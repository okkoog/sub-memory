name: Investigate Corp vs Korean Translation startup (temporary)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-corpkorean-conflict-investigate.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/mods/3828913695
            probably-stolen/mods/3828891515
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Inspect both DLLs without changing them
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install ilspycmd --tool-path "$RUNNER_TEMP/ilspy" >/dev/null
          "$RUNNER_TEMP/ilspy/ilspycmd" -t CorpPresence.GameResources probably-stolen/mods/3828913695/CorpPresence.dll > "$RUNNER_TEMP/CorpGameResources.cs"
          "$RUNNER_TEMP/ilspy/ilspycmd" probably-stolen/mods/3828891515/KoreanTranslation.dll > "$RUNNER_TEMP/KoreanTranslation.cs"
          python3 - <<'PY'
          import os,re,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])
          c=(p/'CorpGameResources.cs').read_text()
          k=(p/'KoreanTranslation.cs').read_text()
          print("======== CorpPresence GameResources.Poll decompiled ========")
          matches=list(re.finditer('mech_condition_pure_water',c))
          print("occurrences:",len(matches))
          for m in matches[:12]:
              print("\n"+c[max(0,m.start()-2400):m.end()+1400])
          print("\n======== CorpPresence GameResources methods ========")
          for m in list(re.finditer(r'^\s*(?:(?:public|private|internal|protected|static|override|virtual|sealed)\s+)+[\w<>\[\]?]+\s+\w+\s*\([^;]*\)',c,re.M))[:90]:
              print(m.group(0).strip()[:200])
          print("\n======== KoreanTranslation Mod mechanism snippets ========")
          print("source chars",len(k))
          for token in ['Mechanic','ko.tsv','LocalizationManager','SetLocale','GetEntry','LoadTable','OnEnable','Awake','Start','GetLocalized','Localization']:
              hits=list(re.finditer(re.escape(token),k,re.I))
              print("token",token,"hits",len(hits))
              for m in hits[:3]:
                  print(k[max(0,m.start()-250):m.end()+450])
          print("\n======== KoreanTranslation types ========")
          for m in list(re.finditer(r'^\s*(?:internal|public|private)?\s*(?:sealed\s+)?class\s+[^\n{]+',k,re.M))[:60]:print(m.group().strip())
          PY
