name: Trace native tooltip event ordering
on:
  push:
    branches: [fix-koreanpack-mechanic-water-20261109]
    paths: [.github/workflows/trace-water-tooltip-native.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            probably-stolen/Managed
            probably-stolen/analysis
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Trace call sites in decompiled game
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install ilspycmd --tool-path "$RUNNER_TEMP/ilspytools"
          mkdir -p "$RUNNER_TEMP/game-src"
          "$RUNNER_TEMP/ilspytools/ilspycmd" -p -o "$RUNNER_TEMP/game-src" probably-stolen/Managed/Assembly-CSharp.dll
          mkdir -p probably-stolen/analysis/water-tooltip-086/callsites
          rg -l 'FireOnCreateTooltipEarly|FireOnCreateTooltipLate|CreateWaterFeatureTooltip' "$RUNNER_TEMP/game-src" --glob '*.cs' | while IFS= read -r file; do
            name="$(basename "$file")"
            cp "$file" "probably-stolen/analysis/water-tooltip-086/callsites/$name"
          done
          echo "Native tooltip source files captured:"
          ls -lh probably-stolen/analysis/water-tooltip-086/callsites
      - name: Commit evidence only
        shell: bash
        run: |
          git add probably-stolen/analysis/water-tooltip-086/callsites
          git diff --cached --quiet && exit 0
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Identify native tooltip event ordering and water label construction'
          git push origin HEAD:fix-koreanpack-mechanic-water-20261109
