name: Finalize Brood diagnostic labels
on:
  push:
    branches: [main]
    paths: ['.github/workflows/brood-diagnostic-final-20261122.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod번역/lewdMemeBrood v0331
            probably-stolen/local-mods/TentacleMod번역/번역대조표/Brood_DiagnosticLabels_20261122.cs
            probably-stolen/local-mods/TentacleMod번역/번역대조표/Brood_DIAGNOSTIC_RESULT_20261122.json
            probably-stolen/local-mods/TentacleMod번역/번역대조표/Brood_FINAL_NEUTRAL_AUDIT_20261122.json
            probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_Brood_v0.3.31_KO_Final_DLL_JSON_20261122.zip
      - name: Apply and verify two diagnostic operands
        shell: bash
        run: |
          set -euo pipefail
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          DLL="$ROOT/lewdMemeBrood v0331/LewdMemeBrood.dll"
          git lfs pull --include="$DLL,$ROOT/ProbablyStolen_Brood_v0.3.31_KO_Final_DLL_JSON_20261122.zip" --exclude=''
          echo "268a3fb54498f1ffeeeccd7d09641b937710c23725b0d7b9dc4be025235d1494  $DLL" | sha256sum -c -
          dotnet new console --framework net8.0 -o /tmp/brood-final --force
          dotnet add /tmp/brood-final/brood-final.csproj package dnlib --version 4.5.0
          cp "$ROOT/번역대조표/Brood_DiagnosticLabels_20261122.cs" /tmp/brood-final/Program.cs
          dotnet run --project /tmp/brood-final -- "$DLL" /tmp/brood-final/output.dll /tmp/brood-final/report.json
          cat /tmp/brood-final/report.json
      - name: Verify and refresh final archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile, shutil
          root=pathlib.Path('probably-stolen/local-mods/TentacleMod번역')
          sub='lewdMemeBrood v0331'
          dll=root/sub/'LewdMemeBrood.dll'
          csv=root/sub/'Localization/ko.csv'
          js=root/sub/'Content/interactionLines.json'
          archive=root/'ProbablyStolen_Brood_v0.3.31_KO_Final_DLL_JSON_20261122.zip'
          report=root/'번역대조표/Brood_FINAL_NEUTRAL_AUDIT_20261122.json'
          readme=root/sub/'README_BROOD_FINAL_KO_20261122.txt'
          def sha(b): return hashlib.sha256(b).hexdigest()
          def blob(b): return hashlib.sha1(b'blob '+str(len(b)).encode()+b'\0'+b).hexdigest()
          old=dll.read_bytes(); new=pathlib.Path('/tmp/brood-final/output.dll').read_bytes()
          evidence=json.loads(pathlib.Path('/tmp/brood-final/report.json').read_text())
          assert sha(old)==evidence['inputHash'] and sha(new)==evidence['temporaryOutputHash']
          assert evidence['checkedMethods']==1740 and evidence['changes']==2 and evidence['unchangedOriginal']
          assert [(x['Offset'],x['Old'],x['New']) for x in evidence['sites']]==[(61,'白','흰색'),(84,'紫','보라색')]
          assert blob(csv.read_bytes())=='e2d5a16e154cce0d269930c2c0ccc9e72e3627a0'
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              entries=z.infolist()
              assert len({i.filename for i in entries})==len(entries)
              contents={i.filename:z.read(i) for i in entries}
          dname=sub+'/LewdMemeBrood.dll'; cname=sub+'/Localization/ko.csv'; jname=sub+'/Content/interactionLines.json'; rname=sub+'/README_BROOD_FINAL_KO_20261122.txt'
          assert all(n in contents for n in [dname,cname,jname,rname])
          assert contents[dname]==old and contents[jname]==js.read_bytes()
          oldhash=sha(archive.read_bytes())
          readme_bytes=readme.read_bytes()
          assert contents[rname]==readme_bytes
          readme_new=(readme_bytes.decode('utf-8').rstrip()+'\n2026-11-22 최종 보강: 색상 진단 표제 2곳 추가 수정, 기존 한국어 유지 및 최신 ko.csv 포함.\n').encode('utf-8')
          replacements={dname:new,cname:csv.read_bytes(),rname:readme_new}
          temp=pathlib.Path('/tmp/brood-final/final.zip')
          with zipfile.ZipFile(temp,'w') as z:
              for i in entries: z.writestr(i,replacements.get(i.filename,contents[i.filename]))
          with zipfile.ZipFile(temp) as z:
              assert z.testzip() is None and z.namelist()==[i.filename for i in entries]
              assert all(z.read(i.filename)==replacements.get(i.filename,contents[i.filename]) for i in entries)
          dll.write_bytes(new);readme.write_bytes(readme_new);shutil.copyfile(temp,archive)
          with zipfile.ZipFile(archive) as z:
              assert z.testzip() is None
              for n in [dname,cname,jname,rname]: assert z.read(n)==(root/n).read_bytes()
          result=json.loads(report.read_text())
          result.update(diagnosticVerification=evidence,installationDllUpdated=True,archiveUpdated=True,installationDllSha256=sha(dll.read_bytes()),previousArchiveSha256=oldhash,archiveSha256=sha(archive.read_bytes()),archiveEntries=len(entries),archiveCRCValid=True,archiveInstallationFilesMatch=True,remainingB=0,actualGameRuntimeTest=False)
          result['diagnosticVerification']['fullBinaryPublished']=True
          report.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          PY
      - name: Commit verified installation and archive
        shell: bash
        run: |
          set -euo pipefail
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse "$ROOT/lewdMemeBrood v0331/LewdMemeBrood.dll" "$ROOT/lewdMemeBrood v0331/README_BROOD_FINAL_KO_20261122.txt" "$ROOT/ProbablyStolen_Brood_v0.3.31_KO_Final_DLL_JSON_20261122.zip" "$ROOT/번역대조표/Brood_FINAL_NEUTRAL_AUDIT_20261122.json"
          git diff --cached --stat
          git commit -m 'Finalize verified Brood color diagnostic labels and archive'
          git push origin main
          git rev-parse HEAD
