name: KoreanPack v0.7.0 artifact

on:
  push:
    branches:
      - probably-stolen-koreanpack-sol
    paths:
      - 'probably-stolen/source/KoreanPack.v0.7.0.cs'
      - 'probably-stolen/source/KoreanPack.v0.7.0.csproj'
      - '.github/workflows/probably-stolen-koreanpack-v070-artifact.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build probably-stolen/source/KoreanPack.v0.7.0.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: KoreanPack-v0.7.0
          path: probably-stolen/source/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll
