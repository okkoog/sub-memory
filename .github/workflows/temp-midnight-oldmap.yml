name: Temp derive old MidnightPawn Korean map

on:
  push:
    branches: [main]
    paths:
      - "probably-stolen/localized/MidnightPawn-1.2.0-KO/Mod/MidnightPawn.dll"
      - ".github/workflows/temp-midnight-oldmap.yml"

permissions:
  contents: read

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Create comparer
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tool"
          cat > "$RUNNER_TEMP/tool/tool.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>disable</Nullable></PropertyGroup>
            <ItemGroup><PackageReference Include="Mono.Cecil" Version="0.11.6"/></ItemGroup>
          </Project>
          EOF
          cat > "$RUNNER_TEMP/tool/Program.cs" <<'EOF'
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          using System.Text;
          using System.Text.RegularExpressions;

          static IEnumerable<TypeDefinition> Types(TypeDefinition t){yield return t; foreach(var n in t.NestedTypes) foreach(var x in Types(n)) yield return x;}
          static string Esc(string s)=>s.Replace("\\","\\\\").Replace("\t","\\t").Replace("\r","\\r").Replace("\n","\\n");
          var a=AssemblyDefinition.ReadAssembly(args[0],new ReaderParameters{ReadingMode=ReadingMode.Immediate});
          var b=AssemblyDefinition.ReadAssembly(args[1],new ReaderParameters{ReadingMode=ReadingMode.Immediate});
          var bm=b.MainModule.Types.SelectMany(Types).SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToDictionary(m=>m.FullName);
          var map=new Dictionary<string,string>(StringComparer.Ordinal);
          var conflicts=new List<string>();
          int methodMatched=0, occurrences=0;
          foreach(var m in a.MainModule.Types.SelectMany(Types).SelectMany(t=>t.Methods).Where(m=>m.HasBody)){
            if(!bm.TryGetValue(m.FullName,out var n)) continue;
            var ai=m.Body.Instructions; var bi=n.Body.Instructions;
            if(ai.Count!=bi.Count) continue;
            bool ops=true; for(int i=0;i<ai.Count;i++) if(ai[i].OpCode.Code!=bi[i].OpCode.Code){ops=false;break;}
            if(!ops) continue;
            methodMatched++;
            for(int i=0;i<ai.Count;i++){
              if(ai[i].OpCode!=OpCodes.Ldstr || bi[i].OpCode!=OpCodes.Ldstr) continue;
              if(ai[i].Operand is not string src || bi[i].Operand is not string dst) continue;
              if(src==dst || !Regex.IsMatch(src,@"[\p{IsCJKUnifiedIdeographs}]")) continue;
              occurrences++;
              if(map.TryGetValue(src,out var old) && old!=dst) conflicts.Add(src+"\t"+old+"\t"+dst+"\t"+m.FullName);
              else map[src]=dst;
            }
          }
          Directory.CreateDirectory(Path.GetDirectoryName(args[2])!);
          using var w=new StreamWriter(args[2],false,new UTF8Encoding(true));
          w.WriteLine("# source\tkorean");
          foreach(var kv in map.OrderBy(x=>x.Key,StringComparer.Ordinal)) w.WriteLine(Esc(kv.Key)+"\t"+Esc(kv.Value));
          Console.WriteLine($"matched_methods={methodMatched} occurrences={occurrences} unique={map.Count} conflicts={conflicts.Count}");
          if(conflicts.Count>0) File.WriteAllLines(Path.Combine(Path.GetDirectoryName(args[2])!,"conflicts.tsv"),conflicts,Encoding.UTF8);
          EOF

      - name: Derive map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          dotnet run -c Release --project "$RUNNER_TEMP/tool/tool.csproj" --             probably-stolen/mods/3831837821/MidnightPawn.dll             "$RUNNER_TEMP/oldko.dll"             "$RUNNER_TEMP/out/old-ko-map.tsv"
          wc -l "$RUNNER_TEMP/out/old-ko-map.tsv"

      - uses: actions/upload-artifact@v4
        with:
          name: MidnightPawn-old-ko-map
          path: ${{ runner.temp }}/out
          if-no-files-found: error
