name: KoreanPack v0.7.0 fast build

on:
  push:
    branches:
      - probably-stolen-koreanpack-sol
    paths:
      - 'probably-stolen/source/KoreanPack.v0.7.0.cs'
      - 'probably-stolen/source/KoreanPack.v0.7.0.csproj'
      - '.github/workflows/probably-stolen-koreanpack-v070-fast.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probably-stolen-koreanpack-sol
          fetch-depth: 1
          sparse-checkout: |
            probably-stolen/source/KoreanPack.v0.7.0.cs
            probably-stolen/source/KoreanPack.v0.7.0.csproj
            probably-stolen/Managed/Assembly-CSharp.dll
            probably-stolen/Managed/0Harmony.dll
            probably-stolen/Managed/UnityEngine.CoreModule.dll
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build probably-stolen/source/KoreanPack.v0.7.0.csproj -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: KoreanPack-v0.7.0-fast
          path: probably-stolen/source/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll
