name: RLD actual uploaded DLL localization audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rld-actual-dll-audit-20261122.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            probably-stolen/local-mods/TentacleMod-Update/.gitattributes
            probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll
            probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1/RedLightDistrict.dll
            probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1/Localization/cn.csv
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/Localization/ko.csv
            probably-stolen/Managed/Assembly-CSharp.dll
      - name: Fetch and verify exact LFS objects
        shell: bash
        run: |
          set -euo pipefail
          export GIT_LFS_SKIP_SMUDGE=1
          git lfs install --local
          git lfs pull --include='probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll,probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1/RedLightDistrict.dll,probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll' --exclude=''
          root='probably-stolen/local-mods'
          echo "a224760a2ae651e07adb467014dbb0053d1c6b8942879644b2afbad614237f25  $root/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll" | sha256sum -c
          echo "4f4f20a00e4754302c53879bfaeb7a7503df10e2f05ff6ad3744be31088159f8  $root/TentacleMod/RedLightDistrict_v1.1.1/RedLightDistrict.dll" | sha256sum -c
          echo "2c1c579523058dca9d5e1a7b2ef7162fbdcca48e64be183a45df564d721cd100  $root/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll" | sha256sum -c
      - name: Audit key callsites and lookup implementation without changing binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rld-audit
          python3 - <<'PY'
          import csv,json,pathlib,hashlib,re,collections
          root=pathlib.Path('probably-stolen/local-mods')
          h=lambda s:hashlib.sha256(s.encode()).hexdigest()
          with (root/'TentacleMod/RedLightDistrict_v1.1.1/Localization/cn.csv').open(encoding='utf-8-sig',newline='') as f: orig=list(csv.DictReader(f))
          with (root/'TentacleMod번역/RedLightDistrict_v1.1.1/Localization/ko.csv').open(encoding='utf-8-sig',newline='') as f: ko=list(csv.reader(f))
          assert all(len(r)==2 for r in ko)
          assert len(orig)==len({r['key'] for r in orig})
          assert len(ko)==len(dict(ko))
          origdata=[{'key':r['key'],'method':r['method'],'offset':int(r['IL_offset']),'hash':h(r['original'])} for r in orig]
          vals=[{'key':k,'hash':h(v),'empty':not v.strip(),'questionOnly':bool(re.fullmatch(r'[\s?？�]+',v)),'containsReplacement': '�' in v,'cjk':bool(re.search(r'[\u3400-\u9fff]',v))} for k,v in ko]
          pathlib.Path('/tmp/rld-catalog.json').write_text(json.dumps({'original':origdata,'ko':vals},ensure_ascii=False))
          print('Original catalog:',len(orig),'Korean rows:',len(ko))
          PY
          dotnet new console --framework net8.0 -o /tmp/rld-actual-audit --force
          dotnet add /tmp/rld-actual-audit/rld-actual-audit.csproj package dnlib --version 4.5.0
          cat >/tmp/rld-actual-audit/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using System.Security.Cryptography;
          using System.Text;
          using System.Text.RegularExpressions;
          using System.Text.Json;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          record Site(string key,string method,int offset,string hash);
          record Val(string key,string hash,bool empty,bool questionOnly,bool containsReplacement,bool cjk);
          record Cat(Site[] original,Val[] ko);
          record Call(string method,int index,uint offset,string callee,string? key,string? fallbackHash,string form,string[] next);
          record RawSite(string method,int index,uint offset,string hash,int length,string[] context,string[] possibleKeys,string status);
          class P{
             static string Hash(string x)=>Convert.ToHexString(SHA256.HashData(Encoding.UTF8.GetBytes(x))).ToLowerInvariant();
             static string FileHash(string x){using var f=File.OpenRead(x);return Convert.ToHexString(SHA256.HashData(f)).ToLowerInvariant();}
             static bool Cjk(string x)=>x.Any(c=>c>='\u3400'&&c<='\u9fff');
             static bool IsKey(string x)=>Regex.IsMatch(x,@"^rld_[A-Za-z0-9_]+$");
             static IEnumerable<MethodDef> Methods(ModuleDefMD m)=>m.GetTypes().SelectMany(t=>t.Methods).Where(x=>x.HasBody);
             static string Safe(object? o)=>o switch{null=>"",string s when IsKey(s)||Regex.IsMatch(s,@"^[A-Za-z0-9_.:/-]{1,80}$")=>s,string s=>"[literal len="+s.Length+" sha="+Hash(s)+"]",Instruction i=>"@"+i.Offset.ToString("X"),IList<Instruction> a=>string.Join(",",a.Select(i=>"@"+i.Offset.ToString("X"))),_=>o.ToString()??""};
             static string Describe(Instruction i)=>i.OpCode.Name+" "+Safe(i.Operand);
             static bool Lookup(IMethod m)=>m.FullName.Contains("CsvLookup::Read")||m.FullName.Contains("GetLocalized")||m.FullName.Contains("GetLocalization")||m.FullName.Contains("::Localize(")||m.FullName.Contains("::Translate(");
             static object Dump(MethodDef m)=>new {method=m.FullName,il=m.Body.Instructions.Select((i,n)=>new{index=n,offset=i.Offset,op=i.OpCode.Name,operand=Safe(i.Operand)}).ToArray()};
             static void Save(string name,object obj)=>File.WriteAllText("rld-audit/"+name,JsonSerializer.Serialize(obj,new JsonSerializerOptions{WriteIndented=true,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping})+"\n");
             static void Main(string[] a){
                var cat=JsonSerializer.Deserialize<Cat>(File.ReadAllText(a[0]))!;
                var catalog=cat.original.ToDictionary(x=>x.key);var trans=cat.ko.ToDictionary(x=>x.key);
                var sourceHash=cat.original.GroupBy(x=>x.hash).ToDictionary(g=>g.Key,g=>g.ToArray());
                using var original=ModuleDefMD.Load(a[1]);using var old=ModuleDefMD.Load(a[2]);using var actual=ModuleDefMD.Load(a[3]);using var game=ModuleDefMD.Load(a[4]);
                var previous=Methods(old).Select(m=>m.FullName).ToHashSet();var originalMethods=Methods(original).Select(m=>m.FullName).ToHashSet();
                var actualMethods=Methods(actual).ToArray();
                var helpers=actualMethods.Where(m=>!originalMethods.Contains(m.FullName)).ToArray();
                var lookups=new List<Call>();var raws=new List<RawSite>();var questions=new List<object>();var keyLiterals=new List<object>();
                foreach(var m in actualMethods){
                   var il=m.Body.Instructions;
                   for(int n=0;n<il.Count;n++){
                     var i=il[n];
                     if(i.OpCode==OpCodes.Ldstr&&i.Operand is string s){
                        if(IsKey(s))keyLiterals.Add(new{method=m.FullName,index=n,offset=i.Offset,key=s,next=il.Skip(n+1).Take(5).Select(Describe).ToArray()});
                        if(Regex.IsMatch(s,@"^[?？�]+$"))questions.Add(new{method=m.FullName,index=n,offset=i.Offset,length=s.Length,context=il.Skip(Math.Max(n-3,0)).Take(8).Select(Describe).ToArray()});
                        if(Cjk(s)){
                           bool fallback=n>0&&n+1<il.Count&&il[n-1].Operand is string k&&IsKey(k)&&il[n+1].Operand is IMethod call&&Lookup(call);
                           var h=Hash(s);var possible=sourceHash.GetValueOrDefault(h)??Array.Empty<Site>();
                           if(!fallback)raws.Add(new(m.FullName,n,i.Offset,h,s.Length,il.Skip(Math.Max(0,n-4)).Take(12).Select(Describe).ToArray(),possible.Where(x=>x.method==m.FullName).Select(x=>x.key).ToArray(),possible.Length==0?"not_in_original_catalog":"catalog_text"));
                        }
                     }
                     if((i.OpCode==OpCodes.Call||i.OpCode==OpCodes.Callvirt)&&i.Operand is IMethod mm&&Lookup(mm)){
                        bool two=n>=2&&il[n-2].OpCode==OpCodes.Ldstr&&il[n-2].Operand is string k2&&IsKey(k2)&&il[n-1].OpCode==OpCodes.Ldstr&&il[n-1].Operand is string;
                        bool one=n>=1&&il[n-1].OpCode==OpCodes.Ldstr&&il[n-1].Operand is string k1&&IsKey(k1);
                        string? key=two?(string)il[n-2].Operand:one?(string)il[n-1].Operand:null;
                        string? h=two?Hash((string)il[n-1].Operand):null;
                        lookups.Add(new(m.FullName,n,i.Offset,mm.FullName,key,h,two?"key_fallback":one?"direct_key":"dynamic",il.Skip(n+1).Take(5).Select(Describe).ToArray()));
                     }
                   }
                }
                var byKey=lookups.Where(x=>x.key!=null).GroupBy(x=>x.key!).ToDictionary(g=>g.Key,g=>g.ToArray());
                var missing=cat.ko.Where(x=>!byKey.ContainsKey(x.key)).Select(x=>new{x.key,original=catalog.GetValueOrDefault(x.key),classification=catalog.ContainsKey(x.key)?"original":"alias"}).ToArray();
                var wrong=lookups.Where(x=>x.key!=null&&catalog.TryGetValue(x.key,out var s)&&((x.fallbackHash!=null&&x.fallbackHash!=s.hash)||x.method!=s.method)).ToArray();
                var unknown=lookups.Where(x=>x.key!=null&&!trans.ContainsKey(x.key)&&!catalog.ContainsKey(x.key)).ToArray();
                var metrics=new{files=new[]{a[1],a[2],a[3]}.Select(x=>new{file=Path.GetFileName(Path.GetDirectoryName(x)),hash=FileHash(x),size=new FileInfo(x).Length}),originalMethods=originalMethods.Count,priorMethods=previous.Count,actualMethods=actualMethods.Length,helpers=helpers.Select(m=>m.FullName),actualOnlyMethods=helpers.Where(m=>!previous.Contains(m.FullName)).Select(m=>m.FullName),originalMissingMethods=originalMethods.Except(actualMethods.Select(m=>m.FullName)),originalResources=original.Resources.Count,priorResources=old.Resources.Count,actualResources=actual.Resources.Count,originalKeys=catalog.Count,koKeys=trans.Count,lookupCalls=lookups.Count,staticCalls=lookups.Count(x=>x.key!=null),dynamicCalls=lookups.Count(x=>x.key==null),distinctCalledKeys=byKey.Count,translatedKeysWithoutStaticCall=missing.Length,unknownKeys=unknown.Length,sourceOrMethodMismatch=wrong.Length,rawCjkSites=raws.Count,rawCatalogSites=raws.Count(x=>x.status=="catalog_text"),literalQuestionSites=questions.Count,badCsvValues=cat.ko.Where(x=>x.empty||x.questionOnly||x.containsReplacement).Select(x=>x.key),csvCjkValues=cat.ko.Count(x=>x.cjk)};
                Save("summary.json",metrics);
                Save("lookup-calls.json",lookups);
                Save("missing-translated-keys.json",missing);
                Save("mismatched-keys.json",wrong);
                Save("unknown-keys.json",unknown);
                Save("raw-cjk-sites.json",raws);
                Save("question-sites.json",questions);
                Save("key-literals.json",keyLiterals);
                Save("helpers.json",helpers.Select(Dump));
                Save("lookup-methods.json",actualMethods.Where(m=>m.DeclaringType.FullName.Contains("Korean")||m.Name.String.Contains("Localiz")||m.Name=="OnModAssetsLoaded").Select(Dump));
                Save("game-localization-methods.json",Methods(game).Where(m=>(m.DeclaringType.Name.String.Contains("Mod")||m.DeclaringType.Name.String.Contains("Localization"))&&(m.Name.String.Contains("Localiz")||m.Name.String=="GetLocalized")).Select(Dump));
                Console.WriteLine(JsonSerializer.Serialize(metrics));
             }
          }
          CS
          root='probably-stolen/local-mods'
          dotnet run --project /tmp/rld-actual-audit -- /tmp/rld-catalog.json "$root/TentacleMod/RedLightDistrict_v1.1.1/RedLightDistrict.dll" "$root/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll" "$root/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll" probably-stolen/Managed/Assembly-CSharp.dll
      - name: Preserve diagnostic reports only on dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse rld-audit
          git commit -m 'Audit actual uploaded RLD DLL localization paths (no binary changes)'
          git push origin HEAD:refs/heads/rld-actual-audit-20261122
      - uses: actions/upload-artifact@v4
        with:
          name: rld-actual-localization-audit
          path: rld-audit/
