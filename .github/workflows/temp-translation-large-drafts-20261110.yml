name: Temporary translate 3 large workshop mod CSVs (audited drafts)
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-translation-large-drafts-20261110.yml]
permissions: {contents: write}
jobs:
  translate:
    strategy:
      fail-fast: false
      matrix:
        modid: ['3835292703', '3830031787', '3834071305']
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /probably-stolen/mods/${{ matrix.modid }}/Localization/en.csv
            /probably-stolen/work-in-progress/translation-20261110/nllb_large_draft.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline translation engine
        run: python -m pip install --quiet "transformers==4.46.3" "sentencepiece" "torch" "sacremoses"
      - name: Translate one mod with placeholder verification
        env:
          HF_HUB_DISABLE_XET: '1'
        run: |
          python probably-stolen/work-in-progress/translation-20261110/nllb_large_draft.py "${{ matrix.modid }}"
      - uses: actions/upload-artifact@v4
        with:
          name: mod-translation-${{ matrix.modid }}
          path: probably-stolen/work-in-progress/translation-20261110/machine-drafts/*
          if-no-files-found: error
  collect:
    needs: translate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/download-artifact@v4
        with:
          pattern: mod-translation-*
          path: probably-stolen/work-in-progress/translation-20261110/machine-drafts
          merge-multiple: true
      - name: Audit counts and commit reviewed-later drafts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,csv
          p=pathlib.Path('probably-stolen/work-in-progress/translation-20261110/machine-drafts')
          want={'3835292703':817,'3830031787':664,'3834071305':473}
          for wid,total in want.items():
              with (p/f'pskb__{wid}.csv').open(encoding='utf-8-sig',newline='') as f:
                  rows=[r for r in csv.reader(f) if r and r[0].startswith('K|')]
              report=json.loads((p/f'qa__{wid}.json').read_text())
              assert len(rows)==total,(wid,len(rows),total)
              assert report['source_count']==total
              print('AUDIT',wid,'rows',len(rows),'fallbacks',len(report['untranslated_keys']), 'bad fragments',report['failed_fragments'])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probably-stolen/work-in-progress/translation-20261110/machine-drafts
          git commit -m "Stage NLLB Korean localization drafts for 3 large workshop mods (QA pending)"
          git push origin HEAD:main
