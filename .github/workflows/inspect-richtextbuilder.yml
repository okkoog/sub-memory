name: Inspect RichTextBuilder

on:
  push:
    branches:
      - probably-stolen-koreanpack-sol
    paths:
      - '.github/workflows/inspect-richtextbuilder.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probably-stolen-koreanpack-sol
          fetch-depth: 1
          sparse-checkout: |
            probably-stolen/Managed/Assembly-CSharp.dll
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install ILSpy
        run: dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
      - name: Find and decompile RichTextBuilder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probably-stolen/analysis
          "$RUNNER_TEMP/ilspy/ilspycmd" -l c probably-stolen/Managed/Assembly-CSharp.dll > /tmp/types.txt
          grep -i "RichTextBuilder" /tmp/types.txt | tee probably-stolen/analysis/RichTextBuilder-types.txt
          type="$(grep -i "RichTextBuilder" /tmp/types.txt | head -1 | sed -E 's/^[^ ]+ //')"
          if [ -n "$type" ]; then
            "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -t "$type" probably-stolen/Managed/Assembly-CSharp.dll > probably-stolen/analysis/RichTextBuilder.cs
          fi
      - name: Commit
        shell: bash
        run: |
          git add --sparse -- probably-stolen/analysis/RichTextBuilder-types.txt probably-stolen/analysis/RichTextBuilder.cs
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Inspect RichTextBuilder"
          git pull --rebase origin probably-stolen-koreanpack-sol
          git push origin HEAD:probably-stolen-koreanpack-sol
