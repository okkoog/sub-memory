name: Tentacle Eleanor locale binding static analysis
on:
  push:
    paths:
      - '.github/workflows/temp-tentacle-eleanor-lang-audit-20261121.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/落魄千金-埃莉诺 v1.0.3
            probably-stolen/local-mods/TentacleMod번역/번역대조표
          sparse-checkout-cone-mode: false
      - name: Analyze method-level literal references
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/eleanor_locale_inspect --force
          dotnet add /tmp/eleanor_locale_inspect/eleanor_locale_inspect.csproj package dnlib --version 4.5.0
          cat > /tmp/eleanor_locale_inspect/Program.cs <<'CS'
          using System;
          using System.Linq;
          using System.Collections.Generic;
          using System.Text;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          public class P {
              public static void Main(string[] args) {
                  using var md=ModuleDefMD.Load(args[0]);
                  var sb=new StringBuilder("# Eleanor v1.0.3 IL locale audit\n\n");
                  int inspected=0,matched=0;
                  foreach(var type in md.GetTypes())
                  foreach(var method in type.Methods) {
                      if(!method.HasBody) continue;
                      inspected++;
                      var body=method.Body.Instructions;
                      var locs=Enumerable.Range(0,body.Count).Where(i => {
                          var x=body[i];
                          string s=x.Operand is string raw ? raw : "";
                          return s.Contains("EleanorEmbedded/Localization",StringComparison.OrdinalIgnoreCase)
                          || s.Equals("zh",StringComparison.OrdinalIgnoreCase)
                          || s.Equals("en",StringComparison.OrdinalIgnoreCase)
                          || s.Equals("ko",StringComparison.OrdinalIgnoreCase)
                          || s.EndsWith(".csv",StringComparison.OrdinalIgnoreCase)
                          || (s.Contains("language",StringComparison.OrdinalIgnoreCase))
                          || (s.Contains("Language",StringComparison.OrdinalIgnoreCase))
                          || (method.Name.ToString().Contains("localiz",StringComparison.OrdinalIgnoreCase) && s.Length>0);
                      }).ToList();
                      if(locs.Count==0 && !(method.Name.ToString().Contains("localiz",StringComparison.OrdinalIgnoreCase) || method.Name.ToString().Contains("Lang",StringComparison.OrdinalIgnoreCase)))continue;
                      matched++;
                      sb.AppendLine("## "+type.FullName+"::"+method.Name+"("+method.MDToken+")");
                      if(locs.Count==0){sb.AppendLine("- no literal match; method name selected");locs.Add(0);}
                      foreach(int idx in locs.Take(20)) {
                          sb.AppendLine("- anchor IL["+idx+"]: "+body[idx]);
                          for(int k=Math.Max(0,idx-17);k<=Math.Min(body.Count-1,idx+25);k++)
                              sb.AppendLine("  "+k.ToString("D4")+" "+body[k]);
                      }
                  }
                  sb.Insert(0,"Inspected methods: "+inspected+"; matched: "+matched+"\n\n");
                  System.IO.File.WriteAllText(args[1],sb.ToString());
                  Console.WriteLine("Inspected "+inspected+", matched "+matched+", bytes "+sb.Length);
              }
          }
          CS
          dotnet run --project /tmp/eleanor_locale_inspect/eleanor_locale_inspect.csproj -- \
            'probably-stolen/local-mods/TentacleMod/落魄千金-埃莉诺 v1.0.3/fallen_heiress_eleanor.dll' \
            'probably-stolen/local-mods/TentacleMod번역/번역대조표/Eleanor_v1.0.3_LANG_BRANCH_IL_AUDIT_20261121.md'
      - name: Commit text audit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'probably-stolen/local-mods/TentacleMod번역/번역대조표/Eleanor_v1.0.3_LANG_BRANCH_IL_AUDIT_20261121.md'
          git diff --cached --quiet || (git commit -m "audit(tentacle): Eleanor 1.0.3 localization branch IL" && git pull --rebase origin main && git push)
