name: Temporary full Localization key audit 2026-11-10
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-translation-audit-20261110.yml]
permissions: {contents: read}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /probably-stolen/mods/*/manifest.xml
            /probably-stolen/mods/*/Localization/*
            /probably-stolen/mods/*/Localization/**/*
            /probably-stolen/mods/*/Data/*.csv
            /probably-stolen/mods/*/Data/*.tsv
            /probably-stolen/번역 모드/Localization/*
            /probably-stolen/maintenance/translation-source-map.md
      - name: Compare every mod localization collection to Korean pack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, csv, collections, re, json, xml.etree.ElementTree as ET
          root=pathlib.Path('probably-stolen')
          mods=root/'mods'
          pack=root/'번역 모드'/'Localization'
          def keys_of(path, packmode=False):
              keys=set(); duplicates=[]; errors=[]
              try:
                  with path.open('r',encoding='utf-8-sig',newline='') as fh:
                      for nr,row in enumerate(csv.reader(fh),1):
                          if not row:continue
                          raw=row[0].strip()
                          if not raw or raw.startswith('#'):continue
                          if packmode:
                              if not raw.startswith('K|'):continue
                              raw=raw[2:]
                          if raw in keys:duplicates.append(raw)
                          keys.add(raw)
              except Exception as exc:
                  errors.append(str(exc))
              return keys,duplicates,errors
          print('AUDIT_VERSION|2026-11-10-v1')
          print('GIT_COMMIT|' + __import__('subprocess').check_output(['git','rev-parse','HEAD'],text=True).strip())
          packfiles={x.name[len('pskb__'):-4]:x for x in pack.glob('pskb__*.csv')}
          print('TOTAL_PACK_CSVS|' + str(len(packfiles)))
          summary=[]
          for directory in sorted(mods.iterdir()):
              if not directory.is_dir() or not directory.name.isdigit():continue
              wid=directory.name
              manifest=directory/'manifest.xml'
              info={'wid':wid,'name':'','modid':'','version':'','error':''}
              try:
                  tree=ET.parse(manifest)
                  for field in ['Name','ID','ModVersion','Description']:
                      info[field.lower() if field!='ModVersion' else 'version']=(tree.getroot().findtext(field) or '').strip().replace('\n',' ')[:200]
              except Exception as exc:
                  info['error']=str(exc)[:180]
              loc=directory/'Localization'
              csvs=list(loc.rglob('*.csv')) if loc.exists() else []
              bylocale={}
              dupreport={}
              errorreport={}
              for path in csvs:
                  ks,dups,errors=keys_of(path)
                  name=path.relative_to(loc).as_posix()
                  bylocale[name]=ks
                  if dups:dupreport[name]=dups[:10]
                  if errors:errorreport[name]=errors
              packpath=packfiles.get(wid)
              packkeys=set()
              if packpath:
                  packkeys,dup,e=keys_of(packpath,True)
                  if dup:dupreport['PACK']=dup[:10]
                  if e:errorreport['PACK']=e
              if wid=='3829085054':
                  packpath=pack/'ko.csv'
                  packkeys,_,_=keys_of(packpath)
              en_sources={n for n in bylocale if re.search(r'(?i)(^|/)(en|english)(-us|_us)?\.csv$',n)}
              zh_sources={n for n in bylocale if re.search(r'(?i)(^|/)(zh|chinese)(-cn|_cn)?\.csv$',n)}
              standard=en_sources|zh_sources
              other_sources={n for n in bylocale if not re.search(r'(?i)(^|/)(ko|korean)(-kr|_kr)?\.csv$',n) and n not in standard and not re.search(r'(?i)(ru|ja|fr|de|es|pt|it)\.csv$',n)}
              chosen=standard or other_sources
              sourcekeys=set().union(*(bylocale[n] for n in chosen)) if chosen else set()
              ownko={n for n in bylocale if re.search(r'(?i)(^|/)(ko|korean)(-kr|_kr)?\.csv$',n)}
              selfkeys=set().union(*(bylocale[n] for n in ownko)) if ownko else set()
              missing=sorted(sourcekeys-packkeys) if packpath else sorted(sourcekeys-selfkeys)
              none_with_locale= bool(sourcekeys) and not(packpath or ownko)
              summary.append({
                  **info, 'locales':{n:len(v) for n,v in bylocale.items()},
                  'selected_sources':sorted(chosen), 'source_count':len(sourcekeys),
                  'pack_count':len(packkeys),'ownko':sorted(ownko),
                  'self_ko_count':len(selfkeys), 'missing':missing,
                  'extra_pack':sorted(packkeys-sourcekeys),
                  'dup':dupreport,'errors':errorreport,
                  'pack_path':str(packpath) if packpath else '',
                  'no_csv':not bool(csvs),
                  'without_translation':none_with_locale,
                  'non_csv_translation_assets':sorted(str(x.relative_to(directory)) for x in directory.rglob('*') if x.is_file() and x.suffix.lower() in ['.tsv','.json','.po','.lang','.txt'] and len(x.parts)<len(directory.parts)+5)[:18],
              })
          print('TOTAL_MOD_FOLDERS|'+str(len(summary)))
          total_missing=sum(len(x['missing']) for x in summary if x['pack_path'])
          print('TOTAL_MISSING_EXISTING_PACKS|'+str(total_missing))
          for d in summary:
              vals=['MOD',d['wid'],d['modid'],d['name'],d['version'],
                 'source='+str(d['source_count']),'pack='+str(d['pack_count']),
                 'selfko='+str(d['self_ko_count']),'missing='+str(len(d['missing'])),
                 'csv='+json.dumps(d['locales'],ensure_ascii=False,separators=(',',':')),
                 'packfile='+('yes' if d['pack_path'] else 'no'),
                 'noncsv='+json.dumps(d['non_csv_translation_assets'],ensure_ascii=False,separators=(',',':'))]
              print('|'.join(vals))
              if d['missing']:
                  print('MISSING_KEYS|'+d['wid']+'|'+','.join(d['missing']))
              if d['extra_pack'] and len(d['extra_pack'])<20:
                  print('EXTRA_KEYS|'+d['wid']+'|'+','.join(d['extra_pack']))
              if d['dup'] or d['errors']:
                  print('PARSE_ISSUES|'+d['wid']+'|'+json.dumps({'duplicates':d['dup'],'errors':d['errors']},ensure_ascii=False))
          print('AUDIT_DONE')
          PY
