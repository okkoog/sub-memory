name: Recover current KoreanPack source

on:
  push:
    paths:
      - "probably-stolen/tmp/current_dll.gz.b64.part*"
      - ".github/workflows/recover-current-koreanpack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Reconstruct exact v0.7.5.4 baseline DLL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/current"
          cat probably-stolen/tmp/current_dll.gz.b64.part0 probably-stolen/tmp/current_dll.gz.b64.part1 \
            | base64 -d | gzip -d > "$RUNNER_TEMP/current/ProbablyStolenKoreanPack.dll"
          echo "6b2f194d6ac5b670858d3b4baaf6f92bf5521aaff58f8fa1b10af20154b6d1d4  $RUNNER_TEMP/current/ProbablyStolenKoreanPack.dll" | sha256sum -c -
      - name: Install ILSpy
        run: dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
      - name: Decompile exact current DLL
        shell: bash
        run: |
          set -euo pipefail
          rm -rf probably-stolen/source/current-v0754
          mkdir -p probably-stolen/source/current-v0754
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p \
            -r probably-stolen/Managed \
            -o probably-stolen/source/current-v0754 \
            "$RUNNER_TEMP/current/ProbablyStolenKoreanPack.dll"
      - name: Commit recovered source
        shell: bash
        run: |
          git add probably-stolen/source/current-v0754
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Recover exact v0.7.5.4 KoreanPack source"
          git pull --rebase origin main
          git push origin HEAD:main
