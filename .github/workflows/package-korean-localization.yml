name: Package Korean localization CSVs
on:
  push:
    paths:
      - '.github/workflows/package-korean-localization.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create validated ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, pathlib, zipfile
          folder = pathlib.Path('probably-stolen/번역 모드/Localization')
          names = ['pskb__3829381036.csv','pskb__3829110153.csv','pskb__3828971731.csv','pskb__3831752512.csv']
          for n in names:
              p = folder/n
              assert p.is_file() and p.stat().st_size > 500, n
              with p.open(encoding='utf-8-sig', newline='') as f:
                  for row in csv.reader(f):
                      assert row, n
          out = pathlib.Path('probably-stolen/maintenance/translation-update-2026-11-08.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for n in names:
                  z.write(folder/n,arcname=n)
          with zipfile.ZipFile(out) as z:
              assert sorted(z.namelist()) == sorted(names)
              assert z.testzip() is None
          print(f'ZIP: {out}, {out.stat().st_size} bytes')
          PY
      - name: Commit ZIP
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probably-stolen/maintenance/translation-update-2026-11-08.zip
          git diff --cached --quiet || (git commit -m 'Package Korean localization CSV updates (2026-11-08)' && git push)
