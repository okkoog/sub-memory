name: Build Probably Stolen Korean Pack

on:
  push:
    paths:
      - "probably-stolen/source/KoreanPack.v0.5.41.cs"
      - "probably-stolen/build/KoreanPack.csproj"
      - ".github/workflows/build-probably-stolen-korean-pack.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build
        run: dotnet build probably-stolen/build/KoreanPack.csproj -c Release
      - name: Stage DLL
        run: |
          mkdir -p probably-stolen/build/out
          cp probably-stolen/build/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll probably-stolen/build/out/ProbablyStolenKoreanPack.dll
      - name: Commit DLL
        run: |
          git add probably-stolen/build/out/ProbablyStolenKoreanPack.dll
          if git diff --cached --quiet; then
            echo "DLL unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build ProbablyStolenKoreanPack"
          git pull --rebase origin main
          git push origin HEAD:main
