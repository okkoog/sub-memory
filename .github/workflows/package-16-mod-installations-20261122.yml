name: Package 16 complete individual Korean mod installations
on:
  push:
    branches: [main]
    paths: ['.github/workflows/package-16-mod-installations-20261122.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod
            probably-stolen/local-mods/TentacleMod번역
          sparse-checkout-cone-mode: false
      - name: Resolve original and translated LFS DLLs
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include='probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1/RedLightDistrict.dll,probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll' --exclude=''
      - name: Build ZIPs and verify every entry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile, subprocess, re, xml.etree.ElementTree as ET, os
          root=pathlib.Path('probably-stolen/local-mods')
          orig=root/'TentacleMod'
          trans=root/'TentacleMod번역'
          out=pathlib.Path('installation-zips')
          out.mkdir()
          mods=[["3842259965","01_AdultGoods_v1.1.1"],["3843110449","02_Elueym_v1.1.0"],["Bai She's R18 Texture Pack 1.4.0","03_BaiShe_TexturePack_v1.4.0"],["IronBloodSheer","04_IronBloodSheer"],["ItemPortraitHD_v1.3.0","05_ItemPortraitHD_v1.3.0"],["LewdMemeBrothel-0.10.4-candidate","06_LewdMemeBrothel_v0.10.4"],["LewdMemeLegacyContent-1.0.6-48sounds","07_LegacyContent_v1.0.6"],["LewdMemeShadowTrade1.6.4","08_ShadowTrade_v1.6.4"],["RedLightDistrict_v1.1.1","09_RedLightDistrict_v1.1.1"],["[SRW-STM]MentorToSarrona","10_MentorToSarrona"],["[SRW-STM]SarronaTheDragon","11_SarronaTheDragon"],["lewdMemeBrood v0331","12_Brood_v0.3.31"],["lewd_meme2.1.0","13_MidnightPawn_v2.1.0"],["lewd_meme_config0.7.2-pre","14_LewdMemeConfig_v0.7.2-pre"],["落魄千金-埃莉诺 v1.0.3","15_Eleanor_v1.0.3"],["起飞攻速装-v1.1.3抢先体验版（修bug）","16_DailyWearWorkshop_v1.1.3"]]
          assert {p.name for p in orig.iterdir() if p.is_dir()}=={x[0] for x in mods}
          assert {p.name for p in trans.iterdir() if p.is_dir() and p.name!='번역대조표'}=={x[0] for x in mods}
          def sha(b): return hashlib.sha256(b).hexdigest()
          def include(rel):
              parts=rel.parts
              if any(p in ('번역대조표','translation-work','Source','.git') for p in parts): return False
              n=rel.name
              return not (n=='WORK_PROGRESS.md' or n=='LOCALIZATION_PROGRESS.md' or n.startswith(('KEY_COVERAGE_AUDIT_','UNTRANSLATED_REVIEW_QUEUE_','DISPLAY_ALIAS_KEYS_')))
          def tree(d):
              return {p.relative_to(d).as_posix():p for p in d.rglob('*') if p.is_file() and include(p.relative_to(d))}
          def get(p):
              assert not p.is_symlink(), str(p)
              b=p.read_bytes()
              assert not b.startswith(b'version https://git-lfs.github.com/spec/v1'), 'Unresolved LFS pointer: '+str(p)
              return b
          results=[]
          for folder,name in mods:
              a=tree(orig/folder); b=tree(trans/folder)
              merged={**a,**b}
              assert 'manifest.xml' in a and 'manifest.xml' in b
              assert any(p.lower().endswith('.dll') for p in merged)
              ET.fromstring(get(merged['manifest.xml']))
              for p in merged:
                  if p.lower().endswith('.dll'): assert get(merged[p])[:2]==b'MZ', 'Not a PE binary: '+p
              expected={p:sha(get(src)) for p,src in merged.items()}
              zpath=out/(name+'_KO_Install.zip')
              # Preserve original source file names and folder layout; use current translation for overlapping files.
              with zipfile.ZipFile(zpath,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=5,allowZip64=True) as z:
                  for rel,src in sorted(merged.items()):
                      z.write(src,folder+'/'+rel)
              with zipfile.ZipFile(zpath) as z:
                  assert z.testzip() is None
                  assert len(z.namelist())==len(expected) and set(z.namelist())=={folder+'/'+p for p in expected}
                  for rel,digest in expected.items():
                      assert sha(z.read(folder+'/'+rel))==digest
              result={'name':zpath.name,'folder':folder,'files':len(expected),'originalFiles':len(a),'overlayFiles':len(b),'unchangedOriginalFiles':len(set(a)-set(b)),'bytes':zpath.stat().st_size,'sha256':sha(zpath.read_bytes()),'manifestParsed':True,'dllPEHeaders':True,'CRC':True,'entryHashesVerified':True,'externalDependenciesIncluded':False,'actualGameRuntimeTest':False}
              results.append(result)
              print(json.dumps(result,ensure_ascii=False),flush=True)
          assert len(results)==16
          report={'sourceCommit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'packages':results,'notes':'Original mod resources plus current translation overlays; source/development and translation audit files excluded; separate inter-mod dependencies must be installed separately; no game execution test.'}
          (out/'INSTALL_VERIFICATION.json').write_text(json.dumps(report,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Upload 01_AdultGoods_v1.1.1
        uses: actions/upload-artifact@v7
        with:
          path: installation-zips/01_AdultGoods_v1.1.1_KO_Install.zip
          archive: false
          if-no-files-found: error
          retention-days: 90
      - name: Upload 02_Elueym_v1.1.0
