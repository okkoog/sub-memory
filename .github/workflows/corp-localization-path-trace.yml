name: CorpPresence localization path trace
on:
  push:
    paths:
      - '.github/workflows/corp-localization-path-trace.yml'
      - 'probably-stolen/tools/trace_corp_localization.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            probably-stolen/mods/3828913695/CorpPresence.dll
            probably-stolen/tools/trace_corp_localization.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
      - name: Decompile CorpPresence
        run: |
          mkdir -p "$RUNNER_TEMP/corp"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p -o "$RUNNER_TEMP/corp" probably-stolen/mods/3828913695/CorpPresence.dll
      - name: Trace localization
        env:
          CORP_DECOMPILED: ${{ runner.temp }}/corp
        run: python3 probably-stolen/tools/trace_corp_localization.py
      - name: Commit report
        run: |
          git add --sparse -- probably-stolen/analysis/CorpPresence-0.9.4-localization-paths.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Trace CorpPresence localization paths"
          git pull --rebase origin main
          git push origin HEAD:main
