name: RLD feeder and water status display safety
on:
  push:
    paths: ['.github/workflows/rld-status-display-safety-20261122.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/Localization/ko.csv
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/translation-work/internal_string_reference.tsv
            probably-stolen/local-mods/TentacleMod번역/번역대조표
      - name: Retrieve exact bridge binary
        run: |
          git lfs pull --include='probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll' --exclude=''
          test "$(sha256sum 'probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll' | cut -d' ' -f1)" = '6089ad1d83d1a3131cc9e141d9c4dd7d66f8f2da6b0afde7010db403b4def03f'
      - name: Preserve old and new status header matching
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/rldstatus --force
          dotnet add /tmp/rldstatus/rldstatus.csproj package dnlib --version 4.5.0
          cat >/tmp/rldstatus/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using System.Security.Cryptography;
          using System.Text.Json;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
            static void Need(bool b,string msg){if(!b)throw new Exception(msg);}
            static string Hash(byte[] x)=>Convert.ToHexString(SHA256.HashData(x)).ToLowerInvariant();
            static string Raw(object? o)=>o?.ToString()??"";
            static string Op(object? o,Dictionary<Instruction,int> ix)=>o switch{null=>"",Instruction i=>"@"+ix[i],IList<Instruction> a=>string.Join(",",a.Select(i=>"@"+ix[i])),_=>Raw(o)};
            static string EH(ExceptionHandler e,Dictionary<Instruction,int> m){string I(Instruction? i)=>i==null?"-":m[i].ToString();return string.Join("|",e.HandlerType.ToString(),I(e.TryStart),I(e.TryEnd),I(e.HandlerStart),I(e.HandlerEnd),I(e.FilterStart),e.CatchType?.FullName??"");}
            static void Main(string[] a){
              using var src=ModuleDefMD.Load(a[0]);using var mod=ModuleDefMD.Load(a[0]);
              var bridge=mod.GetTypes().Single(t=>t.FullName=="RedLightDistrict.Korean.CsvLookup");
              var targets=new[]{("TalentFeeder","AppendFeederLine","rld_4270e752a74b229c8c22","rld_3d9a9a7c59284f7094b0"),("TalentWaterTank","AppendTankLine","rld_445d455a701f81452b29","rld_dd2d8d84624a3a346cba")};
              var helperType=new TypeDefUser("RedLightDistrict.Korean","StatusHeader",mod.CorLibTypes.Object.TypeDefOrRef){Attributes=TypeAttributes.NotPublic|TypeAttributes.Abstract|TypeAttributes.Sealed|TypeAttributes.BeforeFieldInit};mod.Types.Add(helperType);
              var sig=MethodSig.CreateStatic(mod.CorLibTypes.Int32,mod.CorLibTypes.String,mod.CorLibTypes.String,mod.CorLibTypes.String);
              var helper=new MethodDefUser("FirstIndex",sig,MethodImplAttributes.IL|MethodImplAttributes.Managed,MethodAttributes.Assembly|MethodAttributes.Static|MethodAttributes.HideBySig);helperType.Methods.Add(helper);
              IMethod? indexOf=null;
              var edits=new Dictionary<string,(int idx, string generated, string fallback, string read)>();
              var readMethod=bridge.Methods.Single(m=>m.Name=="Read"&&m.MethodSig.Params.Count==2);
              foreach(var (tn,mn,oldkey,newkey) in targets){
                var m=mod.GetTypes().Single(t=>t.FullName=="RedLightDistrict."+tn).Methods.Single(m=>m.Name==mn);
                var ins=m.Body.Instructions;
                var old=ins.Single(i=>i.OpCode==OpCodes.Ldstr&&Equals(i.Operand,oldkey));
                var generated=ins.Single(i=>i.OpCode==OpCodes.Ldstr&&Equals(i.Operand,newkey));
                int oi=ins.IndexOf(old),gi=ins.IndexOf(generated),off=oi+3;
                Need(ins[oi+1].OpCode==OpCodes.Ldstr&&ins[gi+1].OpCode==OpCodes.Ldstr&&Equals(ins[oi+1].Operand,ins[gi+1].Operand),"Matching original prefixes "+tn);
                Need(ins[oi+2].OpCode==OpCodes.Call&&Raw(ins[oi+2].Operand)==readMethod.FullName&&ins[gi+2].OpCode==OpCodes.Call&&Raw(ins[gi+2].Operand)==readMethod.FullName,"Exact inlined CSV bridge "+tn);
                string fallback=(string)ins[gi+1].Operand;
                var call=ins[off];Need(call.OpCode==OpCodes.Callvirt&&Raw(call.Operand)=="System.Int32 System.String::IndexOf(System.String)","Exact search "+tn);
                indexOf=(IMethod)call.Operand;
                Need(!ins.Any(i=>i.Operand is Instruction t&&t==call||i.Operand is IList<Instruction> ar&&ar.Contains(call)),"Branch bypasses inserted prefix");
                Need(!m.Body.ExceptionHandlers.Any(e=>e.TryStart==call||e.TryEnd==call||e.HandlerStart==call||e.HandlerEnd==call||e.FilterStart==call),"Exception boundary at search");
                edits.Add(m.FullName,(off,newkey,fallback,readMethod.FullName));
                ins.Insert(off,Instruction.Create(OpCodes.Ldstr,newkey));
                ins.Insert(off+1,Instruction.Create(OpCodes.Ldstr,fallback));
                ins.Insert(off+2,Instruction.Create(OpCodes.Call,readMethod));
                call.OpCode=OpCodes.Call;call.Operand=helper;
                m.Body.SimplifyBranches();m.Body.OptimizeBranches();
              }
              Need(indexOf!=null,"IndexOf anchor");
              var body=new CilBody{InitLocals=true,MaxStack=2};helper.Body=body;
              var first=new Local(mod.CorLibTypes.Int32);var second=new Local(mod.CorLibTypes.Int32);body.Variables.Add(first);body.Variables.Add(second);
              var checkSecond=Instruction.Create(OpCodes.Ldloc,second);var returnFirst=Instruction.Create(OpCodes.Ldloc,first);var returnSecond=Instruction.Create(OpCodes.Ldloc,second);
              foreach(var i in new[]{Instruction.Create(OpCodes.Ldarg_0),Instruction.Create(OpCodes.Ldarg_1),Instruction.Create(OpCodes.Callvirt,indexOf!),Instruction.Create(OpCodes.Stloc,first),Instruction.Create(OpCodes.Ldarg_0),Instruction.Create(OpCodes.Ldarg_2),Instruction.Create(OpCodes.Callvirt,indexOf!),Instruction.Create(OpCodes.Stloc,second),Instruction.Create(OpCodes.Ldloc,first),Instruction.Create(OpCodes.Ldc_I4_0),Instruction.Create(OpCodes.Bge,checkSecond),Instruction.Create(OpCodes.Br,returnSecond),checkSecond,Instruction.Create(OpCodes.Ldc_I4_0),Instruction.Create(OpCodes.Blt,returnFirst),Instruction.Create(OpCodes.Ldloc,first),Instruction.Create(OpCodes.Ldloc,second),Instruction.Create(OpCodes.Ble,returnFirst),returnSecond,Instruction.Create(OpCodes.Ret),returnFirst,Instruction.Create(OpCodes.Ret)})body.Instructions.Add(i);
              var temp=a[0]+".new";mod.Write(temp);using var output=ModuleDefMD.Load(temp);
              var original=src.GetTypes().SelectMany(t=>t.Methods).GroupBy(m=>m.FullName).ToDictionary(g=>g.Key,g=>g.OrderBy(m=>m.MDToken.Raw).ToArray());
              var updated=output.GetTypes().SelectMany(t=>t.Methods).GroupBy(m=>m.FullName).ToDictionary(g=>g.Key,g=>g.OrderBy(m=>m.MDToken.Raw).ToArray());
              Need(updated.Count==original.Count+1&&original.All(v=>updated.TryGetValue(v.Key,out var z)&&z.Length==v.Value.Length),"Method identity");
              int compared=0;
              foreach(var g in original)for(int j=0;j<g.Value.Length;j++){
                var x=g.Value[j];var y=updated[g.Key][j];Need(x.HasBody==y.HasBody,"Body "+g.Key);if(!x.HasBody)continue;
                var a1=x.Body.Instructions.ToArray();var b1=y.Body.Instructions.ToArray();
                bool changed=edits.TryGetValue(x.FullName,out var e);
                Need(b1.Length==a1.Length+(changed?3:0),"Instruction count "+g.Key);
                var ax=a1.Select((v,k)=>(v,k)).ToDictionary(z=>z.v,z=>z.k);
                var bx=b1.Select((v,k)=>(v,k)).ToDictionary(z=>z.v,z=>changed&&z.k>=e.idx?Math.Max(e.idx,z.k-3):z.k);
                Need(x.Body.Variables.Select(v=>v.Type.FullName).SequenceEqual(y.Body.Variables.Select(v=>v.Type.FullName)),"Locals "+g.Key);
                Need(x.Body.ExceptionHandlers.Select(h=>EH(h,ax)).SequenceEqual(y.Body.ExceptionHandlers.Select(h=>EH(h,bx))),"EH "+g.Key);
                for(int i=0;i<a1.Length;i++){
                  if(changed&&i==e.idx){
                    Need(b1[i].OpCode==OpCodes.Ldstr&&Raw(b1[i].Operand)==e.generated&&b1[i+1].OpCode==OpCodes.Ldstr&&Raw(b1[i+1].Operand)==e.fallback&&b1[i+2].OpCode==OpCodes.Call&&Raw(b1[i+2].Operand)==e.read&&b1[i+3].OpCode==OpCodes.Call&&Raw(b1[i+3].Operand)==helper.FullName,"Exact replacement "+g.Key);continue;
                  }
                  var v=a1[i];var w=b1[changed&&i>=e.idx?i+3:i];
                  Need(v.OpCode==w.OpCode||(v.Operand is Instruction&&v.OpCode.Name.Replace(".s","")==w.OpCode.Name.Replace(".s","")),"Opcode "+g.Key);
                  Need(Op(v.Operand,ax)==Op(w.Operand,bx),"Operand "+g.Key+" "+i);
                }compared++;
              }
              var ress=src.Resources.OfType<EmbeddedResource>().ToDictionary(r=>r.Name.ToString(),r=>Hash(r.CreateReader().ToArray()));
              var rest=output.Resources.OfType<EmbeddedResource>().ToDictionary(r=>r.Name.ToString(),r=>Hash(r.CreateReader().ToArray()));
              Need(ress.Count==rest.Count&&ress.All(x=>rest.TryGetValue(x.Key,out var s)&&x.Value==s),"Embedded resource bytes");
              // Check the emitted helper instruction count and reference algorithm cases.
              var helperOut=output.GetTypes().Single(t=>t.FullName==helperType.FullName).Methods.Single();
              Need(helperOut.Body.Instructions.Count==22,"Helper instruction count");
              int Ref(string s,string oldName,string newName){int i=s.IndexOf(oldName),j=s.IndexOf(newName);return i<0?j:j<0?i:Math.Min(i,j);}
              foreach(var (s,o,n,w) in new[]{("base\n旧:1","\n旧:","\n새:",4),("base\n새:1","\n旧:","\n새:",4),("base\n새:1\n旧:2","\n旧:","\n새:",4),("base\n旧:1\n새:2","\n旧:","\n새:",4),("base","\n旧:","\n새:",-1),("base\n旧:1","\n旧:","\n旧:",4)})Need(Ref(s,o,n)==w,"Reference search test");
              var before=Hash(File.ReadAllBytes(a[0]));var after=Hash(File.ReadAllBytes(temp));File.Move(temp,a[0],true);
              File.WriteAllText(a[1],JsonSerializer.Serialize(new{before,after,comparedMethods=compared,resourceCount=ress.Count,searchSites=edits.Count,helperInstructions=helperOut.Body.Instructions.Count,referenceCases=6,runtime="not tested",scope="Feeder and water status only; not the entire RLD audit"},new JsonSerializerOptions{WriteIndented=true})+"\n");
            }
          }
          CS
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          dotnet run --project /tmp/rldstatus/rldstatus.csproj -- "$ROOT/RedLightDistrict_v1.1.1/RedLightDistrict.dll" "$ROOT/번역대조표/RLD_STATUS_RESULT_20261122.json"
      - name: Add only four audited status display translations and verify exact CSV delta
        shell: bash
        run: |
          python3 - <<'PY'
          import csv, pathlib, io, json
          root=pathlib.Path('probably-stolen/local-mods/TentacleMod번역')
          mod=root/'RedLightDistrict_v1.1.1'
          p=mod/'Localization/ko.csv'
          original=p.read_bytes()
          old=list(csv.reader(io.StringIO(original.decode('utf-8-sig'),newline='')))
          known={r[0] for r in old}
          ref={}
          with (mod/'translation-work/internal_string_reference.tsv').open(encoding='utf-8-sig',newline='') as f:
              for row in csv.DictReader(f,delimiter='\t'):ref[row['key']]=row['korean_reference']
          additions={
            'rld_33a6ce61cfb86135c728':r'\n인재용 급식기: 설치되지 않음',
            'rld_3d9a9a7c59284f7094b0':r'\n인재용 급식기: ',
            'rld_560565bbfcde4ea2f6e5':r'\n인재용 정수기: 설치되지 않음',
            'rld_dd2d8d84624a3a346cba':r'\n인재용 정수기: ',
          }
          assert len(known)==len(old) and not (known&additions.keys())
          assert {'rld_4270e752a74b229c8c22','rld_445d455a701f81452b29'}.isdisjoint(known)
          for a,b in [('rld_33a6ce61cfb86135c728','rld_3d9a9a7c59284f7094b0'),('rld_560565bbfcde4ea2f6e5','rld_dd2d8d84624a3a346cba')]:
              assert additions[a].startswith(additions[b])
          # Preserve the complete existing bytes and all unrelated rows.
          stream=io.StringIO(newline='')
          writer=csv.writer(stream,lineterminator='\r\n',quoting=csv.QUOTE_ALL)
          writer.writerows(additions.items())
          new=original+(b'' if original.endswith(b'\n') else b'\r\n')+stream.getvalue().encode()
          p.write_bytes(new)
          rows=list(csv.reader(io.StringIO(new.decode('utf-8-sig'),newline='')))
          assert rows[:len(old)]==old and dict(rows[len(old):])==additions
          rp=root/'번역대조표/RLD_STATUS_RESULT_20261122.json'
          j=json.loads(rp.read_text())
          j.update(oldCsvRows=len(old),newCsvRows=len(rows),addedKeys=list(additions),rawSearchKeysPreserved=True,scopeComplete=True,rldComplete=False)
          rp.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit only verified status changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          git add --sparse "$ROOT/RedLightDistrict_v1.1.1/RedLightDistrict.dll" "$ROOT/RedLightDistrict_v1.1.1/Localization/ko.csv" "$ROOT/번역대조표/RLD_STATUS_RESULT_20261122.json"
          git diff --cached --quiet || (git commit -m 'Fix localized equipment status with both legacy and current header recognition' && git push origin main)
