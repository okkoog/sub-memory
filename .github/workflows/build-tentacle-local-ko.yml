name: Build MidnightPawn 1.2.0 local KO DLL
on:
  push:
    paths:
      - "probably-stolen/tools/tentacle-local-translation/**"
      - ".github/workflows/build-tentacle-local-ko.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          sparse-checkout: |
            probably-stolen/tools/tentacle-local-translation
            probably-stolen/mods/3831837821
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore pinned pre-0.8 translation catalogs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tentacle-translations"
          for file in pskb__3831837821.csv pskb__supp_3831837821.csv; do
            curl -fLsS --retry 3 "https://raw.githubusercontent.com/okkoog/sub-memory/eac54eb3237730296a2d598fa8203e1845efc599/probably-stolen/0.7.5.21-dev/Localization/$file" -o "$RUNNER_TEMP/tentacle-translations/$file"
          done
      - name: Rebuild offline translated DLL
        run: |
          set -euo pipefail
          mkdir -p probably-stolen/localized/MidnightPawn-1.2.0-KO/Mod
          dotnet run -c Release --project probably-stolen/tools/tentacle-local-translation/Patch.csproj -- \
            probably-stolen/mods/3831837821/MidnightPawn.dll \
            "$RUNNER_TEMP/tentacle-translations/pskb__3831837821.csv" \
            "$RUNNER_TEMP/tentacle-translations/pskb__supp_3831837821.csv" \
            probably-stolen/localized/MidnightPawn-1.2.0-KO/Mod/MidnightPawn.dll \
            probably-stolen/localized/MidnightPawn-1.2.0-KO/IL_AUDIT.txt
      - name: Copy supporting mod data and create localized manifest
        run: |
          python3 - <<'PY'
          import shutil, pathlib, xml.etree.ElementTree as ET
          src=pathlib.Path('probably-stolen/mods/3831837821')
          dst=pathlib.Path('probably-stolen/localized/MidnightPawn-1.2.0-KO/Mod')
          for sub in ('Content','Textures'):
              shutil.copytree(src/sub,dst/sub,dirs_exist_ok=True)
          # Preserve the original 13 region identifiers and comma-separated counts,
          # but use previously reviewed Korean name transliterations.
          import csv,os
          catalog=pathlib.Path(os.environ['RUNNER_TEMP'])/'tentacle-translations/pskb__3831837821.csv'
          with catalog.open(encoding='utf-8-sig',newline='') as f:
              values=[row[1] for row in csv.reader(f) if len(row)>1 and row[0]=='K|Content/names.txt']
          assert len(values)==1, 'Korean name data missing'
          translated_names=values[0].replace('\\\\n','\\n')
          orig_lines=(src/'Content/names.txt').read_text(encoding='utf-8-sig').splitlines()
          ko_lines=translated_names.splitlines()
          assert len(orig_lines)==len(ko_lines)==13, f'Region count changed: {len(orig_lines)} / {len(ko_lines)}'
          for idx,(orig,trans) in enumerate(zip(orig_lines,ko_lines)):
              original_parts=orig.split('\\t'); translated_parts=trans.split('\\t')
              assert len(original_parts)==len(translated_parts)==3, f'Field mismatch at region {idx}'
              assert original_parts[0]==translated_parts[0], f'Region identifier changed at {idx}'
              for field in (1,2):
                  a=original_parts[field].split(','); b=translated_parts[field].split(',')
                  assert len(a)==len(b), f'Name item count mismatch at region {idx}, field {field}: {len(a)} vs {len(b)}'
          (dst/'Content/names.txt').write_text(translated_names+'\\n',encoding='utf-8')
          doc=ET.parse(src/'manifest.xml')
          root=doc.getroot()
          name=root.find('Name');description=root.find('Description')
          assert name is not None and description is not None
          name.text='행복한 심우주: 인지 필터일지도?'
          description.text=('우주정거장에 숨어 있는 부드럽고 분홍빛인 행복의 보금자리. '
              '이 공간을 모두를 위한 안식처로 만들어 보세요.\n\n'
              '1.2.0 업데이트: 시작 특성 행복 필터(특성 슬롯 +3, 포인트 소모 없음), '
              '시작 시 행복의 보금자리 지급 및 매일 손님 1명 방문. '
              '무작위 이름과 소속·신분·체형을 가진 소녀 콘텐츠 추가. '
              '행운 유도제, 페로몬 농축액, 특제 은수 음료 추가.')
          assert root.findtext('ID')=='lewd_meme'
          assert root.findtext('ModVersion')=='1.2.0'
          ET.indent(doc,space='  ')
          doc.write(dst/'manifest.xml',encoding='utf-8',xml_declaration=True)
          PY
      - name: Validate installation package
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,xml.etree.ElementTree as ET
          src=Path('probably-stolen/mods/3831837821/MidnightPawn.dll')
          dst=Path('probably-stolen/localized/MidnightPawn-1.2.0-KO/Mod/MidnightPawn.dll')
          assert src.read_bytes()!=dst.read_bytes()
          assert (dst.parent/'Content/names.txt').is_file()
          assert (dst.parent/'Textures').is_dir()
          manifest=ET.parse(dst.parent/'manifest.xml').getroot()
          assert manifest.findtext('ID')=='lewd_meme'
          assert manifest.findtext('ModVersion')=='1.2.0'
          p=dst.parent.parent/'IL_AUDIT.txt'
          with p.open('a',encoding='utf8') as f:
              f.write('\nInput SHA256: '+hashlib.sha256(src.read_bytes()).hexdigest())
              f.write('\nOutput SHA256: '+hashlib.sha256(dst.read_bytes()).hexdigest()+'\n')
          PY
          cat > probably-stolen/localized/MidnightPawn-1.2.0-KO/README_KO.txt <<'EOF'
          MidnightPawn v1.2.0 — local Korean DLL build
          Replaces ONLY the local installation copy. Original workshop DLL is untouched.
          Install Mod folder's contents as a separate local mod folder under <Game>/Mods/.
          DO NOT load both the local copy and the original workshop mod simultaneously.
          All translated code literals were compared to source mappings and IL instruction structure.
          Runtime loading / save-game behavior must be checked in the actual game.
          EOF
          cd probably-stolen/localized/MidnightPawn-1.2.0-KO
          zip -qr -9 ../MidnightPawn-1.2.0-KO-Local.zip Mod README_KO.txt IL_AUDIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MidnightPawn-1.2.0-KO-local-test
          path: |
            probably-stolen/localized/MidnightPawn-1.2.0-KO-Local.zip
            probably-stolen/localized/MidnightPawn-1.2.0-KO/IL_AUDIT.txt
          if-no-files-found: error
      - name: Commit translated local mod to separate directory
        run: |
          git add --sparse -- probably-stolen/localized/MidnightPawn-1.2.0-KO/
          git add --sparse -- probably-stolen/localized/MidnightPawn-1.2.0-KO-Local.zip
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build MidnightPawn 1.2.0 offline KO local mod"
          git pull --rebase origin main
          git push origin HEAD:main
