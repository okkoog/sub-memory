name: Confirm item identity field and registration mismatch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-dwk-id-fields-20261122.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/起飞攻速装-v1.1.3抢先体验版（修bug）/起飞攻速装.dll
            probably-stolen/local-mods/TentacleMod번역/起飞攻速装-v1.1.3抢先体验版（修bug）/起飞攻速装.dll
      - name: Compare exact identifier operands and field assignments
        run: |
          set -euo pipefail
          dotnet new console --framework net8.0 -o /tmp/identity --force
          dotnet add /tmp/identity/identity.csproj package dnlib --version 4.5.0
          cat >/tmp/identity/Program.cs <<'CS'
          using System;
          using System.Linq;
          using System.Collections.Generic;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class Program {
           static string S(object? o) { if(o is string s) return s.Length<=100 ? s : "[long string]"; if(o is Instruction i)return "@"+i.Offset.ToString("X4");return o?.ToString()??""; }
           static void Main(string[] args) {
           using var a=ModuleDefMD.Load(args[0]);using var b=ModuleDefMD.Load(args[1]);
           foreach(var m in a.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody&& (m.DeclaringType.FullName=="DailyWearKitchen.Definition"&&m.Name==".ctor"||m.DeclaringType.FullName=="DailyWearKitchen.Catalog"&&(m.Name=="Register"||m.Name=="Apply")||m.DeclaringType.FullName=="DailyWearKitchen.Tea"&&m.Name=="Definitions"||m.DeclaringType.FullName=="DailyWearKitchen.QiluoShop"&&m.Name=="Stock"))){
           var n=b.GetTypes().SelectMany(t=>t.Methods).Single(x=>x.FullName==m.FullName);
           Console.WriteLine("METHOD "+m.FullName);
           var x=m.Body.Instructions;var y=n.Body.Instructions;
           if(x.Count!=y.Count){Console.WriteLine("COUNT DIFFERENT");continue;}
           for(int i=0;i<x.Count;i++){if(x[i].Operand is string && !(m.DeclaringType.FullName=="DailyWearKitchen.Tea"&&m.Name=="Definitions"))continue;Console.WriteLine($"{x[i].Offset:X4} {x[i].OpCode} {S(x[i].Operand)}"+(S(x[i].Operand)!=S(y[i].Operand)?" => "+S(y[i].Operand):""));}
           }
           int count=0;var bm=b.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToDictionary(m=>m.FullName);
           foreach(var m in a.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody)){if(!bm.TryGetValue(m.FullName,out var n)||m.Body.Instructions.Count!=n.Body.Instructions.Count)continue;var x=m.Body.Instructions;var y=n.Body.Instructions; for(int i=0;i<x.Count;i++)if(x[i].OpCode==OpCodes.Ldstr&&x[i].Operand is string s&&s.StartsWith("dwk_")&&s!=y[i].Operand as string){Console.WriteLine("ID_DIFF "+m.FullName+" "+x[i].Offset.ToString("X4")+" "+s+" => "+S(y[i].Operand));count++;}}
           Console.WriteLine("ID_DIFF_COUNT "+count);
           }
          }
          CS
          P=probably-stolen/local-mods
          D='起飞攻速装-v1.1.3抢先体验版（修bug）/起飞攻速装.dll'
          dotnet run --project /tmp/identity -- "$P/TentacleMod/$D" "$P/TentacleMod번역/$D"
