name: Verify isolated color diagnostic changes
on:
  push:
    paths: ['.github/workflows/brood-diagnostic-label-audit-20261122.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod번역/lewdMemeBrood v0331/LewdMemeBrood.dll
            probably-stolen/local-mods/TentacleMod번역/번역대조표/Brood_DiagnosticLabels_20261122.cs
      - name: Compile diagnostic-only check
        shell: bash
        run: |
          set -euo pipefail
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          dotnet new console --framework net8.0 -o /tmp/diagnostic-audit --force
          dotnet add /tmp/diagnostic-audit/diagnostic-audit.csproj package dnlib --version 4.5.0
          cp "$ROOT/번역대조표/Brood_DiagnosticLabels_20261122.cs" /tmp/diagnostic-audit/Program.cs
          git lfs pull --include="$ROOT/lewdMemeBrood v0331/LewdMemeBrood.dll" --exclude=''
          dotnet run --project /tmp/diagnostic-audit -- "$ROOT/lewdMemeBrood v0331/LewdMemeBrood.dll" /tmp/diagnostic-audit/temporary.dll "$ROOT/번역대조표/Brood_DIAGNOSTIC_RESULT_20261122.json"
          rm /tmp/diagnostic-audit/temporary.dll
          cat "$ROOT/번역대조표/Brood_DIAGNOSTIC_RESULT_20261122.json"
      - name: Commit neutral audit evidence only
        shell: bash
        run: |
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse "$ROOT/번역대조표/Brood_DIAGNOSTIC_RESULT_20261122.json"
          git diff --cached --quiet || (git commit -m 'Verify exact diagnostic labels and unchanged remaining IL' && git push origin main)
