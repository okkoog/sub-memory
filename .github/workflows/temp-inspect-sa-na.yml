name: Temp inspect localization structure for ShopAssist NightAuction
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-inspect-sa-na.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/mods/3829106910
            probably-stolen/mods/3829429358
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - name: Decompile and summarize localization classes
        run: |
          set -euo pipefail
          dotnet tool install ilspycmd --tool-path "$RUNNER_TEMP/ilspy" >/dev/null
          for item in "SA:probably-stolen/mods/3829106910/ShopAssist.dll" "NA:probably-stolen/mods/3829429358/XIAOWONightAuction.dll"; do
            tag="${item%%:*}"; dll="${item#*:}"
            "$RUNNER_TEMP/ilspy/ilspycmd" "$dll" > "$RUNNER_TEMP/$tag.cs"
          done
          python3 - <<'PY'
          import re,os,pathlib,collections
          for tag in ['SA','NA']:
              data=(pathlib.Path(os.environ['RUNNER_TEMP'])/f'{tag}.cs').read_text()
              print(f"========== {tag} total decompiled chars {len(data)} ==========")
              for line in data.splitlines():
                  if re.search(r'^\s*(?:public|private|internal|protected)?\s*(?:sealed |static |partial )*(?:class|enum|struct)\s+\w+',line) and re.search(r'(?i)loc|lang|translat|text|ui|menu|string|config|setting|main',line):
                      print("TYPE",line.strip()[:170])
              print("========== sample code around locale references ==========")
              patterns=['ResolveStartupLocale','GetLocalized','GetLang','Localize','Localization','Language','Chinese','English','== "zh"','== "en"','"ko"','Text(']
              for p in patterns:
                  matches=list(re.finditer(re.escape(p),data,re.I))
                  print("TOKEN",p,"total",len(matches))
                  for m in matches[:3]:
                      print("SNIPPET",repr(data[max(0,m.start()-170):m.start()+450].replace('\n',' ')))
              print("========== filtered strings ==========")
              candidates=re.findall(r'"((?:[^"\\]|\\.)*)"',data)
              chinese=[s for s in candidates if re.search('[一-龥]',s)]
              korean=[s for s in candidates if re.search('[가-힣]',s)]
              print("CHINESE total",len(chinese),"KOREAN total",len(korean),"unique CHINESE",len(set(chinese)))
              print("sample CHINESE",repr(list(dict.fromkeys(chinese))[:70]))
              print("sample KOREAN",repr(list(dict.fromkeys(korean))[:30]))
          PY
