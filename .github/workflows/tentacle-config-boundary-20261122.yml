name: LewdMemeConfig scoped display boundary verification
on:
  push:
    paths: ['.github/workflows/tentacle-config-boundary-20261122.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod번역/lewd_meme_config0.7.2-pre
            probably-stolen/local-mods/TentacleMod번역/번역대조표/LewdMemeConfig_DIRECT_RESULT_20261122.json
            probably-stolen/Managed/Assembly-CSharp.dll
            probably-stolen/Managed/0Harmony.dll
            probably-stolen/Managed/UnityEngine.CoreModule.dll
            probably-stolen/Managed/UnityEngine.dll
            probably-stolen/Managed/UnityEngine.UI.dll
            probably-stolen/Managed/Assembly-CSharp-firstpass.dll
      - name: Compile display-only helper against existing game API
        shell: bash
        run: |
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          MOD="$ROOT/lewd_meme_config0.7.2-pre"
          mkdir -p /tmp/cfghelper
          cp "$MOD/Source/Integration/ConfigDisplayKo.cs" /tmp/cfghelper/
          MANAGED="$PWD/probably-stolen/Managed"
          cat >/tmp/cfghelper/cfghelper.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net472</TargetFramework><LangVersion>latest</LangVersion><Optimize>true</Optimize><DebugType>none</DebugType><GenerateAssemblyInfo>false</GenerateAssemblyInfo></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies" Version="1.0.3" PrivateAssets="all"/>
              <Reference Include="Assembly-CSharp"><HintPath>$MANAGED/Assembly-CSharp.dll</HintPath></Reference>
              <Reference Include="Assembly-CSharp-firstpass"><HintPath>$MANAGED/Assembly-CSharp-firstpass.dll</HintPath></Reference>
              <Reference Include="0Harmony"><HintPath>$MANAGED/0Harmony.dll</HintPath></Reference>
              <Reference Include="UnityEngine.CoreModule"><HintPath>$MANAGED/UnityEngine.CoreModule.dll</HintPath></Reference>
              <Reference Include="UnityEngine"><HintPath>$MANAGED/UnityEngine.dll</HintPath></Reference>
              <Reference Include="UnityEngine.UI"><HintPath>$MANAGED/UnityEngine.UI.dll</HintPath></Reference>
            </ItemGroup>
          </Project>
          EOF
          dotnet build /tmp/cfghelper/cfghelper.csproj -c Release
      - name: Embed helper in existing mod DLL and verify precise insertion boundaries
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/cfgboundary --force
          dotnet add /tmp/cfgboundary/cfgboundary.csproj package dnlib --version 4.5.0
          cat >/tmp/cfgboundary/Program.cs <<'CS'
          using System;
          using System.Linq;
          using System.IO;
          using System.Collections.Generic;
          using System.Text.Json;
          using System.Security.Cryptography;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
            static void Need(bool x,string why){if(!x)throw new Exception(why);}
            static string Hash(byte[] x)=>Convert.ToHexString(SHA256.HashData(x)).ToLowerInvariant();
            static string Op(object? x,Dictionary<Instruction,int> m)=>x switch{null=>"",Instruction i=>"@"+m[i],IList<Instruction> a=>string.Join(",",a.Select(i=>"@"+m[i])),_=>x.ToString()??""};
            static string EH(ExceptionHandler e,Dictionary<Instruction,int> m){
              string I(Instruction? i)=>i==null?"-":m[i].ToString();
              return string.Join("|",e.HandlerType.ToString(),I(e.TryStart),I(e.TryEnd),I(e.HandlerStart),I(e.HandlerEnd),I(e.FilterStart),e.CatchType?.FullName??"");
            }
            static bool Cjk(string s)=>s.Any(c=>c>='\u3400'&&c<='\u9fff');
            static void Main(string[] a){
              byte[] raw=File.ReadAllBytes(a[0]);Need(Hash(raw)=="74f2c43a0d9ff6cf2ceb95d410e37650b10461470f30be84f8928b117fe464e6","Previous verified DLL hash");
              using var original=ModuleDefMD.Load(raw);using var target=ModuleDefMD.Load(raw);using var donor=ModuleDefMD.Load(a[1]);
              using var game=ModuleDefMD.Load(a[2]);
              Need(Hash(File.ReadAllBytes(a[2]))=="6398d44aa1675e1f02b63bc668868f970e0f5d3ae5a50f2aced8d06ca084e3b5","Game assembly baseline");
              var type=donor.GetTypes().Single(t=>t.FullName=="LewdMemeConfig.ConfigDisplayKo");
              Need(type.Fields.Count==0&&type.NestedTypes.Count==0&&type.Methods.All(m=>m.IsStatic&&m.HasBody&&!m.HasGenericParameters),"Helper shape");
              var importer=new Importer(target,ImporterOptions.TryToUseTypeDefs);
              var tnew=new TypeDefUser(type.Namespace,type.Name,target.CorLibTypes.Object.TypeDefOrRef){Attributes=type.Attributes};target.Types.Add(tnew);
              var mapping=new Dictionary<MethodDef,MethodDef>();
              foreach(var d in type.Methods){
                var m=new MethodDefUser(d.Name,importer.Import(d.MethodSig),d.ImplAttributes,d.Attributes);
                tnew.Methods.Add(m);mapping.Add(d,m);
              }
              object? ImportOperand(object? o,MethodDef dst,Dictionary<Instruction,Instruction> ins,Dictionary<Local,Local> locals){
                return o switch{
                  null=>null,Instruction i=>ins[i],IList<Instruction> seq=>seq.Select(i=>ins[i]).ToArray(),Local l=>locals[l],
                  Parameter p=>dst.Parameters[p.Index],
                  MethodDef d when mapping.ContainsKey(d)=>mapping[d],
                  ITypeDefOrRef t when t.FullName==type.FullName=>tnew,
                  IMethod m=>importer.Import(m),IField f=>importer.Import(f),ITypeDefOrRef t=>importer.Import(t),
                  MethodSig s=>importer.Import(s),_=>o
                };
              }
              foreach(var d in type.Methods){
                var m=mapping[d];var old=d.Body;var body=new CilBody{InitLocals=old.InitLocals,MaxStack=old.MaxStack};m.Body=body;
                var locals=new Dictionary<Local,Local>();foreach(var l in old.Variables){var z=new Local(importer.Import(l.Type));locals.Add(l,z);body.Variables.Add(z);}
                var instructions=old.Instructions.ToDictionary(i=>i,i=>new Instruction(i.OpCode));
                foreach(var i in old.Instructions){var n=instructions[i];n.Operand=ImportOperand(i.Operand,m,instructions,locals);body.Instructions.Add(n);}
                Instruction? At(Instruction? i)=>i==null?null:instructions[i];
                foreach(var e in old.ExceptionHandlers)body.ExceptionHandlers.Add(new ExceptionHandler(e.HandlerType){TryStart=At(e.TryStart),TryEnd=At(e.TryEnd),HandlerStart=At(e.HandlerStart),HandlerEnd=At(e.HandlerEnd),FilterStart=At(e.FilterStart),CatchType=e.CatchType==null?null:importer.Import(e.CatchType)});
              }
              var panel=target.GetTypes().Single(t=>t.FullName=="LewdMemeConfig.PanelRowPatch");
              var install=panel.Methods.Single(m=>m.Name=="Install");var marked=panel.Methods.Single(m=>m.Name=="MarkedRow");
              var h=panel.Fields.Single(f=>f.Name=="harmony");
              var installAnchor=install.Body.Instructions.Single(i=>i.Offset==0x49);
              Need(installAnchor.OpCode==OpCodes.Leave_S,"Existing install end");
              int ip=install.Body.Instructions.IndexOf(installAnchor);
              var ni=new[]{Instruction.Create(OpCodes.Ldsfld,h),Instruction.Create(OpCodes.Ldarg_0),Instruction.Create(OpCodes.Call,tnew.Methods.Single(m=>m.Name=="Install"))};
              for(int i=0;i<ni.Length;i++)install.Body.Instructions.Insert(ip+i,ni[i]);
              var choiceAnchor=marked.Body.Instructions.Single(i=>i.Offset==0x8e);
              Need(choiceAnchor.OpCode==OpCodes.Callvirt&&choiceAnchor.Operand.ToString()!.Contains("ConfigEntry::get_Choices"),"Marked row display array anchor");
              int cp=marked.Body.Instructions.IndexOf(choiceAnchor)+1;
              Need(marked.Body.Instructions[cp].OpCode==OpCodes.Ldc_I4_0,"Marked row original index computation");
              marked.Body.Instructions.Insert(cp,Instruction.Create(OpCodes.Ldarg_1));
              marked.Body.Instructions.Insert(cp+1,Instruction.Create(OpCodes.Call,tnew.Methods.Single(m=>m.Name=="Choices")));
              // These two strings are separate DebugPanel.SpawnItemEntry.Label initializers, not item IDs.
              var debug=target.GetTypes().Single(t=>t.FullName=="LewdMemeConfig.DebugPanel").Methods.Single(m=>m.Name==".cctor");
              var expected=new Dictionary<int,string>();
              foreach(var entry in new[]{(off:0xe1,source:"闹钟",text:"알람 시계"),(off:0x13b,source:"陷阱",text:"함정")}){
                var i=debug.Body.Instructions.Single(i=>i.Offset==entry.off);
                int idx=debug.Body.Instructions.IndexOf(i);
                Need(i.OpCode==OpCodes.Ldstr&&Equals(i.Operand,entry.source)&&debug.Body.Instructions[idx+1].OpCode==OpCodes.Stfld&&debug.Body.Instructions[idx+1].Operand.ToString()!.Contains("SpawnItemEntry::Label"),"Debug label anchor");
                i.Operand=entry.text;expected.Add(idx,entry.text);
              }
              var gt=game.GetTypes().Single(t=>t.Name=="ModConfigWindow");
              var op=gt.Methods.Single(m=>m.Name=="Open");var be=gt.Methods.Single(m=>m.Name=="BuildEntry");
              Need(op.Body.Instructions.Single(i=>i.Offset==0x10d).Operand?.ToString()=="section_"&&op.Body.Instructions.Single(i=>i.Offset==0x119).Operand.ToString()!.Contains("AddHeader"),"Game header anchor");
              Need(be.Body.Instructions.Single(i=>i.Offset==0x12e).Operand.ToString()!.Contains("get_Choices")&&be.Body.Instructions.Single(i=>i.Offset==0x135).Operand.ToString()!.Contains("get_Choices")&&be.Body.Instructions.Single(i=>i.Offset==0x151).Operand.ToString()!.Contains("AddDropdown"),"Game choices anchor");
              install.Body.SimplifyBranches();install.Body.OptimizeBranches();marked.Body.SimplifyBranches();marked.Body.OptimizeBranches();
              string tmp=a[0]+".new";target.Write(tmp);using var read=ModuleDefMD.Load(tmp);
              var om=original.GetTypes().SelectMany(t=>t.Methods).GroupBy(m=>m.FullName).ToDictionary(g=>g.Key,g=>g.OrderBy(m=>m.MDToken.Raw).ToArray());
              var nm=read.GetTypes().SelectMany(t=>t.Methods).GroupBy(m=>m.FullName).ToDictionary(g=>g.Key,g=>g.OrderBy(m=>m.MDToken.Raw).ToArray());
              Need(nm.Count==om.Count+type.Methods.Count&&om.All(v=>nm.TryGetValue(v.Key,out var z)&&z.Length==v.Value.Length),"All old methods present");
              int compared=0;var rest=new List<object>();
              foreach(var pair in om)for(int n=0;n<pair.Value.Length;n++){
                var o=pair.Value[n];var k=nm[pair.Key][n];Need(o.HasBody==k.HasBody,"Body "+o.FullName);if(!o.HasBody)continue;
                var x=o.Body.Instructions.ToList();var y=k.Body.Instructions.ToList();
                int extra=o.FullName==install.FullName?3:o.FullName==marked.FullName?2:0;int position=extra==3?ip:cp;
                Need(y.Count==x.Count+extra,"Instruction count "+o.FullName);
                var xm=x.Select((i,k)=>(i,k)).ToDictionary(z=>z.i,z=>z.k);
                var ym=y.Select((i,k)=>(i,k)).ToDictionary(z=>z.i,z=>extra>0&&z.k>=position?z.k<position+extra?position:z.k-extra:z.k);
                Need(o.Body.Variables.Select(l=>l.Type.FullName).SequenceEqual(k.Body.Variables.Select(l=>l.Type.FullName)),"Local types "+o.FullName);
                Need(o.Body.ExceptionHandlers.Select(e=>EH(e,xm)).SequenceEqual(k.Body.ExceptionHandlers.Select(e=>EH(e,ym))),"Exception handlers "+o.FullName);
                if(extra==3)Need(y[ip].OpCode==OpCodes.Ldsfld&&y[ip].Operand.ToString()!.Contains("::harmony")&&y[ip+1].OpCode==OpCodes.Ldarg_0&&y[ip+2].OpCode==OpCodes.Call&&y[ip+2].Operand.ToString()!.Contains("ConfigDisplayKo::Install"),"Install insertion");
                if(extra==2)Need(y[cp].OpCode==OpCodes.Ldarg_1&&y[cp+1].OpCode==OpCodes.Call&&y[cp+1].Operand.ToString()!.Contains("ConfigDisplayKo::Choices"),"Marked row insertion");
                for(int i=0;i<x.Count;i++){
                  var u=x[i];var v=y[extra>0&&i>=position?i+extra:i];
                  // Short and long branches are equivalent when the destination index matches.
                  var uc=u.OpCode.Name.Replace(".s","");var vc=v.OpCode.Name.Replace(".s","");
                  Need(uc==vc&&(u.OpCode==v.OpCode||u.Operand is Instruction),"Opcode "+o.FullName+" "+i);
                  string ex=o.FullName==debug.FullName&&expected.TryGetValue(i,out var value)?value:Op(u.Operand,xm);
                  Need(ex==Op(v.Operand,ym),"Operand "+o.FullName+" "+i);
                  if(v.OpCode==OpCodes.Ldstr&&v.Operand is string s&&Cjk(s))rest.Add(new{method=k.FullName,token=k.MDToken.Raw.ToString("X8"),offset=v.Offset,source=s});
                }
                compared++;
              }
              var rr=read.GetTypes().Single(t=>t.FullName==type.FullName);
              Need(rr.Methods.Count==type.Methods.Count,"Embedded helper count");
              foreach(var dm in type.Methods){
                var m=rr.Methods.Single(m=>m.Name==dm.Name&&m.MethodSig.Params.Count==dm.MethodSig.Params.Count);
                Need(dm.Body.Instructions.Count==m.Body.Instructions.Count,"Helper copy "+dm.Name);
                var dmidx=dm.Body.Instructions.Select((i,k)=>(i,k)).ToDictionary(x=>x.i,x=>x.k);
                var mmidx=m.Body.Instructions.Select((i,k)=>(i,k)).ToDictionary(x=>x.i,x=>x.k);
                for(int i=0;i<dm.Body.Instructions.Count;i++){
                  Need(dm.Body.Instructions[i].OpCode==m.Body.Instructions[i].OpCode,"Helper opcode "+dm.Name);
                  Need(Op(dm.Body.Instructions[i].Operand,dmidx)==Op(m.Body.Instructions[i].Operand,mmidx),"Helper operand "+dm.Name+" "+i);
                }
              }
              Need(!read.GetAssemblyRefs().Any(x=>x.Name=="cfghelper"),"No helper DLL runtime dependency");
              var ares=original.Resources.OfType<EmbeddedResource>().ToDictionary(x=>x.Name.ToString(),x=>x.CreateReader().ToArray());
              var bres=read.Resources.OfType<EmbeddedResource>().ToDictionary(x=>x.Name.ToString(),x=>x.CreateReader().ToArray());
              Need(ares.Count==bres.Count&&ares.All(x=>bres.TryGetValue(x.Key,out var z)&&x.Value.SequenceEqual(z)),"Embedded resources");
              var uncertain=read.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody&&m.DeclaringType.Name=="MaidenPatch"&&(m.Name=="OnConfigChanged"||m.Name=="WritePoolOrExp"||m.Name=="PoolMeta"||m.Name=="WritePool"||m.Name=="WriteJobsAtCompose"||m.Name=="WriteFbbAtCompose")).Select(m=>new{method=m.FullName,token=m.MDToken.Raw.ToString("X8"),instructions=m.Body.Instructions.Select(i=>new{offset=i.Offset,opcode=i.OpCode.Name,operand=i.Operand?.ToString()??""}).ToArray()}).ToArray();
              File.Move(tmp,a[0],true);
              var opts=new JsonSerializerOptions{WriteIndented=true,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping};
              File.WriteAllText(a[3],JsonSerializer.Serialize(new{previousDllHash=Hash(raw),finalDllHash=Hash(File.ReadAllBytes(a[0])),comparedMethods=compared,embeddedHelperMethods=rr.Methods.Count,debugLabels=2,headerBoundary=1,choiceBoundaries=2,sharedIdsAndValuesPreserved=true,unchangedResources=ares.Count,remainingCjk=rest,uncertain,runtime="not tested"},opts)+"\n");
              Console.WriteLine("Verified "+compared+" old method bodies; helper "+rr.Methods.Count+" methods; two debug labels; scoped header and choice copy boundaries.");
            }
          }
          CS
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          MOD="$ROOT/lewd_meme_config0.7.2-pre"
          dotnet run --project /tmp/cfgboundary/cfgboundary.csproj -- "$MOD/LewdMemeConfig.dll" /tmp/cfghelper/bin/Release/net472/cfghelper.dll probably-stolen/Managed/Assembly-CSharp.dll "$ROOT/번역대조표/LewdMemeConfig_BOUNDARY_RESULT_20261122.json"
      - name: Commit verified intermediate DLL and remaining callsite evidence
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          git add --sparse "$ROOT/lewd_meme_config0.7.2-pre/LewdMemeConfig.dll" "$ROOT/번역대조표/LewdMemeConfig_BOUNDARY_RESULT_20261122.json"
          git diff --cached --quiet || (git commit -m 'Verify scoped Korean configuration display boundaries and preserve raw values' && git push origin main)
