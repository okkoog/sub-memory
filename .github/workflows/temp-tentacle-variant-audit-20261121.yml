name: Tentacle Eleanor variants embedded-localization structural audit
on:
  push:
    paths: [.github/workflows/temp-tentacle-variant-audit-20261121.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/3842247788
            probably-stolen/local-mods/TentacleMod/3843142171
            probably-stolen/local-mods/TentacleMod/落魄千金-埃莉诺 v1.0.3
            probably-stolen/local-mods/TentacleMod번역/번역대조표
          sparse-checkout-cone-mode: false
      - name: Analyze CLR metadata and embedded CSV without executing DLL
        shell: bash
        run: |
          python3 -m pip -q install dnfile
          python3 - <<'PY'
          from pathlib import Path
          import dnfile,hashlib,io,csv,json,collections
          root=Path("probably-stolen/local-mods")
          p=root/"TentacleMod"
          output=root/"TentacleMod번역"/"번역대조표"
          output.mkdir(parents=True,exist_ok=True)
          items={"eleanor_v1.0.0":p/"3842247788/fallen_heiress_eleanor.dll",
                 "integrated_v1.1.3":p/"3843142171/fallen_heiress_eleanor.dll",
                 "eleanor_v1.0.3":p/"落魄千金-埃莉诺 v1.0.3/fallen_heiress_eleanor.dll"}
          records={}
          out=["# Eleanor variants original managed-resource audit\n"]
          for version,path in items.items():
              pe=dnfile.dnPE(str(path))
              byname={str(r.name):r.data for r in pe.net.resources}
              strings={}
              for name,data in byname.items():
                  if ("localization" in name.lower() or name.lower().endswith(".csv")) and name.endswith(".csv"):
                      try:
                          text=data.decode("utf-8-sig")
                          rows=list(csv.reader(io.StringIO(text)))
                          strings[name]=rows
                      except (UnicodeDecodeError,csv.Error) as e:
                          strings[name]=[["<parse error>",str(e)]]
              records[version]={"resources":byname,"strings":strings}
              out+=[f"## {version}","- File: "+str(path),"- Bytes: "+str(path.stat().st_size),
                  "- SHA256: "+hashlib.sha256(path.read_bytes()).hexdigest(),
                  "- CLR TypeDef: "+str(pe.net.mdtables.TypeDef.num_rows),
                  "- CLR MethodDef: "+str(pe.net.mdtables.MethodDef.num_rows),
                  "- Managed resources: "+str(len(byname))]
              out += ["- "+name+" | "+str(len(data))+" bytes | sha256="+hashlib.sha256(data).hexdigest()
                      for name,data in sorted(byname.items()) if ("localization" in name.lower() or name.lower().endswith(".csv") or name.lower().endswith(".json") or name.lower().endswith(".txt"))]
              for name,rows in strings.items():
                  out.append("- CSV "+name+": "+str(len(rows))+" raw rows; header "+repr(rows[0][:4] if rows else None))
              out.append("")
          for vers in ("eleanor_v1.0.0","integrated_v1.1.3"):
              out.append("## Resource and text comparison: "+vers+" against v1.0.3")
              a=records[vers]["resources"]
              b=records["eleanor_v1.0.3"]["resources"]
              out.append(f"- common resource names: {len(a.keys() & b.keys())}; version-only: {len(a.keys()-b.keys())}; ref-only: {len(b.keys()-a.keys())}")
              out.append(f"- common resources same bytes: {sum(a[n]==b[n] for n in a.keys()&b.keys())}")
              for k,rows in records[vers]["strings"].items():
                  if not (k in records["eleanor_v1.0.3"]["strings"]):continue
                  rr=records["eleanor_v1.0.3"]["strings"][k]
                  def table(rs):
                      return {r[0]:r[1] for r in rs[1:] if len(r)>=2}
                  x,y=table(rows),table(rr)
                  out.append(f"- {k}: keys {len(x)} vs {len(y)}; common {len(x.keys()&y.keys())}; exact-value matches {sum(x[n]==y[n] for n in x.keys()&y.keys())}; changed {sum(x[n]!=y[n] for n in x.keys()&y.keys())}; new keys {len(x.keys()-y.keys())}; missing keys {len(y.keys()-x.keys())}")
              out.append("")
          report=output/"Eleanor_VARIANTS_CLR_AUDIT_20261121.md"
          report.write_text("\n".join(out),encoding="utf-8")
          print(report.read_text()[:9000])
          PY
      - name: Commit audit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse 'probably-stolen/local-mods/TentacleMod번역/번역대조표/Eleanor_VARIANTS_CLR_AUDIT_20261121.md'
          git diff --cached --quiet || (git commit -m 'audit(tentacle): compare v1.0.0 v1.0.3 and integrated v1.1.3 CLR resources' && git pull --rebase origin main && git push)
