name: Audit visible strings for storage and card mods

on:
  push:
    paths:
      - "probably-stolen/tools/audit_visible_strings.py"
      - ".github/workflows/audit-visible-strings.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
          sparse-checkout: |
            probably-stolen/tools/audit_visible_strings.py
            probably-stolen/mods/3829085054/ItemStorage.dll
            probably-stolen/mods/3832048841/GameCardPK.dll
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install ILSpy
        run: dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
      - name: Decompile
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/visible"
          mkdir -p "$ROOT/3829085054" "$ROOT/3832048841"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p -o "$ROOT/3829085054" probably-stolen/mods/3829085054/ItemStorage.dll
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p -o "$ROOT/3832048841" probably-stolen/mods/3832048841/GameCardPK.dll
      - name: Audit visible strings
        env:
          DECOMPILED_ROOT: ${{ runner.temp }}/visible
        run: python3 probably-stolen/tools/audit_visible_strings.py
      - name: Upload ItemStorage UI source
        uses: actions/upload-artifact@v4
        with:
          name: itemstorage-decompiled-ui
          path: |
            ${{ runner.temp }}/visible/3829085054/ItemStorage/AutoStow.cs
            ${{ runner.temp }}/visible/3829085054/ItemStorage/BoxItem.cs
            ${{ runner.temp }}/visible/3829085054/ItemStorage/BoxRestock.cs
            ${{ runner.temp }}/visible/3829085054/ItemStorage/BoxStowAll.cs
            ${{ runner.temp }}/visible/3829085054/ItemStorage/BoxTooltip.cs
            ${{ runner.temp }}/visible/3829085054/ItemStorage/BoxTransfer.cs
            ${{ runner.temp }}/visible/3829085054/ItemStorage/BoxWindow.cs
            ${{ runner.temp }}/visible/3829085054/ItemStorage/GearPanel.cs
            ${{ runner.temp }}/visible/3829085054/ItemStorage/SlotLock.cs
            ${{ runner.temp }}/visible/3829085054/ItemStorage/StoragePatch.cs
          if-no-files-found: error
      - name: Upload GameCardPK source
        uses: actions/upload-artifact@v4
        with:
          name: gamecardpk-decompiled-source
          path: ${{ runner.temp }}/visible/3832048841/**/*.cs
          if-no-files-found: error
      - name: Commit report
        shell: bash
        run: |
          git add --sparse -- probably-stolen/analysis/visible-string-audit.tsv
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Audit storage and card visible strings"
          git pull --rebase origin main
          git push origin HEAD:main
