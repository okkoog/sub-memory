name: Probably Stolen managed output pipeline trace
on:
  push:
    branches: [probably-stolen-koreanpack-sol]
    paths:
      - '.github/workflows/managed-output-pipeline-trace.yml'
  workflow_dispatch:

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probably-stolen-koreanpack-sol
          fetch-depth: 1
          sparse-checkout: |
            probably-stolen/Managed/Assembly-CSharp.dll
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
      - name: List relevant managed types
        shell: bash
        run: |
          set -euo pipefail
          dll=probably-stolen/Managed/Assembly-CSharp.dll
          "$RUNNER_TEMP/ilspy/ilspycmd" -l c "$dll" > "$RUNNER_TEMP/types.txt"
          grep -Ei 'Machinery(Button|Label)|Pixel(Window|Element)|Tooltip|RichText|GameItemElement|Dialogue|LocHelper|Localization|Showcase|Record|Transcript|History|Log' "$RUNNER_TEMP/types.txt" > "$RUNNER_TEMP/relevant-types.txt" || true
          cat "$RUNNER_TEMP/relevant-types.txt"
      - name: Decompile confirmed output types
        shell: bash
        run: |
          set -euo pipefail
          dll=probably-stolen/Managed/Assembly-CSharp.dll
          mkdir -p out
          for t in MachineryButton MachineryLabel PixelWindow PixelElement GameItemElement Dialogue LocHelper ModSourceHelper ModInternal DirectoryMaster ModItemDirectory ItemTooltipHandler TooltipManager DialogueHandler DialoguePhoneUIManager StoreClient StoreClientManager StoreClientList StorePhoneClient PhoneUIManager DialogUIManager MachineryContainerUtils MachineryContainer MachineryPanel MachineryPanelRow AdvButtonElement MachineHelper CustomUIManager CustomUIWindow ShowcaseHelper TypeHelper ClienteleUIManager NegociationUIManager RecorderUIManager StoreRecorder RecordUIManager LogUIManager NightLog EmporiumEntry StoreStationUI StoreInfoUI StoreInfoPanel ShowcaseDisplayUI ShowcaseUI ShowcasePanel ShowcaseCustomerUI ShowcaseWindow; do
            if grep -Fxq "Class $t" "$RUNNER_TEMP/types.txt"; then
              "$RUNNER_TEMP/ilspy/ilspycmd" -t "$t" "$dll" > "out/$t.cs" || true
            fi
          done
          cp "$RUNNER_TEMP/relevant-types.txt" out/relevant-types.txt
          find out -maxdepth 1 -type f -print | sort
      - name: Find all managed callers of Showcase customer data
        shell: bash
        run: |
          set -euo pipefail
          dll=probably-stolen/Managed/Assembly-CSharp.dll
          mkdir -p /tmp/allmanaged
          "$RUNNER_TEMP/ilspy/ilspycmd" -p -o /tmp/allmanaged "$dll" >/tmp/decompile-all.log 2>&1 || true
          grep -RInE 'GetDisplayCaseCustomer\(|GetDisplayCaseType\(|attractedType|expected.*customer|Expected.*Customer' /tmp/allmanaged --include='*.cs' > out/showcase-callers.txt || true
          head -n 400 out/showcase-callers.txt
      - uses: actions/upload-artifact@v4
        with:
          name: managed-output-pipeline-trace
          path: out/
          if-no-files-found: error
