name: Temp inspect console item commands

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-inspect-console-item-commands.yml"

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/Managed/Assembly-CSharp.dll
            probably-stolen/Managed/QFSW.QC.dll
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install ILSpy
        run: dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
      - name: Decompile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p -o "$RUNNER_TEMP/src" probably-stolen/Managed/Assembly-CSharp.dll
      - name: Find console commands
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out/files"
          python3 - <<'PY'
          import os,re,pathlib,shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'src'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          patterns=[
            re.compile(r'\bCommand\s*\('),
            re.compile(r'user-commands|all-commands|QuantumConsole|QFSW\.QC',re.I),
            re.compile(r'MoveItemToInventory|SpawnItem|DirectoryMaster\.Item|FindAllItem',re.I),
            re.compile(r'spawn.{0,50}item|item.{0,50}spawn|give.{0,50}item|item.{0,50}give',re.I),
          ]
          contexts=[]; files=set()
          for p in root.rglob('*.cs'):
              lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
              for i,line in enumerate(lines):
                  if any(rx.search(line) for rx in patterns):
                      files.add(p)
                      a=max(0,i-10); b=min(len(lines),i+16)
                      contexts.append(f'### {p.relative_to(root)}:{i+1}\n'+'\n'.join(f'{j+1:05d}: {lines[j]}' for j in range(a,b)))
          (out/'contexts.txt').write_text('\n\n'.join(contexts),encoding='utf-8')
          (out/'matched-files.txt').write_text('\n'.join(str(p.relative_to(root)) for p in sorted(files)),encoding='utf-8')
          for p in files:
              rel=p.relative_to(root); dst=out/'files'/rel
              dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,dst)
          print('files',len(files),'contexts',len(contexts))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: console-item-command-inspect
          path: ${{ runner.temp }}/out
          if-no-files-found: error
