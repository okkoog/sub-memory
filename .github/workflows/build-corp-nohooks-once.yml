name: Build Corp menu one-shot NoHooks trial
on:
  push:
    paths:
      - "probably-stolen/tools/nohooks/CorpMenuOneShot.*"
      - ".github/workflows/build-corp-nohooks-once.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Weave one-time Corp menu translation into a copy of NoHooks
        run: |
          set -euxo pipefail
          dotnet run --project probably-stolen/tools/nohooks/CorpMenuOneShot.csproj -c Release -- \
            probably-stolen/build/out/ProbablyStolenKoreanPack.NoHooks.0.7.5.21-dev.dll \
            probably-stolen/mods/3828913695/CorpPresence.dll \
            probably-stolen/build/out/ProbablyStolenKoreanPack.NoHooks.CorpMenuTrial.dll \
            probably-stolen/build/out/ProbablyStolenKoreanPack.NoHooks.CorpMenuTrial.audit.txt
      - name: Upload experimental DLL and audit
        uses: actions/upload-artifact@v4
        with:
          name: NoHooks-CorpMenuTrial
          path: |
            probably-stolen/build/out/ProbablyStolenKoreanPack.NoHooks.CorpMenuTrial.dll
            probably-stolen/build/out/ProbablyStolenKoreanPack.NoHooks.CorpMenuTrial.audit.txt
          if-no-files-found: error
      - name: Commit separate experimental build
        run: |
          set -euxo pipefail
          git add probably-stolen/build/out/ProbablyStolenKoreanPack.NoHooks.CorpMenuTrial.dll probably-stolen/build/out/ProbablyStolenKoreanPack.NoHooks.CorpMenuTrial.audit.txt
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build NoHooks experimental Corp menu one-shot translation"
          git pull --rebase origin main
          git push origin HEAD:main
