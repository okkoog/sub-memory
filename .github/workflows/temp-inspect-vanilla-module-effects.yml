name: Temp inspect vanilla module effects

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-inspect-vanilla-module-effects.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/Managed/Assembly-CSharp.dll
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
      - name: Decompile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p             -o "$RUNNER_TEMP/src"             probably-stolen/Managed/Assembly-CSharp.dll
      - name: Find vanilla module effect paths
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          python3 - <<'PY'
          import pathlib,re,os
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'src'
          pats=[
            r'AddEffectToModule',
            r'MODULE_EFFECT_',
            r'system_module_',
            r'ModuleEffectHelper',
            r'CreateModule',
            r'Random.*Module',
          ]
          rx=re.compile('|'.join(pats),re.I)
          out=[]
          for p in root.rglob('*.cs'):
              lines=p.read_text(encoding='utf-8',errors='replace').splitlines()
              for i,line in enumerate(lines):
                  if rx.search(line):
                      a=max(0,i-12); b=min(len(lines),i+24)
                      out.append(f'### {p.relative_to(root)}:{i+1}\n'+'\n'.join(f'{j+1:05d}: {lines[j]}' for j in range(a,b)))
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'out'/'module-effects.txt').write_text('\n\n'.join(out),encoding='utf-8')
          print('matches',len(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: vanilla-module-effects-inspect
          path: ${{ runner.temp }}/out
          if-no-files-found: error
