name: Package three Korean localization updates 2026-11-09
on:
  push:
    paths:
      - '.github/workflows/package-three-localizations-20261109.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and package three updated Korean CSV files
        run: |
          python3 - <<'PY'
          import csv
          import io
          import re
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          root=Path('probably-stolen')
          loc=root/'번역 모드'/'Localization'
          ids=['3830758908','3833095213','3834619049']
          counts={'3830758908':524,'3833095213':4121,'3834619049':270}
          def parse(source,prefix=''):
              keys={}
              for i,line in enumerate(source.read_text(encoding='utf-8-sig').splitlines(),1):
                  if not line or line.startswith('#'): continue
                  row=next(csv.reader([line],strict=True))
                  if len(row)!=2: raise ValueError(f'{source}:{i}: invalid columns')
                  key,value=row
                  if prefix:
                      if not key.startswith(prefix): continue
                      key=key[len(prefix):]
                  if key in keys: raise ValueError(f'{source}: duplicate key {key}')
                  keys[key]=value
              return keys
          dest=root/'maintenance'/'translation-update-three-mods-2026-11-09.zip'
          dest.parent.mkdir(parents=True,exist_ok=True)
          with ZipFile(dest,'w',ZIP_DEFLATED) as z:
              for id in ids:
                  src=loc/f'pskb__{id}.csv'
                  en=root/'mods'/id/'Localization'/'en.csv'
                  ko=parse(src,'K|')
                  source=parse(en)
                  if len(ko)!=counts[id] or set(ko)!=set(source):
                      raise ValueError(f'{id}: key mismatch, translated {len(ko)}, source {len(source)}')
                  for key,value in source.items():
                      pattern=r'\{\d+\}'
                      if sorted(re.findall(pattern,value))!=sorted(re.findall(pattern,ko[key])):
                          raise ValueError(f'{id}: placeholder mismatch {key}')
                  z.write(src,arcname=src.name)
          with ZipFile(dest) as z:
              assert len(z.namelist())==3 and z.testzip() is None
          print('Verified and packaged:',dest,'size',dest.stat().st_size)
          PY
      - name: Commit package
        run: |
          git add -- probably-stolen/maintenance/translation-update-three-mods-2026-11-09.zip
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Package three updated Korean localization CSVs'
          git pull --rebase origin main
          git push origin HEAD:main
