name: Complete Brood five display-only self-test labels
on:
  push:
    paths:
      - .github/workflows/temp-tentacle-brood5-stage-patch-20261122.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod번역/lewdMemeBrood v0331
            probably-stolen/local-mods/TentacleMod번역/번역대조표
          sparse-checkout-cone-mode: false
      - name: Patch only five proven Check.That display labels
        shell: bash
        run: |
          dotnet new console --framework net8.0 --force -o /tmp/brood5-ko
          dotnet add /tmp/brood5-ko/brood5-ko.csproj package dnlib --version 4.5.0
          cat > /tmp/brood5-ko/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using System.Security.Cryptography;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class Program {
            static int Main() {
              var root="probably-stolen/local-mods/TentacleMod번역";
              var path=root+"/lewdMemeBrood v0331/LewdMemeBrood.dll";
              var translations=new Dictionary<string,string> {
                ["萝莉 → 少女"]="로리 → 소녀",
                ["少女 → 御姐"]="소녀 → 누님",
                ["御姐 → 少妇"]="누님 → 새댁",
                ["少妇 → 熟女"]="새댁 → 숙녀",
                ["熟女为止"]="숙녀까지"
              };
              var before=SHA256.HashData(File.ReadAllBytes(path));
              var counts=translations.Keys.ToDictionary(k=>k,k=>0);
              var methods=new List<string>();
              using(var mod=ModuleDefMD.Load(path)){
                foreach(var type in mod.GetTypes()) {
                  foreach(var method in type.Methods.Where(m=>m.HasBody)) {
                    var body=method.Body.Instructions;
                    for(int i=0;i<body.Count;i++) {
                      var ins=body[i];
                      if(ins.OpCode!=OpCodes.Ldstr || ins.Operand is not string value || !translations.ContainsKey(value)) continue;
                      if(!method.Name.ToString().Contains("RegisterTests") || type.FullName.ToString()!="BroodMainCycle.TentacleChild.TentacleUse/<>c")
                        throw new Exception("Unverified callsite: "+method.FullName+" "+value);
                      if(i+1>=body.Count || body[i+1].OpCode!=OpCodes.Call ||
                         !(body[i+1].Operand?.ToString()?.Contains("BroodMainCycle.Check::That(System.Boolean,System.String)")??false))
                        throw new Exception("Target not directly passed to Check.That: "+value);
                      counts[value]++;
                      methods.Add(method.FullName.ToString());
                      ins.Operand=translations[value];
                    }
                  }
                }
                if(counts.Values.Any(x=>x!=1))throw new Exception("Unexpected target count: "+string.Join(", ",counts.Select(x=>x.Key+"="+x.Value)));
                string temp=path+".tmp";
                mod.Write(temp);
                File.Move(temp,path,true);
              }
              using(var verify=ModuleDefMD.Load(path)) {
                var originalSet=new HashSet<string>(translations.Keys);
                var koCounts=translations.Values.ToDictionary(k=>k,k=>0);
                foreach(var method in verify.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody)) {
                  foreach(var ins in method.Body.Instructions.Where(i=>i.OpCode==OpCodes.Ldstr)) {
                    if(ins.Operand is not string v)continue;
                    if(originalSet.Contains(v))throw new Exception("Old display target remains: "+v);
                    if(koCounts.ContainsKey(v))koCounts[v]++;
                  }
                }
                if(koCounts.Values.Any(x=>x!=1))throw new Exception("Translated target missing or duplicated");
                var essential=verify.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody)
                  .SelectMany(m=>m.Body.Instructions).Where(i=>i.OpCode==OpCodes.Ldstr)
                  .Select(i=>i.Operand?.ToString()??"").ToHashSet();
                foreach(var key in new[]{"萝莉","少女","御姐","少妇","熟女","MAIDEN_BODY"})
                  if(!essential.Contains(key))throw new Exception("Game-critical comparison key disappeared: "+key);
              }
              var after=SHA256.HashData(File.ReadAllBytes(path));
              var lines=new List<string> {
                "# Brood five stage self-test labels — Korean patch and IL validation",
                "",
                "- Target: `lewdMemeBrood v0331/LewdMemeBrood.dll`",
                "- Verified callsites: `BroodMainCycle.TentacleChild.TentacleUse/<>c::<RegisterTests>b__8_0` calling `BroodMainCycle.Check::That(Boolean,String)`.",
                "- Stage labels 5/5 replaced only as the reporting argument; no `MAIDEN_BODY` comparison values were changed.",
                "- Input SHA256: `"+Convert.ToHexString(before).ToLowerInvariant()+"`",
                "- Output SHA256: `"+Convert.ToHexString(after).ToLowerInvariant()+"`",
                "",
                "| Chinese label | Korean label | IL callsite instances |",
                "|---|---|---:|"
              };
              foreach(var pair in translations) lines.Add("| "+pair.Key+" | "+pair.Value+" | "+counts[pair.Key]+" |");
              lines.Add("");
              lines.Add("- Static dnlib read-back checks: all old five display strings absent, each new Korean display string appears once, six essential comparison keys still exist.");
              lines.Add("- Original mod DLL untouched. Actual Unity/CLR game execution not tested.");
              File.WriteAllText(root+"/번역대조표/Brood_STAGE_5_KO_PATCH_AUDIT_20261122.md",string.Join("\n",lines)+"\n");
              Console.WriteLine(string.Join("\n",lines));
              return 0;
            }
          }
          CS
          dotnet run --project /tmp/brood5-ko/brood5-ko.csproj -c Release
      - name: Create final Brood Korean overlay ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          import hashlib, csv, io, json, re
          root=Path('probably-stolen/local-mods/TentacleMod번역')
          sub=Path('lewdMemeBrood v0331')
          dll=root/sub/'LewdMemeBrood.dll'
          interaction=root/sub/'Content/interactionLines.json'
          locale=root/sub/'Localization/ko.csv'
          audit=root/'번역대조표/Brood_STAGE_5_KO_PATCH_AUDIT_20261122.md'
          assert all(p.is_file() for p in [dll,interaction,locale,audit])
          dialogue=json.loads(interaction.read_text(encoding='utf-8'))
          assert len(dialogue['lines'])==135
          assert not any(re.search(r'[\u3400-\u9fff]',row['text']) for row in dialogue['lines'])
          labels={k for row in csv.reader(io.StringIO(locale.read_text(encoding='utf-8-sig'))) if row for k in row[:1]}
          assert len(labels)>=560
          readme=root/sub/'README_BROOD_FINAL_KO_20261122.txt'
          readme.write_text(
            'LewdMemeBrood v0.3.31 한국어 완성 오버레이\n\n'
            '게임을 종료하고 ZIP 내부의 lewdMemeBrood v0331 폴더 안 파일을 같은 이름의 원본 모드 폴더에 덮어쓰세요.\n'
            '포함: 번역 DLL, 외부 대사 JSON 135개, Localization/ko.csv, 자체 검사 표제 5개 수정, 검수 기록.\n'
            '내부 체형 식별자 및 MAIDEN_BODY 비교 문자열은 중국어 원문을 보존합니다.\n'
            '원본 모드의 별도 리소스와 기타 파일은 삭제하지 마세요.\n'
            '정적 검증 완료. 실제 게임/CLR 실행은 검증하지 않았습니다.\n',encoding='utf-8')
          files=[(dll,str(sub/'LewdMemeBrood.dll')),(interaction,str(sub/'Content/interactionLines.json')),(locale,str(sub/'Localization/ko.csv')),(readme,str(sub/'README_BROOD_FINAL_KO_20261122.txt')),(audit,'Brood_STAGE_5_KO_PATCH_AUDIT_20261122.md')]
          z=root/'ProbablyStolen_Brood_v0.3.31_KO_Final_DLL_JSON_20261122.zip'
          with ZipFile(z,'w',ZIP_DEFLATED,compresslevel=6) as out:
            for p,name in files:out.write(p,arcname=name)
          with ZipFile(z) as ver:
            assert ver.testzip() is None and len(ver.namelist())==len(files)
            for p,name in files:assert ver.read(name)==p.read_bytes()
          print('Final ZIP:',z,'bytes:',z.stat().st_size,'SHA256:',hashlib.sha256(z.read_bytes()).hexdigest())
          PY
      - name: Commit patched DLL audit and completed Brood ZIP
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse "probably-stolen/local-mods/TentacleMod번역/lewdMemeBrood v0331/LewdMemeBrood.dll" "probably-stolen/local-mods/TentacleMod번역/lewdMemeBrood v0331/README_BROOD_FINAL_KO_20261122.txt" "probably-stolen/local-mods/TentacleMod번역/번역대조표/Brood_STAGE_5_KO_PATCH_AUDIT_20261122.md" "probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_Brood_v0.3.31_KO_Final_DLL_JSON_20261122.zip"
          git commit -m 'fix(tentacle): localize five Brood self-test labels and package complete Korean overlay'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep 3
          done
          exit 1
