name: Probably Stolen remaining localization route audit
on:
  push:
    branches: [probably-stolen-koreanpack-sol]
    paths:
      - '.github/workflows/remaining-localization-route-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probably-stolen-koreanpack-sol
          fetch-depth: 1
          sparse-checkout: |
            probably-stolen/mods/3828913695/CorpPresence.dll
            probably-stolen/mods/3829085054/ItemStorage.dll
            probably-stolen/mods/3829429358/XIAOWONightAuction.dll
            probably-stolen/mods/3831837821/MidnightPawn.dll
            probably-stolen/mods/3832048841/GameCardPK.dll
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
      - name: Decompile target mods
        shell: bash
        run: |
          set -euo pipefail
          for spec in             "corp:probably-stolen/mods/3828913695/CorpPresence.dll"             "storage:probably-stolen/mods/3829085054/ItemStorage.dll"             "auction:probably-stolen/mods/3829429358/XIAOWONightAuction.dll"             "tentacle:probably-stolen/mods/3831837821/MidnightPawn.dll"             "card:probably-stolen/mods/3832048841/GameCardPK.dll"; do
            name="${spec%%:*}"
            dll="${spec#*:}"
            mkdir -p "$RUNNER_TEMP/$name"
            "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p -o "$RUNNER_TEMP/$name" "$dll"
          done
      - name: Extract exact screenshot routes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os,re
          root=Path(os.environ['RUNNER_TEMP'])
          out=Path('probably-stolen/analysis/remaining-localization-routes.md')
          queries={
            'card':['碎骨狼','基础版','生命值','攻击力','速度','技能槽上限','会先绕场跑三圈','游戏卡','破损版'],
            'storage':['收纳箱','一键收纳','全箱收纳','全箱上货','一键上货','UpdateTooltip','EnsureWindow','RefreshButtons'],
            'tentacle':['触手本体','经验','携带它去垃圾场拾荒','MaidenTooltip','OnTooltip'],
            'auction':['AuctionText','AuctionPhone','AuctionController','Night Auction','BuildDialogue','LocalizeCard','DisplayLog','Select('],
            'corp':['Lower Dealer','Lower Foot Traffic','Brand Catalog','Mail Order','Regular rebate','Dealer for','Expected rebate','Canning Equipment','Darve Food','Request a home visit to buy tobacco and alcohol','End Call','class L',' T(']
          }
          rows=['# Remaining localization route audit','']
          for name,terms in queries.items():
            base=root/name
            rows += [f'## {name}','']
            files=list(base.rglob('*.cs'))
            for p in files:
              lines=p.read_text(encoding='utf-8',errors='ignore').splitlines()
              hits=[]
              for i,l in enumerate(lines):
                if any(t in l for t in terms):
                  hits.append(i)
              if not hits: continue
              rows += [f'### {p.relative_to(base)}','']
              merged=[]
              for i in hits:
                a=max(0,i-35); b=min(len(lines),i+70)
                if merged and a<=merged[-1][1]+5:
                  merged[-1]=(merged[-1][0],max(merged[-1][1],b))
                else:
                  merged.append((a,b))
              for a,b in merged:
                rows += ['~~~csharp']+[f'{j+1:05d}: {lines[j]}' for j in range(a,b)]+['~~~','']
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_text('\n'.join(rows),encoding='utf-8')
          print(out)
          PY
      - name: Commit report
        shell: bash
        run: |
          git add --sparse -- probably-stolen/analysis/remaining-localization-routes.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Audit remaining localization routes from current mod DLLs"
          git pull --rebase origin probably-stolen-koreanpack-sol
          git push origin HEAD:probably-stolen-koreanpack-sol
