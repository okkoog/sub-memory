name: MidnightPawn final Korean UI and protected-state verification
on:
  push:
    paths:
      - '.github/workflows/tentacle-midnightpawn-final-20261122.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/lewd_meme2.1.0/manifest.xml
            probably-stolen/local-mods/TentacleMod/lewd_meme2.1.0/MidnightPawn.dll
            probably-stolen/local-mods/TentacleMod/lewd_meme2.1.0/Content/names.txt
            probably-stolen/local-mods/TentacleMod/lewd_meme2.1.0/Data/物品定义.csv
            probably-stolen/local-mods/TentacleMod/lewd_meme2.1.0/Localization
            probably-stolen/local-mods/TentacleMod번역/lewd_meme2.1.0
            probably-stolen/local-mods/TentacleMod번역/번역대조표/MidnightPawn_FINAL_PLAN_20261122.json
      - name: Patch only explicit audited callsites, translate display copies, statically compare all original methods
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/mp_final --force
          dotnet add /tmp/mp_final/mp_final.csproj package dnlib --version 4.5.0
          cat >/tmp/mp_final/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using System.Text.Json;
          using System.Security.Cryptography;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
            record Site(string token,string method,uint offset,string source,string target,string action);
            record Anchor(string token,string method,uint offset,string opcode,string operand,string kind);
            static void Need(bool b,string why){if(!b)throw new Exception(why);}
            static string Hash(byte[] b)=>Convert.ToHexString(SHA256.HashData(b)).ToLowerInvariant();
            static string Tok(MethodDef m)=>m.MDToken.Raw.ToString("X8");
            static string TextOperand(object? x)=>x switch{null=>"",Instruction i=>"IL_"+i.Offset.ToString("X4"),IList<Instruction> a=>string.Join(",",a.Select(i=>"IL_"+i.Offset.ToString("X4"))),_=>x.ToString()??""};
            static string Oper(object? x,Dictionary<Instruction,int> map)=>x switch{null=>"",Instruction i=>"@"+map[i],IList<Instruction> a=>string.Join(",",a.Select(i=>"@"+map[i])),_=>x.ToString()??""};
            static string Opcode(Instruction i)=>i.OpCode.OperandType==OperandType.ShortInlineBrTarget?i.OpCode.Name.Replace(".s",""):i.OpCode.Name;
            static Dictionary<Instruction,int> Idx(IList<Instruction> a)=>a.Select((v,i)=>(v,i)).ToDictionary(x=>x.v,x=>x.i);
            static string EH(ExceptionHandler e,Dictionary<Instruction,int> map){
              string I(Instruction? i)=>i==null?"-":map[i].ToString();
              return string.Join("|",e.HandlerType.ToString(),I(e.TryStart),I(e.TryEnd),I(e.HandlerStart),I(e.HandlerEnd),I(e.FilterStart),e.CatchType?.FullName??"");
            }
            static MethodDefUser Method(ModuleDefMD md,TypeDef owner,string name,params TypeSig[] args){
              var m=new MethodDefUser(name,MethodSig.CreateStatic(md.CorLibTypes.String,args),dnlib.DotNet.MethodImplAttributes.IL|dnlib.DotNet.MethodImplAttributes.Managed,dnlib.DotNet.MethodAttributes.Assembly|dnlib.DotNet.MethodAttributes.Static|dnlib.DotNet.MethodAttributes.HideBySig);
              m.Body=new CilBody();owner.Methods.Add(m);return m;
            }
            static void Main(string[] a){
              byte[] bytes=File.ReadAllBytes(a[0]);using var doc=JsonDocument.Parse(File.ReadAllText(a[1]));var plan=doc.RootElement;
              Need(Hash(bytes)==plan.GetProperty("baselineSha256").GetString(),"Baseline hash "+Hash(bytes));
              var sites=plan.GetProperty("sites").Deserialize<Site[]>()!;var anchors=plan.GetProperty("anchors").Deserialize<Anchor[]>()!;
              var mapping=plan.GetProperty("display").Deserialize<Dictionary<string,string>>()!;
              using var before=ModuleDefMD.Load(bytes);using var md=ModuleDefMD.Load(bytes);
              var mm=md.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToDictionary(Tok);
              var old=before.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToDictionary(Tok);
              var expected=new Dictionary<(string,int),string>();var insPlan=new Dictionary<(string,int),List<Instruction>>();
              var reviewed=new List<object>();var boundaries=new List<object>();
              foreach(var s in sites){
                Need(mm.TryGetValue(s.token,out var m)&&m!.FullName==s.method,"Method anchor "+s.method);
                var i=m!.Body.Instructions.SingleOrDefault(x=>x.Offset==s.offset);
                Need(i!=null&&i.OpCode==OpCodes.Ldstr,"IL anchor "+s.method);
                Need(Equals(i!.Operand,s.action=="already"?s.target:s.source),"Literal mismatch "+s.method+" "+s.offset);
                if(s.action=="patch"){expected.Add((s.token,m.Body.Instructions.IndexOf(i)),s.target);i.Operand=s.target;}
                reviewed.Add(new{s.token,s.method,s.offset,s.action,source=s.source,result=(string)i.Operand});
              }
              var eq=mm.Values.SelectMany(m=>m.Body.Instructions).Select(i=>i.Operand).OfType<IMethod>().First(m=>m.FullName=="System.Boolean System.String::op_Equality(System.String,System.String)");
              var empty=mm.Values.SelectMany(m=>m.Body.Instructions).Select(i=>i.Operand).OfType<IMethod>().First(m=>m.FullName=="System.Boolean System.String::IsNullOrEmpty(System.String)");
              var owner=md.GetTypes().Single(t=>t.FullName=="MidnightPawn.ModConst");
              var copy=Method(md,owner,"KoreanDisplayValue",md.CorLibTypes.String);
              foreach(var kv in mapping){
                var next=Instruction.Create(OpCodes.Nop);
                copy.Body.Instructions.Add(Instruction.Create(OpCodes.Ldarg_0));
                copy.Body.Instructions.Add(Instruction.Create(OpCodes.Ldstr,kv.Key));
                copy.Body.Instructions.Add(Instruction.Create(OpCodes.Call,eq));
                copy.Body.Instructions.Add(Instruction.Create(OpCodes.Brfalse,next));
                copy.Body.Instructions.Add(Instruction.Create(OpCodes.Ldstr,kv.Value));
                copy.Body.Instructions.Add(Instruction.Create(OpCodes.Ret));
                copy.Body.Instructions.Add(next);
              }
              copy.Body.Instructions.Add(Instruction.Create(OpCodes.Ldarg_0));copy.Body.Instructions.Add(Instruction.Create(OpCodes.Ret));
              var gameHelper=md.GetTypeRefs().Single(t=>t.FullName=="ModHelper");
              var localized=new MemberRefUser(md,"GetLocalized",MethodSig.CreateStatic(md.CorLibTypes.String,md.CorLibTypes.String,md.CorLibTypes.String,new SZArraySig(md.CorLibTypes.Object)),gameHelper);
              var type=Method(md,owner,"LocalizedOwnTypeDisplay",md.CorLibTypes.String,md.CorLibTypes.String);
              type.Body.InitLocals=true;
              var key=new Local(md.CorLibTypes.String);var result=new Local(md.CorLibTypes.String);
              type.Body.Variables.Add(key);type.Body.Variables.Add(result);
              var corrupt=Instruction.Create(OpCodes.Ldstr,"type_tentacle_corrupt");
              var tool=Instruction.Create(OpCodes.Ldstr,"type_tentacle_tool");
              var resolve=Instruction.Create(OpCodes.Stloc,key);
              var fallback=Instruction.Create(OpCodes.Ldarg_0);
              void Add(params Instruction[] il){foreach(var i in il)type.Body.Instructions.Add(i);}
              Add(Instruction.Create(OpCodes.Ldarg_1),Instruction.Create(OpCodes.Ldstr,"TENTACLE_CORRUPT"),Instruction.Create(OpCodes.Call,eq),Instruction.Create(OpCodes.Brtrue,corrupt),
                  Instruction.Create(OpCodes.Ldarg_1),Instruction.Create(OpCodes.Ldstr,"TENTACLE_TOOL"),Instruction.Create(OpCodes.Call,eq),Instruction.Create(OpCodes.Brtrue,tool),Instruction.Create(OpCodes.Br,fallback),
                  corrupt,Instruction.Create(OpCodes.Br,resolve),tool,resolve,
                  Instruction.Create(OpCodes.Ldstr,"lewd_meme"),Instruction.Create(OpCodes.Ldloc,key),Instruction.Create(OpCodes.Ldc_I4_0),Instruction.Create(OpCodes.Newarr,md.CorLibTypes.Object.TypeDefOrRef),Instruction.Create(OpCodes.Call,localized),Instruction.Create(OpCodes.Stloc,result),
                  Instruction.Create(OpCodes.Ldloc,result),Instruction.Create(OpCodes.Call,empty),Instruction.Create(OpCodes.Brtrue,fallback),
                  Instruction.Create(OpCodes.Ldloc,result),Instruction.Create(OpCodes.Ldloc,key),Instruction.Create(OpCodes.Call,eq),Instruction.Create(OpCodes.Brtrue,fallback),
                  Instruction.Create(OpCodes.Ldloc,result),Instruction.Create(OpCodes.Ret),fallback,Instruction.Create(OpCodes.Ret));
              foreach(var s in anchors){
                Need(mm.TryGetValue(s.token,out var m)&&m!.FullName==s.method,"Output method "+s.method);
                var i=m!.Body.Instructions.Single(x=>x.Offset==s.offset);
                Need(i.OpCode.Name==s.opcode&&TextOperand(i.Operand)==s.operand,"Output anchor mismatch "+s.method+" "+s.offset);
                var insert=s.kind=="type"?new List<Instruction>{Instruction.Create(OpCodes.Ldloc_0),Instruction.Create(OpCodes.Call,type)}:new List<Instruction>{Instruction.Create(OpCodes.Call,copy)};
                insPlan.Add((s.token,m.Body.Instructions.IndexOf(i)),insert);
                boundaries.Add(new{s.token,s.method,s.offset,s.kind,s.opcode,s.operand});
              }
              foreach(var g in insPlan.GroupBy(x=>x.Key.Item1)){
                var m=mm[g.Key];foreach(var p in g.OrderByDescending(x=>x.Key.Item2))for(int n=0;n<p.Value.Count;n++)m.Body.Instructions.Insert(p.Key.Item2+1+n,p.Value[n]);m.Body.SimplifyBranches();
              }
              string temp=a[0]+".new";md.Write(temp);using var check=ModuleDefMD.Load(temp);
              var nm=check.GetTypes().SelectMany(t=>t.Methods).GroupBy(m=>m.FullName).ToDictionary(g=>g.Key,g=>g.OrderBy(m=>m.MDToken.Raw).ToArray());
              var om=before.GetTypes().SelectMany(t=>t.Methods).GroupBy(m=>m.FullName).ToDictionary(g=>g.Key,g=>g.OrderBy(m=>m.MDToken.Raw).ToArray());
              Need(nm.Count==om.Count+2&&om.All(x=>nm.TryGetValue(x.Key,out var v)&&x.Value.Length==v.Length),"Method set");
              Need(before.GetTypes().Select(t=>t.FullName).OrderBy(x=>x).SequenceEqual(check.GetTypes().Select(t=>t.FullName).OrderBy(x=>x)),"Type set");
              int changed=0,compared=0,inserted=0,cjk=0;
              foreach(var pair in om)for(int n=0;n<pair.Value.Length;n++){
                var o=pair.Value[n];var k=nm[pair.Key][n];Need(o.HasBody==k.HasBody,"Body presence");if(!o.HasBody)continue;
                var oi=o.Body.Instructions;var ni=k.Body.Instructions;var token=Tok(o);
                var omap=Idx(oi);var nmap=new Dictionary<Instruction,int>();var align=new List<(Instruction x,Instruction y)>();
                int pos=0;
                for(int i=0;i<oi.Count;i++){
                  Need(pos<ni.Count,"Short body "+o.FullName);
                  var y=ni[pos++];nmap.Add(y,i);align.Add((oi[i],y));
                  if(insPlan.TryGetValue((token,i),out var adds))foreach(var app in adds){
                    Need(pos<ni.Count&&ni[pos].OpCode==app.OpCode&&TextOperand(ni[pos].Operand)==TextOperand(app.Operand),"Output added instruction "+o.FullName);
                    nmap.Add(ni[pos++],i);inserted++;
                  }
                }
                Need(pos==ni.Count,"Unexpected instruction "+o.FullName);
                Need(o.Body.Variables.Select(v=>v.Type.FullName).SequenceEqual(k.Body.Variables.Select(v=>v.Type.FullName)),"Locals "+o.FullName);
                Need(o.Body.ExceptionHandlers.Select(e=>EH(e,omap)).SequenceEqual(k.Body.ExceptionHandlers.Select(e=>EH(e,nmap))),"Exception handlers "+o.FullName);
                for(int i=0;i<align.Count;i++){
                  var (x,y)=align[i];Need(Opcode(x)==Opcode(y),"Opcode "+o.FullName+" "+i);
                  var exp=expected.TryGetValue((token,i),out var v)?v:Oper(x.Operand,omap);
                  Need(exp==Oper(y.Operand,nmap),"Unexpected operand "+o.FullName+" "+i);
                  if(expected.ContainsKey((token,i)))changed++;
                  if(y.OpCode==OpCodes.Ldstr&&y.Operand is string s&&s.Any(c=>c>='\u3400'&&c<='\u9fff')){
                    var st=sites.SingleOrDefault(z=>z.token==token&&z.offset==x.Offset);
                    Need(st!=null&&(st.action=="protect"||st.action=="display-boundary"),"Unclassified CJK "+o.FullName+" "+x.Offset);
                    cjk++;
                  }
                }
                compared++;
              }
              Need(changed==94&&compared==732&&inserted==anchors.Length+1&&cjk==228,"Counts "+changed+"/"+compared+"/"+inserted+"/"+cjk);
              foreach(var src in new[]{copy,type}){
                var dst=nm[src.FullName].Single();var ai=src.Body.Instructions;var bi=dst.Body.Instructions;var am=Idx(ai);var bm=Idx(bi);
                Need(ai.Count==bi.Count&&ai.Select(i=>Opcode(i)+" "+Oper(i.Operand,am)).SequenceEqual(bi.Select(i=>Opcode(i)+" "+Oper(i.Operand,bm))),"Helper readback "+src.Name);
              }
              var ar=before.Resources.OfType<EmbeddedResource>().ToDictionary(x=>x.Name.ToString(),x=>x.CreateReader().ToArray());var br=check.Resources.OfType<EmbeddedResource>().ToDictionary(x=>x.Name.ToString(),x=>x.CreateReader().ToArray());
              Need(ar.Count==br.Count&&ar.All(x=>br.TryGetValue(x.Key,out var b)&&x.Value.SequenceEqual(b)),"Resources");
              File.Move(temp,a[0],true);
              File.WriteAllText(a[2],JsonSerializer.Serialize(new{previousDllHash=Hash(bytes),finalDllHash=Hash(File.ReadAllBytes(a[0])),comparedMethods=compared,changedSites=changed,alreadyApplied=5,protectedOriginalCjkSites=cjk,displayBoundaryCalls=anchors.Length,helperCount=2,displayMapCount=mapping.Count,unchangedResources=ar.Count,reviewed,boundaries,runtime="not tested"},new JsonSerializerOptions{WriteIndented=true,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping})+"\n");
            }
          }
          CS
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          dotnet run --project /tmp/mp_final/mp_final.csproj -- "$ROOT/lewd_meme2.1.0/MidnightPawn.dll" "$ROOT/번역대조표/MidnightPawn_FINAL_PLAN_20261122.json" "$ROOT/번역대조표/MidnightPawn_FINAL_RESULT_20261122.json"
      - name: Check external data and installation overlay
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import csv,json,hashlib,xml.etree.ElementTree as ET
          root=Path('probably-stolen/local-mods/TentacleMod번역')
          source=Path('probably-stolen/local-mods/TentacleMod/lewd_meme2.1.0')
          mod=root/'lewd_meme2.1.0'
          report=root/'번역대조표/MidnightPawn_FINAL_RESULT_20261122.json'
          r=json.loads(report.read_text())
          def rows(p):
              return [x for x in csv.reader(p.read_text(encoding='utf-8-sig').splitlines()) if x]
          a=rows(source/'Data/物品定义.csv');b=rows(mod/'Data/物品定义.csv')
          assert len(a)==len(b)==16
          assert all(x[0]==y[0] and x[2:]==y[2:] for x,y in zip(a[1:],b[1:]))
          assert all(y[1] and not any('\u3400'<=c<='\u9fff' for c in y[1]) for y in b[1:])
          def names(p):
              return [x.split('\t') for x in p.read_text(encoding='utf-8-sig').splitlines() if x.strip()]
          na,nb=names(source/'Content/names.txt'),names(mod/'Content/names.txt')
          assert len(na)==len(nb)==13
          assert all(x[0]==y[0] and len(x)==len(y)==3 and all(len(x[j].split(','))==len(y[j].split(',')) for j in (1,2)) for x,y in zip(na,nb))
          assert all(not any('\u3400'<=c<='\u9fff' for c in y[j]) for y in nb for j in (1,2))
          assert sum(len(y[j].split(',')) for y in nb for j in (1,2))==5160
          zh=dict(rows(source/'Localization/zh.csv'));en=dict(rows(source/'Localization/en.csv'));ko=dict(rows(mod/'Localization/ko.csv'))
          assert zh.keys()==en.keys()==ko.keys()=={'type_tentacle_corrupt','type_tentacle_tool'}
          assert ko=={'type_tentacle_corrupt':'촉수 침식','type_tentacle_tool':'촉수'}
          o=ET.parse(source/'manifest.xml').getroot();n=ET.parse(mod/'manifest.xml').getroot()
          def canon(e):return None if e is None else (e.tag,(e.text or '').strip(),dict(e.attrib),[canon(c) for c in e])
          for key in ['ID','Author','ModVersion','GameVersions','Prerequisites','Assemblies','Capabilities']:
              assert canon(o.find(key))==canon(n.find(key)),key
          assert n.findtext('ModVersion')=='2.1.0'
          zpath=root/'ProbablyStolen_MidnightPawn_v2.1.0_KO_Final_20261122.zip'
          files=sorted(p for p in mod.rglob('*') if p.is_file())
          with ZipFile(zpath,'w',ZIP_DEFLATED,compresslevel=6) as z:
              for p in files:z.write(p,str(p.relative_to(root)))
          with ZipFile(zpath) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={str(p.relative_to(root)) for p in files}
              assert all(z.read(str(p.relative_to(root)))==p.read_bytes() for p in files)
          r.update(originalDllHash=hashlib.sha256((source/'MidnightPawn.dll').read_bytes()).hexdigest(),itemNames=15,npcNameEntries=5160,nameGroups=13,localizedTypeKeys=2,archive={'path':zpath.name,'sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),'files':len(files),'crc':'pass','matchesAllOverlayFiles':True},manifestVersion='2.1.0')
          report.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print({k:v for k,v in r.items() if k not in ('reviewed','boundaries')})
          PY
      - name: Commit verified final overlay only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          git add --sparse "$ROOT/lewd_meme2.1.0/MidnightPawn.dll" "$ROOT/번역대조표/MidnightPawn_FINAL_RESULT_20261122.json" "$ROOT/ProbablyStolen_MidnightPawn_v2.1.0_KO_Final_20261122.zip"
          git diff --cached --quiet || (git commit -m 'Finalize MidnightPawn Korean display callsites and preserved-state mappings' && git push origin main)
