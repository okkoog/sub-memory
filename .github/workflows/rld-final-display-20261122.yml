name: RLD final display-only boundaries
on:
  push:
    paths: ['.github/workflows/rld-final-display-20261122.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1
            probably-stolen/local-mods/TentacleMod번역/번역대조표/RLD_FINAL_PLAN_20261122.json
            probably-stolen/local-mods/TentacleMod번역/번역대조표/RLD_DISPLAY_HELPER_20261122.cs
            probably-stolen/local-mods/TentacleMod번역/번역대조표/RLD_STATUS_RESULT_20261122.json
            probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1/Localization/cn.csv
            probably-stolen/Managed/Assembly-CSharp.dll
            probably-stolen/Managed/Assembly-CSharp-firstpass.dll
            probably-stolen/Managed/0Harmony.dll
            probably-stolen/Managed/UnityEngine.CoreModule.dll
            probably-stolen/Managed/UnityEngine.dll
            probably-stolen/Managed/UnityEngine.UI.dll
      - name: Retrieve exact verified RLD binary
        run: |
          git lfs pull --include='probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll' --exclude=''
          test "$(sha256sum 'probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll' | cut -d' ' -f1)" = '45f3f40c401dc9cc99bd5261509df30d5e9b814b67422386676eb372e482e72b'
      - name: Compile display-only helper against existing game API
        shell: bash
        run: |
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          MOD="$ROOT/RedLightDistrict_v1.1.1"
          mkdir -p /tmp/cfghelper
          cp "$ROOT/번역대조표/RLD_DISPLAY_HELPER_20261122.cs" /tmp/cfghelper/
          MANAGED="$PWD/probably-stolen/Managed"
          cat >/tmp/cfghelper/cfghelper.csproj <<EOF
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup><TargetFramework>net472</TargetFramework><LangVersion>latest</LangVersion><Optimize>true</Optimize><DebugType>none</DebugType><GenerateAssemblyInfo>false</GenerateAssemblyInfo></PropertyGroup>
            <ItemGroup>
              <PackageReference Include="Microsoft.NETFramework.ReferenceAssemblies" Version="1.0.3" PrivateAssets="all"/>
              <Reference Include="Assembly-CSharp"><HintPath>$MANAGED/Assembly-CSharp.dll</HintPath></Reference>
              <Reference Include="Assembly-CSharp-firstpass"><HintPath>$MANAGED/Assembly-CSharp-firstpass.dll</HintPath></Reference>
              <Reference Include="0Harmony"><HintPath>$MANAGED/0Harmony.dll</HintPath></Reference>
              <Reference Include="UnityEngine.CoreModule"><HintPath>$MANAGED/UnityEngine.CoreModule.dll</HintPath></Reference>
              <Reference Include="UnityEngine"><HintPath>$MANAGED/UnityEngine.dll</HintPath></Reference>
              <Reference Include="UnityEngine.UI"><HintPath>$MANAGED/UnityEngine.UI.dll</HintPath></Reference>
            </ItemGroup>
          </Project>
          EOF
          dotnet build /tmp/cfghelper/cfghelper.csproj -c Release
      - name: Apply exact audited boundaries and verify all old methods and resources
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/rldfinal --force
          dotnet add /tmp/rldfinal/rldfinal.csproj package dnlib --version 4.5.0
          cat >/tmp/rldfinal/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using System.Security.Cryptography;
          using System.Text.Json;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
            record Boundary(string token,string method,uint offset,string opcode,string operand,string helper);
            record Alias(string key,string source,string target);
            record Parser(string key,string source,string target,string method,string displayKey);
            static void Need(bool b,string msg){if(!b)throw new Exception(msg);}
            static string Hash(byte[] x)=>Convert.ToHexString(SHA256.HashData(x)).ToLowerInvariant();
            static string Raw(object? o)=>o?.ToString()??"";
            static string Op(object? o,Dictionary<Instruction,int> ix)=>o switch{null=>"",Instruction i=>"@"+ix[i],IList<Instruction> a=>string.Join(",",a.Select(i=>"@"+ix[i])),_=>Raw(o)};
            static string EH(ExceptionHandler e,Dictionary<Instruction,int> m){string I(Instruction? i)=>i==null?"-":m[i].ToString();return string.Join("|",e.HandlerType.ToString(),I(e.TryStart),I(e.TryEnd),I(e.HandlerStart),I(e.HandlerEnd),I(e.FilterStart),e.CatchType?.FullName??"");}
            static bool Eq(Instruction a,Instruction b)=>a.OpCode==b.OpCode||a.Operand is Instruction&&a.OpCode.Name.Replace(".s","")==b.OpCode.Name.Replace(".s","");
            static void Main(string[] a){
              using var plan=JsonDocument.Parse(File.ReadAllText(a[1]));
              var baseline=Hash(File.ReadAllBytes(a[0]));Need(baseline==plan.RootElement.GetProperty("baselineSha256").GetString(),"Baseline SHA");
              using var src=ModuleDefMD.Load(a[0]);using var mod=ModuleDefMD.Load(a[0]);using var donor=ModuleDefMD.Load(a[2]);using var game=ModuleDefMD.Load(a[3]);
              var old=mod.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToArray();
              var originals=old.ToDictionary(m=>m,m=>m.Body.Instructions.ToArray());
              var byToken=old.ToDictionary(m=>m.MDToken.Raw.ToString("X8"));
              var read=mod.GetTypes().Single(t=>t.FullName=="RedLightDistrict.Korean.CsvLookup").Methods.Single(m=>m.Name=="Read"&&m.MethodSig.Params.Count==2);
              var patron=mod.GetTypes().Single(t=>t.FullName=="RedLightDistrict.PatronSystem");
              var id=patron.Methods.Single(m=>m.Name=="PatronIdentifier"&&m.IsStatic&&m.MethodSig.Params.Count==0&&m.ReturnType.FullName=="System.String");
              var idWrapper=new MethodDefUser("KoDisplayPatronIdentifier",MethodSig.CreateStatic(mod.CorLibTypes.String),MethodImplAttributes.IL|MethodImplAttributes.Managed,MethodAttributes.Assembly|MethodAttributes.Static|MethodAttributes.HideBySig);
              patron.Methods.Add(idWrapper);idWrapper.Body=new CilBody();idWrapper.Body.Instructions.Add(Instruction.Create(OpCodes.Call,id));idWrapper.Body.Instructions.Add(Instruction.Create(OpCodes.Ret));
              var dType=donor.GetTypes().Single(t=>t.FullName=="RedLightDistrict.Korean.DisplayBoundaryKo");
              Need(dType.Fields.Count==0&&dType.NestedTypes.Count==0&&dType.Methods.All(m=>m.IsStatic&&m.HasBody&&!m.HasGenericParameters),"Donor shape");
              var importer=new Importer(mod,ImporterOptions.TryToUseTypeDefs);
              var hType=new TypeDefUser(dType.Namespace,dType.Name,mod.CorLibTypes.Object.TypeDefOrRef){Attributes=dType.Attributes};mod.Types.Add(hType);
              var map=new Dictionary<MethodDef,MethodDef>();
              map.Add(dType.Methods.Single(m=>m.Name=="LookupStub"),read);
              map.Add(dType.Methods.Single(m=>m.Name=="PatronIdStub"),idWrapper);
              var donors=dType.Methods.Where(m=>m.Name!="LookupStub"&&m.Name!="PatronIdStub").ToArray();
              foreach(var d in donors){var m=new MethodDefUser(d.Name,importer.Import(d.MethodSig),d.ImplAttributes,d.Attributes);hType.Methods.Add(m);map.Add(d,m);}
              object? ImportOp(object? o,MethodDef dst,Dictionary<Instruction,Instruction> ins,Dictionary<Local,Local> locals)=>o switch{
                null=>null,Instruction i=>ins[i],IList<Instruction> seq=>seq.Select(i=>ins[i]).ToArray(),Local l=>locals[l],
                Parameter p=>dst.Parameters[p.Index],MethodDef d when map.ContainsKey(d)=>map[d],
                ITypeDefOrRef t when t.FullName==dType.FullName=>hType,
                IMethod m=>importer.Import(m),IField f=>importer.Import(f),ITypeDefOrRef t=>importer.Import(t),MethodSig s=>importer.Import(s),_=>o
              };
              foreach(var d in donors){
                var m=map[d];var ob=d.Body;var body=new CilBody{InitLocals=ob.InitLocals,MaxStack=ob.MaxStack};m.Body=body;
                var locals=new Dictionary<Local,Local>();foreach(var l in ob.Variables){var z=new Local(importer.Import(l.Type));locals.Add(l,z);body.Variables.Add(z);}
                var ins=ob.Instructions.ToDictionary(i=>i,i=>new Instruction(i.OpCode));
                foreach(var i in ob.Instructions){var n=ins[i];n.Operand=ImportOp(i.Operand,m,ins,locals);body.Instructions.Add(n);}
                Instruction? At(Instruction? i)=>i==null?null:ins[i];
                foreach(var e in ob.ExceptionHandlers)body.ExceptionHandlers.Add(new ExceptionHandler(e.HandlerType){TryStart=At(e.TryStart),TryEnd=At(e.TryEnd),HandlerStart=At(e.HandlerStart),HandlerEnd=At(e.HandlerEnd),FilterStart=At(e.FilterStart),CatchType=e.CatchType==null?null:importer.Import(e.CatchType)});
              }
              MethodDef H(string name)=>hType.Methods.Single(m=>m.Name==name);
              var inserts=new Dictionary<(MethodDef,int),Instruction[]>();var replacements=new Dictionary<(MethodDef,int),Instruction>();var log=new List<object>();
              void Before(MethodDef m,int i,Instruction[] add,string reason){
                Need(i>=0&&i<originals[m].Length&&!inserts.ContainsKey((m,i)),"Duplicate insertion "+m.FullName);
                var at=originals[m][i];
                if(i>0){Need(!originals[m].Any(j=>j.Operand is Instruction t&&t==at||j.Operand is IList<Instruction> arr&&arr.Contains(at)),"Branch bypass "+m.FullName+" "+at.Offset);Need(!m.Body.ExceptionHandlers.Any(e=>e.TryStart==at||e.TryEnd==at||e.HandlerStart==at||e.HandlerEnd==at||e.FilterStart==at),"EH bypass "+m.FullName+" "+at.Offset);}
                inserts.Add((m,i),add);log.Add(new{method=m.FullName,token=m.MDToken.Raw.ToString("X8"),offset=at.Offset,added=add.Select(z=>z.OpCode.Name+" "+Raw(z.Operand)).ToArray(),reason});
              }
              void Replace(MethodDef m,int i,MethodDef h){
                Need(!replacements.ContainsKey((m,i)),"Duplicate replacement");replacements[(m,i)]=Instruction.Create(OpCodes.Call,h);
              }
              foreach(var bnd in plan.RootElement.GetProperty("boundaries").Deserialize<Boundary[]>()!){
                var m=byToken[bnd.token];Need(m.FullName==bnd.method,"Boundary method");
                var ins=originals[m];int k=Array.FindIndex(ins,x=>x.Offset==bnd.offset);Need(k>=0&&ins[k].OpCode.Name==bnd.opcode&&Raw(ins[k].Operand)==bnd.operand,"Boundary anchor "+bnd.method);
                Before(m,k+1,new[]{Instruction.Create(OpCodes.Call,H(bnd.helper))},"Display argument only; saved identity untouched");
              }
              var parser=plan.RootElement.GetProperty("parser").Deserialize<Parser[]>()!;
              foreach(var row in parser){
                var m=old.Single(z=>z.FullName==row.method);var ins=originals[m];int k=Array.FindIndex(ins,x=>x.OpCode==OpCodes.Ldstr&&Equals(x.Operand,row.key));
                Need(k>=0&&ins[k+1].OpCode==OpCodes.Ldstr&&Equals(ins[k+1].Operand,row.source)&&ins[k+2].OpCode==OpCodes.Call&&Raw(ins[k+2].Operand)==read.FullName&&ins[k+3].IsLdcI4()&&ins[k+3].GetLdcI4Value()==4&&ins[k+4].OpCode==OpCodes.Callvirt&&Raw(ins[k+4].Operand)=="System.Int32 System.String::IndexOf(System.String,System.StringComparison)","Exact parser key "+row.key);
                Before(m,k+3,new[]{Instruction.Create(OpCodes.Ldstr,row.displayKey),Instruction.Create(OpCodes.Ldstr,row.source),Instruction.Create(OpCodes.Call,read)},"Check old source and displayed label using original comparison type");
                Replace(m,k+4,H("IndexEitherOrdinal"));
              }
              var mk=plan.RootElement.GetProperty("markerDisplayKey").GetString()!;
              int markerCount=0;
              foreach(var key in plan.RootElement.GetProperty("markerSearchKeys").EnumerateArray().Select(x=>x.GetString()!)){
                var m=old.Single(m=>originals[m].Any(i=>i.OpCode==OpCodes.Ldstr&&Equals(i.Operand,key)));
                var ins=originals[m];int k=Array.FindIndex(ins,x=>x.OpCode==OpCodes.Ldstr&&Equals(x.Operand,key));
                Need(ins[k+1].OpCode==OpCodes.Ldstr&&Equals(ins[k+1].Operand,"[已食用]")&&ins[k+2].OpCode==OpCodes.Call&&Raw(ins[k+2].Operand)==read.FullName,"Marker key "+key);
                string sink=Raw(ins[k+3].Operand);
                var helperName=sink switch{"System.Boolean System.String::Contains(System.String)"=>"ContainsEither","System.Boolean System.String::StartsWith(System.String)"=>"StartsWithEither","System.Int32 System.String::IndexOf(System.String)"=>"IndexEither",_=>""};
                Need(helperName!="","Unknown marker sink "+key+" "+sink);
                Before(m,k+3,new[]{Instruction.Create(OpCodes.Ldstr,mk),Instruction.Create(OpCodes.Ldstr,"[已食用]"),Instruction.Create(OpCodes.Call,read)},"Recognize legacy and current marker without duplicate append");
                Replace(m,k+3,H(helperName));markerCount++;
              }
              var entries=mod.GetTypes().Where(t=>t.Interfaces.Any(i=>i.Interface.Name=="IMod")&&t.Methods.Any(m=>m.Name=="OnEnable"&&m.HasBody)&&t.Methods.Any(m=>m.Name=="OnDisable"&&m.HasBody)).ToArray();
              Need(entries.Length==1,"Unique mod lifecycle "+string.Join(",",entries.Select(t=>t.FullName)));
              foreach(var (name,helper) in new[]{("OnEnable","Install"),("OnDisable","Uninstall")}){
                var m=entries[0].Methods.Single(m=>m.Name==name&&m.HasBody&&m.MethodSig.Params.Count==0);
                Before(m,0,new[]{Instruction.Create(OpCodes.Call,H(helper))},"Own ID-only UI patch lifecycle");
              }
              foreach(var m in inserts.Keys.Select(x=>x.Item1).Concat(replacements.Keys.Select(x=>x.Item1)).Distinct()){
                foreach(var p in replacements.Where(x=>x.Key.Item1==m)){var at=originals[m][p.Key.Item2];at.OpCode=p.Value.OpCode;at.Operand=p.Value.Operand;}
                foreach(var p in inserts.Where(x=>x.Key.Item1==m).OrderByDescending(x=>x.Key.Item2)){int pos=m.Body.Instructions.IndexOf(originals[m][p.Key.Item2]);foreach(var ins in p.Value)m.Body.Instructions.Insert(pos++,ins);}
                m.Body.SimplifyBranches();m.Body.OptimizeBranches();
              }
              var expectedGame=new[]{("DialogUIManager","DisplayClientText",2),("DialogUIManager","PlayClientSingleText",1),("DialoguePhoneUIManager","PlayClientSingleText",1),("NegociationUIManager","RefreshClientHeader",1)};
              foreach(var (tn,mn,n) in expectedGame){var m=game.GetTypes().Single(t=>t.Name==tn).Methods.Single(m=>m.Name==mn&&m.HasBody);var ins=m.Body.Instructions.Where(i=>i.OpCode==OpCodes.Ldfld&&Raw(i.Operand)=="System.String StoreClient::displayName").ToArray();Need(ins.Length==n,"Game UI target "+tn+" "+mn);Need(!m.Body.ExceptionHandlers.Any(e=>ins.Contains(e.TryStart)||ins.Contains(e.TryEnd)||ins.Contains(e.HandlerStart)||ins.Contains(e.HandlerEnd)||ins.Contains(e.FilterStart)),"Game UI EH boundary");}
              var temp=a[0]+".new";mod.Write(temp);using var output=ModuleDefMD.Load(temp);
              var original=src.GetTypes().SelectMany(t=>t.Methods).GroupBy(m=>m.FullName).ToDictionary(g=>g.Key,g=>g.OrderBy(m=>m.MDToken.Raw).ToArray());
              var updated=output.GetTypes().SelectMany(t=>t.Methods).GroupBy(m=>m.FullName).ToDictionary(g=>g.Key,g=>g.OrderBy(m=>m.MDToken.Raw).ToArray());
              Need(updated.Count==original.Count+donors.Length+1&&original.All(v=>updated.TryGetValue(v.Key,out var z)&&z.Length==v.Value.Length),"All old method identity");
              int compared=0,insertCount=0,replaceCount=0;
              foreach(var g in original)for(int j=0;j<g.Value.Length;j++){
                var x=g.Value[j];var y=updated[g.Key][j];Need(x.HasBody==y.HasBody,"Body "+g.Key);if(!x.HasBody)continue;
                var target=byToken[x.MDToken.Raw.ToString("X8")];var ai=x.Body.Instructions.ToArray();var bi=y.Body.Instructions.ToArray();
                Need(bi.Length==ai.Length+inserts.Where(v=>v.Key.Item1==target).Sum(v=>v.Value.Length),"Instruction count "+g.Key);
                var ax=ai.Select((v,k)=>(v,k)).ToDictionary(z=>z.v,z=>z.k);var bx=new Dictionary<Instruction,int>();var positions=new int[ai.Length];int pos=0;
                for(int i=0;i<ai.Length;i++){if(inserts.TryGetValue((target,i),out var add))foreach(var z in add){bx.Add(bi[pos],i);Need(z.OpCode==bi[pos].OpCode&&Raw(z.Operand)==Raw(bi[pos].Operand),"Inserted operand "+g.Key+" "+i);pos++;insertCount++;}positions[i]=pos;bx.Add(bi[pos++],i);}
                Need(pos==bi.Length,"Mapped instruction count");
                Need(x.Body.Variables.Select(v=>v.Type.FullName).SequenceEqual(y.Body.Variables.Select(v=>v.Type.FullName)),"Locals "+g.Key);
                Need(x.Body.ExceptionHandlers.Select(h=>EH(h,ax)).SequenceEqual(y.Body.ExceptionHandlers.Select(h=>EH(h,bx))),"EH "+g.Key);
                for(int i=0;i<ai.Length;i++){var v=ai[i];var w=bi[positions[i]];
                  if(replacements.TryGetValue((target,i),out var rp)){Need(rp.OpCode==w.OpCode&&Raw(rp.Operand)==Raw(w.Operand),"Replacement operand "+g.Key);replaceCount++;}
                  else {Need(Eq(v,w),"Opcode "+g.Key+" "+i);Need(Op(v.Operand,ax)==Op(w.Operand,bx),"Operand "+g.Key+" "+i);}
                }compared++;
              }
              Need(insertCount==inserts.Values.Sum(x=>x.Length)&&replaceCount==replacements.Count,"Exact edit totals");
              var helperOut=output.GetTypes().Single(t=>t.FullName==hType.FullName);Need(helperOut.Methods.Count==donors.Length,"Helper methods");
              foreach(var dm in donors){
                var m=helperOut.Methods.Single(m=>m.Name==dm.Name&&m.MethodSig.Params.Count==dm.MethodSig.Params.Count);
                Need(m.Body.Instructions.Count==dm.Body.Instructions.Count,"Helper count "+dm.Name);
                var ax=dm.Body.Instructions.Select((i,k)=>(i,k)).ToDictionary(z=>z.i,z=>z.k);var bx=m.Body.Instructions.Select((i,k)=>(i,k)).ToDictionary(z=>z.i,z=>z.k);
                for(int i=0;i<dm.Body.Instructions.Count;i++){
                  var v=dm.Body.Instructions[i];var w=m.Body.Instructions[i];var expected=Op(v.Operand,ax);
                  if(v.Operand is MethodDef target&&map.TryGetValue(target,out var replacement))expected=replacement.FullName;
                  Need(v.OpCode==w.OpCode&&expected==Op(w.Operand,bx),"Helper IL "+dm.Name+" "+i+" "+expected+" != "+Op(w.Operand,bx));
                }
              }
              Need(!output.GetAssemblyRefs().Any(x=>x.Name=="cfghelper"),"No donor runtime dependency");
              var res=src.Resources.OfType<EmbeddedResource>().ToDictionary(x=>x.Name.ToString(),x=>Hash(x.CreateReader().ToArray()));var res2=output.Resources.OfType<EmbeddedResource>().ToDictionary(x=>x.Name.ToString(),x=>Hash(x.CreateReader().ToArray()));
              Need(res.Count==res2.Count&&res.All(x=>res2.TryGetValue(x.Key,out var h)&&h==x.Value),"Embedded resources unchanged");
              // Only test algorithmic equivalence; this is not a game load test.
              int Index(string x,string raw,string shown){int one=x.IndexOf(raw,StringComparison.Ordinal),two=x.IndexOf(shown,StringComparison.Ordinal);return one<0?two:two<0?one:Math.Min(one,two);}
              foreach(var row in parser){Need(Index(row.source,row.source,row.target)==0&&Index(row.target,row.source,row.target)==0&&Index("zzz",row.source,row.target)==-1,"Legacy/current parser reference");}
              var final=Hash(File.ReadAllBytes(temp));File.Move(temp,a[0],true);
              File.WriteAllText(a[4],JsonSerializer.Serialize(new{baseline,finalDllHash=final,comparedMethods=compared,embeddedResources=res.Count,insertCount,replaceCount,helperMethods=helperOut.Methods.Count+1,parserSites=parser.Length,markerSites=markerCount,displaySites=5,gameNameSites=5,lifecycleSites=2,modType=entries[0].FullName,patronIdentifierIL=id.Body.Instructions.Select(i=>i.OpCode.Name+" "+Raw(i.Operand)).ToArray(),runtime="not tested",changes=log},new JsonSerializerOptions{WriteIndented=true,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping})+"\n");
            }
          }
          CS
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          dotnet run --project /tmp/rldfinal/rldfinal.csproj -- "$ROOT/RedLightDistrict_v1.1.1/RedLightDistrict.dll" "$ROOT/번역대조표/RLD_FINAL_PLAN_20261122.json" /tmp/cfghelper/bin/Release/net472/cfghelper.dll probably-stolen/Managed/Assembly-CSharp.dll "$ROOT/번역대조표/RLD_FINAL_RESULT_20261122.json"
      - name: Validate localized keys and review references
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, json, hashlib, io, re
          root=Path('probably-stolen/local-mods/TentacleMod번역')
          mod=root/'RedLightDistrict_v1.1.1'
          plan=json.loads((root/'번역대조표/RLD_FINAL_PLAN_20261122.json').read_text())
          report=root/'번역대조표/RLD_FINAL_RESULT_20261122.json'
          j=json.loads(report.read_text())
          assert j['comparedMethods']>=1860 and j['embeddedResources']==1617 and j['parserSites']==10 and j['markerSites']==4
          src=Path('probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1/Localization/cn.csv')
          with src.open(encoding='utf-8-sig',newline='') as f: source={r['key']:r for r in csv.DictReader(f)}
          assert len(source)==3619
          p=mod/'Localization/ko.csv'
          raw=p.read_bytes()
          rows=list(csv.reader(io.StringIO(raw.decode('utf-8-sig'),newline='')))
          existing=dict(rows)
          assert len(rows)==len(existing)==plan['priorCsvCount'] and existing.keys()<=source.keys()
          refs={}
          with (mod/'translation-work/internal_string_reference.tsv').open(encoding='utf-8-sig',newline='') as f:
              for row in csv.DictReader(f,delimiter='\t'):refs[row['key']]=row
          new={x['key']:x['target'] for x in plan['direct']}
          aliases={x['key']:x['target'] for x in plan['aliases']}
          assert len(new)==8 and len(aliases)==24 and not (existing.keys()&new.keys()) and new.keys()<=source.keys()
          assert not (source.keys()&aliases.keys())
          for x in plan['parser']:assert x['key'] not in existing and x['key'] not in new
          for x in plan['markerSearchKeys']:assert x not in existing and x not in new
          def encode(s):return s.replace('\n',r'\n')
          updated=dict(existing)
          for k in ('rld_33a6ce61cfb86135c728','rld_560565bbfcde4ea2f6e5'):updated[k]=refs[k]['korean_reference']
          updated.update({k:encode(v) for k,v in new.items()})
          updated.update({k:encode(v) for k,v in aliases.items()})
          protected=set(source)-set(updated)
          assert len(protected)==91 and protected<=refs.keys()
          assert all(updated[k]==v for k,v in existing.items() if k not in ('rld_33a6ce61cfb86135c728','rld_560565bbfcde4ea2f6e5'))
          with p.open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,lineterminator='\r\n',quoting=csv.QUOTE_ALL);w.writerows(updated.items())
          with p.open(encoding='utf-8-sig',newline='') as f: assert dict(csv.reader(f))==updated
