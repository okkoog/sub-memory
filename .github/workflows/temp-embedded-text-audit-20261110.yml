name: Temporary embedded text audit for CSV-less mods
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-embedded-text-audit-20261110.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /probably-stolen/mods/3828902092/*.dll
            /probably-stolen/mods/3829696854/*.dll
            /probably-stolen/mods/3830643693/*.dll
            /probably-stolen/mods/3832249311/*.dll
            /probably-stolen/mods/3832805089/*.dll
            /probably-stolen/mods/3834556946/*.dll
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - name: Scan DLL literals and internal localization APIs
        shell: bash
        run: |
          set -euo pipefail
          dotnet new console --framework net10.0 -o "$RUNNER_TEMP/localization-scan" --no-restore >/dev/null
          dotnet add "$RUNNER_TEMP/localization-scan/localization-scan.csproj" package Mono.Cecil --version 0.11.6 >/dev/null
          cat > "$RUNNER_TEMP/localization-scan/Program.cs" <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using Mono.Cecil;
          using Mono.Cecil.Cil;
          static IEnumerable<TypeDefinition> Types(TypeDefinition type) {
            yield return type;
            foreach(var nested in type.NestedTypes)foreach(var tt in Types(nested))yield return tt;
          }
          var ids=new[]{"3828902092","3829696854","3830643693","3832249311","3832805089","3834556946"};
          foreach(var id in ids) {
            var p=Path.Combine("probably-stolen/mods",id);
            foreach(var path in Directory.GetFiles(p,"*.dll")) {
              try {
                using var asm=AssemblyDefinition.ReadAssembly(path);
                var methods=asm.MainModule.Types.SelectMany(Types).SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToList();
                var lit=methods.SelectMany(m=>m.Body.Instructions).Where(i=>i.OpCode==OpCodes.Ldstr && i.Operand is string).Select(i=>(string)i.Operand).Distinct().ToList();
                var chinese=lit.Where(s=>s.Any(c=>c>='\u3400'&&c<='\u9fff')).ToList();
                var korean=lit.Where(s=>s.Any(c=>c>='\uac00'&&c<='\ud7af')).ToList();
                var english=lit.Where(s=>s.Length>=15&&s.Length<300&&s.Contains(' ')&&s.Any(char.IsLetter)&&!s.Contains("/")&&!s.Contains("\\")).ToList();
                var calls=methods.SelectMany(m=>m.Body.Instructions)
                  .Where(i=>i.Operand is MethodReference mr && (mr.Name.Contains("Localiz",StringComparison.OrdinalIgnoreCase)
                    ||mr.Name.Contains("GetTranslation",StringComparison.OrdinalIgnoreCase)
                    ||mr.Name.Contains("GetText",StringComparison.OrdinalIgnoreCase)
                    ||mr.Name.Contains("Translate",StringComparison.OrdinalIgnoreCase)
                    ||mr.Name.Contains("SelectedLocale",StringComparison.OrdinalIgnoreCase)))
                  .Select(i=>((MethodReference)i.Operand).FullName)
                  .Distinct().Take(10).ToList();
                var ltypes=asm.MainModule.Types.SelectMany(Types).Where(t=>t.FullName.Contains("Localiz",StringComparison.OrdinalIgnoreCase)||t.FullName.Contains("Translation",StringComparison.OrdinalIgnoreCase)||t.FullName.Contains("Language",StringComparison.OrdinalIgnoreCase)).Select(t=>t.FullName).Take(10).ToList();
                Console.WriteLine($"EMBEDDED|{id}|{Path.GetFileName(path)}|literals={lit.Count}|han={chinese.Count}|hangul={korean.Count}|english_phrases={english.Count}|ko_token={lit.Contains("ko")||lit.Contains("ko-KR")||lit.Contains("Korean")}");
                Console.WriteLine("HAN_EXAMPLES|"+id+"|"+string.Join(" ; ",chinese.Where(x=>x.Length>=4).Take(12).Select(x=>x.Replace("\n","\\n")[..Math.Min(140,x.Length)])));
                Console.WriteLine("EN_EXAMPLES|"+id+"|"+string.Join(" ; ",english.Take(12).Select(x=>x.Replace("\n","\\n")[..Math.Min(120,x.Length)])));
                Console.WriteLine("LOCALIZATION_API|"+id+"|"+string.Join(" ; ",calls));
                Console.WriteLine("LOCALIZATION_TYPES|"+id+"|"+string.Join(" ; ",ltypes));
              }catch(Exception ex){Console.WriteLine($"EMBEDDED_ERROR|{id}|{Path.GetFileName(path)}|{ex.Message}");}
            }
          }
          CS
          dotnet run --project "$RUNNER_TEMP/localization-scan" --configuration Release
