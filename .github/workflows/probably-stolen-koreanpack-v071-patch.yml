# package revision: v078-v075-safe-locale
name: KoreanPack v0.7.8 v0.7.5-safe locale diagnostic patch

on:
  push:
    branches:
      - probably-stolen-koreanpack-sol
    paths:
      - 'probably-stolen/korean-pack/ProbablyStolenKoreanPack.dll'
      - 'probably-stolen/korean-pack/manifest.xml'
      - 'probably-stolen/korean-pack/Localization/pskb__supp_*.csv'
      - '.github/workflows/probably-stolen-koreanpack-v071-patch.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probably-stolen-koreanpack-sol
          fetch-depth: 1
          sparse-checkout: |
            probably-stolen/korean-pack/ProbablyStolenKoreanPack.dll
            probably-stolen/korean-pack/manifest.xml
            probably-stolen/korean-pack/Localization/pskb__supp_3832048841.csv
            probably-stolen/korean-pack/Localization/pskb__supp_3831837821.csv
            probably-stolen/korean-pack/Localization/pskb__supp_3829085054.csv
            probably-stolen/korean-pack/Localization/pskb__supp_3829429358.csv
            probably-stolen/korean-pack/Localization/pskb__supp_3829730904.csv
            probably-stolen/korean-pack/Localization/pskb__supp_3828913695.csv
          sparse-checkout-cone-mode: false
      - name: Validate overlay inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s probably-stolen/korean-pack/ProbablyStolenKoreanPack.dll
          test -s probably-stolen/korean-pack/manifest.xml
          grep -q '<ModVersion>0.7.8-dev</ModVersion>' probably-stolen/korean-pack/manifest.xml
          count=$(find probably-stolen/korean-pack/Localization -maxdepth 1 -name 'pskb__supp_*.csv' -type f | wc -l)
          test "$count" -eq 6
          python3 - <<'PY'
          import csv, glob
          files=sorted(glob.glob('probably-stolen/korean-pack/Localization/pskb__supp_*.csv'))
          assert len(files)==6, files
          for path in files:
              with open(path,encoding='utf-8-sig',newline='') as f:
                  for n,row in enumerate(csv.reader(f),1):
                      if not row:
                          continue
                      assert len(row)==2, (path,n,row)
                      assert row[0], (path,n,'empty key')
          print('validated',len(files),'supplement catalogs')
          PY
      - name: Assemble overlay patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p patch/Localization
          cp probably-stolen/korean-pack/ProbablyStolenKoreanPack.dll patch/
          cp probably-stolen/korean-pack/manifest.xml patch/
          cp probably-stolen/korean-pack/Localization/pskb__supp_*.csv patch/Localization/
          cat > patch/README_PATCH.txt <<'EOF'
          Probably Stolen Korean Pack v0.7.8-dev v0.7.5-safe locale-gate diagnostic overlay patch

          Apply this over the existing v0.7.0-dev Korean Pack folder.
          Replace ProbablyStolenKoreanPack.dll and manifest.xml, then merge the Localization folder.
          Existing Localization files must remain; the pskb__supp_*.csv files are additions.
          No third-party mod files are replaced by this patch.
          EOF
          find patch -type f -maxdepth 2 -print | sort
      - uses: actions/upload-artifact@v4
        with:
          name: ProbablyStolen_KoreanPack_v0.7.8-dev_TargetedUI_Overlay
          path: patch/
          if-no-files-found: error
