name: Build actual RLD inventory title Korean display-only DLL
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rld-inventory-title-patch-build-20261122.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rld-item-title-display-fix-20261122
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            rld-ui-fix
            rld-title-fix
            probably-stolen/Managed/Assembly-CSharp.dll
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/Localization/ko.csv
      - name: Resolve exact previously patched DLL and game assembly
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='rld-ui-fix/RedLightDistrict.dll,probably-stolen/Managed/Assembly-CSharp.dll' --exclude=''
          echo '86ad3f461f263dd04199edf8dad7e8c3f2e017b0c8a013462eef8034733bda47  rld-ui-fix/RedLightDistrict.dll' | sha256sum -c
          test "$(head -c 2 probably-stolen/Managed/Assembly-CSharp.dll)" = 'MZ'
      - name: Compile and apply exact 19-ID name display hook
        run: |
          set -euo pipefail
          dotnet new console -f net8.0 -o /tmp/rld-title-final --force
          dotnet add /tmp/rld-title-final/rld-title-final.csproj package dnlib --version 4.5.0
          cp rld-title-fix/PatchTitle.cs /tmp/rld-title-final/Program.cs
          dotnet build /tmp/rld-title-final/rld-title-final.csproj -c Release
          mkdir -p rld-title-fix/verified
          dotnet /tmp/rld-title-final/bin/Release/net8.0/rld-title-final.dll \
            rld-ui-fix/RedLightDistrict.dll \
            rld-ui-fix/plan.json \
            probably-stolen/Managed/Assembly-CSharp.dll \
            rld-title-fix/RedLightDistrict.dll \
            rld-title-fix/verified/report.json
      - name: Validate all name keys and DLL-only package without touching local ko.csv
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,csv,zipfile,hashlib
          root=pathlib.Path('rld-title-fix')
          data=(root/'RedLightDistrict.dll').read_bytes()
          report=json.loads((root/'verified/report.json').read_text())
          assert data[:2]==b'MZ' and len(data)>100000000
          assert hashlib.sha256(data).hexdigest()==report['patchedSha256']
          plan=json.loads(pathlib.Path('rld-ui-fix/plan.json').read_text())
          rows=plan['equipment']+plan['accessory']
          assert len(rows)==19
          with pathlib.Path('probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/Localization/ko.csv').open(newline='',encoding='utf-8-sig') as f: ko=dict(csv.reader(f))
          assert all(row['key'] in ko and ko[row['key']] != row['source'] for row in rows)
          pkg=root/'verified/RedLightDistrict_Inventory_Title_KO_DLL_Only.zip'
          with zipfile.ZipFile(pkg,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=4) as z:z.write(root/'RedLightDistrict.dll','RedLightDistrict.dll')
          with zipfile.ZipFile(pkg,'r') as z:
            assert z.namelist()==['RedLightDistrict.dll']
            assert z.testzip() is None
            assert hashlib.sha256(z.read('RedLightDistrict.dll')).hexdigest()==report['patchedSha256']
          print('Verified DLL bytes:',len(data),'SHA256',report['patchedSha256'])
          print('Verified ZIP size:',pkg.stat().st_size,'SHA256',hashlib.sha256(pkg.read_bytes()).hexdigest())
          PY
      - name: Publish only newly verified DLL in isolated branch using Git LFS
        run: |
          set -euo pipefail
          git lfs track 'rld-title-fix/RedLightDistrict.dll'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse .gitattributes rld-title-fix/RedLightDistrict.dll rld-title-fix/verified/report.json
          pointer=$(git show :rld-title-fix/RedLightDistrict.dll)
          grep -Fxq 'version https://git-lfs.github.com/spec/v1' <<< "$pointer"
          grep -Fxq "oid sha256:$(sha256sum rld-title-fix/RedLightDistrict.dll|cut -d' ' -f1)" <<< "$pointer"
          git commit -m 'Fix old saved RLD inventory item display names via targeted Harmony postfix'
          git push origin HEAD:refs/heads/rld-item-title-display-fix-20261122
      - uses: actions/upload-artifact@v4
        with:
          name: RLD-Inventory-Title-KO-DLL-Only
          path: rld-title-fix/verified/RedLightDistrict_Inventory_Title_KO_DLL_Only.zip
          retention-days: 7
          if-no-files-found: error
