name: RedLightDistrict active IL Chinese strings audit
on:
  push:
    paths: [.github/workflows/temp-tentacle-rld-strings-20261121.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1
            probably-stolen/local-mods/TentacleMod번역/번역대조표
          sparse-checkout-cone-mode: false
      - name: Audit live ldstr Chinese string literals and callsite methods
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/rld_inventory --force
          dotnet add /tmp/rld_inventory/rld_inventory.csproj package dnlib --version 4.5.0
          cat > /tmp/rld_inventory/Program.cs <<'CS'
          using System;
          using System.Linq;
          using System.Text;
          using System.Text.RegularExpressions;
          using System.IO;
          using System.Collections.Generic;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
              static void Main(string[] args) {
                  using var md=ModuleDefMD.Load(args[0]);
                  var dict=new Dictionary<string,List<string>>();
                  var rx=new Regex(@"[\u3400-\u9fff]",RegexOptions.Compiled);
                  int refs=0,methods=0;
                  foreach(var t in md.GetTypes())
                  foreach(var m in t.Methods) {
                      if(!m.HasBody)continue;
                      methods++;
                      var il=m.Body.Instructions;
                      for(int i=0;i<il.Count;i++){
                          var x=il[i];
                          if(x.OpCode!=OpCodes.Ldstr || x.Operand is not string s || !rx.IsMatch(s))continue;
                          if(!dict.TryGetValue(s,out var list)){list=new List<string>();dict[s]=list;}
                          list.Add(t.FullName+"::"+m.Name+"@"+x.Offset.ToString("X4"));
                          refs++;
                      }
                  }
                  var out=new StringBuilder();
                  out.AppendLine("id\toriginal_json_string\tactive_refs\tcall_sites");
                  int row=0;
                  foreach(var entry in dict.OrderBy(k=>k.Key,StringComparer.Ordinal)){
                      row++;
                      var quoted=System.Text.Json.JsonSerializer.Serialize(entry.Key);
                      out.Append(row).Append('\t').Append(quoted).Append('\t').Append(entry.Value.Count).Append('\t')
                         .Append(string.Join("; ",entry.Value)).AppendLine();
                  }
                  File.WriteAllText(args[1],out.ToString(),Encoding.UTF8);
                  File.WriteAllText(args[2],
                      "# RedLightDistrict v1.1.1 — active Chinese IL strings\n\n"
                      +"- Original source DLL bytes: "+new FileInfo(args[0]).Length+"\n"
                      +"- Managed methods scanned: "+methods+"\n"
                      +"- CJK-containing active ldstr references: "+refs+"\n"
                      +"- Unique CJK-containing strings: "+dict.Count+"\n"
                      +"- All call-site locations are IL instruction offsets; some strings may be internal identifiers and must not be mass replaced.\n"
                      +"- Actual CLR/Unity runtime tests: not performed.\n",Encoding.UTF8);
                  Console.WriteLine($"CJK unique {dict.Count}, IL refs {refs}, inspected methods {methods}");
              }
          }
          CS
          dotnet run --project /tmp/rld_inventory/rld_inventory.csproj -- \
            'probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1/RedLightDistrict.dll' \
            'probably-stolen/local-mods/TentacleMod번역/번역대조표/RedLightDistrict_v1.1.1_active_CJK_strings_20261121.tsv' \
            'probably-stolen/local-mods/TentacleMod번역/번역대조표/RedLightDistrict_v1.1.1_CJK_STATIC_SUMMARY_20261121.md'
      - name: Commit static Chinese literal inventory
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'probably-stolen/local-mods/TentacleMod번역/번역대조표/RedLightDistrict_v1.1.1_active_CJK_strings_20261121.tsv' 'probably-stolen/local-mods/TentacleMod번역/번역대조표/RedLightDistrict_v1.1.1_CJK_STATIC_SUMMARY_20261121.md'
          git diff --cached --quiet || (git commit -m 'audit(tentacle): RedLightDistrict active CJK ldstr method inventory' && git pull --rebase origin main && git push)
