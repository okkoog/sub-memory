name: Package RLD exact trait localization DLL and safe CSV key installer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rld-trait-install-safe-package-20261122.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rld-traits-direct-localkey-20261122
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            rld-trait-fix
      - name: Fetch true DLL bytes (not LFS pointer)
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='rld-trait-fix/RedLightDistrict.dll' --exclude=''
          echo 'a381faa30d8dcb0ae97e1bca0a64ae528b0eae3b23b44b34bf7b5fd0898ebd8f  rld-trait-fix/RedLightDistrict.dll' | sha256sum -c
      - name: Verify 41 exact key rows and test non-destructive Windows PowerShell installer
        shell: bash
        run: |
          set -euo pipefail
          test "$(command -v pwsh)" != ""
          python3 - <<'PY'
          import csv,pathlib
          src=pathlib.Path('rld-trait-fix/Localization_MissingKeys_Only.csv')
          with src.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.reader(f))
          assert len(rows)==41 and all(len(row)==2 and row[0].startswith('rld_') for row in rows)
          assert len(set(r[0] for r in rows))==41
          assert dict(rows)['rld_display_e98b511ac9df76a6d02c']=='고분고분함'
          base=pathlib.Path('/tmp/rld-safe-test/Localization')
          base.mkdir(parents=True,exist_ok=True)
          (base/'ko.csv').write_text('rld_0c709a656b8604731f59,"메이드"\n'+'rld_display_e98b511ac9df76a6d02c,"내 번역"\n',encoding='utf-8-sig')
          PY
          pwsh -NoProfile -NonInteractive -File rld-trait-fix/Apply_Localization_MissingKeys.ps1 -ModDirectory /tmp/rld-safe-test
          python3 - <<'PY'
          import csv,pathlib,hashlib
          p=pathlib.Path('/tmp/rld-safe-test/Localization/ko.csv')
          with p.open(encoding='utf-8-sig',newline='') as f: rows=list(csv.reader(f))
          m=dict(rows)
          assert len(rows)==42 and len(m)==42
          assert m['rld_0c709a656b8604731f59']=='메이드'
          assert m['rld_display_e98b511ac9df76a6d02c']=='내 번역'
          assert m['rld_092ed1524c83d3f79781']=='달빛 아래의 벨벳 하녀'
          assert len(list(p.parent.glob('ko.csv.backup_*')))==1
          pathlib.Path('/tmp/rld-before-hash').write_text(hashlib.sha256(p.read_bytes()).hexdigest())
          PY
          pwsh -NoProfile -NonInteractive -File rld-trait-fix/Apply_Localization_MissingKeys.ps1 -ModDirectory /tmp/rld-safe-test
          python3 - <<'PY'
          import pathlib,hashlib
          p=pathlib.Path('/tmp/rld-safe-test/Localization/ko.csv')
          assert hashlib.sha256(p.read_bytes()).hexdigest()==pathlib.Path('/tmp/rld-before-hash').read_text()
          assert len(list(p.parent.glob('ko.csv.backup_*')))==1
          print('CSV add-only and repeat-run idempotence verified')
          PY
      - name: Create and verify complete installer ZIP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,zipfile,hashlib,csv
          root=pathlib.Path('rld-trait-fix')
          files=['RedLightDistrict.dll','Localization_MissingKeys_Only.csv','Apply_Localization_MissingKeys.ps1','Apply_Localization_MissingKeys.cmd','INSTALL_KO.txt']
          out=root/'verified/RedLightDistrict_v1.1.1_Traits_Direct_LocalKeys_Install.zip'
          out.parent.mkdir(parents=True,exist_ok=True)
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=4) as z:
            for name in files:z.write(root/name,name)
          with zipfile.ZipFile(out) as z:
            assert z.testzip() is None
            assert z.namelist()==files
            for name in files:assert z.read(name)==(root/name).read_bytes()
            assert hashlib.sha256(z.read('RedLightDistrict.dll')).hexdigest()=='a381faa30d8dcb0ae97e1bca0a64ae528b0eae3b23b44b34bf7b5fd0898ebd8f'
          print('INSTALL_PACKAGE',out.stat().st_size,hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RLD-Traits-Direct-LocalKey-Install
          path: rld-trait-fix/verified/RedLightDistrict_v1.1.1_Traits_Direct_LocalKeys_Install.zip
          retention-days: 7
          if-no-files-found: error
