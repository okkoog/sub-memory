name: Tentacle translated data file load and identity safety static audit
on:
  push:
    paths: [.github/workflows/temp-tentacle-data-loader-identity-audit-20261122.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/lewd_meme2.1.0/MidnightPawn.dll
            probably-stolen/local-mods/TentacleMod/可能是成人用品 v1.1.3/probably_adult_goods.dll
            probably-stolen/local-mods/TentacleMod/起飞攻速装-v1.1.3抢先体验版（修bug）/起飞攻速装.dll
            probably-stolen/local-mods/TentacleMod/LewdMemeShadowTrade1.6.4/ShadowTrade.dll
            probably-stolen/local-mods/TentacleMod番訳/README_NA
            probably-stolen/local-mods/TentacleMod번역/번역대조표
          sparse-checkout-cone-mode: false
      - name: Inspect direct literal file loader references and related IL
        run: |
          dotnet new console --framework net8.0 -o /tmp/tentacle-data-check --force
          dotnet add /tmp/tentacle-data-check/tentacle-data-check.csproj package dnlib --version 4.5.0
          cat >/tmp/tentacle-data-check/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class Program {
            static void Main() {
              string[] files={
                "probably-stolen/local-mods/TentacleMod/lewd_meme2.1.0/MidnightPawn.dll",
                "probably-stolen/local-mods/TentacleMod/可能是成人用品 v1.1.3/probably_adult_goods.dll",
                "probably-stolen/local-mods/TentacleMod/起飞攻速装-v1.1.3抢先体验版（修bug）/起飞攻速装.dll",
                "probably-stolen/local-mods/TentacleMod/LewdMemeShadowTrade1.6.4/ShadowTrade.dll"
              };
              string[] queries={".csv",".json","名字库","物品定义","物品标签价格","娃娃清单","Content/names.txt","GetItem","NameGen","ReadModFileText"};
              var audit=new List<string> { "# Tentacle external gameplay data and IL reference audit", "", "Static original DLL callsites and nearby IL are listed here; lack of a literal match is not proof of non-use.", ""};
              foreach(var f in files) {
                using var mod=ModuleDefMD.Load(f);
                audit.Add("## "+Path.GetFileName(f));
                var methods=mod.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToArray();
                audit.Add("Methods with IL: "+methods.Length);
                int hit=0;
                foreach(var m in methods) {
                  var body=m.Body.Instructions;
                  for(int i=0;i<body.Count;i++) {
                    if(body[i].OpCode!=OpCodes.Ldstr)continue;
                    string value=body[i].Operand?.ToString()??"";
                    if(!queries.Any(q=>value.Contains(q,StringComparison.OrdinalIgnoreCase)))continue;
                    if(value.Length>300)continue;
                    audit.Add("**"+m.FullName+"**: string `"+value.Replace("`","'")+"`");
                    audit.Add("```text");
                    for(int k=Math.Max(0,i-5);k<=Math.Min(body.Count-1,i+9);k++)
                      audit.Add(k+": "+body[k].OpCode+" "+((body[k].Operand?.ToString()??"").Replace("\n"," ").Substring(0,Math.Min((body[k].Operand?.ToString()??"").Length,200))));
                    audit.Add("```");
                    hit++;
                    if(hit>=100){audit.Add("Capped at first 100 matches for this DLL.");break;}
                  }
                  if(hit>=100)break;
                }
                audit.Add("Found "+hit+" relevant literal-IL matches.");
              }
              var path="probably-stolen/local-mods/TentacleMod번역/번역대조표/Tentacle_GAME_DATA_DLL_READ_AUDIT_20261122.md";
              File.WriteAllText(path,string.Join("\n",audit)+"\n");
              Console.WriteLine("Audited four DLL assemblies and wrote static loader references.");
            }
          }
          CS
          dotnet run --project /tmp/tentacle-data-check/tentacle-data-check.csproj -c Release
      - name: Commit audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse probably-stolen/local-mods/TentacleMod번역/번역대조표/Tentacle_GAME_DATA_DLL_READ_AUDIT_20261122.md
          if ! git diff --cached --quiet; then
            git commit -m 'audit(tentacle): trace original DLL accesses to translated item and doll data'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
