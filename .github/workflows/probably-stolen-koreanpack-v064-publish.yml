name: KoreanPack v0.6.4 publish DLL

on:
  push:
    branches:
      - probably-stolen-koreanpack-sol
    paths:
      - '.github/workflows/probably-stolen-koreanpack-v064-publish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probably-stolen-koreanpack-sol
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build probably-stolen/source/KoreanPack.v0.6.4.csproj -c Release
      - name: Commit DLL
        shell: bash
        run: |
          set -euo pipefail
          cp probably-stolen/source/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll probably-stolen/korean-pack/ProbablyStolenKoreanPack.dll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probably-stolen/korean-pack/ProbablyStolenKoreanPack.dll
          if git diff --cached --quiet; then
            echo "DLL already current."
            exit 0
          fi
          git commit -m "Publish KoreanPack v0.6.4 DLL [skip ci]"
          git pull --rebase origin probably-stolen-koreanpack-sol
          git push origin HEAD:probably-stolen-koreanpack-sol
