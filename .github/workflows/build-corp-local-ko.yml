name: Build CorpPresence 0.9.6 local Korean translation
on:
  push:
    paths:
      - "probably-stolen/tools/corp-local-translation/**"
      - ".github/workflows/build-corp-local-ko.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build localized DLL from fixed uploaded source
        run: |
          set -euxo pipefail
          mkdir -p probably-stolen/localized/CorpPresence-0.9.6-KO/CorpPresence
          dotnet run --project probably-stolen/tools/corp-local-translation/CorpLocalTranslator.csproj -c Release -- \
            probably-stolen/mods/3828913695/CorpPresence.dll \
            probably-stolen/0.7.5.21-dev/Localization/pskb__3828913695.csv \
            probably-stolen/0.7.5.21-dev/Localization/pskb__supp_3828913695.csv \
            probably-stolen/localized/CorpPresence-0.9.6-KO/CorpPresence/CorpPresence.dll \
            probably-stolen/localized/CorpPresence-0.9.6-KO/audit.txt
          cp probably-stolen/mods/3828913695/manifest.xml probably-stolen/localized/CorpPresence-0.9.6-KO/CorpPresence/manifest.xml
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          d=Path('probably-stolen/localized/CorpPresence-0.9.6-KO')
          orig=Path('probably-stolen/mods/3828913695/CorpPresence.dll').read_bytes()
          new=(d/'CorpPresence/CorpPresence.dll').read_bytes()
          assert orig!=new, 'No translation!'
          manifest=(d/'CorpPresence/manifest.xml').read_text(encoding='utf8')
          assert '<ID>CorpPresence</ID>' in manifest
          with (d/'audit.txt').open('a',encoding='utf8') as f:
            f.write('\nInput SHA256: '+hashlib.sha256(orig).hexdigest()+'\n')
            f.write('Output SHA256: '+hashlib.sha256(new).hexdigest()+'\n')
            f.write('Output size: '+str(len(new))+' bytes\n')
          print('Original bytes',len(orig),'Translated bytes',len(new))
          PY
          cat > probably-stolen/localized/CorpPresence-0.9.6-KO/README_KO.txt <<'EOF'
          CorpPresence v0.9.6 Korean local DLL test build
          - CorpPresence.dll: offline text replacement using the pack's S/S64 translation catalogs
          - No Korean runtime translation hooks. Original Steam Workshop mod untouched.
          - Place the CorpPresence directory under <Game>/Mods/ and verify only one CorpPresence is loaded.
          - Keep backups of your original installation and save.
          - This build is statically verified, but must still be tested in game for localization, loading, and saves.
          - Local copy may shadow a Steam Workshop mod depending on game loader behavior; verify loaded path.
          EOF
          cd probably-stolen/localized/CorpPresence-0.9.6-KO
          zip -r -9 ../CorpPresence-0.9.6-KO-Local.zip CorpPresence README_KO.txt audit.txt
      - name: Upload package and report
        uses: actions/upload-artifact@v4
        with:
          name: CorpPresence-v096-KO-local
          path: |
            probably-stolen/localized/CorpPresence-0.9.6-KO-Local.zip
            probably-stolen/localized/CorpPresence-0.9.6-KO/audit.txt
          if-no-files-found: error
      - name: Commit translated DLL and package to separate directory
        run: |
          set -euxo pipefail
          git add probably-stolen/localized/CorpPresence-0.9.6-KO/ probably-stolen/localized/CorpPresence-0.9.6-KO-Local.zip
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build local CorpPresence v0.9.6 Korean translation"
          git pull --rebase origin main
          git push origin HEAD:main
