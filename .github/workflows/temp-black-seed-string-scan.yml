name: Temp locate black seed dialogue source
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-black-seed-string-scan.yml]
permissions: {contents: read}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /probably-stolen/mods/*/*.dll
            /probably-stolen/mods/*/Localization/*.csv
            /probably-stolen/mods/*/*.json
      - name: Scan all uploaded mod DLL strings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          root=pathlib.Path("probably-stolen/mods")
          needles=["black seed","original goods","no obligation","separately?","settled. i also","黑种子"]
          files=list(root.rglob("*.dll"))
          print("DLLs scanned",len(files))
          for f in files:
              data=f.read_bytes()
              matches=[]
              for n in needles:
                  for enc in ['utf-16-le','utf-8']:
                      key=n.encode(enc)
                      index=data.lower().find(key.lower())
                      if index!=-1:
                          nearby=data[max(0,index-140):min(len(data),index+240)]
                          preview=nearby.decode(enc,'replace').replace('\n',' ')[:220]
                          matches.append((n,enc,preview))
              if matches:print("MATCH",str(f),repr(matches))
          PY
