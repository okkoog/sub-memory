name: Temporary Cyber Fried Rice translation retry
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-cyber-rice-translation-retry.yml]
permissions: {contents: write}
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /probably-stolen/mods/3834071305/Localization/en.csv
            /probably-stolen/work-in-progress/translation-20261110/nllb_large_draft.py
          persist-credentials: true
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install model
        run: python -m pip install --quiet "transformers==4.46.3" "sentencepiece" "torch" "sacremoses"
      - name: Translate and protect placeholders
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python probably-stolen/work-in-progress/translation-20261110/nllb_large_draft.py 3834071305
      - name: Stage draft and QA report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f probably-stolen/work-in-progress/translation-20261110/machine-drafts/
          git commit -m "Stage Cyber Fried Rice 473 Korean draft keys pending editorial review"
          git push origin HEAD:main
