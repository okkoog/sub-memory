name: RLD targeted clothing names and traits output audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rld-ui-clothing-traits-20261122.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            probably-stolen/local-mods/TentacleMod-Update/.gitattributes
            probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll
            probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1/Localization/cn.csv
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/Localization/ko.csv
      - name: Fetch exact uploaded DLL
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include='probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll' --exclude=''
          echo 'a224760a2ae651e07adb467014dbb0053d1c6b8942879644b2afbad614237f25  probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll' | sha256sum -c
      - name: Inspect display sinks, garment names, and trait rendering
        shell: bash
        run: |
          set -euo pipefail
          dotnet new console --framework net8.0 -o /tmp/rld-focused --force
          dotnet add /tmp/rld-focused/rld-focused.csproj package dnlib --version 4.5.0
          cat >/tmp/rld-focused/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using System.Text.Json;
          using System.Text.RegularExpressions;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
            static bool Match(string s)=>Regex.IsMatch(s,@"(?i)Cloth|Outfit|Wardrobe|Costume|Dress|Wear|Uniform|Sewing|Trait|Bonus|TalentEquipment|TalentPanel|TalentStatus|TalentScenarioMaid");
            static bool Key(string s)=>s.StartsWith("rld_");
            static string Op(Instruction i)=>i.Operand switch {
              null=>"",string s=>s,Instruction t=>"@"+t.Offset.ToString("X"),IList<Instruction> x=>string.Join(",",x.Select(v=>"@"+v.Offset.ToString("X"))),_=>i.Operand.ToString()??""
            };
            static object Row(Instruction i,int n)=>new{index=n,offset=i.Offset,opcode=i.OpCode.Name,operand=Op(i)};
            static void Main(string[]a){
              using var mod=ModuleDefMD.Load(a[0]);
              var methods=mod.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToArray();
              var focused=methods.Where(m=>Match(m.DeclaringType.FullName)).ToArray();
              var sites=focused.SelectMany(m=>m.Body.Instructions.Select((i,n)=>(i,n)).Where(x=>x.i.OpCode==OpCodes.Ldstr&&x.i.Operand is string s && (Key(s)||Regex.IsMatch(s,@"[\u3400-\u9fff]"))).Select(x=>new{method=m.FullName,index=x.n,offset=x.i.Offset,text=(string)x.i.Operand,after=m.Body.Instructions.Skip(x.n+1).Take(5).Select((i,j)=>Row(i,x.n+j+1))})).ToArray();
              var sinks=methods.SelectMany(m=>m.Body.Instructions.Select((i,n)=>(i,n)).Where(x=>x.i.Operand is IMethod callee&&(Regex.IsMatch(callee.FullName,@"(?i)GameItem::(SetName|set_name|get_name|get_shortDescription)|GameItem::set_(shortDescription|longDescription)|ItemDirectory|::(GetTrait|GetTraitNames|DisplayTraits|BuildTrait|ClothingName|GetEquipmentName|GetOutfitName|ApplyEquipment|MakeClothingItem)"))).Select(x=>new{method=m.FullName,index=x.n,callee=Op(x.i),before=m.Body.Instructions.Skip(Math.Max(0,x.n-11)).Take(Math.Min(x.n,11)+1).Select((i,j)=>Row(i,Math.Max(0,x.n-11)+j))})).Where(x=>Match(x.method)).ToArray();
              var calls=focused.SelectMany(m=>m.Body.Instructions.Select((i,n)=>(i,n)).Where(x=>x.i.Operand is IMethod callee&&(callee.FullName.Contains("CsvLookup")||callee.FullName.Contains("DisplayBoundaryKo")||callee.FullName.Contains("GetLocalized"))).Select(x=>new{method=m.FullName,index=x.n,callee=Op(x.i),before=m.Body.Instructions.Skip(Math.Max(0,x.n-5)).Take(8).Select((i,j)=>Row(i,Math.Max(0,x.n-5)+j))})).ToArray();
              var ktype=mod.GetTypes().Where(t=>t.FullName.Contains("Korean")&&!t.FullName.Contains("CsvLookup")).ToArray();
              var report=new{
                typeList=mod.GetTypes().Where(t=>Match(t.FullName)).Select(t=>new{type=t.FullName,methods=t.Methods.Where(m=>m.HasBody).Select(m=>m.FullName).ToArray()}).ToArray(),
                focusedMethods=focused.Length,
                literalSites=sites.Length,
                outputSinkCount=sinks.Length,
                localizationCallCount=calls.Length,
                localizedHelpers=ktype.Select(t=>new{type=t.FullName,methods=t.Methods.Where(m=>m.HasBody).Select(m=>m.FullName).ToArray()}),
              };
              Directory.CreateDirectory("rld-ui-audit");
              var opt=new JsonSerializerOptions{WriteIndented=true,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping};
              void save(string f,object x)=>File.WriteAllText("rld-ui-audit/"+f,JsonSerializer.Serialize(x,opt)+"\n");
              save("summary.json",report);save("literal-sites.json",sites);save("output-sinks.json",sinks);save("localization-calls.json",calls);
              // Exact focused classes, relevant method signatures and IL only.
              foreach(var name in new[]{"TalentEquipment","TalentTraits","TalentPanel","TalentScenarioMaid"}){
                var list=focused.Where(m=>m.DeclaringType.Name.String==name).Select(m=>new{method=m.FullName,il=m.Body.Instructions.Select(Row).ToArray()}).ToArray();
                save(name+".json",list);
              }
              Console.WriteLine(JsonSerializer.Serialize(new{focusedMethods=focused.Length,literalSites=sites.Length,outputSinks=sinks.Length,localizationCalls=calls.Length}));
            }
          }
          CS
          dotnet run --project /tmp/rld-focused/rld-focused.csproj -- 'probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll'
      - name: Save focused audit on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse rld-ui-audit
          git commit -m "Inspect RLD clothing name and trait display-only paths"
          git push origin HEAD:refs/heads/rld-ui-clothing-traits-20261122
      - uses: actions/upload-artifact@v4
        with:
          name: rld-clothing-and-traits-audit
          path: rld-ui-audit/
