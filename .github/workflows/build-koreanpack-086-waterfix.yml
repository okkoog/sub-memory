name: Build exact b041 KoreanPack plus Corp postload fix
on:
  push:
    branches:
      - tmp-koreanpack-corp-postload-b041
    paths:
      - .github/workflows/build-koreanpack-086-waterfix.yml
      - probably-stolen/build/KoreanPack086WaterFix.csproj
      - probably-stolen/source/koreanpack-086-restored/**
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            probably-stolen/Managed
            probably-stolen/build
            probably-stolen/source/koreanpack-086-restored
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Diagnose ModuleEffect type from original game binaries
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install ilspycmd --tool-path "$RUNNER_TEMP/ilspytools"
          for dll in probably-stolen/Managed/*.dll; do
            if LC_ALL=C grep -a -q 'ModuleEffect' "$dll"; then
              echo "TYPE NAME FOUND IN: $dll"
              "$RUNNER_TEMP/ilspytools/ilspycmd" -l c "$dll" | grep 'ModuleEffect' | head -n 25 || true
            fi
          done
      - name: Compile restored current DLL plus targeted fix
        shell: bash
        run: |
          set -euo pipefail
          dotnet build probably-stolen/build/KoreanPack086WaterFix.csproj -c Release -v minimal
          test -s probably-stolen/build/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll
      - name: Validate feature entry points and water table repair
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install ilspycmd --tool-path "$RUNNER_TEMP/ilspytools"
          mkdir -p "$RUNNER_TEMP/waterfix-decompiled"
          "$RUNNER_TEMP/ilspytools/ilspycmd" -p -o "$RUNNER_TEMP/waterfix-decompiled" probably-stolen/build/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll
          grep -R -q 'Korean Mechanic water entries repaired' "$RUNNER_TEMP/waterfix-decompiled"
          grep -R -q 'void OnEnable' "$RUNNER_TEMP/waterfix-decompiled"
          grep -R -q 'void OnDisable' "$RUNNER_TEMP/waterfix-decompiled"
          grep -R -q 'FishingStartPerkCompatibility' "$RUNNER_TEMP/waterfix-decompiled"
          grep -R -q 'LabelerElement' "$RUNNER_TEMP/waterfix-decompiled"
          grep -R -q 'OnCreateTooltipEarly' "$RUNNER_TEMP/waterfix-decompiled"
          grep -R -q 'Water tooltip v3: repaired feature category=' "$RUNNER_TEMP/waterfix-decompiled"
          grep -R -q 'Water tooltip v4 audit:' "$RUNNER_TEMP/waterfix-decompiled"
          grep -R -q 'CoreGameWaterFeaturePostfix' "$RUNNER_TEMP/waterfix-decompiled"
          grep -R -q 'Native water feature repaired after other mods' "$RUNNER_TEMP/waterfix-decompiled"
          grep -R -q 'localizationHooksReady' "$RUNNER_TEMP/waterfix-decompiled"
          grep -R -q 'EnsureLocalizationHooks' "$RUNNER_TEMP/waterfix-decompiled"
          python3 - <<'PY'
          from pathlib import Path
          p=next(Path("$RUNNER_TEMP/waterfix-decompiled").rglob("WaterNameCompatibility.cs"))
          t=p.read_text()
          a=t[t.index("internal void Enable()"):t.index("internal void Disable()", t.index("internal void Enable()"))]
          if "LocalizationSettings" in a:
              raise SystemExit("FAIL: Enable still touches LocalizationSettings")
          r=t[t.index("private void Request()"):]
          if "EnsureLocalizationHooks();" not in r or "!worldReady" not in r:
              raise SystemExit("FAIL: Request is not postload gated")
          print("Corp postload initialization isolation verified")
          PY
          test "$(stat -c '%s' probably-stolen/build/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll)" -ge 20000
      - name: Stage candidate DLL (never overwrite released main)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p probably-stolen/build/waterfix-086
          cp probably-stolen/build/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll probably-stolen/build/waterfix-086/ProbablyStolenKoreanPack.dll
          sha256sum probably-stolen/build/waterfix-086/ProbablyStolenKoreanPack.dll > probably-stolen/build/waterfix-086/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KoreanPack-086-water-condition-corp-postload
          path: probably-stolen/build/waterfix-086/
          if-no-files-found: error
