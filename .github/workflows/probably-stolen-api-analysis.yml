name: Probably Stolen API analysis

on:
  push:
    branches:
      - probably-stolen-koreanpack-sol
    paths-ignore:
      - 'probably-stolen/analysis/sol-decompile/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probably-stolen-koreanpack-sol
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install ILSpy command line
        run: dotnet tool install ilspycmd --tool-path .tools --version 9.1.0.7988

      - name: Decompile game mod API
        shell: bash
        run: |
          set -euo pipefail
          OUT="probably-stolen/analysis/sol-decompile"
          ASM="probably-stolen/Managed/Assembly-CSharp.dll"
          rm -rf "$OUT"
          mkdir -p "$OUT/game" "$OUT/mods"

          ./.tools/ilspycmd -l c,i,s,d,e "$ASM" > "$OUT/all-types.txt"

          for TYPE in ModLoader LoadedMod ModHelper ModHook IMod ModManifest GameItem; do
            ./.tools/ilspycmd -t "$TYPE" "$ASM" > "$OUT/game/$TYPE.cs" 2>"$OUT/game/$TYPE.err" || true
          done

          grep -Ei 'ModLoader|LoadedMod|ModHelper|ModHook|IMod|ModManifest|Localization|Locale|GetLocalized|LoadLocalization|LoadModAssets|LoadModDll' "$OUT/all-types.txt"             > "$OUT/relevant-types.txt" || true

          declare -a DLLS=(
            "probably-stolen/mods/3831429588/HydroponicAutoReplant.dll"
            "probably-stolen/mods/3829053332/ReputationPop.dll"
            "probably-stolen/mods/3829429358/XIAOWONightAuction.dll"
            "probably-stolen/mods/3829730904/BrewingExpansion.dll"
            "probably-stolen/mods/3829672185/Plus50Mod.dll"
            "probably-stolen/mods/3830874694/PawnshopBillboards.Mod.dll"
          )

          for DLL in "${DLLS[@]}"; do
            NAME="$(basename "$DLL" .dll)"
            ./.tools/ilspycmd "$DLL" > "$OUT/mods/$NAME.cs" 2>"$OUT/mods/$NAME.err" || true
          done

          grep -RniE 'GetLocalized|LoadLocalization|Localization|SelectedLocale|Locale|ModHelper|LoadedMod|Register[A-Za-z]*|GameItem' "$OUT/mods"             > "$OUT/mod-localization-usage.txt" || true

          {
            echo "# Probably Stolen decompilation notes"
            echo
            echo "Generated from the Managed assemblies committed in this repository."
            echo
            echo "## Game API files"
            find "$OUT/game" -maxdepth 1 -name '*.cs' -type f -printf '%f\n' | sort
            echo
            echo "## Representative mod decompilations"
            find "$OUT/mods" -maxdepth 1 -name '*.cs' -type f -printf '%f\n' | sort
          } > "$OUT/README.md"

      - name: Commit analysis result
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- probably-stolen/analysis/sol-decompile &&              git diff --cached --quiet -- probably-stolen/analysis/sol-decompile; then
            echo "No analysis changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probably-stolen/analysis/sol-decompile
          git commit -m "Analyze Probably Stolen mod localization API [skip ci]"
          git push origin HEAD:probably-stolen-koreanpack-sol
