name: KoreanPack v0.6 package

on:
  push:
    branches:
      - probably-stolen-koreanpack-sol
    paths:
      - 'probably-stolen/source/KoreanPack.v0.6.cs'
      - 'probably-stolen/source/KoreanPack.v0.6.csproj'
      - '.github/workflows/probably-stolen-koreanpack-v06-package.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: probably-stolen-koreanpack-sol
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build
        run: dotnet build probably-stolen/source/KoreanPack.v0.6.csproj -c Release
      - name: Commit built DLL
        shell: bash
        run: |
          set -euo pipefail
          cp probably-stolen/source/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll probably-stolen/korean-pack/ProbablyStolenKoreanPack.dll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probably-stolen/korean-pack/ProbablyStolenKoreanPack.dll
          if git diff --cached --quiet; then
            echo "DLL unchanged."
            exit 0
          fi
          git commit -m "Build KoreanPack v0.6 DLL [skip ci]"
          git push origin HEAD:probably-stolen-koreanpack-sol
