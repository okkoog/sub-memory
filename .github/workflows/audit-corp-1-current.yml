name: Audit CorpPresence 1.0 current DLL
on:
  push:
    paths:
      - '.github/workflows/audit-corp-1-current.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
      - name: Decompile latest uploaded CorpPresence.dll
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/corp-code"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p -o "$RUNNER_TEMP/corp-code" probably-stolen/mods/3828913695/CorpPresence.dll
      - name: Extract relevant call sites and full translation classes
        shell: bash
        env:
          ROOT: ${{ runner.temp }}/corp-code
        run: |
          python3 - <<'PY'
          import os, pathlib, hashlib, re, shutil
          root=pathlib.Path(os.environ['ROOT'])
          out=pathlib.Path('probably-stolen/analysis/CorpPresence-1.0-current')
          out.mkdir(parents=True,exist_ok=True)
          dll=pathlib.Path('probably-stolen/mods/3828913695/CorpPresence.dll')
          files=list(root.rglob('*.cs'))
          names={'L.cs','ExternalTranslations.cs','LocHelper.cs','Main.cs','ConfigLocalization.cs','ModLocalization.cs','GameResources.cs','TextKeys.cs'}
          copied=[]
          for p in files:
              if p.name in names or 'Translation' in p.name or 'Localiz' in p.name:
                  dest=out/(str(p.relative_to(root)).replace('/','__'))
                  shutil.copyfile(p,dest)
                  copied.append(str(dest))
          needles=['ExternalTranslations','ModHelper.GetLocalized','LoadLocalization','LoadedMod.Localization','File.ReadAllText','File.ReadAllBytes','Directory.Exists','File.Exists','ReadAllText','language.json','Translations/','Translations\\\\','Capability','ResolveLocale','L.K(','L.T(']
          with (out/'callsite-report.md').open('w',encoding='utf-8') as f:
              f.write('# CorpPresence 1.0 current DLL static decompilation\n\n')
              f.write('DLL sha256: '+hashlib.sha256(dll.read_bytes()).hexdigest()+'\n\n')
              f.write('Decompiled C# files: '+str(len(files))+'\n\n')
              f.write('Copied localization classes: '+str(len(copied))+'\n\n')
              for needle in needles:
                  f.write('\n## '+needle+'\n\n')
                  hits=0
                  for path in files:
                      lines=path.read_text(encoding='utf-8',errors='replace').splitlines()
                      for i,line in enumerate(lines):
                          if needle in line:
                              hits+=1
                              if hits<=65:
                                  f.write(f'- `{path.relative_to(root)}:{i+1}` — `{line.strip()[:350]}`\n')
                  f.write(f'\nTotal matching lines: {hits}\n')
          print('decompiled',len(files),'copied',len(copied))
          PY
      - name: Commit audit text only
        run: |
          git add probably-stolen/analysis/CorpPresence-1.0-current/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --quiet || (git commit -m 'Decompile current CorpPresence 1.0 DLL localization code' && git pull --rebase origin main && git push origin HEAD:main)
