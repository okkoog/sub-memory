name: Extract ShopAssist and NightAuction localization inventory
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-extract-sa-na.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/mods/3829106910
            probably-stolen/mods/3829429358
            probably-stolen/work-in-progress
            .github/workflows
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Extract original resources and text inventory
        shell: bash
        run: |
          set -euo pipefail
          out="probably-stolen/work-in-progress/sa-na-dll-translation"
          mkdir -p "$out"
          dotnet new console --framework net10.0 -o "$RUNNER_TEMP/sa-extract" --no-restore >/dev/null
          cat > "$RUNNER_TEMP/sa-extract/Program.cs" <<'CS'
          using System;
          using System.IO;
          using System.Reflection;
          var a=Assembly.LoadFile(Path.GetFullPath(args[0]));
          foreach(var name in a.GetManifestResourceNames()){
              Console.WriteLine("Resource "+name);
              if(name.Contains("Translations.json")){
                  using var s=a.GetManifestResourceStream(name);
                  using var f=File.Create(args[1]);
                  s!.CopyTo(f);
              }
          }
          CS
          dotnet run --project "$RUNNER_TEMP/sa-extract" -- "probably-stolen/mods/3829106910/ShopAssist.dll" "$out/ShopAssist.Translations.original.json"
          dotnet tool install ilspycmd --tool-path "$RUNNER_TEMP/ilspy" >/dev/null
          "$RUNNER_TEMP/ilspy/ilspycmd" "probably-stolen/mods/3829429358/XIAOWONightAuction.dll" > "$RUNNER_TEMP/NightAuction.cs"
          python3 - <<'PY'
          import re,json,pathlib,collections
          out=pathlib.Path("probably-stolen/work-in-progress/sa-na-dll-translation")
          raw=(pathlib.Path(__import__('os').environ["RUNNER_TEMP"])/"NightAuction.cs").read_text()
          matches=re.findall(r'"(?:[^"\\]|\\.)*"',raw)
          unique=[]
          seen=set()
          for m in matches:
              s=m[1:-1]
              if re.search('[\u3400-\u9fff]',s) and s not in seen:
                  seen.add(s);unique.append(s)
          (out/"NightAuction.Chinese.original.json").write_text(json.dumps(unique,ensure_ascii=False,indent=2),encoding="utf8")
          d=json.loads((out/"ShopAssist.Translations.original.json").read_text(encoding="utf-8-sig"))
          print("ShopAssist translation entries",len(d))
          print("ShopAssist data type",type(d).__name__)
          print("ShopAssist sample",list(d.items())[:7])
          print("ShopAssist missing Korean",sum(len(v)<3 or not v[2] for v in d.values()),"of",len(d))
          print("NightAuction unique Chinese strings",len(unique))
          print("NightAuction example",unique[:30])
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$out/ShopAssist.Translations.original.json" "$out/NightAuction.Chinese.original.json"
          if ! git diff --cached --quiet; then git commit -m "WIP: extract current ShopAssist/NightAuction localization data"; git push origin HEAD:main; fi
