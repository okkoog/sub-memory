name: RLD exact inventory item title pipeline audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rld-inventory-title-audit-20261122.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            probably-stolen/Managed/Assembly-CSharp.dll
            probably-stolen/local-mods/TentacleMod-Update/.gitattributes
            probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll
      - name: Fetch real binaries
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull --include='probably-stolen/Managed/Assembly-CSharp.dll,probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll' --exclude=''
          test "$(head -c 2 probably-stolen/Managed/Assembly-CSharp.dll)" = "MZ"
          echo 'a224760a2ae651e07adb467014dbb0053d1c6b8942879644b2afbad614237f25  probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll' | sha256sum -c
      - name: Audit name render path
        shell: bash
        run: |
          set -euo pipefail
          dotnet new console -f net8.0 -o /tmp/titleaudit --force
          dotnet add /tmp/titleaudit/titleaudit.csproj package dnlib --version 4.5.0
          cat >/tmp/titleaudit/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using System.Text.Json;
          using System.Text.RegularExpressions;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
            static string Operand(Instruction i)=>i.Operand switch{null=>"",string s=>s,Instruction t=>"@"+t.Offset.ToString("X"),IList<Instruction> s=>string.Join(",",s.Select(t=>"@"+t.Offset.ToString("X"))),_=>i.Operand.ToString()??""};
            static object Dump(MethodDef m)=>new{method=m.FullName,token=m.MDToken.Raw,il=m.Body.Instructions.Select((x,n)=>new{n,op=x.OpCode.Name,arg=Operand(x)}).ToArray()};
            static void Main(string[] a){
              using var game=ModuleDefMD.Load(a[0]);
              using var mod=ModuleDefMD.Load(a[1]);
              var g=game.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToArray();
              var q=mod.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToArray();
              var classes=game.GetTypes().Where(t=>Regex.IsMatch(t.Name.String,"(?i)^(GameItem|GameItemElement|.*Tooltip.*|.*ItemElement.*)$")).Select(t=>new{type=t.FullName,fields=t.Fields.Select(f=>new{f.Name,type=f.FieldType.FullName}),methods=t.Methods.Select(m=>new{signature=m.FullName,hasBody=m.HasBody,token=m.MDToken.Raw})}).ToArray();
              var core=g.Where(m=>Regex.IsMatch(m.DeclaringType.Name.String,@"(?i)^(GameItem|GameItemElement|.*Tooltip.*|.*ItemElement.*)$")&&Regex.IsMatch(m.Name.String,@"(?i)Tooltip|Name|Label|Text|Draw|Set|Refresh|Init|Show|Description")).Select(Dump).ToArray();
              var candidates=g.Where(m=>Regex.IsMatch(m.FullName,@"(?i)(Tooltip|Inventory|GameItemElement|ItemInfo|ItemDescription|ItemManager)") && m.Body.Instructions.Any(i=>i.Operand is IMethod r && Regex.IsMatch(r.FullName,@"(?i)(GetName|::get_name|::get_Name|GetTooltip|::SetText|::set_text)"))).Select(m=>new{method=m.FullName,calls=m.Body.Instructions.Select((i,j)=>(i,j)).Where(x=>x.i.Operand is IMethod n&&Regex.IsMatch(n.FullName,@"(?i)(GetName|::get_name|::get_Name|GetTooltip|::SetText|::set_text)")).Select(x=>new{index=x.j,target=Operand(x.i),context=m.Body.Instructions.Skip(Math.Max(0,x.j-5)).Take(12).Select((v,k)=>new{n=Math.Max(0,x.j-5)+k,op=v.OpCode.Name,arg=Operand(v)})}).ToArray()}).ToArray();
              var modMethods=q.Where(m=>Regex.IsMatch(m.FullName,@"(?i)TalentPatches::.*Tooltip|TalentEquipment::CreateItem|TalentAccessory::CreateItem|TalentPatches::PostfixInitDirectory")).Select(Dump).ToArray();
              Directory.CreateDirectory("rld-title-audit");
              var opt=new JsonSerializerOptions{WriteIndented=true,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping};
              void Save(string name,object value)=>File.WriteAllText("rld-title-audit/"+name,JsonSerializer.Serialize(value,opt));
              Save("game-types.json",classes);Save("core-methods.json",core);Save("game-callers.json",candidates);Save("mod-methods.json",modMethods);
              Console.WriteLine(JsonSerializer.Serialize(new{types=classes.Length,core=core.Length,callers=candidates.Length,mod=modMethods.Length}));
              Console.WriteLine("GameItemElement type="+string.Join(",",classes.Where(x=>x.type.Contains("GameItemElement")).Select(x=>x.type)));
            }
          }
          CS
          dotnet run -c Release --project /tmp/titleaudit -- 'probably-stolen/Managed/Assembly-CSharp.dll' 'probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll'
      - name: Preserve audit on isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse rld-title-audit
          git commit -m 'Inspect actual game inventory tooltip title path'
          git push origin HEAD:refs/heads/rld-inventory-title-audit-20261122
