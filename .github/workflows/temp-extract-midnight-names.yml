name: Temp extract MidnightPawn Korean names
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-extract-midnight-names.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/0.8.0/Localization/pskb__3831837821.csv
          sparse-checkout-cone-mode: false
      - name: Extract translated name rows
        shell: python
        run: |
          from pathlib import Path
          import csv, io
          p=Path('probably-stolen/0.8.0/Localization/pskb__3831837821.csv')
          text=p.read_text(encoding='utf-8-sig')
          value=None
          for row in csv.reader(io.StringIO(text)):
              if row and row[0]=='K|Content/names.txt':
                  value=row[1]
                  break
          if value is None:
              raise SystemExit('names mapping not found')
          rows=[]
          for r in value.split('\\\\n'):
              if r.startswith(('中国\\t','日本\\t','韩国\\t')):
                  rows.append(r.replace('\\t','\t'))
          if len(rows)!=3:
              raise SystemExit(f'expected 3 rows, got {len(rows)}')
          out=Path('/tmp/names_ko.txt')
          out.write_text('\n'.join(rows)+'\n',encoding='utf-8')
          print(out.stat().st_size)
      - uses: actions/upload-artifact@v4
        with:
          name: MidnightPawn-remake-ko-names
          path: /tmp/names_ko.txt
