name: Temp extract MidnightPawn Korean names
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-extract-midnight-names.yml'
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/0.8.0/Localization/pskb__3831837821.csv
          sparse-checkout-cone-mode: false
      - name: Extract translated name rows
        shell: python
        run: |
          from pathlib import Path
          import csv, io
          p=Path('probably-stolen/0.8.0/Localization/pskb__3831837821.csv')
          text=p.read_text(encoding='utf-8-sig')
          marker='K|Content/names.txt,'
          i=text.find(marker)
          if i<0:
              raise SystemExit('names mapping not found')
          p=i+len(marker)
          if text[p]=='"': p+=1
          buf=[]
          while p<len(text):
              ch=text[p]
              if ch=='"':
                  if p+1<len(text) and text[p+1]=='"':
                      buf.append('"'); p+=2; continue
                  break
              buf.append(ch); p+=1
          value=''.join(buf)
          rows=[]
          for r in value.split(chr(92)+'n'):
              if r.startswith(('中国'+chr(9),'日本'+chr(9),'韩国'+chr(9))):
                  rows.append(r)
          if len(rows)!=3:
              raise SystemExit(f'expected 3 rows, got {len(rows)}')
          out=Path('/tmp/names_ko.txt')
          out.write_text('\n'.join(rows)+'\n',encoding='utf-8')
          print(out.stat().st_size)
      - uses: actions/upload-artifact@v4
        with:
          name: MidnightPawn-remake-ko-names
          path: /tmp/names_ko.txt
