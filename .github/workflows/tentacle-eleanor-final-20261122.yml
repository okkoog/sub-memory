name: Eleanor Korean title and diagnostic audit
on:
  push:
    paths: ['.github/workflows/tentacle-eleanor-final-20261122.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod번역/落魄千金-埃莉诺 v1.0.3
      - name: Apply Korean-only title and three logging messages
        shell: bash
        run: |
          set -euo pipefail
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          MOD="$ROOT/落魄千金-埃莉诺 v1.0.3"
          mkdir -p "$ROOT/번역대조표"
          dotnet new console --framework net8.0 -o /tmp/eleanor --force
          dotnet add /tmp/eleanor/eleanor.csproj package dnlib --version 4.5.0
          cat >/tmp/eleanor/Program.cs <<'CS'
          using System;
          using System.Linq;
          using System.IO;
          using System.Collections.Generic;
          using System.Security.Cryptography;
          using System.Text.Json;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
            record Site(string Method,uint Offset,string Before,string After);
            static void Need(bool b,string s){if(!b)throw new Exception(s);}
            static string Hash(string p)=>Convert.ToHexString(SHA256.HashData(File.ReadAllBytes(p))).ToLowerInvariant();
            static string Op(object? o,Dictionary<Instruction,int> ix)=>o switch{null=>"",Instruction i=>"@"+ix[i],IList<Instruction> a=>string.Join(",",a.Select(i=>"@"+ix[i])),_=>o.ToString()??""};
            static string Finger(MethodDef m){if(!m.HasBody)return "";var il=m.Body.Instructions;var ix=il.Select((v,k)=>(v,k)).ToDictionary(z=>z.v,z=>z.k);string At(Instruction? i)=>i==null?"-":ix[i].ToString();return string.Join("\n",il.Select(i=>i.OpCode.Name+"|"+Op(i.Operand,ix)))+"\n"+string.Join("|",m.Body.Variables.Select(v=>v.Type.FullName))+"\n"+string.Join("\n",m.Body.ExceptionHandlers.Select(e=>string.Join("|",e.HandlerType,At(e.TryStart),At(e.TryEnd),At(e.HandlerStart),At(e.HandlerEnd),At(e.FilterStart),e.CatchType?.FullName??"")));}
            static void Main(string[] args){
              string p=args[0],report=args[1],input=Hash(p);
              Need(input=="8a9a116882821298713826b3d357f4ccac4c04ee3fa3664c6671f2c29f95d690","Audited input hash");
              using var before=ModuleDefMD.Load(p);using var edit=ModuleDefMD.Load(p);
              var originals=before.GetTypes().SelectMany(t=>t.Methods).ToDictionary(m=>m.FullName);
              var methods=edit.GetTypes().SelectMany(t=>t.Methods).ToDictionary(m=>m.FullName);
              var old=methods["System.Boolean ProbablyEleanorFollowup.EmbeddedAssets::IsChineseLocale()"];
              Need(old.IsStatic&&old.Body.Instructions.Count(i=>i.OpCode==OpCodes.Ldstr&&Equals(i.Operand,"zh"))==1,"Existing locale predicate");
              var ko=new MethodDefUser("IsKoreanLocaleForTitle",old.MethodSig,old.ImplAttributes,old.Attributes);
              old.DeclaringType.Methods.Add(ko);
              var body=new CilBody{InitLocals=old.Body.InitLocals,MaxStack=old.Body.MaxStack};
              ko.Body=body;
              var locals=new Dictionary<Local,Local>();
              foreach(var l in old.Body.Variables){var v=new Local(l.Type);body.Variables.Add(v);locals[l]=v;}
              var map=new Dictionary<Instruction,Instruction>();
              foreach(var i in old.Body.Instructions){var n=new Instruction(i.OpCode,i.Operand);body.Instructions.Add(n);map[i]=n;}
              foreach(var i in old.Body.Instructions){var n=map[i];n.Operand=i.Operand switch{Instruction t=>map[t],IList<Instruction> ts=>ts.Select(t=>map[t]).ToArray(),Local l=>locals[l],_=>i.Operand};if(n.OpCode==OpCodes.Ldstr&&Equals(n.Operand,"zh"))n.Operand="ko";}
              Instruction? M(Instruction? i)=>i==null?null:map[i];
              foreach(var e in old.Body.ExceptionHandlers)body.ExceptionHandlers.Add(new ExceptionHandler(e.HandlerType){TryStart=M(e.TryStart),TryEnd=M(e.TryEnd),HandlerStart=M(e.HandlerStart),HandlerEnd=M(e.HandlerEnd),FilterStart=M(e.FilterStart),CatchType=e.CatchType});
              var title=methods["System.String ProbablyEleanorFollowup.EmbeddedAssets::DisplayName()"];
              var ti=title.Body.Instructions;
              Need(ti.Count==10&&ti.Count(i=>i.OpCode==OpCodes.Ldstr&&Equals(i.Operand,"落魄千金-埃莉诺"))==2&&ti.Any(i=>i.OpCode==OpCodes.Ldstr&&Equals(i.Operand,"Fallen Heiress - Eleanor")),"Title original routes");
              var target=ti.Single(i=>i.Offset==0x000D);
              Need(target.Operand?.ToString()==old.FullName&&ti.Any(i=>i.Operand==target),"Selected locale branch");
              // Only the selected-locale branch calls the Korean detector. No-locale and zh fallback remain intact.
              var check=Instruction.Create(OpCodes.Call,ko);
              foreach(var i in ti)if(i.Operand==target)i.Operand=check;
              int pos=ti.IndexOf(target);ti.Insert(pos++,check);ti.Insert(pos++,Instruction.Create(OpCodes.Brfalse_S,target));ti.Insert(pos++,Instruction.Create(OpCodes.Ldstr,"몰락한 영애 - 엘리너"));ti.Insert(pos,Instruction.Create(OpCodes.Ret));
              var sites=new[]{
                new Site("System.Void ProbablyEleanorFollowup.ModEntry::Init(ModManifest)",0x0066,"[contract] Portrait Studio 兼容契约: Docs/契约-PortraitStudio兼容.md（改 ClientSprites / HomePortrait / HomeAssetLoad 的公开面或字段名前先读这份）","[contract] Portrait Studio 호환 규약: Docs/契约-PortraitStudio兼容.md (ClientSprites / HomePortrait / HomeAssetLoad의 공개 인터페이스 또는 필드명을 변경하기 전에 읽어 주세요.)"),
                new Site("System.Void ProbablyEleanorFollowup.PurityArrival/<>c::<BuildRenameDialogue>b__13_0()",0x0023,"PurityArrival rename: accept -> 主人","PurityArrival 호칭 변경: 수락 -> 주인님"),
                new Site("System.Void ProbablyEleanorFollowup.PurityArrival/<>c::<BuildRenameDialogue>b__13_2()",0x0019,"PurityArrival rename: refuse -> 店长","PurityArrival 호칭 변경: 거절 -> 점장님")
              };
              foreach(var s in sites){var m=methods[s.Method];var il=m.Body.Instructions;var i=il.Single(i=>i.Offset==s.Offset);int k=il.IndexOf(i);Need(i.OpCode==OpCodes.Ldstr&&Equals(i.Operand,s.Before),"Exact log anchor");Need(k+1<il.Count&&(il[k+1].OpCode==OpCodes.Call||il[k+1].OpCode==OpCodes.Callvirt)&&il[k+1].Operand?.ToString()=="System.Void ModLog::Log(System.Object)","Log-only consumer "+s.Method);i.Operand=s.After;}
              var expected=edit.GetTypes().SelectMany(t=>t.Methods).ToDictionary(m=>m.FullName,m=>Finger(m));
              var allowed=sites.Select(s=>s.Method).Append(title.FullName).ToHashSet();
              Need(originals.All(x=>allowed.Contains(x.Key)||expected[x.Key]==Finger(x.Value)),"Pre-write unexpected modification");
              string tmp=p+".new";edit.Write(tmp);using var after=ModuleDefMD.Load(tmp);
              var actual=after.GetTypes().SelectMany(t=>t.Methods).ToDictionary(m=>m.FullName,m=>Finger(m));
              Need(expected.Count==actual.Count&&expected.All(x=>actual.GetValueOrDefault(x.Key)==x.Value),"Readback exact IL");
              var oldRes=before.Resources.OfType<EmbeddedResource>().ToDictionary(e=>e.Name.ToString(),e=>Convert.ToHexString(SHA256.HashData(e.CreateReader().ToArray())));
              var newRes=after.Resources.OfType<EmbeddedResource>().ToDictionary(e=>e.Name.ToString(),e=>Convert.ToHexString(SHA256.HashData(e.CreateReader().ToArray())));
              Need(before.Resources.Count==after.Resources.Count&&oldRes.Count==newRes.Count&&oldRes.All(kv=>newRes.GetValueOrDefault(kv.Key)==kv.Value),"All resources including localization byte-identical");
              Need(actual.Count==originals.Count+1,"Only one added locale helper");
              File.Move(tmp,p,true);
              File.WriteAllText(report,JsonSerializer.Serialize(new{inputHash=input,finalDllSHA256=Hash(p),oldMethods=originals.Count,newMethods=actual.Count,oldMethodsWithBody=originals.Values.Count(m=>m.HasBody),modifiedMethods=allowed.Count,logChanges=sites.Length,newLocaleHelper=ko.FullName,resourceCount=oldRes.Count,resourcesUnchanged=true,originalChineseEnglishAndNoLocaleTitlePreserved=true,actualGameRuntimeTest=false,sites},new JsonSerializerOptions{WriteIndented=true,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping})+"\n");
            }
          }
          CS
          git lfs pull --include="$MOD/fallen_heiress_eleanor.dll" --exclude=''
          dotnet run --project /tmp/eleanor/eleanor.csproj -- "$MOD/fallen_heiress_eleanor.dll" "$ROOT/번역대조표/Eleanor_FINAL_RESULT_20261122.json"
      - name: Verify overlay and commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          root=Path('probably-stolen/local-mods/TentacleMod번역')
          mod=root/'落魄千金-埃莉诺 v1.0.3'
          p=root/'번역대조표/Eleanor_FINAL_RESULT_20261122.json'
          j=json.loads(p.read_text())
          sha=lambda x:hashlib.sha256(x.read_bytes()).hexdigest()
          assert sha(mod/'fallen_heiress_eleanor.dll')==j['finalDllSHA256']
          out=root/'ProbablyStolen_Eleanor_v1.0.3_KO_Final_20261122.zip'
          files=['fallen_heiress_eleanor.dll','manifest.xml','README_ko.txt','README.txt']
          with ZipFile(out,'w',ZIP_DEFLATED) as z:
              for f in files:z.write(mod/f,mod.name+'/'+f)
              z.write(p,'STATIC_AUDIT.json')
          with ZipFile(out) as z:
              assert z.testzip() is None and len(z.namelist())==5
              for f in files:assert hashlib.sha256(z.read(mod.name+'/'+f)).hexdigest()==sha(mod/f)
          j['archive']={'path':out.name,'sha256':sha(out),'files':5,'crc':'pass','matchesAllOverlayFiles':True}
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          git add --sparse "$ROOT/落魄千金-埃莉诺 v1.0.3/fallen_heiress_eleanor.dll" "$ROOT/번역대조표/Eleanor_FINAL_RESULT_20261122.json" "$ROOT/ProbablyStolen_Eleanor_v1.0.3_KO_Final_20261122.zip"
          git diff --cached --quiet || (git commit -m 'Finalize Eleanor Korean-only title and diagnostic messages' && git push origin main)
