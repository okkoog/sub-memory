name: Eleanor three variants active Chinese IL display callsite audit
on:
  push:
    paths: [.github/workflows/temp-tentacle-eleanor-ui-il-audit-20261121.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/3842247788
            probably-stolen/local-mods/TentacleMod/3843142171
            probably-stolen/local-mods/TentacleMod/落魄千金-埃莉诺 v1.0.3
            probably-stolen/local-mods/TentacleMod번역/번역대조표
          sparse-checkout-cone-mode: false
      - name: Extract Chinese IL sites across 3 original builds
        shell: bash
        run: |
          dotnet new console -f net8.0 -o /tmp/eleanor_il_audit --force
          dotnet add /tmp/eleanor_il_audit/eleanor_il_audit.csproj package dnlib --version 4.5.0
          cat >/tmp/eleanor_il_audit/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Text;
          using System.Text.Json;
          using System.Collections.Generic;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P{
            static void Main(string[] args){
              var rows=new List<string>{"version\tmethod\toffset\toriginal_json\tprevious\tfollowing"};
              for(int a=0;a<3;a++){
                var version=args[a].Split('/')[4];
                using var mod=ModuleDefMD.Load(args[a]);
                int ct=0;
                foreach(var m in mod.GetTypes().SelectMany(t=>t.Methods.Where(m=>m.HasBody))){
                  var il=m.Body.Instructions;
                  for(int i=0;i<il.Count;i++){
                    if(il[i].OpCode!=OpCodes.Ldstr || il[i].Operand is not string value ||
                      !value.Any(c=>c>='\u3400'&&c<='\u9fff'))continue;
                    var prev=i==0?"":il[i-1].ToString();
                    var next=i+1>=il.Count?"":il[i+1].ToString();
                    rows.Add(version+"\t"+m.FullName+"\t"+il[i].Offset+"\t"+
                      JsonSerializer.Serialize(value)+"\t"+JsonSerializer.Serialize(prev)+"\t"+JsonSerializer.Serialize(next));
                    ct++;
                  }
                }
                Console.WriteLine(version+": "+ct+" CJK ldstr callsites");
              }
              File.WriteAllLines(args[3],rows,new UTF8Encoding(false));
            }
          }
          CS
          dotnet run --project /tmp/eleanor_il_audit/eleanor_il_audit.csproj -- \
            'probably-stolen/local-mods/TentacleMod/3842247788/fallen_heiress_eleanor.dll' \
            'probably-stolen/local-mods/TentacleMod/落魄千金-埃莉诺 v1.0.3/fallen_heiress_eleanor.dll' \
            'probably-stolen/local-mods/TentacleMod/3843142171/fallen_heiress_eleanor.dll' \
            'probably-stolen/local-mods/TentacleMod번역/번역대조표/Eleanor_VARIANTS_ACTIVE_CJK_IL_AUDIT_20261121.tsv'
      - name: Commit active IL callsite report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse probably-stolen/local-mods/TentacleMod번역/번역대조표/Eleanor_VARIANTS_ACTIVE_CJK_IL_AUDIT_20261121.tsv
          if ! git diff --cached --quiet; then
            git commit -m 'audit(tentacle): inspect remaining Chinese IL strings in three Eleanor DLL versions'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
