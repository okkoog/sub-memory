name: ItemPortraitHD neutral configuration label audit
on:
  push:
    paths: ['.github/workflows/tentacle-itemportrait-final-20261122.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod번역/ItemPortraitHD_v1.3.0
      - shell: bash
        run: |
          set -euo pipefail
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          MOD="$ROOT/ItemPortraitHD_v1.3.0"
          mkdir -p "$ROOT/번역대조표"
          dotnet new console --framework net8.0 -o /tmp/portrait --force
          dotnet add /tmp/portrait/portrait.csproj package dnlib --version 4.5.0
          cat >/tmp/portrait/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using System.Security.Cryptography;
          using System.Text.Json;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
            static void Need(bool b,string s){if(!b)throw new Exception(s);}
            static string Hash(string p)=>Convert.ToHexString(SHA256.HashData(File.ReadAllBytes(p))).ToLowerInvariant();
            static string Op(object? o,Dictionary<Instruction,int> ix)=>o switch{null=>"",Instruction i=>"@"+ix[i],IList<Instruction> a=>string.Join(",",a.Select(i=>"@"+ix[i])),_=>o.ToString()??""};
            static string Finger(MethodDef m){if(!m.HasBody)return "";var il=m.Body.Instructions;var ix=il.Select((v,k)=>(v,k)).ToDictionary(z=>z.v,z=>z.k);string At(Instruction? i)=>i==null?"-":ix[i].ToString();return string.Join("\n",il.Select(i=>i.OpCode.Name+"|"+Op(i.Operand,ix)))+"\n"+string.Join("|",m.Body.Variables.Select(v=>v.Type.FullName))+"\n"+string.Join("\n",m.Body.ExceptionHandlers.Select(e=>string.Join("|",e.HandlerType,At(e.TryStart),At(e.TryEnd),At(e.HandlerStart),At(e.HandlerEnd),At(e.FilterStart),e.CatchType?.FullName??"")));}
            static void Main(string[] args){
              string p=args[0],report=args[1],input=Hash(p);
              Need(input=="4d02455b210a03a56179cb8be967740d0f9f5d6b7703bf86f6f37aa5d7bd058f","Input hash");
              using var before=ModuleDefMD.Load(p);using var edit=ModuleDefMD.Load(p);
              var old=before.GetTypes().SelectMany(t=>t.Methods).ToDictionary(m=>m.FullName);
              var methods=edit.GetTypes().SelectMany(t=>t.Methods).ToDictionary(m=>m.FullName);
              var m=methods["System.Void ItemPortraitHD.ModEntry::Init(ModManifest)"];
              var sites=new uint[]{0x013A,0x01AF,0x0236,0x03F7,0x045F,0x04BA};
              var keys=new[]{"resolution","hotkey","guest_portrait_hd","local_portrait_chance","weighted_capture_factions","trace_portrait_replacements"};
              Need(m.Body.Instructions.Count(i=>i.OpCode==OpCodes.Ldstr&&Equals(i.Operand,"立绘"))==sites.Length,"Expected six exact group labels");
              for(int n=0;n<sites.Length;n++){
                var il=m.Body.Instructions;var i=il.Single(x=>x.Offset==sites[n]);int k=il.IndexOf(i);
                Need(i.OpCode==OpCodes.Ldstr&&Equals(i.Operand,"立绘"),"Group old literal");
                Need(il.Take(k).Reverse().Take(6).Any(x=>x.OpCode==OpCodes.Ldstr&&Equals(x.Operand,keys[n])),"Config key "+keys[n]);
                var targets=il.Skip(k+1).Take(55).Where(x=>x.OpCode==OpCodes.Call||x.OpCode==OpCodes.Callvirt).Where(x=>x.Operand?.ToString()?.Contains("ModConfig::Define")==true);
                Need(targets.Any(),"Config.Define group consumer");
                i.Operand="초상화";
              }
              var description=methods["System.String ItemPortraitHD.ModEntry/<>c::<Init>b__26_21()"];
              Need(description.Body.Instructions.Any(i=>i.OpCode==OpCodes.Ldstr&&(i.Operand as string)?.Contains("Portraits/来源名/阵营")==true&&(i.Operand as string)?.Contains("체형에 지정된 출처")==true),"Existing Korean description and literal folder path");
              var expected=methods.ToDictionary(x=>x.Key,x=>Finger(x.Value));
              Need(old.Count==expected.Count&&old.All(x=>x.Key==m.FullName||expected[x.Key]==Finger(x.Value)),"Only group method changed");
              string tmp=p+".new";edit.Write(tmp);using var after=ModuleDefMD.Load(tmp);
              var actual=after.GetTypes().SelectMany(t=>t.Methods).ToDictionary(x=>x.FullName,x=>Finger(x));
              Need(expected.Count==actual.Count&&expected.All(x=>actual.GetValueOrDefault(x.Key)==x.Value),"IL readback");
              var res=before.Resources.OfType<EmbeddedResource>().ToDictionary(e=>e.Name.ToString(),e=>Convert.ToHexString(SHA256.HashData(e.CreateReader().ToArray())));
              var rr=after.Resources.OfType<EmbeddedResource>().ToDictionary(e=>e.Name.ToString(),e=>Convert.ToHexString(SHA256.HashData(e.CreateReader().ToArray())));
              Need(before.Resources.Count==after.Resources.Count&&res.Count==rr.Count&&res.All(x=>rr.GetValueOrDefault(x.Key)==x.Value),"Resources unchanged");
              File.Move(tmp,p,true);
              File.WriteAllText(report,JsonSerializer.Serialize(new{inputHash=input,finalDllSHA256=Hash(p),methods=old.Count,methodsWithBody=old.Values.Count(x=>x.HasBody),changedMethods=1,changedGroupLabels=sites.Length,offsets=sites,keys,oldGroup="立绘",newGroup="초상화",alreadyKoreanDescriptionPreserved=true,resourcesUnchanged=true,actualGameRuntimeTest=false},new JsonSerializerOptions{WriteIndented=true,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping})+"\n");
            }
          }
          CS
          dotnet run --project /tmp/portrait/portrait.csproj -- "$MOD/ItemPortraitHD.dll" "$ROOT/번역대조표/ItemPortraitHD_FINAL_RESULT_20261122.json"
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          root=Path('probably-stolen/local-mods/TentacleMod번역')
          mod=root/'ItemPortraitHD_v1.3.0'
          p=root/'번역대조표/ItemPortraitHD_FINAL_RESULT_20261122.json'
          j=json.loads(p.read_text())
          sha=lambda x:hashlib.sha256(x.read_bytes()).hexdigest()
          assert sha(mod/'ItemPortraitHD.dll')==j['finalDllSHA256']
          out=root/'ProbablyStolen_ItemPortraitHD_v1.3.0_KO_Final_20261122.zip'
          files=[x for x in mod.rglob('*') if x.is_file() and (x.suffix.lower() in ('.dll','.md','.txt','.xml'))]
          with ZipFile(out,'w',ZIP_DEFLATED) as z:
              for f in files:z.write(f,str(f.relative_to(root)))
              z.write(p,'STATIC_AUDIT.json')
          with ZipFile(out) as z:
              assert z.testzip() is None and len(z.namelist())==len(files)+1
              for f in files:assert hashlib.sha256(z.read(str(f.relative_to(root)))).hexdigest()==sha(f)
          j['archive']={'path':out.name,'sha256':sha(out),'files':len(files)+1,'crc':'pass','matchesOverlayFiles':True}
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse "$MOD/ItemPortraitHD.dll" "$ROOT/번역대조표/ItemPortraitHD_FINAL_RESULT_20261122.json" "$ROOT/ProbablyStolen_ItemPortraitHD_v1.3.0_KO_Final_20261122.zip"
          git commit -m 'Finalize neutral ItemPortraitHD config group localization'
          git pull --rebase origin main
          git push origin main
