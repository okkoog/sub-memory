name: CorpPresence deferred-init test DLL

on:
  push:
    paths:
      - ".github/workflows/corp-init-fix.yml"
      - "probably-stolen/tools/corp-init-fix/**"
      - "probably-stolen/mods/3828913695/CorpPresence.dll"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-verified-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build Mono.Cecil patcher
        run: |
          dotnet restore probably-stolen/tools/corp-init-fix/CorpInitFix.csproj
          dotnet build probably-stolen/tools/corp-init-fix/CorpInitFix.csproj -c Release --no-restore
      - name: Patch only two premature bootstrap calls and verify entire IL
        run: |
          dotnet run --no-build -c Release --project probably-stolen/tools/corp-init-fix/CorpInitFix.csproj -- \
            probably-stolen/mods/3828913695/CorpPresence.dll \
            probably-stolen/test-builds/CorpPresence-v0.9.4-delayed-locale/CorpPresence.dll \
            probably-stolen/test-builds/CorpPresence-v0.9.4-delayed-locale/verification.md
          git diff --exit-code -- probably-stolen/mods/3828913695/CorpPresence.dll
          sha256sum \
            probably-stolen/mods/3828913695/CorpPresence.dll \
            probably-stolen/test-builds/CorpPresence-v0.9.4-delayed-locale/CorpPresence.dll
      - name: Save test binary and verification report to repository
        run: |
          git add -- \
            probably-stolen/test-builds/CorpPresence-v0.9.4-delayed-locale/CorpPresence.dll \
            probably-stolen/test-builds/CorpPresence-v0.9.4-delayed-locale/verification.md
          if git diff --cached --quiet; then
            echo "No change in compiled output"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build verified delayed-init CorpPresence test DLL"
          git pull --rebase origin main
          git push origin HEAD:main
