name: Restore KoreanPack 0.8.6 source for isolated water-label fix
on:
  push:
    branches:
      - fix-koreanpack-mechanic-water-20261109
    paths:
      - .github/workflows/restore-koreanpack-086-waterfix.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install ILSpy
        run: dotnet tool install ilspycmd --tool-path "$RUNNER_TEMP/ilspytools"
      - name: Restore C# from actual deployed DLL
        shell: bash
        run: |
          set -euo pipefail
          test -s 'probably-stolen/번역 모드/ProbablyStolenKoreanPack.dll'
          mkdir -p probably-stolen/source/koreanpack-086-restored
          "$RUNNER_TEMP/ilspytools/ilspycmd" -p -o probably-stolen/source/koreanpack-086-restored 'probably-stolen/번역 모드/ProbablyStolenKoreanPack.dll'
          find probably-stolen/source/koreanpack-086-restored -type f -maxdepth 5
      - name: Commit restored source to isolated branch only
        shell: bash
        run: |
          set -euo pipefail
          git add probably-stolen/source/koreanpack-086-restored
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore source from shipping KoreanPack DLL for inspection'
          git push origin HEAD:fix-koreanpack-mechanic-water-20261109
