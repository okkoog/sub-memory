name: Build KoreanPack NoHooks v07521

on:
  push:
    paths:
      - "probably-stolen/tools/nohooks/**"
      - ".github/workflows/build-koreanpack-nohooks.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Patch current release DLL without editing original
        run: |
          set -euxo pipefail
          dotnet run --project probably-stolen/tools/nohooks/KoreanPack.NoHooks.csproj --configuration Release -- \
            probably-stolen/0.7.5.21-dev/ProbablyStolenKoreanPack.dll \
            probably-stolen/build/out/ProbablyStolenKoreanPack.NoHooks.0.7.5.21-dev.dll \
            probably-stolen/build/out/ProbablyStolenKoreanPack.NoHooks.audit.txt
      - name: Upload verified no-hook DLL
        uses: actions/upload-artifact@v4
        with:
          name: ProbablyStolenKoreanPack-NoHooks-v07521
          path: |
            probably-stolen/build/out/ProbablyStolenKoreanPack.NoHooks.0.7.5.21-dev.dll
            probably-stolen/build/out/ProbablyStolenKoreanPack.NoHooks.audit.txt
          if-no-files-found: error
      - name: Commit separate no-hook deliverables
        run: |
          set -euxo pipefail
          git add probably-stolen/build/out/ProbablyStolenKoreanPack.NoHooks.0.7.5.21-dev.dll probably-stolen/build/out/ProbablyStolenKoreanPack.NoHooks.audit.txt
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build hook-free 0.7.5.21-dev KoreanPack DLL"
          git pull --rebase origin main
          git push origin HEAD:main
