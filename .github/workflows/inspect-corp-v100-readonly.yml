name: Inspect CorpPresence v1.0.0 activation path
on:
  push:
    branches: [diagnose-corp-v100-20261109]
    paths: [.github/workflows/inspect-corp-v100-readonly.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            probably-stolen/mods/3828913695
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Inspect original DLL read-only
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install ilspycmd --tool-path "$RUNNER_TEMP/ilspytools"
          DLL=probably-stolen/mods/3828913695/CorpPresence.dll
          echo '===== DLL ====='
          sha256sum "$DLL"
          echo '===== types / classes ====='
          "$RUNNER_TEMP/ilspytools/ilspycmd" -l c "$DLL" | head -n 180 || true
          echo '===== namespace source ====='
          mkdir -p "$RUNNER_TEMP/corp"
          "$RUNNER_TEMP/ilspytools/ilspycmd" -p -o "$RUNNER_TEMP/corp" "$DLL"
          echo '===== targeted activation classes ====='
          for ty in CorpPresence.GameResources CorpPresence.ItemRegistry CorpPresence.ModLog CorpPresence.Runtime.ResourceBootstrap; do
            echo "=========== TYPE: $ty ==========="
            "$RUNNER_TEMP/ilspytools/ilspycmd" -t "$ty" "$DLL" | head -n 450 || true
          done
