name: RLD late Korean display fixes for clothing and traits
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rld-ui-late-display-build-20261122.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rld-ui-late-lookup-fix-20261122
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            rld-ui-fix
            probably-stolen/local-mods/TentacleMod-Update/.gitattributes
            probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/manifest.xml
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/Localization/ko.csv
      - name: Fetch and verify current actual DLL
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll' --exclude=''
          echo 'a224760a2ae651e07adb467014dbb0053d1c6b8942879644b2afbad614237f25  probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll' | sha256sum -c
      - name: Compile and patch the six audited output methods
        shell: bash
        run: |
          set -euo pipefail
          dotnet new console -f net8.0 --force -o /tmp/rld-display-fix
          dotnet add /tmp/rld-display-fix/rld-display-fix.csproj package dnlib --version 4.5.0
          cp rld-ui-fix/Patch.cs /tmp/rld-display-fix/Program.cs
          dotnet build /tmp/rld-display-fix/rld-display-fix.csproj -c Release
          mkdir -p rld-ui-fix/verified
          dotnet /tmp/rld-display-fix/bin/Release/net8.0/rld-display-fix.dll \
            'probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll' \
            rld-ui-fix/plan.json \
            rld-ui-fix/RedLightDistrict.dll \
            rld-ui-fix/verified/report.json
      - name: Reopen, verify and assemble install package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,zipfile,pathlib,hashlib,csv
          work=pathlib.Path('rld-ui-fix')
          dll=work/'RedLightDistrict.dll'
          plan=json.loads((work/'plan.json').read_text())
          report=json.loads((work/'verified/report.json').read_text())
          assert dll.stat().st_size>100000000 and dll.read_bytes()[:2]==b'MZ'
          assert hashlib.sha256(dll.read_bytes()).hexdigest()==report['patchedSha256']
          src=pathlib.Path('probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1')
          with (src/'Localization/ko.csv').open(encoding='utf-8-sig',newline='') as f: names=dict(csv.reader(f))
          for row in plan['equipment']+plan['accessory']+plan['traits']:
             assert row['key'] in names and names[row['key']].strip()
          assert len(names)==3552
          zipname=work/'verified/RedLightDistrict_v1.1.1_KO_UI_DisplayFix.zip'
          with zipfile.ZipFile(zipname,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=4) as z:
             z.write(dll,arcname='RedLightDistrict_v1.1.1/RedLightDistrict.dll')
             z.write(src/'Localization/ko.csv',arcname='RedLightDistrict_v1.1.1/Localization/ko.csv')
             z.write(src/'manifest.xml',arcname='RedLightDistrict_v1.1.1/manifest.xml')
          with zipfile.ZipFile(zipname) as z:
             assert z.testzip() is None
             assert hashlib.sha256(z.read('RedLightDistrict_v1.1.1/RedLightDistrict.dll')).hexdigest()==report['patchedSha256']
          print('Output DLL sha256:',report['patchedSha256'])
          print('ZIP sha256:',hashlib.sha256(zipname.read_bytes()).hexdigest())
          PY
      - name: Publish verified DLL to isolated GitHub branch
        shell: bash
        run: |
          set -euo pipefail
          git lfs track 'rld-ui-fix/RedLightDistrict.dll'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse .gitattributes rld-ui-fix/RedLightDistrict.dll rld-ui-fix/verified/report.json
          pointer=$(git show :rld-ui-fix/RedLightDistrict.dll)
          grep -Fxq 'version https://git-lfs.github.com/spec/v1' <<< "$pointer"
          grep -Fxq "oid sha256:$(sha256sum rld-ui-fix/RedLightDistrict.dll|cut -d' ' -f1)" <<< "$pointer"
          git commit -m 'Fix only RLD outfit and trait display late localization'
          git push origin HEAD:refs/heads/rld-ui-late-lookup-fix-20261122
      - uses: actions/upload-artifact@v4
        with:
          name: RLD-UI-display-fix-verified-installation
          path: rld-ui-fix/verified/RedLightDistrict_v1.1.1_KO_UI_DisplayFix.zip
          if-no-files-found: error

# Retry after compiler fix
