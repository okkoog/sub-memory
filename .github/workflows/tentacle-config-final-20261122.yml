name: LewdMemeConfig final Korean display and installation overlay
on:
  push:
    paths: ['.github/workflows/tentacle-config-final-20261122.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod번역/lewd_meme_config0.7.2-pre
            probably-stolen/local-mods/TentacleMod/lewd_meme_config0.7.2-pre/manifest.xml
            probably-stolen/local-mods/TentacleMod/lewd_meme_config0.7.2-pre/LewdMemeConfig.dll
            probably-stolen/local-mods/TentacleMod번역/번역대조표/LewdMemeConfig_BOUNDARY_RESULT_20261122.json
            probably-stolen/local-mods/TentacleMod번역/번역대조표/LewdMemeConfig_DIRECT_RESULT_20261122.json
            probably-stolen/local-mods/TentacleMod번역/번역대조표/LewdMemeConfig_FINAL_PLAN_20261122.json
            probably-stolen/local-mods/TentacleMod번역/번역대조표/WorkAudit_20261122
            probably-stolen/Managed/Assembly-CSharp.dll
      - name: Patch exact audited display callsites; preserve section IDs and dropdown values
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/cfg_direct --force
          dotnet add /tmp/cfg_direct/cfg_direct.csproj package dnlib --version 4.5.0
          cat >/tmp/cfg_direct/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using System.Text.Json;
          using System.Security.Cryptography;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
            record Site(string token,string method,uint offset,string source,string target,string action,string classification,string reason);
            static void Need(bool b,string why){if(!b)throw new Exception(why);}
            static string Hash(byte[] b)=>Convert.ToHexString(SHA256.HashData(b)).ToLowerInvariant();
            static bool Cjk(string s)=>s.Any(c=>c>='\u3400'&&c<='\u9fff');
            static string Op(object? x,Dictionary<Instruction,int> map)=>x switch{null=>"",Instruction i=>"@"+map[i],IList<Instruction> a=>string.Join(",",a.Select(i=>"@"+map[i])),_=>x.ToString()??""};
            static string EH(ExceptionHandler e,Dictionary<Instruction,int> map){
              string I(Instruction? i)=>i==null?"-":map[i].ToString();
              return string.Join("|",e.HandlerType.ToString(),I(e.TryStart),I(e.TryEnd),I(e.HandlerStart),I(e.HandlerEnd),I(e.FilterStart),e.CatchType?.FullName??"");
            }
            static void Main(string[] a){
              byte[] bytes=File.ReadAllBytes(a[0]);using var plan=JsonDocument.Parse(File.ReadAllText(a[1]));
              Need(Hash(bytes)==plan.RootElement.GetProperty("baselineSha256").GetString(),"Unexpected DLL baseline "+Hash(bytes));
              var sites=plan.RootElement.GetProperty("sites").Deserialize<Site[]>()!;
              using var before=ModuleDefMD.Load(bytes);using var m=ModuleDefMD.Load(bytes);
              var methods=m.GetTypes().SelectMany(t=>t.Methods).Where(x=>x.HasBody).ToDictionary(x=>x.MDToken.Raw.ToString("X8"));
              var expected=new Dictionary<(string,int),string>();var reviewed=new List<object>();
              foreach(var s in sites){
                Need(methods.TryGetValue(s.token,out var method)&&method!.FullName==s.method,"Method "+s.method);
                var ins=method!.Body.Instructions.SingleOrDefault(x=>x.Offset==s.offset);
                Need(ins!=null&&ins.OpCode==OpCodes.Ldstr&&Equals(ins.Operand,s.source),"Anchor "+s.method+" "+s.offset+" observed "+ins?.Operand);
                // PanelKeys section is a shared grouping/ID input: do not alter it. The header needs an output-only patch.
                bool deferred=false;
                string action=deferred?"defer-section-boundary":s.action;
                if(action=="patch"){expected.Add((s.token,method.Body.Instructions.IndexOf(ins!)),s.target);ins!.Operand=s.target;}
                reviewed.Add(new{s.token,s.method,s.offset,s.source,s.target,action,result=(string)ins!.Operand});
              }
              string temp=a[0]+".new";m.Write(temp);using var check=ModuleDefMD.Load(temp);
              var old=before.GetTypes().SelectMany(t=>t.Methods).GroupBy(x=>x.FullName).ToDictionary(g=>g.Key,g=>g.OrderBy(x=>x.MDToken.Raw).ToArray());
              var now=check.GetTypes().SelectMany(t=>t.Methods).GroupBy(x=>x.FullName).ToDictionary(g=>g.Key,g=>g.OrderBy(x=>x.MDToken.Raw).ToArray());
              Need(old.Count==now.Count&&old.All(x=>now.TryGetValue(x.Key,out var z)&&x.Value.Length==z.Length),"Method collection");
              Need(before.GetTypes().Select(x=>x.FullName).SequenceEqual(check.GetTypes().Select(x=>x.FullName)),"Type collection");
              int compared=0,changed=0;var active=new List<object>();
              foreach(var pair in old)for(int n=0;n<pair.Value.Length;n++){
                var o=pair.Value[n];var k=now[pair.Key][n];Need(o.HasBody==k.HasBody,"Body availability");if(!o.HasBody)continue;
                var oi=o.Body.Instructions.ToList();var ni=k.Body.Instructions.ToList();
                Need(oi.Count==ni.Count&&o.Body.Variables.Count==k.Body.Variables.Count&&o.Body.ExceptionHandlers.Count==k.Body.ExceptionHandlers.Count,"Body "+o.FullName);
                var xmap=oi.Select((v,i)=>(v,i)).ToDictionary(x=>x.v,x=>x.i);var ymap=ni.Select((v,i)=>(v,i)).ToDictionary(x=>x.v,x=>x.i);
                Need(o.Body.ExceptionHandlers.Select(e=>EH(e,xmap)).SequenceEqual(k.Body.ExceptionHandlers.Select(e=>EH(e,ymap))),"EH "+o.FullName);
                Need(o.Body.Variables.Select(v=>v.Type.FullName).SequenceEqual(k.Body.Variables.Select(v=>v.Type.FullName)),"Locals "+o.FullName);
                for(int i=0;i<oi.Count;i++){
                  var x=oi[i];var y=ni[i];Need(x.OpCode==y.OpCode,"Opcode "+o.FullName+" "+i);
                  var key=(o.MDToken.Raw.ToString("X8"),i);
                  var ex=expected.TryGetValue(key,out var v)?v:Op(x.Operand,xmap);
                  Need(ex==Op(y.Operand,ymap),"Operand "+o.FullName+" "+i);
                  if(expected.ContainsKey(key))changed++;
                  if(y.OpCode==OpCodes.Ldstr&&y.Operand is string s&&Cjk(s))active.Add(new{token=k.MDToken.Raw.ToString("X8"),method=k.FullName,offset=y.Offset,source=s,previousToken=o.MDToken.Raw.ToString("X8"),previousOffset=x.Offset});
                }compared++;
              }
              Need(changed==expected.Count,"Changed sites");
              var ar=before.Resources.OfType<EmbeddedResource>().ToDictionary(x=>x.Name.ToString(),x=>x.CreateReader().ToArray());
              var br=check.Resources.OfType<EmbeddedResource>().ToDictionary(x=>x.Name.ToString(),x=>x.CreateReader().ToArray());
              Need(ar.Count==br.Count&&ar.All(x=>br.TryGetValue(x.Key,out var v)&&x.Value.SequenceEqual(v)),"Resources");
              File.Move(temp,a[0],true);
              using var game=ModuleDefMD.Load(a[3]);
              var selected=game.GetTypes().Where(t=>t.Name=="ModConfigWindow").SelectMany(t=>t.Methods).Where(x=>x.HasBody&&(x.Name=="Open"||x.Name=="BuildEntry")).Concat(check.GetTypes().Where(t=>t.Name=="PanelRowPatch").SelectMany(t=>t.Methods).Where(x=>x.HasBody&&(x.Name=="Install"||x.Name=="MarkedRow"||x.Name=="BuildEntryPrefix"))).Select(x=>new{method=x.FullName,token=x.MDToken.Raw.ToString("X8"),instructions=x.Body.Instructions.Select(i=>new{offset=i.Offset,opcode=i.OpCode.Name,operand=i.Operand?.ToString()??""}).ToArray()}).ToArray();
              var options=new JsonSerializerOptions{WriteIndented=true,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping};
              File.WriteAllText(a[2],JsonSerializer.Serialize(new{previousDllHash=Hash(bytes),finalDllHash=Hash(File.ReadAllBytes(a[0])),comparedMethods=compared,changedSites=changed,unchangedResources=ar.Count,reviewed,remainingCjk=active,displayBoundaryIL=selected,remaining="Pending final package and protected-value classification",runtime="not tested"},options)+"\n");
              Console.WriteLine("Verified "+compared+" methods; "+changed+" exact display literals; remaining CJK "+active.Count);
            }
          }
          CS
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          dotnet run --project /tmp/cfg_direct/cfg_direct.csproj -- "$ROOT/lewd_meme_config0.7.2-pre/LewdMemeConfig.dll" "$ROOT/번역대조표/LewdMemeConfig_FINAL_PLAN_20261122.json" "$ROOT/번역대조표/LewdMemeConfig_FINAL_RESULT_20261122.json" 'probably-stolen/Managed/Assembly-CSharp.dll'
      - name: Verify remaining source keys, align runtime source and build final installation ZIP
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from collections import Counter
          from zipfile import ZipFile,ZIP_DEFLATED
          import json, hashlib, xml.etree.ElementTree as E
          root=Path('probably-stolen/local-mods/TentacleMod번역')
          src=Path('probably-stolen/local-mods/TentacleMod/lewd_meme_config0.7.2-pre')
          name='lewd_meme_config0.7.2-pre'
          mod=root/name
          def read(n):
              return json.loads((root/'번역대조표'/n).read_text(encoding='utf-8-sig'))
          direct=read('LewdMemeConfig_DIRECT_RESULT_20261122.json')
          boundary=read('LewdMemeConfig_BOUNDARY_RESULT_20261122.json')
          report=root/'번역대조표/LewdMemeConfig_FINAL_RESULT_20261122.json'
          r=json.loads(report.read_text())
          assert direct['changedSites']==21 and direct['comparedMethods']==881
          assert boundary['debugLabels']==2 and boundary['sharedIdsAndValuesPreserved']
          assert boundary['headerBoundary']==1 and boundary['choiceBoundaries']==2
          assert r['changedSites']==8 and r['comparedMethods']==881+boundary['embeddedHelperMethods']
          assert all(x['action']=='patch' for x in r['reviewed'])
          key=lambda x:(x['method'],x['offset'],x['source'])
          before=Counter(key(x) for x in boundary['remainingCjk'])
          patched=Counter(key(x) for x in r['reviewed'])
          assert not (patched-before)
          old=[x for x in r['remainingCjk'] if 'ConfigDisplayKo::' not in x['method']]
          helpers=[x for x in r['remainingCjk'] if 'ConfigDisplayKo::' in x['method']]
          assert Counter(key(x) for x in old)==before-patched
          assert len(old)==272 and helpers and all('ConfigDisplayKo::Translate(' in x['method'] for x in helpers)
          section={'顾客','价格','成长','掉落','少女生成','闹钟','陷阱','界面','天赋','暗流交易联动','巢穴扩展联动','掌上青楼联动','tearlaments 联动','物品高清立绘管理器联动'}
          choices={'开','关','不限制（原版）','仅日本','仅中国','仅中日韩','仅女性（原版）','不限性别','原版行为','保留游戏原分布','关闭','仅普通顾客','顾客+特殊顾客','全体人类角色'}
          def reason(x):
              m,s=x['method'],x['source']
              if 'FamilyPanelKeys::.cctor(' in m or 'PanelKeys::.cctor(' in m:
                  if s in section:return 'Shared section identifier; header display-only translation inserted, original section_ ID and equality retained.'
                  if s in choices:return 'Raw choice/default value; display array copied, original array and selected index retained.'
                  if any('가'<=c<='힣' for c in s):return 'Already Korean; contains intentionally preserved raw CSV input examples.'
              if 'PlayerChoices::.cctor(' in m and s in choices:return 'Raw scope choice and reverse mapping; display array translated separately.'
              if 'DebugPanel::QuickGroupTests(' in m and s=='掌上青楼联动':return 'Original group identity, retained with matching FamilyPanelKeys section.'
              if 'SelfTestRunner' in m:
                  if s=='黑市':return 'Raw faction test fixture or equality operand.'
                  if 'fatigue_enabled=关' in s:return 'Already Korean; literal config switch token retained.'
              if 'ConfigRegistry::RegisterMaiden(' in m:return 'Raw configuration defaults.'
              if 'MaidenRoll::ParseFactionBases(' in m:return 'Raw faction parsing key.'
              if 'TranspilePlan::.cctor(' in m:return 'Original matching/rewrite input or raw faction default.'
              if 'CorruptPatch::IsCorruptibleBody(' in m:return 'Original search/blacklist values.'
              if 'MaidenPatch::CreateMaidenBody(' in m:return 'Original item identity or internally consumed attribute token.'
              if any('MaidenPatch::'+q+'(' in m for q in ['PoolMeta','WriteJobsAtCompose','WriteFbbAtCompose','OnConfigChanged','WritePoolOrExp']) and ',' in s:return 'Raw pool CSV; not the diagnostic label.'
              if 'RemakePatches::TryProduceMilkPrefix(' in m:return 'Raw body attribute comparison.'
              if 'SpecialAndManualPatches::UpdateMaidenDescriptionBody(' in m:return 'Raw faction equality operand; narrative output has separate Korean literals.'
              raise AssertionError('Unclassified remaining source '+str(x))
          for x in old:x['reason']=reason(x)
          for x in helpers:x['reason']='Exact original lookup key in scoped UI translator, not output.'
          assert set(x['source'] for x in old if x['reason'].startswith('Shared section'))==section
          assert set(x['source'] for x in old if x['reason'].startswith('Raw choice') or x['reason'].startswith('Raw scope'))==choices
          assert section|choices==set(x['source'] for x in helpers)
          # The source folder is retained for maintenance, but the verified DLL is the installation authority.
          source=mod/'Source/Integration/PanelRowPatch.cs'
          text=source.read_text(encoding='utf-8')
          install='harmony.Patch(original, prefix: new HarmonyMethod(typeof(PanelRowPatch), nameof(BuildEntryPrefix)));'
          choice='b.AddDropdown(entry.Choices,'
          assert text.count(install)==1 and text.count(choice)==1
          text=text.replace(install,install+'\n                ConfigDisplayKo.Install(harmony, log);').replace(choice,'b.AddDropdown(ConfigDisplayKo.Choices(entry.Choices, config),')
          source.write_text(text,encoding='utf-8')
          a=E.parse(src/'manifest.xml').getroot();b=E.parse(mod/'manifest.xml').getroot()
          for k in ['ID','Author','ModVersion','GameVersions','Prerequisites','Assemblies','Capabilities']:
              assert E.tostring(a.find(k))==E.tostring(b.find(k)),k
          assert b.findtext('ModVersion')=='0.7.2-pre'
          files=['LewdMemeConfig.dll','manifest.xml','README.md']
          zpath=root/'ProbablyStolen_LewdMemeConfig_v0.7.2-pre_KO_Final_20261122.zip'
          with ZipFile(zpath,'w',ZIP_DEFLATED,compresslevel=6) as z:
              for f in files:z.write(mod/f,name+'/'+f)
          with ZipFile(zpath) as z:
              assert z.testzip() is None and set(z.namelist())=={name+'/'+f for f in files}
              for f in files:assert z.read(name+'/'+f)==(mod/f).read_bytes()
          r.update(originalDllHash=hashlib.sha256((src/'LewdMemeConfig.dll').read_bytes()).hexdigest(),directPatchSites=direct['changedSites'],extraDebugLabels=boundary['debugLabels'],additionalDiagnosticSites=r['changedSites'],totalNewDirectLiteralPatches=direct['changedSites']+boundary['debugLabels']+r['changedSites'],alreadyKorean=sum(x['action']=='already' for x in direct['reviewed']),scopedHeaderBoundary=1,scopedChoiceBoundaries=2,originalMethodCount=881,embeddedHelperMethods=boundary['embeddedHelperMethods'],protectedOriginalCjkSites=len(old),helperLookupCjkSites=len(helpers),protectedCategoryCounts=dict(Counter(x['reason'] for x in old)),remainingUnclassified=0,remainingAuditedDisplaySites=0,manifestVersion=b.findtext('ModVersion'),archive={'path':zpath.name,'sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),'files':len(files),'crc':'pass','matchesAllOverlayFiles':True},runtime='not tested')
          r.pop('remaining',None)
          report.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print({k:v for k,v in r.items() if not isinstance(v,list)})
          PY
      - name: Commit verified final DLL, source and installation ZIP
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          git add --sparse "$ROOT/lewd_meme_config0.7.2-pre/LewdMemeConfig.dll" "$ROOT/lewd_meme_config0.7.2-pre/Source/Integration/PanelRowPatch.cs" "$ROOT/번역대조표/LewdMemeConfig_FINAL_RESULT_20261122.json" "$ROOT/ProbablyStolen_LewdMemeConfig_v0.7.2-pre_KO_Final_20261122.zip"
          git diff --cached --quiet || (git commit -m 'Finalize LewdMemeConfig Korean display and verified installation overlay' && git push origin main)
