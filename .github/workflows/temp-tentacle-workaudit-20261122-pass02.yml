          git add --sparse 'probably-stolen/local-mods/TentacleMod번역/번역대조표/WorkAudit_20261122/후속02'
          git add -u -- 'probably-stolen/local-mods/TentacleMod번역'
          if ! git diff --cached --quiet; then
            git commit -m 'audit(tentacle): grouped IL consumers and strictly verified direct UI label patches'
            git pull --rebase origin main
            git push origin main
          fi
