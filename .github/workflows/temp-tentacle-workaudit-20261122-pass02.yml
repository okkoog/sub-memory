      - name: Update matching package copies and verify CRC
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,zipfile,os
          root=Path('probably-stolen/local-mods/TentacleMod번역')
          dest=root/'번역대조표/WorkAudit_20261122/후속02'
          r=json.loads((dest/'patch_result.json').read_text())
          def sha(b):return hashlib.sha256(b).hexdigest()
          changes={x['oldHash']: root/x['relative'] for x in r['dlls']}
          archives=[]
          for z in root.glob('*.zip'):
           if not z.is_file(): continue
           if not zipfile.is_zipfile(z): continue
           with zipfile.ZipFile(z) as f:
            assert f.testzip() is None, str(z)
            entries=[(i,f.read(i)) for i in f.infolist()]
           repl=[(i,changes[sha(b)].read_bytes() if i.filename.endswith('.dll') and sha(b) in changes else b) for i,b in entries]
           modified=[i.filename for (i,b),(_,n) in zip(entries,repl) if b!=n]
           if not modified:continue
           temp=z.with_suffix('.tmp')
           with zipfile.ZipFile(temp,'w',compression=zipfile.ZIP_DEFLATED) as f:
            for i,b in repl:f.writestr(i,b)
           with zipfile.ZipFile(temp) as f:
            assert f.testzip() is None
            for i,b in repl:assert f.read(i.filename)==b
           temp.replace(z)
           archives.append({'file':z.name,'entries':modified,'sha256':sha(z.read_bytes())})
          (dest/'archive_result.json').write_text(json.dumps(archives,ensure_ascii=False,indent=2))
          print('updated DLLs:',len(r['dlls']),'sites:',len(r['sites']),'archives:',len(archives))
          
          PY
      - name: Commit verified binary and full grouped evidence
