      - name: Read grouped IL and modify verified single display arguments
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/workaudit2 --force
          dotnet add /tmp/workaudit2/workaudit2.csproj package dnlib --version 4.5.0
          mkdir -p 'probably-stolen/local-mods/TentacleMod번역/번역대조표/WorkAudit_20261122/후속02'
          cat >/tmp/workaudit2/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using System.Text;
          using System.Text.Json;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          using System.Security.Cryptography;
          class Program {
           record Spec(string folder,string file,string type,string method,string from,string to,int[] offsets,string sink);
           static string Hash(string p)=>Convert.ToHexString(SHA256.HashData(File.ReadAllBytes(p))).ToLowerInvariant();
           static string Oper(object? o)=>o switch {null=>"",Instruction i=>"IL_"+i.Offset.ToString("X4"),IList<Instruction> a=>string.Join(",",a.Select(i=>"IL_"+i.Offset.ToString("X4"))),_=>o.ToString()??""};
           static bool Cjk(string s)=>s.Any(c=>c>='\u3400'&&c<='\u9fff');
           static void Main(string[] a){
           string root=a[0], dest=a[1];
           var specs=JsonSerializer.Deserialize<Spec[]>(File.ReadAllText(a[2]))!;
           var results=new List<object>(); var verified=new List<object>(); var status=new List<object>();
           foreach(var file in Directory.EnumerateFiles(root,"*.dll",SearchOption.AllDirectories).OrderBy(x=>x)){
           string rel=Path.GetRelativePath(root,file).Replace('\\','/');string folder=rel.Split('/')[0];
           var selected=specs.Where(s=>s.folder==folder&&s.file==Path.GetFileName(file)).ToArray();
           var oldHash=Hash(file);
           try{
           using var md=ModuleDefMD.Load(file);
           var methods=md.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToArray();
           var map=methods.ToDictionary(m=>m.FullName,m=>m);
           var direct=new Dictionary<string,HashSet<string>>();
           var fieldUses=new Dictionary<string,HashSet<string>>();
           var reverse=new Dictionary<string,HashSet<string>>();
           foreach(var m in methods)foreach(var i in m.Body.Instructions){if(i.Operand is IMethod call){string k=call.FullName;if(map.ContainsKey(k)){if(!direct.ContainsKey(m.FullName))direct[m.FullName]=new();direct[m.FullName].Add(k);if(!reverse.ContainsKey(k))reverse[k]=new();reverse[k].Add(m.FullName);}} if(i.Operand is IField f){if(!fieldUses.ContainsKey(f.FullName))fieldUses[f.FullName]=new();fieldUses[f.FullName].Add(m.FullName);}}
           var targets=methods.Where(m=>m.Body.Instructions.Any(i=>i.OpCode==OpCodes.Ldstr&&i.Operand is string s&&Cjk(s))).Select(m=>m.FullName).ToHashSet();
           var include=new HashSet<string>(targets); foreach(var key in targets){if(reverse.TryGetValue(key,out var rr))include.UnionWith(rr);if(direct.TryGetValue(key,out var dd))include.UnionWith(dd);foreach(var i in map[key].Body.Instructions)if(i.Operand is IField f&&fieldUses.TryGetValue(f.FullName,out var ff))include.UnionWith(ff);}
           var report=new {relative=rel,sha256=oldHash,methodCount=methods.Length,groups=targets.Count,methods=include.OrderBy(x=>x).Select(k=>new {method=k,hasCjk=targets.Contains(k),callers=reverse.TryGetValue(k,out var rr)?rr.OrderBy(x=>x).ToArray():Array.Empty<string>(),il=map[k].Body.Instructions.Select(i=>new {off=i.Offset,op=i.OpCode.Name,arg=Oper(i.Operand)}).ToArray()}).ToArray()};
           File.WriteAllText(Path.Combine(dest,"IL_"+Convert.ToHexString(SHA256.HashData(Encoding.UTF8.GetBytes(rel))).Substring(0,16)+".json"),JsonSerializer.Serialize(report));
           status.Add(new {relative=rel,status="read",methodCount=methods.Length,groups=targets.Count,sha256=oldHash});
           if(selected.Length==0)continue;
           var planned=new Dictionary<(string,uint),string>();
           foreach(var s in selected){
           var m=methods.Single(x=>x.DeclaringType.FullName==s.type&&x.Name.ToString()==s.method);
           foreach(var off in s.offsets){var idx=m.Body.Instructions.ToList().FindIndex(i=>i.Offset==(uint)off&&i.OpCode==OpCodes.Ldstr&&Equals(i.Operand,s.from));
           if(idx<0)throw new Exception("anchor not found "+rel+" "+s.method+" "+off);
           int limit=s.sink=="ModConfig::Define"?70:2;
           var sink=m.Body.Instructions.Skip(idx+1).Take(limit).FirstOrDefault(i=>i.Operand is IMethod call&&call.FullName.Contains(s.sink));if(sink==null)throw new Exception("sink missing "+rel+" "+s.method+" "+off);
           planned.Add((m.FullName,(uint)off),s.to);
           verified.Add(new {relative=rel,method=m.FullName,offset=off,old=s.from,newText=s.to,sink=sink.Operand.ToString()});}}
           foreach(var m in methods)foreach(var i in m.Body.Instructions)if(planned.TryGetValue((m.FullName,i.Offset),out var translated))i.Operand=translated;
           var temp=file+".new";md.Write(temp);
           using var old=ModuleDefMD.Load(file);using var check=ModuleDefMD.Load(temp);
           var oldTypes=old.GetTypes().ToDictionary(t=>t.FullName);var newTypes=check.GetTypes().ToDictionary(t=>t.FullName);
           if(!oldTypes.Keys.ToHashSet().SetEquals(newTypes.Keys))throw new Exception("changed type collection");
           var om=oldTypes.Values.SelectMany(t=>t.Methods).ToDictionary(m=>m.FullName);var nm=newTypes.Values.SelectMany(t=>t.Methods).ToDictionary(m=>m.FullName);
           if(!om.Keys.ToHashSet().SetEquals(nm.Keys))throw new Exception("changed method collection");
           int diffs=0;foreach(var pair in om){var m=pair.Value;var n=nm[pair.Key];if(m.HasBody!=n.HasBody)throw new Exception("body mismatch");if(!m.HasBody)continue;
           if(m.Body.Instructions.Count!=n.Body.Instructions.Count||m.Body.Variables.Count!=n.Body.Variables.Count||m.Body.ExceptionHandlers.Count!=n.Body.ExceptionHandlers.Count)throw new Exception("body shape changed "+pair.Key);
           for(int k=0;k<m.Body.Instructions.Count;k++){var x=m.Body.Instructions[k];var y=n.Body.Instructions[k];if(x.OpCode!=y.OpCode||x.Offset!=y.Offset)throw new Exception("opcode/offset changed "+pair.Key);var expected=planned.TryGetValue((pair.Key,x.Offset),out var v)?v:Oper(x.Operand);if(expected!=Oper(y.Operand))throw new Exception("unexpected operand change "+pair.Key+" "+x.Offset);if(planned.ContainsKey((pair.Key,x.Offset)))diffs++;}}
           if(diffs!=planned.Count)throw new Exception("patched count mismatch");
           var or=old.Resources.OfType<EmbeddedResource>().ToDictionary(x=>x.Name.ToString(),x=>x.CreateReader().ToArray());var nr=check.Resources.OfType<EmbeddedResource>().ToDictionary(x=>x.Name.ToString(),x=>x.CreateReader().ToArray());if(!or.Keys.ToHashSet().SetEquals(nr.Keys)||or.Any(x=>!x.Value.SequenceEqual(nr[x.Key])))throw new Exception("resource changed");
           File.Move(temp,file,true);results.Add(new {relative=rel,oldHash,newHash=Hash(file),patched=diffs});
           }catch(Exception e){status.Add(new {relative=rel,status="error",error=e.Message});if(selected.Length>0)throw;}}
           if(results.Count!=specs.Select(x=>x.folder+"/"+x.file).Distinct().Count())throw new Exception("patch target missing");
           File.WriteAllText(Path.Combine(dest,"patch_result.json"),JsonSerializer.Serialize(new {dlls=results,sites=verified,scan=status},new JsonSerializerOptions{WriteIndented=true}));
           }
          }
          
