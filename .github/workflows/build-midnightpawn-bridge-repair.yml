name: Build MidnightPawn Korean bridge repair

on:
  push:
    paths:
      - "probably-stolen/tools/tentacle-bridge-binary/**"
      - ".github/workflows/build-midnightpawn-bridge-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Patch deployed v0.7.5.12 binary without dropping existing features
        run: |
          dotnet run --project probably-stolen/tools/tentacle-bridge-binary/TentacleBridgeBinaryPatcher.csproj -c Release -- \
            probably-stolen/current-v07512/ProbablyStolenKoreanPack.dll \
            probably-stolen/build/out/ProbablyStolenKoreanPack.TentacleRepair.dll
      - name: Upload repaired KoreanPack DLL
        uses: actions/upload-artifact@v4
        with:
          name: ProbablyStolenKoreanPack-TentacleRepair
          path: probably-stolen/build/out/ProbablyStolenKoreanPack.TentacleRepair.dll
          if-no-files-found: error
      - name: Commit repaired DLL as separate artifact
        run: |
          git add probably-stolen/build/out/ProbablyStolenKoreanPack.TentacleRepair.dll
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build isolated KoreanPack tentacle repair DLL"
          git pull --rebase origin main
          git push origin HEAD:main
