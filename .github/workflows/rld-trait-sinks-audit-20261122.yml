name: Inspect RLD trait text sinks exactly
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rld-trait-sinks-audit-20261122.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rld-traits-direct-localkey-20261122
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            rld-direct-key
            rld-ui-fix
      - name: Pull exact patched DLL
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='rld-direct-key/RedLightDistrict.dll' --exclude=''
          echo '77241d011e46a4bb6fcbb3a06edfae70c30aea33f26c5a698adcb4dc1e51cdde  rld-direct-key/RedLightDistrict.dll' | sha256sum -c
      - name: Emit IL for direct trait string display paths
        run: |
          set -euo pipefail
          dotnet new console -f net8.0 -o /tmp/rldtrait-audit --force
          dotnet add /tmp/rldtrait-audit/rldtrait-audit.csproj package dnlib --version 4.5.0
          cat >/tmp/rldtrait-audit/Program.cs <<'CS'
          using System;using System.IO;using System.Linq;using System.Collections.Generic;using System.Text.Json;using System.Text.RegularExpressions;using dnlib.DotNet;using dnlib.DotNet.Emit;
          class P {
            static string Op(Instruction i)=>i.Operand switch{null=>"",string s=>s,Instruction t=>"@"+t.Offset.ToString("X"),IList<Instruction> a=>string.Join(",",a.Select(x=>"@"+x.Offset.ToString("X"))),_=>i.Operand.ToString()??""};
            static object Dump(MethodDef m)=>new {method=m.FullName,token=m.MDToken.Raw,il=m.Body.Instructions.Select((x,i)=>new {i,opcode=x.OpCode.Name,operand=Op(x)}).ToArray()};
            static void Main(string[] args) {
              using var mod=ModuleDefMD.Load(args[0]);var methods=mod.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToArray();
              var focus=methods.Where(m=>(m.DeclaringType.FullName=="RedLightDistrict.TalentSystem"&&Regex.IsMatch(m.Name.String,"BuildDescription|TalentLabel|CreateTalentItem|Update|Status|Tooltip|Trait|Name"))||
                  (m.DeclaringType.FullName=="RedLightDistrict.TalentPanel"&&Regex.IsMatch(m.Name.String,"ShowPanel|BuildTalentTooltipBuilder"))||
                  m.DeclaringType.FullName=="RedLightDistrict.Korean.UiLateLookup").Select(Dump).ToArray();
              var references=methods.Where(m=>m.Body.Instructions.Any(x=>x.Operand is IMethod z&&(
                z.FullName.Contains("TalentSystem::BuildDescription")||z.FullName.Contains("TalentPanel::BuildTalentTooltipBuilder")||z.FullName.Contains("UiLateLookup::TraitName")))).Select(m=>new{method=m.FullName,refs=m.Body.Instructions.Select((x,i)=>(x,i)).Where(z=>z.x.Operand is IMethod t&&(t.FullName.Contains("BuildDescription")||t.FullName.Contains("BuildTalentTooltipBuilder")||t.FullName.Contains("UiLateLookup::TraitName"))).Select(z=>new{i=z.i,callee=Op(z.x)}).ToArray()}).ToArray();
              var opt=new JsonSerializerOptions{WriteIndented=true,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping};
              Directory.CreateDirectory("rld-trait-audit");
              File.WriteAllText("rld-trait-audit/methods.json",JsonSerializer.Serialize(focus,opt));
              File.WriteAllText("rld-trait-audit/references.json",JsonSerializer.Serialize(references,opt));
              Console.WriteLine(JsonSerializer.Serialize(new{focus=focus.Length,refs=references.Length,methods=focus.Select(x=>x.GetType().GetProperty("method")!.GetValue(x)).ToArray()}));
            }
          }
          CS
          dotnet run -c Release --project /tmp/rldtrait-audit -- rld-direct-key/RedLightDistrict.dll
      - name: Publish IL trace to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse rld-trait-audit
          git commit -m 'Trace actual trait string output methods'
          git push origin HEAD:refs/heads/rld-traits-direct-localkey-20261122
