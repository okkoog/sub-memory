name: Tentacle Eleanor isolated Korean locale DLL
on:
  push:
    paths: [.github/workflows/temp-tentacle-eleanor-ko-locale-final-20261121.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/落魄千金-埃莉诺 v1.0.3
            probably-stolen/local-mods/TentacleMod번역/落魄千金-埃莉诺 v1.0.3
            probably-stolen/local-mods/TentacleMod번역/번역대조표
          sparse-checkout-cone-mode: false
      - name: Assemble verified Korean from 13 manually translated TSV batches
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,re,hashlib
          d=Path('probably-stolen/local-mods/TentacleMod번역/번역대조표')
          en=(d/'Eleanor_v1.0.3_original_en_embedded_20261121.csv').read_bytes()
          assert hashlib.sha256(en).hexdigest()=='6e2e935145dd255e7057ec8966b2cd9f610e475acc236ba94118be23dafb9125'
          files=sorted(d.glob('Eleanor_v1.0.3_KO_reviewed_batch*_20261121.tsv'))
          assert len(files)==13
          assert [int(f.stem.split('batch')[-1].split('_')[0]) for f in files]==list(range(1,14))
          translated={}
          for file in files:
              with file.open(encoding='utf-8',newline='') as f:
                  rd=csv.DictReader(f,delimiter='\t')
                  for row in rd:
                      key,value=row['key'],row['korean_value']
                      assert key not in translated and value and not any(x in value for x in '\r\n\t')
                      translated[key]=value
          assert len(translated)==1553
          original=en.decode('utf-8').splitlines(keepends=True)
          assert len(original)==1839
          result=[];active=0;place=0;used=set()
          for line in original:
              source=line.rstrip('\r\n'); ending=line[len(source):]
              k,sep,v=source.partition(',')
              assert sep
              if v=='[empty placeholder]':
                  assert k not in translated
                  place+=1;result.append(line)
              else:
                  assert k in translated,k
                  new=translated[k]
                  assert new!=v,k
                  assert sorted(re.findall(r'\{[^{}]+\}',v))==sorted(re.findall(r'\{[^{}]+\}',new)),k
                  assert v.count(r'\n')==new.count(r'\n'),k
                  result.append(k+','+new+ending);active+=1;used.add(k)
          assert (active,place)==(1553,286) and used==set(translated)
          Path('/tmp/Eleanor_complete_ko.csv').write_bytes(''.join(result).encode('utf-8'))
          print('KO translated',active,'inactive source placeholders untouched',place)
          PY
      - name: Build original DLL with separate ko and ko-KR dictionary registrations
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/eleanor_ko_only --force
          dotnet add /tmp/eleanor_ko_only/eleanor_ko_only.csproj package dnlib --version 4.5.0
          cat > /tmp/eleanor_ko_only/Program.cs <<'CS'
          using System;
          using System.Linq;
          using System.Collections.Generic;
          using System.IO;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class Program {
              static void Main(string[] args) {
                  using var mod=ModuleDefMD.Load(args[0]);
                  var en=mod.Resources.OfType<EmbeddedResource>().Single(r=>r.Name.ToString()=="EleanorEmbedded/Localization/en.csv");
                  if(mod.Resources.Any(r=>r.Name.ToString()=="EleanorEmbedded/Localization/ko.csv"))throw new Exception("ko resource already exists");
                  byte[] korean=File.ReadAllBytes(args[1]);
                  mod.Resources.Add(new EmbeddedResource("EleanorEmbedded/Localization/ko.csv",korean,en.Attributes));
                  var typ=mod.GetTypes().Single(t=>t.FullName=="ProbablyEleanorFollowup.EmbeddedAssets");
                  var m=typ.Methods.Single(m=>m.Name.ToString()=="InstallLocalization");
                  var il=m.Body.Instructions;
                  int at=il.ToList().FindIndex(i=>i.OpCode==OpCodes.Ldstr && Equals(i.Operand,"Localization/zh.csv"));
                  if(at<0)throw new Exception("Localization registration anchor not found");
                  var fld=(IField)il.First(i=>i.OpCode==OpCodes.Ldfld && i.Operand is IField f && f.Name.ToString()=="Localization").Operand;
                  var read=(IMethod)il.First(i=>i.OpCode==OpCodes.Call && i.Operand is IMethod mm && mm.Name.ToString()=="ReadText").Operand;
                  var parse=(IMethod)il.First(i=>i.OpCode==OpCodes.Call && i.Operand is IMethod mm && mm.Name.ToString()=="ParseCsv").Operand;
                  var assign=(IMethod)il.First(i=>i.OpCode==OpCodes.Callvirt && i.Operand is IMethod mm && mm.Name.ToString()=="set_Item").Operand;
                  foreach(var language in new[]{"ko","ko-KR"}) {
                      var insert=new[]{
                        Instruction.Create(OpCodes.Ldarg_0),Instruction.Create(OpCodes.Ldfld,fld),
                        Instruction.Create(OpCodes.Ldstr,language),Instruction.Create(OpCodes.Ldstr,"Localization/ko.csv"),
                        Instruction.Create(OpCodes.Call,read),Instruction.Create(OpCodes.Call,parse),
                        Instruction.Create(OpCodes.Callvirt,assign)};
                      foreach(var instruction in insert)il.Insert(at++,instruction);
                  }
                  Directory.CreateDirectory(Path.GetDirectoryName(args[2])!);
                  mod.Write(args[2]);
                  using var v=ModuleDefMD.Load(args[2]);
                  var vm=v.GetTypes().Single(t=>t.FullName=="ProbablyEleanorFollowup.EmbeddedAssets").Methods.Single(m=>m.Name.ToString()=="InstallLocalization");
                  int ct(string key)=>vm.Body.Instructions.Count(i=>i.OpCode==OpCodes.Ldstr && Equals(i.Operand,key));
                  if(ct("Localization/ko.csv")!=2||ct("Localization/en.csv")!=1||ct("Localization/zh.csv")!=1)
                      throw new Exception("Unexpected IL localization literal count");
                  if(!v.Resources.OfType<EmbeddedResource>().Single(r=>r.Name.ToString()=="EleanorEmbedded/Localization/ko.csv").GetResourceData().SequenceEqual(korean))
                      throw new Exception("KO resource did not roundtrip");
                  Console.WriteLine("Original en/zh code and resources preserved; injected ko and ko-KR registration.");
              }
          }
          CS
          dotnet run --project /tmp/eleanor_ko_only/eleanor_ko_only.csproj -- \
            'probably-stolen/local-mods/TentacleMod/落魄千金-埃莉诺 v1.0.3/fallen_heiress_eleanor.dll' \
            /tmp/Eleanor_complete_ko.csv \
            'probably-stolen/local-mods/TentacleMod번역/落魄千金-埃莉诺 v1.0.3/fallen_heiress_eleanor.dll'
      - name: Independently verify embedded resources and package ZIP
        shell: bash
        run: |
          python3 -m pip install --quiet dnfile
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import dnfile,hashlib,re
          base=Path('probably-stolen/local-mods')
          src=base/'TentacleMod/落魄千金-埃莉诺 v1.0.3/fallen_heiress_eleanor.dll'
          root=base/'TentacleMod번역'
          dst=root/'落魄千金-埃莉诺 v1.0.3/fallen_heiress_eleanor.dll'
          audit=root/'번역대조표/Eleanor_v1.0.3_KO_ONLY_1553_STATIC_AUDIT_20261121.md'
          old=dnfile.dnPE(str(src));new=dnfile.dnPE(str(dst))
          before={str(x.name):x.data for x in old.net.resources}
          after={str(x.name):x.data for x in new.net.resources}
          key='EleanorEmbedded/Localization/ko.csv'
          assert set(after)-set(before)=={key}
          assert all(after[k]==v for k,v in before.items())
          assert after[key]==Path('/tmp/Eleanor_complete_ko.csv').read_bytes()
          assert old.net.mdtables.MethodDef.num_rows==new.net.mdtables.MethodDef.num_rows
          assert old.net.mdtables.TypeDef.num_rows==new.net.mdtables.TypeDef.num_rows
          en=before['EleanorEmbedded/Localization/en.csv'].decode('utf-8').splitlines()
          ko=after[key].decode('utf-8').splitlines()
          assert len(en)==len(ko)==1839
          translated=0;inactive=0
          for x,y in zip(en,ko):
              k,v=x.split(',',1); kk,vv=y.split(',',1)
              assert kk==k
              if v=='[empty placeholder]':
                  assert v==vv;inactive+=1
              else:
                  assert vv!=v
                  assert sorted(re.findall(r'\{[^{}]+\}',v))==sorted(re.findall(r'\{[^{}]+\}',vv))
                  translated+=1
          assert (translated,inactive)==(1553,286)
          sha0=hashlib.sha256(src.read_bytes()).hexdigest()
          sha1=hashlib.sha256(dst.read_bytes()).hexdigest()
          audit.write_text(
              '# Eleanor v1.0.3 — isolated Korean locale DLL static audit\n\n'
              +f'- Original SHA256: {sha0}\n- Patched SHA256: {sha1}\n'
              +f'- Original bytes: {src.stat().st_size}; Korean DLL bytes: {dst.stat().st_size}\n'
              +'- All original managed resources are byte-identical, including original Chinese and English CSV\n'
              +'- One added Korean CLR resource: EleanorEmbedded/Localization/ko.csv\n'
              +'- Original 1839 CSV keys and order preserved; 1553 manually translated values; 286 intentionally inactive development placeholders unmodified\n'
              +'- Original CLR MethodDef/TypeDef counts retained\n'
              +'- InstallLocalization method: 14 IL instructions inserted to load new KO resource and register both ko and ko-KR; original en and zh references retained\n'
              +'- ZIP CRC32 verified. No source DLL was changed.\n'
              +'- Actual Unity/CLR runtime, save files, and inter-mod compatibility remain untested.\n',encoding='utf-8')
          z=root/'ProbablyStolen_Eleanor_v1.0.3_DLL_KO_Isolated_1553_20261121.zip'
          with ZipFile(z,'w',ZIP_DEFLATED,compresslevel=6) as f:
              for fname in ['fallen_heiress_eleanor.dll','manifest.xml','README_ko.txt']:
                  f.write(root/'落魄千金-埃莉诺 v1.0.3'/fname,arcname='落魄千金-埃莉诺 v1.0.3/'+fname)
              f.write(audit,arcname='STATIC_AUDIT.md')
              for i in range(1,14):
                  f.write(root/f'번역대조표/Eleanor_v1.0.3_KO_reviewed_batch{i:02d}_20261121.tsv',arcname=f'reviewed/batch{i:02d}.tsv')
          with ZipFile(z) as f:
              assert f.testzip() is None and len(f.namelist())==17
          print(audit.read_text());print('ZIP',z.stat().st_size)
          PY
      - name: Commit Korean-only DLL, audited ZIP, and static report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse \
             'probably-stolen/local-mods/TentacleMod번역/落魄千金-埃莉诺 v1.0.3/fallen_heiress_eleanor.dll' \
             'probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_Eleanor_v1.0.3_DLL_KO_Isolated_1553_20261121.zip' \
             'probably-stolen/local-mods/TentacleMod번역/번역대조표/Eleanor_v1.0.3_KO_ONLY_1553_STATIC_AUDIT_20261121.md'
          git diff --cached --quiet || (git commit -m 'build(tentacle): separate ko resource for Eleanor 1553 localized values' && git pull --rebase origin main && git push)
