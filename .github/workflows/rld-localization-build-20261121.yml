name: Red Light District external ko localization work
on:
  push:
    paths:
      - 'probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/translation-work/*.py'
      - 'probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/translation-work/manual_direct_batch*.tsv'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge-localization:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1/Localization
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1
            probably-stolen/local-mods/TentacleMod번역/번역대조표
          sparse-checkout-cone-mode: false
      - name: Obtain verified LFS-backed DLL for the guarded merge
        shell: bash
        run: |
          git lfs pull --include='probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll' --exclude=''
      - name: Merge and validate Korean localization CSV (no ZIP, no DLL changes)
        shell: bash
        run: |
          python3 'probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/translation-work/merge_localization.py'
      - name: Commit localization CSV and review audits (no ZIP)
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse \
            'probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/Localization/ko.csv' \
            'probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/LOCALIZATION_PROGRESS.md' \
            'probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/KEY_COVERAGE_AUDIT_20261122.tsv' \
            'probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/UNTRANSLATED_REVIEW_QUEUE_20261122.tsv'
          git diff --cached --quiet || (git commit -m 'translate(rld): merge reviewed localization keys and verified localization CSV' && git pull --rebase origin main && git push)
