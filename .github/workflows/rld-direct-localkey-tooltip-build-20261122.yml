name: RLD direct localization at existing item tooltip method
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rld-direct-localkey-tooltip-build-20261122.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rld-direct-localkey-tooltip-20261122
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            rld-direct-key
            rld-ui-fix
            probably-stolen/Managed/Assembly-CSharp.dll
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/Localization/ko.csv
      - name: Fetch exact six-method UI localization DLL and game signatures
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          git lfs pull --include='rld-ui-fix/RedLightDistrict.dll,probably-stolen/Managed/Assembly-CSharp.dll' --exclude=''
          echo '86ad3f461f263dd04199edf8dad7e8c3f2e017b0c8a013462eef8034733bda47  rld-ui-fix/RedLightDistrict.dll' | sha256sum -c
      - name: Inject 19 direct CsvLookup wrapper calls into existing tooltip prefix, re-open and diff DLL
        shell: bash
        run: |
          set -euo pipefail
          dotnet new console -f net8.0 -o /tmp/rld-direct --force
          dotnet add /tmp/rld-direct/rld-direct.csproj package dnlib --version 4.5.0
          cp rld-direct-key/PatchExistingTooltip.cs /tmp/rld-direct/Program.cs
          dotnet build /tmp/rld-direct/rld-direct.csproj -c Release
          mkdir -p rld-direct-key/verified
          dotnet /tmp/rld-direct/bin/Release/net8.0/rld-direct.dll \
             rld-ui-fix/RedLightDistrict.dll \
             rld-ui-fix/plan.json \
             probably-stolen/Managed/Assembly-CSharp.dll \
             rld-direct-key/RedLightDistrict.dll \
             rld-direct-key/verified/report.json
      - name: Verify exact 19 CSV translations; package DLL only to preserve local CSV edits
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,csv,zipfile,hashlib
          p=pathlib.Path('rld-direct-key')
          data=(p/'RedLightDistrict.dll').read_bytes()
          report=json.loads((p/'verified/report.json').read_text())
          assert len(data)>100000000 and data[:2]==b'MZ'
          assert hashlib.sha256(data).hexdigest()==report['newDllSha256']
          assert report['existingMethodsModified']==1 and report['methodsAdded']==0 and report['newHarmonyHooks']==0
          rows=json.loads(pathlib.Path('rld-ui-fix/plan.json').read_text())
          with pathlib.Path('probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/Localization/ko.csv').open(encoding='utf-8-sig',newline='') as f: ko=dict(csv.reader(f))
          for row in rows['equipment']+rows['accessory']:
             assert row['key'] in ko and ko[row['key']].strip() and ko[row['key']]!=row['source']
          pkg=p/'verified/RedLightDistrict_DirectLocalKey_DLL_Only.zip'
          with zipfile.ZipFile(pkg,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=4) as z:z.writestr('RedLightDistrict.dll',data)
          with zipfile.ZipFile(pkg) as z:
             assert z.testzip() is None
             assert z.namelist()==['RedLightDistrict.dll']
             assert hashlib.sha256(z.read('RedLightDistrict.dll')).hexdigest()==report['newDllSha256']
          print('FILE VERIFIED',len(data),report['newDllSha256'])
          print('ZIP VERIFIED',pkg.stat().st_size,hashlib.sha256(pkg.read_bytes()).hexdigest())
          PY
      - name: Publish verified DLL with Git LFS on isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git lfs track 'rld-direct-key/RedLightDistrict.dll'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse .gitattributes rld-direct-key/RedLightDistrict.dll rld-direct-key/verified/report.json
          pointer=$(git show :rld-direct-key/RedLightDistrict.dll)
          grep -Fxq 'version https://git-lfs.github.com/spec/v1' <<< "$pointer"
          grep -Fxq "oid sha256:$(sha256sum rld-direct-key/RedLightDistrict.dll|cut -d' ' -f1)" <<< "$pointer"
          git commit -m 'Resolve cached RLD Chinese item names through existing exact CSV keys in tooltip prefix'
          git push origin HEAD:refs/heads/rld-direct-localkey-tooltip-20261122
      - uses: actions/upload-artifact@v4
        with:
          name: RLD-DirectLocalKey-DLL-Only
          path: rld-direct-key/verified/RedLightDistrict_DirectLocalKey_DLL_Only.zip
          if-no-files-found: error
          retention-days: 7
