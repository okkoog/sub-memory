name: Tentacle Config 0.7.2-pre docs and ItemPortrait exact folder name final packs
on:
  push:
    paths: [.github/workflows/temp-tentacle-config-docs-finalpack-20261121.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/lewd_meme_config0.7.2-pre/manifest.xml
            probably-stolen/local-mods/TentacleMod/ItemPortraitHD_v1.3.0/manifest.xml
            probably-stolen/local-mods/TentacleMod번역/lewd_meme_config0.7.2-pre
            probably-stolen/local-mods/TentacleMod번역/ItemPortraitHD_v1.3.0
            probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_ItemPortraitHD_v1.3.0_DLL_Docs_KO_20261121.zip
          sparse-checkout-cone-mode: false
      - name: Verify manifest invariants and localization of both manuals
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,xml.etree.ElementTree as ET
          root=Path('probably-stolen/local-mods')
          dst=root/'TentacleMod번역'
          def normalize(s):
              return re.sub(r'<Description>[\s\S]*?</Description>','<Description/>',
                     re.sub(r'<Name>[^<]*</Name>','<Name/>',s))
          for folder,mid,version in [
              ('lewd_meme_config0.7.2-pre','lewd_meme_config','0.7.2-pre'),
              ('ItemPortraitHD_v1.3.0','item_portrait_hd','1.3.0')]:
              src=(root/'TentacleMod'/folder/'manifest.xml').read_text(encoding='utf-8')
              ko=(dst/folder/'manifest.xml').read_text(encoding='utf-8')
              assert normalize(src)==normalize(ko),folder
              a,b=ET.fromstring(src),ET.fromstring(ko)
              assert a.findtext('ID')==b.findtext('ID')==mid
              assert a.findtext('ModVersion')==b.findtext('ModVersion')==version
              for tag in ['GameVersions','Prerequisites','Assemblies','Capabilities']:
                  assert ET.tostring(a.find(tag))==ET.tostring(b.find(tag)),(folder,tag)
          config=(dst/'lewd_meme_config0.7.2-pre/README.md').read_text(encoding='utf-8')
          assert all(q in config for q in ['93개','269개','75개','1.2.18','1.3.0','ModReflect','dotnet build'])
          portrait=(dst/'ItemPortraitHD_v1.3.0/Docs/立绘使用说明.md').read_text(encoding='utf-8')
          folder=(dst/'ItemPortraitHD_v1.3.0/Portraits/使用说明.txt').read_text(encoding='utf-8')
          for s in [portrait,folder]:
              assert all(q in s for q in ['上层区','下层区','治安部','黑市','革命军','不限阵营'])
          assert (dst/'lewd_meme_config0.7.2-pre/LewdMemeConfig.dll').stat().st_size>50000
          print('Manifest game IDs/versions preserved, docs and original Chinese lookup folder names validated.')
          PY
      - name: Build Config full UI/docs overlay and repack ItemPortrait revised PNG folder names
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import hashlib
          root=Path('probably-stolen/local-mods/TentacleMod번역')
          config='lewd_meme_config0.7.2-pre'
          output=root/'ProbablyStolen_LewdMemeConfig_v0.7.2-pre_DLL_README_KO_20261121.zip'
          files=['LewdMemeConfig.dll','manifest.xml','README.md']
          with ZipFile(output,'w',ZIP_DEFLATED,compresslevel=6) as f:
              for n in files:f.write(root/config/n,arcname=config+'/'+n)
          with ZipFile(output) as check:
              assert check.testzip() is None and len(check.namelist())==len(files)
              assert all(check.read(config+'/'+n)==(root/config/n).read_bytes() for n in files)
          print(output.name, output.stat().st_size,hashlib.sha256(output.read_bytes()).hexdigest())
          existing=root/'ProbablyStolen_ItemPortraitHD_v1.3.0_DLL_Docs_KO_20261121.zip'
          folder='ItemPortraitHD_v1.3.0'
          items=[]
          with ZipFile(existing) as z:
              assert z.testzip() is None
              for n in z.namelist():
                  changed=n in [folder+'/Docs/立绘使用说明.md',folder+'/Portraits/使用说明.txt']
                  data=(root/n).read_bytes() if changed else z.read(n)
                  items.append((n,data))
          assert sum(n.endswith('立绘使用说明.md') or n.endswith('Portraits/使用说明.txt') for n,d in items)==2
          temp=existing.with_suffix('.new')
          with ZipFile(temp,'w',ZIP_DEFLATED,compresslevel=6) as z:
              for n,d in items:z.writestr(n,d)
          with ZipFile(temp) as z:
              assert z.testzip() is None and len(z.namelist())==len(items)
              for n,d in items:assert z.read(n)==d
          temp.replace(existing)
          print(existing.name, existing.stat().st_size,hashlib.sha256(existing.read_bytes()).hexdigest())
          PY
      - name: Commit both verified patch ZIPs
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse \
            'probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_LewdMemeConfig_v0.7.2-pre_DLL_README_KO_20261121.zip' \
            'probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_ItemPortraitHD_v1.3.0_DLL_Docs_KO_20261121.zip'
          if ! git diff --cached --quiet; then
            git commit -m 'pack(tentacle): ship complete config manual and source-exact ItemPortrait PNG folders'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
