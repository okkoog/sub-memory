name: RLD inspect Harmony registration for item title patch
on:
  push:
    branches: [main]
    paths: ['.github/workflows/rld-title-registration-audit-20261122.yml']
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .gitattributes
            probably-stolen/local-mods/TentacleMod-Update/.gitattributes
            probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll
      - run: |
          git lfs pull --include='probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll' --exclude=''
          dotnet new console -f net8.0 -o /tmp/regaudit --force
          dotnet add /tmp/regaudit/regaudit.csproj package dnlib --version 4.5.0
          cat >/tmp/regaudit/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using System.Text.Json;
          using System.Text.RegularExpressions;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P{
            static string Op(Instruction i)=>i.Operand switch {null=>"",string x=>x,Instruction x=>"@"+x.Offset.ToString("X"),IList<Instruction> a=>string.Join(",",a.Select(v=>"@"+v.Offset.ToString("X"))),_=>i.Operand.ToString()??""};
            static object M(MethodDef m)=>new{name=m.FullName,body=m.Body.Instructions.Select((i,n)=>new{n,op=i.OpCode.Name,v=Op(i)})};
            static void Main(string[]a){
              using var mod=ModuleDefMD.Load(a[0]);var ms=mod.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToArray();
              var focus=ms.Where(m=>Regex.IsMatch(m.FullName,@"RedLightDistrict\.(RedLightDistrictMod|TalentPatches|TalentEquipment|TalentAccessory)::(OnEnable|OnDisable|Install|Apply|Initialize|Init|Patch|Register|Setup|Postfix|Prefix)")&&m.Body.Instructions.Count<3000).Select(M).ToArray();
              var registrations=ms.Where(m=>m.Body.Instructions.Any(i=>i.Operand is IMethod x && Regex.IsMatch(x.FullName,@"HarmonyLib\.(Harmony|HarmonyMethod)::(Patch|PatchAll|Unpatch|CreateAndPatchAll)") )).Select(M).ToArray();
              var attr=mod.GetTypes().Where(t=>t.CustomAttributes.Any(a=>a.TypeFullName.Contains("HarmonyPatch"))).Select(t=>new{type=t.FullName,attributes=t.CustomAttributes.Select(x=>x.TypeFullName),methods=t.Methods.Select(m=>m.FullName)}).ToArray();
              var opt=new JsonSerializerOptions{WriteIndented=true,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping};
              Directory.CreateDirectory("rld-register-audit");
              void Save(string n,object v)=>File.WriteAllText("rld-register-audit/"+n,JsonSerializer.Serialize(v,opt));
              Save("focus.json",focus);Save("registrations.json",registrations);Save("attributes.json",attr);
              Console.WriteLine(JsonSerializer.Serialize(new{focus=focus.Length,registrations=registrations.Length,attributes=attr.Length}));
            }
          }
          CS
          dotnet run -c Release --project /tmp/regaudit -- 'probably-stolen/local-mods/TentacleMod-Update/RedLightDistrict/RedLightDistrict.dll'
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse rld-register-audit
          git commit -m 'Inspect RLD Harmony patch registration'
          git push origin HEAD:refs/heads/rld-register-audit-20261122
