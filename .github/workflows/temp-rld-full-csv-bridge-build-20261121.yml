name: RLD v1.1.1 full 3619-key external ko CSV bridge DLL
on:
  push:
    paths: [.github/workflows/temp-rld-full-csv-bridge-build-20261121.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1
            probably-stolen/local-mods/TentacleMod/落魄千金-埃莉诺 v1.0.3/fallen_heiress_eleanor.dll
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1
            probably-stolen/local-mods/TentacleMod번역/번역대조표
          sparse-checkout-cone-mode: false
      - name: Build verified per-IL site map and 3512/107 CSV coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv,json,hashlib
          src=Path('probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1')
          tr=Path('probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1')
          assert hashlib.sha256((src/'RedLightDistrict.dll').read_bytes()).hexdigest()=='4f4f20a00e4754302c53879bfaeb7a7503df10e2f05ff6ad3744be31088159f8'
          with (src/'Localization/cn.csv').open(encoding='utf-8-sig',newline='') as f:
              sites=list(csv.DictReader(f))
          assert len(sites)==3619
          assert len({r['key'] for r in sites})==3619
          with (tr/'Localization/ko.csv').open(encoding='utf-8-sig',newline='') as f:
              trans=list(csv.reader(f))
          ko={r[0]:r[1] for r in trans}
          assert all(len(r)==2 and r[0] and r[1] for r in trans)
          assert len(ko)==len(trans)==3512
          assert set(ko)<={r['key'] for r in sites}
          protected={r['key'] for r in sites}-set(ko)
          assert len(protected)==107
          with (tr/'translation-work/internal_string_reference.tsv').open(encoding='utf-8',newline='') as f:
              internal=list(csv.DictReader(f,delimiter='\t'))
          assert protected=={r['key'] for r in internal}
          with Path('/tmp/rld-bridge-sites.jsonl').open('w',encoding='utf-8') as f:
              for r in sites:
                  f.write(json.dumps({'key':r['key'],'method':r['method'],'offset':int(r['IL_offset']),'text':r['original']},ensure_ascii=False)+'\n')
          print('Verified original 3619 callsites, 3512 translated CSV values, 107 protected.')
          PY
      - name: Rebuild from original RLD with runtime-loaded external Korean dictionary bridge
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/rld_full_bridge --force
          dotnet add /tmp/rld_full_bridge/rld_full_bridge.csproj package dnlib --version 4.5.0
          cat > /tmp/rld_full_bridge/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Text.Json;
          using System.Collections.Generic;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          record Site(string key,string method,int offset,string text);
          class Program {
            static void Main(string[] args) {
              using var mod=ModuleDefMD.Load(args[0]);
              using var source=ModuleDefMD.Load(args[1]);
              var sites=File.ReadLines(args[2]).Where(x=>!string.IsNullOrWhiteSpace(x))
                  .Select(x=>JsonSerializer.Deserialize<Site>(x)!).ToList();
              if(sites.Count!=3619 || sites.Select(x=>x.key).Distinct().Count()!=3619)throw new Exception("Bad original key catalog");
              var methods=mod.GetTypes().SelectMany(t=>t.Methods.Where(m=>m.HasBody))
                  .GroupBy(m=>m.FullName).ToDictionary(g=>g.Key,g=>g.ToArray());
              var verified=new List<(Site site,MethodDef method,Instruction instruction)>();
              foreach(var site in sites) {
                if(!methods.TryGetValue(site.method,out var target))throw new Exception("Unknown method: "+site.method);
                var matches=target.SelectMany(m=>m.Body.Instructions.Where(i=>i.Offset==site.offset &&
                    i.OpCode==OpCodes.Ldstr && Equals(i.Operand,site.text)).Select(i=>(method:m,ins:i))).ToArray();
                if(matches.Length!=1)throw new Exception("Wrong method+IL offset+literal: "+site.method+" @"+site.offset+" "+site.key);
                verified.Add((site,matches[0].method,matches[0].ins));
              }
              var bound=mod.GetTypes().Single(t=>t.FullName=="RedLightDistrict.RedLightDistrictMod")
                  .Methods.Single(m=>m.Name.ToString()=="OnModAssetsLoaded");
              if(!bound.HasBody || bound.MethodSig.Params.Count!=1)throw new Exception("OnModAssetsLoaded signature changed");
              var ownerType=(ITypeDefOrRef)((IField)bound.Body.Instructions.First(i=>i.OpCode==OpCodes.Ldfld &&
                  i.Operand is IField f && f.Name.ToString()=="Manifest").Operand).DeclaringType;
              var langMethod=source.GetTypes().Single(t=>t.FullName=="ProbablyEleanorFollowup.EmbeddedAssets")
                  .Methods.Single(m=>m.Name.ToString()=="InstallLocalization");
              var langField=(IField)langMethod.Body.Instructions.First(i=>i.OpCode==OpCodes.Ldfld &&
                  i.Operand is IField f && f.Name.ToString()=="Localization").Operand;
              var importer=new Importer(mod);
              var dictField=importer.Import(langField);
              if(dictField.DeclaringType.FullName!=ownerType.FullName || ownerType.FullName!="LoadedMod")
                  throw new Exception("Expected LoadedMod.Localization field");
              var helper=new TypeDefUser("RedLightDistrict.Korean","CsvLookup",mod.CorLibTypes.Object.TypeDefOrRef) {
                  Attributes=TypeAttributes.NotPublic|TypeAttributes.Abstract|TypeAttributes.Sealed|TypeAttributes.BeforeFieldInit
              };
              mod.Types.Add(helper);
              var owner=new FieldDefUser("owner",new FieldSig(new ClassSig(ownerType)),FieldAttributes.Private|FieldAttributes.Static);
              helper.Fields.Add(owner);
              var read=new MethodDefUser("Read",MethodSig.CreateStatic(mod.CorLibTypes.String,mod.CorLibTypes.String,mod.CorLibTypes.String)) {
                  Attributes=MethodAttributes.Assembly|MethodAttributes.Static|MethodAttributes.HideBySig,
                  ImplAttributes=MethodImplAttributes.IL|MethodImplAttributes.Managed
              };
              helper.Methods.Add(read);
              read.Body=new CilBody { InitLocals=true,MaxStack=3 };
              var interfaceType=new TypeRefUser(mod,"System.Collections","IDictionary",mod.CorLibTypes.AssemblyRef);
              var getItem=new MemberRefUser(mod,"get_Item",MethodSig.CreateInstance(mod.CorLibTypes.Object,mod.CorLibTypes.Object),interfaceType);
              var nullCheck=new MemberRefUser(mod,"IsNullOrEmpty",MethodSig.CreateStatic(mod.CorLibTypes.Boolean,mod.CorLibTypes.String),mod.CorLibTypes.String.TypeDefOrRef);
              var allDict=new Local(new ClassSig(interfaceType));
              var koreanDict=new Local(new ClassSig(interfaceType));
              var translated=new Local(mod.CorLibTypes.String);
              read.Body.Variables.Add(allDict);
              read.Body.Variables.Add(koreanDict);
              read.Body.Variables.Add(translated);
              var fallback=Instruction.Create(OpCodes.Ldarg_1);
              var il=read.Body.Instructions;
              il.Add(Instruction.Create(OpCodes.Ldsfld,owner));
              il.Add(Instruction.Create(OpCodes.Brfalse,fallback));
              il.Add(Instruction.Create(OpCodes.Ldsfld,owner));
              il.Add(Instruction.Create(OpCodes.Ldfld,dictField));
              il.Add(Instruction.Create(OpCodes.Isinst,interfaceType));
              il.Add(Instruction.Create(OpCodes.Stloc,allDict));
              il.Add(Instruction.Create(OpCodes.Ldloc,allDict));
              il.Add(Instruction.Create(OpCodes.Brfalse,fallback));
              il.Add(Instruction.Create(OpCodes.Ldloc,allDict));
              il.Add(Instruction.Create(OpCodes.Ldstr,"ko"));
              il.Add(Instruction.Create(OpCodes.Callvirt,getItem));
              il.Add(Instruction.Create(OpCodes.Isinst,interfaceType));
              il.Add(Instruction.Create(OpCodes.Stloc,koreanDict));
              il.Add(Instruction.Create(OpCodes.Ldloc,koreanDict));
              il.Add(Instruction.Create(OpCodes.Brfalse,fallback));
              il.Add(Instruction.Create(OpCodes.Ldloc,koreanDict));
              il.Add(Instruction.Create(OpCodes.Ldarg_0));
              il.Add(Instruction.Create(OpCodes.Callvirt,getItem));
              il.Add(Instruction.Create(OpCodes.Isinst,mod.CorLibTypes.String.TypeDefOrRef));
              il.Add(Instruction.Create(OpCodes.Stloc,translated));
              il.Add(Instruction.Create(OpCodes.Ldloc,translated));
              il.Add(Instruction.Create(OpCodes.Call,nullCheck));
              il.Add(Instruction.Create(OpCodes.Brtrue,fallback));
              il.Add(Instruction.Create(OpCodes.Ldloc,translated));
              il.Add(Instruction.Create(OpCodes.Ret));
              il.Add(fallback);
              il.Add(Instruction.Create(OpCodes.Ret));
              // Use loaded-mod instance captured by the mod's existing lifecycle callback.
              // No file access, reflection, native calls, or assembly-wide global replacements.
              bound.Body.Instructions.Insert(0,Instruction.Create(bound.IsStatic?OpCodes.Ldarg_0:OpCodes.Ldarg_1));
              bound.Body.Instructions.Insert(1,Instruction.Create(OpCodes.Stsfld,owner));
              int patched=0;
              // Original instruction objects were audited before modification.
              foreach(var entry in verified) {
                  var instructions=entry.method.Body.Instructions;
                  int index=instructions.IndexOf(entry.instruction);
                  if(index<0 || entry.instruction.OpCode!=OpCodes.Ldstr || !Equals(entry.instruction.Operand,entry.site.text))
                      throw new Exception("Callsite mutated during patch: "+entry.site.key);
                  entry.instruction.Operand=entry.site.key;
                  instructions.Insert(index+1,Instruction.Create(OpCodes.Ldstr,entry.site.text));
                  instructions.Insert(index+2,Instruction.Create(OpCodes.Call,read));
                  patched++;
              }
              if(patched!=3619)throw new Exception("Only patched "+patched);
              Directory.CreateDirectory(Path.GetDirectoryName(args[3])!);
              mod.Write(args[3]);
              using var verify=ModuleDefMD.Load(args[3]);
              var vhelper=verify.GetTypes().Single(t=>t.FullName=="RedLightDistrict.Korean.CsvLookup");
              var vm=vhelper.Methods.Single(x=>x.Name.ToString()=="Read");
              if(vm.Body.Instructions.Count(i=>i.OpCode==OpCodes.Ldstr && Equals(i.Operand,"ko"))!=1)
                  throw new Exception("Missing ko lookup");
              var userCalls=verify.GetTypes().SelectMany(t=>t.Methods.Where(m=>m.HasBody))
                  .SelectMany(m=>m.Body.Instructions)
                  .Count(i=>i.OpCode==OpCodes.Call && i.Operand is IMethod mm &&
                     mm.FullName==vm.FullName);
              if(userCalls!=3619)throw new Exception("Incorrect generated localization calls "+userCalls);
              Console.WriteLine("Rebuilt original DLL with "+userCalls+" source-matched callsites and CSV helper (captures LoadedMod on OnModAssetsLoaded).");
            }
          }
          CS
          dotnet run --project /tmp/rld_full_bridge/rld_full_bridge.csproj -- \
            probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1/RedLightDistrict.dll \
            'probably-stolen/local-mods/TentacleMod/落魄千金-埃莉诺 v1.0.3/fallen_heiress_eleanor.dll' \
            /tmp/rld-bridge-sites.jsonl \
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll
      - name: Independently verify original managed resources and build final bridge ZIP
        shell: bash
        run: |
          python3 -m pip -q install dnfile
          python3 - <<'PY'
          from pathlib import Path
          import dnfile,hashlib,csv
          from zipfile import ZipFile,ZIP_DEFLATED
          base=Path("probably-stolen/local-mods")
          src=base/"TentacleMod/RedLightDistrict_v1.1.1/RedLightDistrict.dll"
          root=base/"TentacleMod번역"
          dst=root/"RedLightDistrict_v1.1.1/RedLightDistrict.dll"
          old=dnfile.dnPE(str(src));new=dnfile.dnPE(str(dst))
          before={str(r.name):r.data for r in old.net.resources}
          after={str(r.name):r.data for r in new.net.resources}
          assert len(before)==len(after)==1617
          assert before==after,'Existing CLR resource changed'
          assert new.net.mdtables.TypeDef.num_rows==old.net.mdtables.TypeDef.num_rows+1
          assert new.net.mdtables.MethodDef.num_rows==old.net.mdtables.MethodDef.num_rows+1
          assert new.net.mdtables.Field.num_rows==old.net.mdtables.Field.num_rows+1
          with (root/"RedLightDistrict_v1.1.1/Localization/ko.csv").open(encoding='utf-8-sig',newline='') as f:
              ko=list(csv.reader(f))
          assert len(ko)==3512 and len({x[0] for x in ko})==3512
          audit=root/"번역대조표/RedLightDistrict_v1.1.1_FULL_CSV_BRIDGE_DLL_AUDIT_20261121.md"
          audit.write_text("# RedLightDistrict v1.1.1 full CSV-bridge Korean DLL static audit\n\n"
              +f"- Original: {src.stat().st_size} bytes / SHA256 {hashlib.sha256(src.read_bytes()).hexdigest()}.\n"
              +f"- Revised: {dst.stat().st_size} bytes / SHA256 {hashlib.sha256(dst.read_bytes()).hexdigest()}.\n"
              +"- All 3619 active Chinese original IL caller sites were independently matched by original method signature, IL offset and literal, then rewritten to call a locale bridge. No global #US string replacement.\n"
              +"- Runtime lookup: RedLightDistrict.Korean.CsvLookup.Read reads LoadedMod.Localization['ko'] via IDictionary. The owner LoadedMod reference is captured in original RedLightDistrictMod.OnModAssetsLoaded callback. Missing, empty, or unavailable values fall back to per-site original Chinese; no mod files read or external reflection used.\n"
              +"- External KO CSV: 3512 translated caller keys, 107 protected identifier/comparison/saved-header keys. Korean translation is not baked into DLL, so CSV updates work after game loads its localization.\n"
              +f"- Original {len(before)} managed resources and all their bytes are unchanged; CLR TypeDef +1, MethodDef +1, Field +1 (bridge only).\n"
              +"- The previous translation folder's 214-UI-only direct IL patch DLL did not contain this full CSV bridge and has been superseded. The new DLL must be installed WITH Localization/ko.csv.\n"
              +"- No actual Unity/CLR game startup, mod loader, save data or compatibility test was performed. OnModAssetsLoaded may occur after some early string evaluation, which will then use the original Chinese fallback.\n",encoding='utf-8')
          z=root/"ProbablyStolen_RLD_v1.1.1_DLL_Korean_CSV_Bridge_3512_20261121.zip"
          with ZipFile(z,'w',ZIP_DEFLATED,compresslevel=1) as f:
              for path in ["RedLightDistrict.dll","manifest.xml","README_ko.txt","Localization/ko.csv"]:
                  f.write(root/"RedLightDistrict_v1.1.1"/path,arcname="RedLightDistrict_v1.1.1/"+path)
              f.write(audit,arcname="STATIC_AUDIT.md")
          with ZipFile(z) as f:assert f.testzip() is None and len(f.namelist())==5
          print(audit.read_text());print("ZIP",z.stat().st_size)
          PY
      - name: Store complete bridge DLL and final ZIP in Git LFS
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs track 'probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll'
          git lfs track 'probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_RLD_v1.1.1_DLL_Korean_CSV_Bridge_3512_20261121.zip'
          git add --sparse \
            .gitattributes \
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll \
            probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_RLD_v1.1.1_DLL_Korean_CSV_Bridge_3512_20261121.zip \
            probably-stolen/local-mods/TentacleMod번역/번역대조표/RedLightDistrict_v1.1.1_FULL_CSV_BRIDGE_DLL_AUDIT_20261121.md
          if ! git diff --cached --quiet; then
            git commit -m 'build(rld): replace obsolete UI-only DLL with complete 3619-key external-ko bridge'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 5
            done
            exit 1
          fi
