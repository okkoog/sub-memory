name: DailyWearWorkshop final Korean patch and static package
on:
  push:
    paths:
      - '.github/workflows/tentacle-dailywear-final-20261122.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/起飞攻速装-v1.1.3抢先体验版（修bug）/起飞攻速装.dll
            probably-stolen/local-mods/TentacleMod/起飞攻速装-v1.1.3抢先体验版（修bug）/娃娃清单.json
            probably-stolen/local-mods/TentacleMod/起飞攻速装-v1.1.3抢先体验版（修bug）/manifest.xml
            probably-stolen/local-mods/TentacleMod번역/起飞攻速装-v1.1.3抢先体验版（修bug）
            probably-stolen/local-mods/TentacleMod번역/번역대조표/DailyWearWorkshop_FINAL_PLAN_20261122.json
      - name: Exact per-callsite patch and restore original asset-to-ID aliases
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/daily_final --force
          dotnet add /tmp/daily_final/daily_final.csproj package dnlib --version 4.5.0
          cat >/tmp/daily_final/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using System.Text;
          using System.Text.Json;
          using System.Text.Json.Nodes;
          using System.Security.Cryptography;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
            record Site(string token,string method,uint offset,string source,string target,string action);
            static void Need(bool b,string why){if(!b)throw new Exception(why);}
            static string Hash(byte[] b)=>Convert.ToHexString(SHA256.HashData(b)).ToLowerInvariant();
            static string Key(MethodDef m)=>m.FullName;
            static bool Cjk(string s)=>s.Any(c=>c>='\u3400'&&c<='\u9fff');
            static string NameKey(string s)=>s.Normalize(NormalizationForm.FormKC).ToUpperInvariant();
            static string Strip(string s)=>System.Text.RegularExpressions.Regex.Replace(Path.GetFileNameWithoutExtension(s).Trim(),@"^\d+[\s_.\-、]+","").Trim();
            static Dictionary<string,string> Dolls(ModuleDefMD md){
              var m=md.GetTypes().Single(t=>t.FullName=="DailyWearKitchen.DollContent").Methods.Single(m=>m.Name=="Define");
              var i=m.Body.Instructions;var d=new Dictionary<string,string>();
              for(int k=0;k<i.Count-1;k++)if(i[k].OpCode==OpCodes.Ldstr&&i[k].Operand is string s&&System.Text.RegularExpressions.Regex.IsMatch(s,@"^dwk_doll_\d{3}$")){
                Need(i[k+1].OpCode==OpCodes.Ldstr,"Doll definition name anchor");d.Add(s,(string)i[k+1].Operand);
              }
              Need(d.Count==50,"50 legacy definitions");return d;
            }
            static string Op(object? x,Dictionary<Instruction,int> map)=>x switch{null=>"",Instruction i=>"@"+map[i],IList<Instruction> a=>string.Join(",",a.Select(i=>"@"+map[i])),_=>x.ToString()??""};
            static string EH(ExceptionHandler e,Dictionary<Instruction,int> map){
              string I(Instruction? i)=>i==null?"-":map[i].ToString();
              return string.Join("|",e.HandlerType.ToString(),I(e.TryStart),I(e.TryEnd),I(e.HandlerStart),I(e.HandlerEnd),I(e.FilterStart),e.CatchType?.FullName??"");
            }
            static void Main(string[] a){
              string source=a[0],target=a[1],sourceJson=a[2],targetJson=a[3],planFile=a[4],reportFile=a[5];
              byte[] oldBytes=File.ReadAllBytes(target);using var plan=JsonDocument.Parse(File.ReadAllText(planFile));
              Need(Hash(oldBytes)==plan.RootElement.GetProperty("oldSha256").GetString(),"Unexpected previous DLL hash "+Hash(oldBytes));
              Site[] sites=plan.RootElement.GetProperty("sites").Deserialize<Site[]>()!;
              using var original=ModuleDefMD.Load(source);using var before=ModuleDefMD.Load(oldBytes);using var md=ModuleDefMD.Load(oldBytes);
              var om=before.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToDictionary(m=>m.MDToken.Raw.ToString("X8"));
              var mm=md.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToDictionary(m=>m.MDToken.Raw.ToString("X8"));
              var expected=new Dictionary<(string,int),string>();var verified=new List<object>();
              foreach(var s in sites){
                Need(mm.TryGetValue(s.token,out var m)&&m!.FullName==s.method,"Method anchor "+s.method);
                var ins=m!.Body.Instructions.SingleOrDefault(i=>i.Offset==s.offset);
                Need(ins!=null&&ins.OpCode==OpCodes.Ldstr,"IL anchor "+s.method+" "+s.offset);
                string observed=(string)ins!.Operand;
                Need(observed==(s.action=="already"?s.target:s.source),"Unexpected literal "+s.method+" "+s.offset);
                if(s.action=="patch"){expected.Add((s.token,m.Body.Instructions.IndexOf(ins)),s.target);ins.Operand=s.target;}
                verified.Add(new{s.token,s.method,s.offset,s.action,source=s.source,result=(string)ins.Operand});
              }
              // Match all 50 original names and already-localized definitions by preserved ID.
              // The original loader computes legacy IDs from normalized asset basenames.
              var origDolls=Dolls(original);var koDolls=Dolls(before);
              var sj=JsonNode.Parse(File.ReadAllText(sourceJson))!.AsArray();var tj=JsonNode.Parse(File.ReadAllText(targetJson))!.AsArray();
              Need(sj.Count==50&&tj.Count==50,"Catalog row count");
              var aliases=new List<(string name,string id)>();var keyIds=new Dictionary<string,string>(StringComparer.Ordinal);
              void AddKey(string name,string id){var k=NameKey(Strip(name));Need(!keyIds.TryGetValue(k,out var other)||other==id,"Ambiguous legacy alias "+k);keyIds[k]=id;}
              foreach(var row in sj){string id=row!["id"]!.GetValue<string>();AddKey(origDolls[id],id);AddKey(koDolls[id],id);AddKey(id,id);}
              for(int i=0;i<sj.Count;i++){
                var x=sj[i]!.AsObject();var y=tj[i]!.AsObject();string id=x["id"]!.GetValue<string>();string on=x["name"]!.GetValue<string>();string kn=koDolls[id];
                Need(x.Count==y.Count&&x.All(k=>k.Key=="name"||JsonNode.DeepEquals(k.Value,y[k.Key])),"JSON identity mismatch "+id);
                Need(Strip(on)==Strip(x["file"]!.GetValue<string>())&&Strip(on)==Strip(origDolls[id]),"Original legacy name mismatch "+id);
                Need(!Cjk(kn)&&kn.Length>0,"Existing Korean definition name "+id);
                aliases.Add((origDolls[id],id));y["name"]=kn; // one consistent Korean game name, unchanged asset filename
              }
              var lib=md.GetTypes().Single(t=>t.FullName=="DailyWearKitchen.DollLibrary");
              var ready=lib.Methods.Single(m=>m.Name=="AssetsReady");
              var display=lib.Methods.Single(m=>m.Name=="DisplayName");
              var nameKey=lib.Methods.Single(m=>m.Name=="NameKey");
              var setter=ready.Body.Instructions.Single(i=>i.Offset==0x86).Operand as IMethod;
              Need(setter!=null&&setter.FullName.Contains("Dictionary")&&setter.Name=="set_Item","Dictionary anchor");
              var anchor=ready.Body.Instructions.Single(i=>i.Offset==0xBB);
              Need(anchor.OpCode==OpCodes.Newobj&&anchor.Operand.ToString()!.Contains("DollArt"),"Alias insertion anchor");
              var helper=new MethodDefUser("RegisterOriginalDollNameAliases",MethodSig.CreateStatic(md.CorLibTypes.Void,ready.Body.Variables[0].Type),dnlib.DotNet.MethodImplAttributes.IL|dnlib.DotNet.MethodImplAttributes.Managed,dnlib.DotNet.MethodAttributes.Private|dnlib.DotNet.MethodAttributes.Static|dnlib.DotNet.MethodAttributes.HideBySig);
              helper.Body=new CilBody();lib.Methods.Add(helper);
              foreach(var x in aliases){
                helper.Body.Instructions.Add(Instruction.Create(OpCodes.Ldarg_0));
                helper.Body.Instructions.Add(Instruction.Create(OpCodes.Ldstr,x.name));
                helper.Body.Instructions.Add(Instruction.Create(OpCodes.Call,display));
                helper.Body.Instructions.Add(Instruction.Create(OpCodes.Call,nameKey));
                helper.Body.Instructions.Add(Instruction.Create(OpCodes.Ldstr,x.id));
                helper.Body.Instructions.Add(Instruction.Create(OpCodes.Callvirt,setter!));
              }
              helper.Body.Instructions.Add(Instruction.Create(OpCodes.Ret));
              int insert=ready.Body.Instructions.IndexOf(anchor);
              var oldAnchor=Instruction.Create(anchor.OpCode,(IMethod)anchor.Operand);
              anchor.OpCode=OpCodes.Ldloc_0;anchor.Operand=null; // preserve old jump and EH target at the alias call
              ready.Body.Instructions.Insert(insert+1,Instruction.Create(OpCodes.Call,helper));
              ready.Body.Instructions.Insert(insert+2,oldAnchor);
              string temp=target+".new";md.Write(temp);using var check=ModuleDefMD.Load(temp);
              var oldMethods=before.GetTypes().SelectMany(t=>t.Methods).GroupBy(Key).ToDictionary(g=>g.Key,g=>g.OrderBy(m=>m.MDToken.Raw).ToArray());
              var newMethods=check.GetTypes().SelectMany(t=>t.Methods).GroupBy(Key).ToDictionary(g=>g.Key,g=>g.OrderBy(m=>m.MDToken.Raw).ToArray());
              Need(newMethods.Count==oldMethods.Count+1&&oldMethods.All(x=>newMethods.TryGetValue(x.Key,out var z)&&z.Length==x.Value.Length),"Method collection");
              Need(before.GetTypes().Select(t=>t.FullName).OrderBy(x=>x).SequenceEqual(check.GetTypes().Select(t=>t.FullName).OrderBy(x=>x)),"Type collection");
              int changed=0;int compared=0;int protectedCount=0;
              foreach(var pair in oldMethods)for(int n=0;n<pair.Value.Length;n++){
                var o=pair.Value[n];var k=newMethods[pair.Key][n];Need(o.HasBody==k.HasBody,"Body availability");if(!o.HasBody)continue;
                var oi=o.Body.Instructions.ToList();var ni=k.Body.Instructions.ToList();bool special=o.FullName==ready.FullName;
                Need(ni.Count==oi.Count+(special?2:0)&&o.Body.Variables.Count==k.Body.Variables.Count&&o.Body.ExceptionHandlers.Count==k.Body.ExceptionHandlers.Count,"Body shape "+o.FullName);
                var oldIndex=oi.Select((v,i)=>(v,i)).ToDictionary(x=>x.v,x=>x.i);var newIndex=ni.Select((v,i)=>(v,i)).ToDictionary(x=>x.v,x=>special&&x.i>=insert?(x.i<=insert+2?insert:x.i-2):x.i);
                if(special){Need(ni[insert].OpCode==OpCodes.Ldloc_0&&ni[insert+1].OpCode==OpCodes.Call&&((IMethod)ni[insert+1].Operand).FullName==helper.FullName,"Alias call");}
                Need(o.Body.ExceptionHandlers.Select(e=>EH(e,oldIndex)).SequenceEqual(k.Body.ExceptionHandlers.Select(e=>EH(e,newIndex))),"Exception handlers "+o.FullName);
                Need(o.Body.Variables.Select(v=>v.Type.FullName).SequenceEqual(k.Body.Variables.Select(v=>v.Type.FullName)),"Local types");
                for(int i=0;i<oi.Count;i++){
                  var x=oi[i];var y=ni[special&&i>=insert?i+2:i];
                  Need(x.OpCode==y.OpCode,"Opcode change "+o.FullName+" "+i);
                  string ex=expected.TryGetValue((o.MDToken.Raw.ToString("X8"),i),out var v)?v:Op(x.Operand,oldIndex);
                  Need(ex==Op(y.Operand,newIndex),"Unexpected operand change "+o.FullName+" "+i);
                  if(expected.ContainsKey((o.MDToken.Raw.ToString("X8"),i)))changed++;
                  if(y.OpCode==OpCodes.Ldstr&&y.Operand is string s&&Cjk(s)){
                    var aSite=sites.SingleOrDefault(z=>z.token==o.MDToken.Raw.ToString("X8")&&z.offset==x.Offset);
                    // The original audit only counted Chinese ideographs and Korean with original-title annotations.
                    Need(aSite!=null&&aSite.action!="patch"&&aSite.action!="already","Unclassified active CJK "+o.FullName+" "+x.Offset+" "+s);
                    protectedCount++;
                  }
                }
                compared++;
              }
              Need(changed==expected.Count,"Exact modified site count");
              var hh=check.GetTypes().Single(t=>t.FullName==lib.FullName).Methods.Single(m=>m.Name==helper.Name);
              Need(hh.Body.Instructions.Count==aliases.Count*6+1,"Alias body count");
              for(int i=0;i<aliases.Count;i++){
                int p=i*6;Need(hh.Body.Instructions[p].OpCode==OpCodes.Ldarg_0&&Equals(hh.Body.Instructions[p+1].Operand,aliases[i].name)&&((IMethod)hh.Body.Instructions[p+2].Operand).FullName==display.FullName&&((IMethod)hh.Body.Instructions[p+3].Operand).FullName==nameKey.FullName&&Equals(hh.Body.Instructions[p+4].Operand,aliases[i].id)&&((IMethod)hh.Body.Instructions[p+5].Operand).FullName==setter!.FullName,"Alias semantics "+i);
              }
              var ares=before.Resources.OfType<EmbeddedResource>().ToDictionary(x=>x.Name.ToString(),x=>x.CreateReader().ToArray());
              var bres=check.Resources.OfType<EmbeddedResource>().ToDictionary(x=>x.Name.ToString(),x=>x.CreateReader().ToArray());
              Need(ares.Count==bres.Count&&ares.All(x=>bres.TryGetValue(x.Key,out var b)&&x.Value.SequenceEqual(b)),"Resource bytes");
              Need(Dolls(check).OrderBy(x=>x.Key).SequenceEqual(koDolls.OrderBy(x=>x.Key)),"Legacy definitions unchanged");
              File.Move(temp,target,true);File.WriteAllText(targetJson,tj.ToJsonString(new JsonSerializerOptions{WriteIndented=true,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping})+"\n",new UTF8Encoding(false));
              File.WriteAllText(reportFile,JsonSerializer.Serialize(new{originalDllHash=Hash(File.ReadAllBytes(source)),previousDllHash=Hash(oldBytes),finalDllHash=Hash(File.ReadAllBytes(target)),comparedMethods=compared,changedSites=changed,preservedCjkSites=protectedCount,originalAssetAliases=aliases.Count,all50JsonNamesMatchDll=true,unchangedResources=ares.Count,verified,remainingPlayerVisibleChinese=0,runtime="not tested"},new JsonSerializerOptions{WriteIndented=true,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping})+"\n");
            }
          }
          CS
          SRC='probably-stolen/local-mods/TentacleMod/起飞攻速装-v1.1.3抢先体验版（修bug）'
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          MOD="$ROOT/起飞攻速装-v1.1.3抢先体验版（修bug）"
          dotnet run --project /tmp/daily_final/daily_final.csproj -- "$SRC/起飞攻速装.dll" "$MOD/起飞攻速装.dll" "$SRC/娃娃清单.json" "$MOD/娃娃清单.json" "$ROOT/번역대조표/DailyWearWorkshop_FINAL_PLAN_20261122.json" "$ROOT/번역대조표/DailyWearWorkshop_FINAL_RESULT_20261122.json"
      - name: Final Korean overlay and CRC verification
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,zipfile,xml.etree.ElementTree as E
          root=Path('probably-stolen/local-mods/TentacleMod번역')
          name='起飞攻速装-v1.1.3抢先体验版（修bug）'
          mod=root/name
          src=Path('probably-stolen/local-mods/TentacleMod')/name
          report=root/'번역대조표/DailyWearWorkshop_FINAL_RESULT_20261122.json'
          r=json.loads(report.read_text())
          o=E.parse(src/'manifest.xml').getroot();n=E.parse(mod/'manifest.xml').getroot()
          for k in ['ID','Author','ModVersion','GameVersions','Prerequisites','Assemblies','Capabilities']:
              assert E.tostring(o.find(k))==E.tostring(n.find(k)),k
          a=json.loads((src/'娃娃清单.json').read_text(encoding='utf-8-sig'))
          b=json.loads((mod/'娃娃清单.json').read_text(encoding='utf-8-sig'))
          assert len(a)==len(b)==50
          assert all({k:v for k,v in x.items() if k!='name'}=={k:v for k,v in y.items() if k!='name'} for x,y in zip(a,b))
          assert all(y['name'] and not any('\u3400'<=c<='\u9fff' for c in y['name']) for y in b)
          zpath=root/'ProbablyStolen_DailyWearWorkshop_KO_Final_20261122.zip'
          files=sorted(p for p in mod.rglob('*') if p.is_file())
          with zipfile.ZipFile(zpath,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for p in files:z.write(p,str(p.relative_to(root)))
          with zipfile.ZipFile(zpath) as z:
              assert z.testzip() is None
              assert set(z.namelist())=={str(p.relative_to(root)) for p in files}
              for p in files:assert z.read(str(p.relative_to(root)))==p.read_bytes()
          r.update(archive={'path':zpath.name,'sha256':hashlib.sha256(zpath.read_bytes()).hexdigest(),'files':len(files),'crc':'pass','matchesAllOverlayFiles':True},manifestVersion=n.findtext('ModVersion'),externalData='50 names; all identity, price, category and asset path fields unchanged',runtime='not tested')
          report.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print({k:v for k,v in r.items() if k!='verified'})
          PY
      - name: Commit only verified final mod files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          MOD="$ROOT/起飞攻速装-v1.1.3抢先体验版（修bug）"
          git add --sparse "$MOD/起飞攻速装.dll" "$MOD/娃娃清单.json" "$ROOT/번역대조표/DailyWearWorkshop_FINAL_RESULT_20261122.json" "$ROOT/ProbablyStolen_DailyWearWorkshop_KO_Final_20261122.zip"
          git diff --cached --quiet || (git commit -m 'Finalize DailyWearWorkshop Korean callsites and original doll aliases' && git push origin main)
