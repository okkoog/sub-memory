name: Tentacle Brood v0.3.31 final 135-line Korean interaction dialogue ZIP
on:
  push:
    paths: [.github/workflows/temp-tentacle-brood135-final-pack-20261121.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  zip:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/lewdMemeBrood v0331/Content/interactionLines.json
            probably-stolen/local-mods/TentacleMod번역/lewdMemeBrood v0331/Content/interactionLines.json
            probably-stolen/local-mods/TentacleMod번역/lewdMemeBrood v0331/README_ko.txt
            probably-stolen/local-mods/TentacleMod번역/번역대조표/Brood_v0331_interaction_lines_COMPLETE_STATIC_AUDIT_20261121.md
          sparse-checkout-cone-mode: false
      - name: Verify all dialogue rows and create final small overlay archive
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import json,re,hashlib
          root=Path('probably-stolen/local-mods')
          src=root/'TentacleMod/lewdMemeBrood v0331/Content/interactionLines.json'
          dst=root/'TentacleMod번역/lewdMemeBrood v0331/Content/interactionLines.json'
          src_data=json.loads(src.read_text(encoding='utf-8'))
          dst_data=json.loads(dst.read_text(encoding='utf-8'))
          assert len(src_data['lines'])==len(dst_data['lines'])==135
          variables=lambda x:sorted(re.findall(r'\{[^{}]+\}',x))
          for i,(o,t) in enumerate(zip(src_data['lines'],dst_data['lines'])):
              assert o['kind']==t['kind'] and o['tags']==t['tags'],('selectors',i)
              assert variables(o['text'])==variables(t['text']),('variables',i)
              assert o['text']!=t['text'],('untranslated',i)
              assert not re.search(r'[\u3400-\u9fff]',t['text']),('Chinese text',i)
          assert all(x['tags']==y['tags'] for x,y in zip(
              src_data['_写法示例（不会被读取）'],dst_data['_写法示例（不会被读取）']))
          archive=root/'TentacleMod번역/ProbablyStolen_Brood_v0.3.31_Interaction_KO_135_20261121.zip'
          with ZipFile(archive,'w',ZIP_DEFLATED,compresslevel=6) as f:
              f.write(dst,arcname='lewdMemeBrood v0331/Content/interactionLines.json')
              f.write(root/'TentacleMod번역/lewdMemeBrood v0331/README_ko.txt',arcname='lewdMemeBrood v0331/README_ko.txt')
              f.write(root/'TentacleMod번역/번역대조표/Brood_v0331_interaction_lines_COMPLETE_STATIC_AUDIT_20261121.md',arcname='STATIC_AUDIT.md')
          with ZipFile(archive) as f:
              assert f.testzip() is None and len(f.namelist())==3
              assert f.read('lewdMemeBrood v0331/Content/interactionLines.json')==dst.read_bytes()
          print('135/135 dialogue rows localized, game selectors/vars 0 changes, zip bytes',archive.stat().st_size,'SHA256',hashlib.sha256(archive.read_bytes()).hexdigest())
          PY
      - name: Commit final Korean text content ZIP
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_Brood_v0.3.31_Interaction_KO_135_20261121.zip
          if ! git diff --cached --quiet; then
            git commit -m 'pack(tentacle): publish verified Brood v0.3.31 135-dialogue overlay'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
