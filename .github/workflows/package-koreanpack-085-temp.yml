name: Package Korean Pack 0.8.5
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package
        shell: bash
        run: |
          cd "probably-stolen/번역 모드"
          zip -r "$GITHUB_WORKSPACE/ProbablyStolen_KoreanPack_0.8.5.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: ProbablyStolen_KoreanPack_0.8.5
          path: ProbablyStolen_KoreanPack_0.8.5.zip
          if-no-files-found: error
