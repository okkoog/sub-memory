name: Tentacle Adult Goods v1.1.1 original DLL static inventory
on:
  push:
    paths:
      - '.github/workflows/temp-tentacle-adultgoods111-audit-20261121.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout unmodified original
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/3842259965
            probably-stolen/local-mods/TentacleMod번역/번역대조표
          sparse-checkout-cone-mode: false
      - name: Extract CLR resource index and existing embedded locale CSV files
        shell: bash
        run: |
          python3 -m pip install --quiet dnfile
          python3 - <<'PY'
          from pathlib import Path
          import dnfile,hashlib,csv,re
          src=Path('probably-stolen/local-mods/TentacleMod/3842259965/probably_adult_goods.dll')
          out=Path('probably-stolen/local-mods/TentacleMod번역/번역대조표')
          out.mkdir(parents=True,exist_ok=True)
          data=src.read_bytes()
          assert len(data)==8166912,('source DLL size changed',len(data))
          pe=dnfile.dnPE(str(src))
          assert pe.net,'original not .NET assembly'
          rows=[];exported=[]
          for i,r in enumerate(pe.net.resources):
              name=str(r.name);v=r.data
              if isinstance(v,bytes):
                  sha=hashlib.sha256(v).hexdigest()
                  try:
                      decoded=v.decode('utf-8-sig')
                      cjk=sum('\u3400'<=ch<='\u9fff' for ch in decoded)
                  except UnicodeError:
                      cjk=0
                  size=len(v)
                  m=re.search(r'(?i)(?:^|[./])localization[./](zh|en)(?:[-_][a-z]+)?\.csv$',name)
                  if m and size<5000000:
                      language=m.group(1).lower()
                      fp=out/f'AdultGoods_v1.1.1_original_{language}_embedded_20261121.csv'
                      fp.write_bytes(v)
                      exported.append((name,fp.name,size))
              else:
                  sha='';size=0;cjk=0
              rows.append((i,name,type(v).__name__,size,sha,cjk))
          inv=out/'AdultGoods_v1.1.1_CLR_resource_index_20261121.tsv'
          with inv.open('w',encoding='utf-8',newline='') as f:
              w=csv.writer(f,delimiter='\t')
              w.writerow(['index','resource_name','data_type','size','sha256','utf8_cjk_chars'])
              w.writerows(rows)
          summary=out/'AdultGoods_v1.1.1_DLL_STATIC_INVENTORY_20261121.md'
          summary.write_text(
            '# Probably Adult Goods v1.1.1 — original DLL static inventory\n\n'
            +f'- Original size: {len(data)} bytes\n'
            +f'- Original SHA256: {hashlib.sha256(data).hexdigest()}\n'
            +f'- CLR managed resource count: {len(rows)}\n'
            +f'- Existing embedded localization CSVs exported: {exported}\n'
            +f'- TypeDef rows: {pe.net.mdtables.TypeDef.num_rows}\n'
            +f'- MethodDef rows: {pe.net.mdtables.MethodDef.num_rows}\n'
            +'- No executable assembly was loaded into the CLR; only static metadata inspected.\n'
            +'- No translation was applied to any DLL. Game/Unity loading remains untested.\n',
            encoding='utf-8')
          print(summary.read_text())
          PY
      - name: Read original method-level CJK ldstr references without modifying assembly
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/adult111_audit --force
          dotnet add /tmp/adult111_audit/adult111_audit.csproj package dnlib --version 4.5.0
          cat > /tmp/adult111_audit/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Text.Json;
          using System.Text.RegularExpressions;
          using System.Collections.Generic;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
            static void Main(string[] args) {
              using var md=ModuleDefMD.Load(args[0]);
              var regex=new Regex(@"[\u3400-\u9fff]",RegexOptions.Compiled);
              var refs=new Dictionary<string,List<string>>(StringComparer.Ordinal);
              int allRefs=0;
              foreach (var t in md.GetTypes()) foreach (var method in t.Methods) {
                if (!method.HasBody) continue;
                foreach (var il in method.Body.Instructions) {
                  if (il.OpCode!=OpCodes.Ldstr || il.Operand is not string s || !regex.IsMatch(s)) continue;
                  if(!refs.TryGetValue(s,out var sites))refs[s]=sites=new List<string>();
                  sites.Add(t.FullName+"::"+method.Name+"@"+il.Offset.ToString("X4"));
                  allRefs++;
                }
              }
              using(var w=new StreamWriter(args[1],false,new System.Text.UTF8Encoding(false))) {
                w.WriteLine("index\toriginal_json\treferences\tmethod_sites");
                int n=0;
                foreach(var kv in refs.OrderBy(x=>x.Key,StringComparer.Ordinal)){
                  w.WriteLine(n+++"\t"+JsonSerializer.Serialize(kv.Key)+"\t"+kv.Value.Count+"\t"+String.Join("; ",kv.Value));
                }
              }
              File.AppendAllText(args[2],$"- Active unique CJK ldstr strings: {refs.Count}\n- Method-level CJK ldstr sites: {allRefs}\n- Source method bodies were not modified; no strings have been translated yet.\n");
              Console.WriteLine($"Active unique CJK strings {refs.Count}, IL sites {allRefs}");
            }
          }
          CS
          dotnet run --project /tmp/adult111_audit/adult111_audit.csproj -- \
            'probably-stolen/local-mods/TentacleMod/3842259965/probably_adult_goods.dll' \
            'probably-stolen/local-mods/TentacleMod번역/번역대조표/AdultGoods_v1.1.1_active_CJK_IL_inventory_20261121.tsv' \
            'probably-stolen/local-mods/TentacleMod번역/번역대조표/AdultGoods_v1.1.1_DLL_STATIC_INVENTORY_20261121.md'
      - name: Inspect localization loader and caller IL without running the DLL
        shell: bash
        run: |
          cat > /tmp/adult111_audit/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
            static void Main(string[] args) {
              using var md=ModuleDefMD.Load(args[0]);
              using var w=new StreamWriter(args[1],false,new System.Text.UTF8Encoding(false));
              w.WriteLine("# Adult Goods v1.1.1 embedded localization IL static audit\n");
              var selected=md.GetTypes().SelectMany(t=>t.Methods.Where(m=>m.HasBody).Select(m=>(t,m)))
               .Where(x=>x.t.FullName.Contains("ModLocale") || x.m.Name.ToString().Contains("Localization") ||
                        x.m.Name.ToString().Contains("Locale") || x.m.Name.ToString().Contains("Resource") ||
                        x.t.FullName.EndsWith(".ModEntry") ||
                        x.m.Body.Instructions.Any(i=>i.OpCode==OpCodes.Ldstr && i.Operand is string s && s.Contains("Localization")))
               .ToArray();
              w.WriteLine("Methods selected: "+selected.Length+"\n");
              foreach(var x in selected) {
                w.WriteLine("## "+x.t.FullName+"::"+x.m.Name+" ("+x.m.MDToken+")");
                foreach (var il in x.m.Body.Instructions) {
                  string op=il.Operand is string s?System.Text.Json.JsonSerializer.Serialize(s):(il.Operand?.ToString()??"");
                  w.WriteLine($"- IL_{il.Offset:X4}: {il.OpCode} {op}");
                }
              }
              Console.WriteLine("Selected methods: "+selected.Length);
            }
          }
          CS
          dotnet run --project /tmp/adult111_audit/adult111_audit.csproj -- \
            'probably-stolen/local-mods/TentacleMod/3842259965/probably_adult_goods.dll' \
            'probably-stolen/local-mods/TentacleMod번역/번역대조표/AdultGoods_v1.1.1_LOCALIZATION_IL_AUDIT_20261121.md'
      - name: Commit static audit text only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse 'probably-stolen/local-mods/TentacleMod번역/번역대조표/AdultGoods_v1.1.1_'*
          git diff --cached --quiet || (git commit -m 'audit(tentacle): extract Adult Goods v1.1.1 original CLR inventory' && git pull --rebase origin main && git push)
