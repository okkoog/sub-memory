name: Temporary inspect Black Market Arsenal untranslated dialogue
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-bma-localization-audit.yml]
permissions: {contents: read}
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/mods/3832503109
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Identify hardcoded BMA dialogue
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install ilspycmd --tool-path "$RUNNER_TEMP/ilspy" >/dev/null
          "$RUNNER_TEMP/ilspy/ilspycmd" probably-stolen/mods/3832503109/BlackMarketArsenal.dll > "$RUNNER_TEMP/bma.cs"
          python3 - <<'PY'
          import pathlib,re,os
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'bma.cs'
          s=p.read_text(errors='replace')
          targets=['The original goods are settled','black seed','No obligation','client_street_chemist_greeting','ModHelper.GetLocalized','Localization','Got some sparkle']
          print('DLL size decompiled chars:',len(s))
          for q in targets:
              found=list(re.finditer(re.escape(q),s,re.I))
              print('====',q,'matches',len(found))
              for m in found[:8]:
                  at=m.start()
                  prev=s.rfind('\n\t',0,at)
                  context=s[max(0,at-1600):min(len(s),at+1200)]
                  print('context:',context.replace('\t','  '))
          PY
