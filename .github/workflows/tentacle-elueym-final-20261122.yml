name: Elueym portrait mod final Korean output audit
on:
  push:
    paths: ['.github/workflows/tentacle-elueym-final-20261122.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod번역/3843110449
            probably-stolen/local-mods/TentacleMod/3843110449/GeorgioToElueym.dll
            probably-stolen/local-mods/TentacleMod/3843110449/ToElueym.dll
            probably-stolen/local-mods/TentacleMod/3843110449/manifest.xml
            probably-stolen/local-mods/TentacleMod번역/번역대조표/WorkAudit_20261122/후속02/IL_96E116FC1A39E192.json
      - name: Patch only verified replacement results, not input search operands
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/elueym --force
          dotnet add /tmp/elueym/elueym.csproj package dnlib --version 4.5.0
          cat >/tmp/elueym/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using System.Security.Cryptography;
          using System.Text.Json;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
            record Site(uint token,uint offset,string from,string to,string input);
            static void Need(bool b,string msg){if(!b)throw new Exception(msg);}
            static string Hash(string p)=>Convert.ToHexString(SHA256.HashData(File.ReadAllBytes(p))).ToLowerInvariant();
            static string Raw(object? o)=>o?.ToString()??"";
            static string Op(object? o,Dictionary<Instruction,int> ix)=>o switch{null=>"",Instruction i=>"@"+ix[i],IList<Instruction> a=>string.Join(",",a.Select(i=>"@"+ix[i])),_=>Raw(o)};
            static string EH(ExceptionHandler e,Dictionary<Instruction,int> m){string I(Instruction? i)=>i==null?"-":m[i].ToString();return string.Join("|",e.HandlerType.ToString(),I(e.TryStart),I(e.TryEnd),I(e.HandlerStart),I(e.HandlerEnd),I(e.FilterStart),e.CatchType?.FullName??"");}
            static bool Cjk(string s)=>s.Any(c=>c>='\u3400'&&c<='\u9fff');
            static void Main(string[] args){
              string file=args[0],other=args[1],report=args[2];
              string inputHash=Hash(file),otherHash=Hash(other);
              Need(inputHash=="fa9a8b7d0780e5f776c8662b5dca910da59b6cd92af799cd3dcf9b5c5d009739","Audited main DLL SHA");
              Need(otherHash=="e40309fd34299801721e2cbe93be1db7c6be978f989d3ce09932f35449c586c9","Audited secondary DLL SHA");
              var specs=new[]{
                new Site(0x06000008,0x000B,"艾露姆","Elueym","乔治奥"),
                new Site(0x06000008,0x0029,"“军阀”","“군벌”","杰克逊博士"),
                new Site(0x06000008,0x0038,"“军阀”","“군벌”","Dr. Jackson"),
                new Site(0x06000008,0x0047,"“军阀”","“군벌”","STM博士"),
                new Site(0x06000008,0x0056,"“军阀”","“군벌”","Dr. STM"),
                new Site(0x06000008,0x0065,"“军阀”投资","“군벌” 투자","杰克逊投资"),
                new Site(0x06000008,0x0074,"“军阀” Investment","“군벌” 투자","Jackson Investment"),
                new Site(0x06000008,0x0083,"“军阀” Investment","“군벌” 투자","STM Investment"),
                new Site(0x06000009,0x002A,"她","그녀","他")
              };
              using var original=ModuleDefMD.Load(file);using var mod=ModuleDefMD.Load(file);using var second=ModuleDefMD.Load(other);
              var methods=mod.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToDictionary(m=>m.MDToken.Raw);
              Need(methods.Count==23,"Main method count");
              var protectedSites=methods.Values.SelectMany(m=>m.Body.Instructions.Where(i=>i.OpCode==OpCodes.Ldstr&&i.Operand is string v&&Cjk(v)).Select(i=>new{token=m.MDToken.Raw,method=m.FullName,offset=i.Offset,value=(string)i.Operand})).Where(x=>!specs.Any(s=>s.token==x.token&&s.offset==x.offset)).ToArray();
              Need(protectedSites.Length==5,"Five unchanged CJK search operands");
              foreach(var s in specs){
                var m=methods[s.token];var il=m.Body.Instructions;var i=il.Single(i=>i.Offset==s.offset);int n=il.IndexOf(i);
                Need(i.OpCode==OpCodes.Ldstr&&Equals(i.Operand,s.from),"Exact target "+s.offset);
                Need(n>0&&il[n-1].OpCode==OpCodes.Ldstr&&Equals(il[n-1].Operand,s.input),"Exact original search argument "+s.offset);
                Need(n+1<il.Count&&(il[n+1].OpCode==OpCodes.Call||il[n+1].OpCode==OpCodes.Callvirt)&&Raw(il[n+1].Operand)=="System.String System.String::Replace(System.String,System.String)","Exact Replace result operand");
                i.Operand=s.to;
              }
              var temp=file+".new";mod.Write(temp);using var output=ModuleDefMD.Load(temp);
              var orig=original.GetTypes().SelectMany(t=>t.Methods).ToDictionary(m=>m.FullName);
              var dest=output.GetTypes().SelectMany(t=>t.Methods).ToDictionary(m=>m.FullName);
              Need(orig.Keys.ToHashSet().SetEquals(dest.Keys),"Method identities");
              int compared=0,changed=0;
              foreach(var kv in orig){
                var a=kv.Value;var b=dest[kv.Key];Need(a.HasBody==b.HasBody,"Body");if(!a.HasBody)continue;
                var x=a.Body.Instructions.ToArray();var y=b.Body.Instructions.ToArray();
                Need(x.Length==y.Length,"Instruction count "+a.FullName);
                var ax=x.Select((v,k)=>(v,k)).ToDictionary(z=>z.v,z=>z.k);var bx=y.Select((v,k)=>(v,k)).ToDictionary(z=>z.v,z=>z.k);
                Need(a.Body.Variables.Select(v=>v.Type.FullName).SequenceEqual(b.Body.Variables.Select(v=>v.Type.FullName)),"Locals");
                Need(a.Body.ExceptionHandlers.Select(e=>EH(e,ax)).SequenceEqual(b.Body.ExceptionHandlers.Select(e=>EH(e,bx))),"Exception handlers");
                for(int i=0;i<x.Length;i++){
                  Need(x[i].OpCode==y[i].OpCode,"Opcode "+a.FullName);
                  var spec=specs.SingleOrDefault(s=>s.token==a.MDToken.Raw&&s.offset==x[i].Offset);
                  if(spec!=null){Need(Equals(x[i].Operand,spec.from)&&Equals(y[i].Operand,spec.to),"Verified planned output");changed++;}
                  else Need(Op(x[i].Operand,ax)==Op(y[i].Operand,bx),"Unexpected operand "+a.FullName+" "+i);
                }compared++;
              }
              Need(compared==23&&changed==9,"Patch exact footprint");
              var remaining=output.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).SelectMany(m=>m.Body.Instructions.Where(i=>i.OpCode==OpCodes.Ldstr&&i.Operand is string s&&Cjk(s)).Select(i=>new{method=m.FullName,offset=i.Offset,value=(string)i.Operand})).ToArray();
              Need(remaining.Length==protectedSites.Length&&remaining.All(x=>protectedSites.Any(y=>y.method==x.method&&y.offset==x.offset&&y.value==x.value)),"Protected active CJK exact");
              var res=original.Resources.OfType<EmbeddedResource>().ToDictionary(r=>r.Name.ToString(),r=>Convert.ToHexString(SHA256.HashData(r.CreateReader().ToArray())));
              var res2=output.Resources.OfType<EmbeddedResource>().ToDictionary(r=>r.Name.ToString(),r=>Convert.ToHexString(SHA256.HashData(r.CreateReader().ToArray())));
              Need(res.Count==res2.Count&&res.All(x=>res2.GetValueOrDefault(x.Key)==x.Value),"Resource bytes");
              var secondMethods=second.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToArray();
              Need(secondMethods.Length==6&&!secondMethods.SelectMany(m=>m.Body.Instructions).Any(i=>i.OpCode==OpCodes.Ldstr&&i.Operand is string s&&Cjk(s)),"Secondary module no residual CJK");
              // Reference cases derived from the verified ordered Replace operands, not a game load.
              var rename=dest["System.String GeorgioToElueym.ModEntry::RenameText(System.String)"];
              var seq=rename.Body.Instructions.ToArray();
              var pairs=Enumerable.Range(2,seq.Length-2).Where(n=>seq[n].Operand is IMethod m&&m.FullName=="System.String System.String::Replace(System.String,System.String)").Select(n=>((string)seq[n-2].Operand,(string)seq[n-1].Operand)).ToArray();
              Need(pairs.Length==9,"Rename pairs");
              string? Run(string? s){if(s==null)return null;foreach(var p in pairs)s=s.Replace(p.Item1,p.Item2);return s;}
              var cases=new (string?,string?)[]{(null,null),("乔治奥","Elueym"),("Georgio","Elueym"),("杰克逊博士","“군벌”"),("Dr. Jackson","“군벌”"),("STM博士","“군벌”"),("Dr. STM","“군벌”"),("杰克逊投资","“군벌” 투자"),("Jackson Investment","“군벌” 투자"),("STM Investment","“군벌” 투자"),("unrelated","unrelated"),("Elueym","Elueym"),("“군벌” 투자","“군벌” 투자")};
              foreach(var (input,expected) in cases)Need(Run(input)==expected,"Reference case "+input);
              File.Move(temp,file,true);Need(Hash(other)==otherHash,"Secondary binary untouched");
              File.WriteAllText(report,JsonSerializer.Serialize(new{inputHash,finalDllSHA256=Hash(file),secondarySHA256=otherHash,mainMethodsCompared=compared,secondaryMethods=secondMethods.Length,patchedSites=changed,uniqueOutputGroups=5,protectedSearchSites=protectedSites.Length,protectedSites,resourceCount=res.Count,referenceCases=cases.Length,secondaryUnchanged=true,remainingUnclassifiedOutput=0,actualGameRuntimeTest=false,scope="Audited output operands only. Korean-source aliases not added without verified original game localization; original mod search and behavior unchanged.",sites=specs},new JsonSerializerOptions{WriteIndented=true,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping})+"\n");
            }
          }
          CS
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          MOD="$ROOT/3843110449"
          mkdir -p "$ROOT/번역대조표"
          dotnet run --project /tmp/elueym/elueym.csproj -- "$MOD/GeorgioToElueym.dll" "$MOD/ToElueym.dll" "$ROOT/번역대조표/Elueym_FINAL_RESULT_20261122.json"
      - name: Verify manifest and final overlay archive
        shell: bash
        run: |
          python3 - <<'PY'
          import json,hashlib,xml.etree.ElementTree as ET
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          root=Path('probably-stolen/local-mods/TentacleMod번역')
          mod=root/'3843110449'
          orig=Path('probably-stolen/local-mods/TentacleMod/3843110449')
          p=root/'번역대조표/Elueym_FINAL_RESULT_20261122.json'
          j=json.loads(p.read_text())
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha(mod/'GeorgioToElueym.dll')==j['finalDllSHA256']
          assert sha(mod/'ToElueym.dll')==j['secondarySHA256']
          a,b=ET.parse(orig/'manifest.xml').getroot(),ET.parse(mod/'manifest.xml').getroot()
          for k in ('ID','Author','ModVersion','GameVersions','Prerequisites','Assemblies','Capabilities'):
              assert ET.tostring(a.find(k))==ET.tostring(b.find(k)),k
          assert [x.text for x in b.find('Assemblies')]==['GeorgioToElueym.dll','ToElueym.dll']
          readme=mod/'README_ko.txt'
          readme.write_text('3843110449 — 조르지오를 Elueym으로 교체 / ToElueym v1.1.0\n원본 모드 폴더를 백업하고 DLL 2개와 manifest.xml을 덮어쓰세요. 원본 Textures 폴더 및 나머지 파일은 유지해야 합니다.\n감사 기준 표시값 5종 / 9곳 한국어화. 기존 검색 문자열, 메서드, 보조 DLL 및 리소스 유지. 실제 게임 실행 미검증.\n',encoding='utf-8')
          j.update(manifestIdentityPreserved=True,externalReview='Original author name and retained English character name; archive replaces DLLs and manifest, preserves original textures.')
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          out=root/'ProbablyStolen_Elueym_v1.1.0_KO_Final_20261122.zip'
          files=['GeorgioToElueym.dll','ToElueym.dll','manifest.xml','README_ko.txt']
          with ZipFile(out,'w',ZIP_DEFLATED) as z:
              for f in files: z.write(mod/f,'3843110449/'+f)
              z.write(p,'STATIC_AUDIT.json')
          with ZipFile(out) as z:
              assert z.testzip() is None and len(z.namelist())==5
              for f in files: assert hashlib.sha256(z.read('3843110449/'+f)).hexdigest()==sha(mod/f)
          j['archive']={'path':out.name,'sha256':sha(out),'size':out.stat().st_size,'files':5,'crc':'pass','matchesAllOverlayFiles':True}
          p.write_text(json.dumps(j,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:v for k,v in j.items() if k not in ('sites','protectedSites')},ensure_ascii=False))
          PY
      - name: Commit only patched DLL, instructions, report and verified ZIP
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          ROOT='probably-stolen/local-mods/TentacleMod번역'
          git add --sparse "$ROOT/3843110449/GeorgioToElueym.dll" "$ROOT/3843110449/README_ko.txt" "$ROOT/번역대조표/Elueym_FINAL_RESULT_20261122.json" "$ROOT/ProbablyStolen_Elueym_v1.1.0_KO_Final_20261122.zip"
          git diff --cached --quiet || (git commit -m 'Finalize Elueym Korean replacement results without modifying search keys' && git push origin main)
