name: Temp inspect item spawner module ids

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-inspect-item-spawner-module-ids.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/Managed/Assembly-CSharp.dll
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
      - name: Decompile selected
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          DLL=probably-stolen/Managed/Assembly-CSharp.dll
          for T in ItemSpawner DebugPanel ModuleEffectHelper; do
            "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -t "$T" "$DLL" > "$RUNNER_TEMP/out/$T.cs" || true
          done
      - uses: actions/upload-artifact@v4
        with:
          name: item-spawner-module-ids-inspect
          path: ${{ runner.temp }}/out
          if-no-files-found: error
