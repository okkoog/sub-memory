name: Temp inspect debug item spawner catalog

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-inspect-debug-item-spawner-catalog.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/Managed/Assembly-CSharp.dll
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
      - name: Decompile all and search spawner UI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src" "$RUNNER_TEMP/out"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p -o "$RUNNER_TEMP/src" probably-stolen/Managed/Assembly-CSharp.dll
          python3 - <<'PY'
          import pathlib, os, re, shutil
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'src'
          out=pathlib.Path(os.environ['RUNNER_TEMP'])/'out'
          pats=['filter by identifier','Stack x10','Item Spawner','preBuiltItems','DirectoryMaster.item','Open Debug Spawner']
          contexts=[]
          files=set()
          for p in root.rglob('*.cs'):
              txt=p.read_text(encoding='utf-8',errors='replace')
              lines=txt.splitlines()
              for i,l in enumerate(lines):
                  if any(x.lower() in l.lower() for x in pats):
                      files.add(p)
                      a=max(0,i-20); b=min(len(lines),i+50)
                      contexts.append(f'### {p.relative_to(root)}:{i+1}\n'+'\n'.join(f'{j+1:05d}: {lines[j]}' for j in range(a,b)))
          (out/'contexts.txt').write_text('\n\n'.join(contexts),encoding='utf-8')
          for p in files:
              dst=out/p.relative_to(root); dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(p,dst)
          print('matched files', len(files))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: debug-item-spawner-catalog-inspect
          path: ${{ runner.temp }}/out
          if-no-files-found: error
