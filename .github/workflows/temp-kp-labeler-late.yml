name: Temp build KoreanPack labeler late fix

on:
  push:
    branches: [main]
    paths:
      - "probably-stolen/tmp/kp_labeler_late_patch.py"
      - ".github/workflows/temp-kp-labeler-late.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download exact working labeler build
        uses: actions/download-artifact@v4
        with:
          name: ProbablyStolenKoreanPack-LabelerTimingFix
          path: ${{ runner.temp }}/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: okkoog/sub-memory
          run-id: 42310100243

      - name: Verify input DLL
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/input/ProbablyStolenKoreanPack_LabelerTimingFix.dll"
          echo "ef49598c78a1f47c25126cca2ce217ff59cc457fda4e0b8e4a6a9cfa632a2ba2  $RUNNER_TEMP/input/ProbablyStolenKoreanPack_LabelerTimingFix.dll" | sha256sum -c -

      - name: Decompile exact input
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
          mkdir -p "$RUNNER_TEMP/src"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p -r probably-stolen/Managed -o "$RUNNER_TEMP/src" "$RUNNER_TEMP/input/ProbablyStolenKoreanPack_LabelerTimingFix.dll"

      - name: Restore water and defer label patch
        shell: bash
        run: |
          set -euo pipefail
          python3 probably-stolen/tmp/kp_labeler_late_patch.py

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet build "$RUNNER_TEMP/build/ProbablyStolenKoreanPack.csproj" -c Release --nologo
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/build/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll" "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_LabelerLateFix.dll"
          sha256sum "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_LabelerLateFix.dll" > "$RUNNER_TEMP/out/SHA256.txt"

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -r probably-stolen/Managed -t ProbablyStolenKoreanPack.KoreanPack "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_LabelerLateFix.dll" > "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -r probably-stolen/Managed -t ProbablyStolenKoreanPack.WaterNameCompatibility "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_LabelerLateFix.dll" > "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"

          grep -q "0.8.2-labeler-latefix" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "OnGameLoadedLate += EnableLabelerConditionRepairLate" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "Labeler condition repair armed after game load" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "RepairForLabeler" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "Water name compatibility: liquids=" "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"

          if grep -q "RepairFeatureCategoryNames" "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"; then
            echo "FAIL: water module still contains label feature cache repair" >&2
            exit 1
          fi
          if grep -q "RepairConditionLookup" "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"; then
            echo "FAIL: water module still scans full condition cache" >&2
            exit 1
          fi
          if grep -q "RepairForLabeler" "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"; then
            echo "FAIL: label repair still coupled to water module" >&2
            exit 1
          fi
          python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"out"/"KoreanPack.verify.cs"; s=p.read_text(); a=s[s.index("public void OnEnable()"):s.index("public void OnDisable()",s.index("public void OnEnable()"))]; assert "EnableLabelerConditionRepair();" not in a, "Harmony still armed in OnEnable"; print("OnEnable verification passed")'
          if grep -q "CorpPresence" "$RUNNER_TEMP/out/KoreanPack.verify.cs"; then
            echo "FAIL: unexpected CorpPresence-specific code" >&2
            exit 1
          fi

          printf "Verified: original water compatibility restored; labeler Harmony is armed only after OnGameLoadedLate; label repair is scoped to the opened item/category.\n" > "$RUNNER_TEMP/out/VERIFIED.txt"
          stat -c "%n %s bytes" "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_LabelerLateFix.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: ProbablyStolenKoreanPack-LabelerLateFix
          path: ${{ runner.temp }}/out
          if-no-files-found: error
