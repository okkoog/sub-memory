name: Temp build KoreanPack cache fix 3 safe

on:
  push:
    branches: [main]
    paths:
      - "probably-stolen/tmp/kp_cachefix3_safe_patch.py"
      - ".github/workflows/temp-kp-cachefix3-safe.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/tmp/kp_cachefix3_safe_patch.py
            probably-stolen/Managed/Assembly-CSharp.dll
            probably-stolen/Managed/0Harmony.dll
            probably-stolen/Managed/Unity.Localization.dll
            probably-stolen/Managed/Unity.ResourceManager.dll
            probably-stolen/Managed/UnityEngine.CoreModule.dll
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download known-good cachefix base
        uses: actions/download-artifact@v4
        with:
          name: ProbablyStolenKoreanPack-CacheFix
          path: ${{ runner.temp }}/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: okkoog/sub-memory
          run-id: 42428214133

      - name: Verify exact base
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/input/ProbablyStolenKoreanPack_CacheFix.dll"
          echo "0c077a0a0f5e3a92dd08a7626bdaaf93fb699023cffd750ad63ea1fc4d564438  $RUNNER_TEMP/input/ProbablyStolenKoreanPack_CacheFix.dll" | sha256sum -c -

      - name: Decompile base
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
          mkdir -p "$RUNNER_TEMP/src"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p \
            -r probably-stolen/Managed \
            -o "$RUNNER_TEMP/src" \
            "$RUNNER_TEMP/input/ProbablyStolenKoreanPack_CacheFix.dll"

      - name: Apply safe patch
        shell: bash
        run: |
          set -euo pipefail
          python3 probably-stolen/tmp/kp_cachefix3_safe_patch.py

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet build "$RUNNER_TEMP/build/ProbablyStolenKoreanPack.csproj" -c Release --nologo
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/build/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll" \
             "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CacheFix3_Safe.dll"
          sha256sum "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CacheFix3_Safe.dll" > "$RUNNER_TEMP/out/SHA256.txt"

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -r probably-stolen/Managed \
            -t ProbablyStolenKoreanPack.KoreanPack \
            "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CacheFix3_Safe.dll" > "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -r probably-stolen/Managed \
            -t ProbablyStolenKoreanPack.FishingStartPerkCompatibility \
            "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CacheFix3_Safe.dll" > "$RUNNER_TEMP/out/FishingStartPerkCompatibility.verify.cs"

          grep -q "0.8.2-cachefix3-safe" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "RelocalizeIfMissing" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "Late Item cache repair" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "conditionFoodFreshness" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "conditionModuleStuck" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "ModuleEffectHelper.moduleEffects" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "ps-fishing-gameplay" "$RUNNER_TEMP/out/FishingStartPerkCompatibility.verify.cs"

          for forbidden in 'GetTableAsync("Item"' 'RequestItemTableRepair' 'itemTableRepairGeneration' 'AsyncOperationHandle<StringTable>'; do
            if grep -Fq "$forbidden" "$RUNNER_TEMP/out/KoreanPack.verify.cs"; then
              echo "FAIL: dangerous early async localization code remains: $forbidden" >&2
              exit 1
            fi
          done
          if grep -q "CorpPresence" "$RUNNER_TEMP/out/KoreanPack.verify.cs"; then
            echo "FAIL: unexpected CorpPresence-specific code" >&2
            exit 1
          fi
          printf "Verified: built from known-good cachefix base; no early Item-table async load; Chem Finisher repair runs only in OnGameLoadedLate and uses LocHelper.RelocalizeIfMissing.\n" > "$RUNNER_TEMP/out/VERIFIED.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: ProbablyStolenKoreanPack-CacheFix3-Safe
          path: ${{ runner.temp }}/out
          if-no-files-found: error
