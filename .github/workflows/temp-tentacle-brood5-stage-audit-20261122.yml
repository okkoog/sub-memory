name: Audit Brood five stage strings
on:
  push:
    paths:
      - .github/workflows/temp-tentacle-brood5-stage-audit-20261122.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod번역/lewdMemeBrood v0331
            probably-stolen/local-mods/TentacleMod번역/번역대조표
          sparse-checkout-cone-mode: false
      - name: Inspect exact five labels and all IL callsites
        shell: bash
        run: |
          dotnet new console --framework net8.0 --force -o /tmp/brood5-audit
          dotnet add /tmp/brood5-audit/brood5-audit.csproj package dnlib --version 4.5.0
          cat > /tmp/brood5-audit/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class Program {
            static int Main() {
              var path="probably-stolen/local-mods/TentacleMod번역/lewdMemeBrood v0331/LewdMemeBrood.dll";
              string[] search={"萝莉 → 少女","少女 → 御姐","御姐 → 少妇","少妇 → 熟女","熟女为止"};
              var lines=new List<string>{"# Brood five stage strings: real IL callsites (2026-11-22)","",
                "DLL: `"+path+"`",""};
              using var module=ModuleDefMD.Load(path);
              int found=0;
              foreach(var type in module.GetTypes()) {
                foreach(var method in type.Methods.Where(m=>m.HasBody)) {
                  var ins=method.Body.Instructions;
                  for(int i=0;i<ins.Count;i++) {
                    if(ins[i].OpCode!=OpCodes.Ldstr)continue;
                    var value=(string)(ins[i].Operand??"");
                    if(!search.Contains(value))continue;
                    found++;
                    lines.Add("## "+type.FullName+" :: "+method.FullName);
                    lines.Add("- target: `"+value+"`");
                    lines.Add("- method instructions: "+ins.Count);
                    lines.Add("```cil");
                    for(int j=Math.Max(0,i-12);j<=Math.Min(ins.Count-1,i+12);j++) {
                      var op=ins[j];
                      var operand=op.Operand?.ToString()?.Replace("\r","\\r").Replace("\n","\\n")??"";
                      lines.Add((j==i?"TARGET ":"       ")+op.Offset.ToString("X4")+" "+op.OpCode.Name+" "+operand);
                    }
                    lines.Add("```");
                    lines.Add("");
                  }
                }
              }
              lines.Add("Found string references: "+found);
              lines.Add("Caution: this document is a static audit and does not certify runtime behavior.");
              var output="probably-stolen/local-mods/TentacleMod번역/번역대조표/Brood_STAGE_5_IL_CALLSITE_AUDIT_20261122.md";
              File.WriteAllText(output,string.Join("\n",lines)+"\n");
              Console.WriteLine(string.Join("\n",lines));
              if(found<5)throw new Exception("Fewer than five literal references found: "+found);
              return 0;
            }
          }
          CS
          dotnet run --project /tmp/brood5-audit/brood5-audit.csproj -c Release
      - name: Commit callsite audit only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse probably-stolen/local-mods/TentacleMod번역/번역대조표/Brood_STAGE_5_IL_CALLSITE_AUDIT_20261122.md
          git commit -m 'audit(tentacle): identify Brood stage-label IL uses'
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep 3
          done
          exit 1
