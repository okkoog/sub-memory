name: Tentacle exact original README filenames in final patches and Bai She metadata
on:
  push:
    paths: [.github/workflows/temp-tentacle-readme-original-name-pack-20261121.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/3842247788/README.txt
            probably-stolen/local-mods/TentacleMod/落魄千金-埃莉诺 v1.0.3/README.txt
            probably-stolen/local-mods/TentacleMod/3842259965/README.txt
            probably-stolen/local-mods/TentacleMod/Bai She's R18 Texture Pack 1.4.0/manifest.xml
            probably-stolen/local-mods/TentacleMod번역/3842247788
            probably-stolen/local-mods/TentacleMod번역/落魄千金-埃莉诺 v1.0.3
            probably-stolen/local-mods/TentacleMod번역/3842259965
            probably-stolen/local-mods/TentacleMod번역/Bai She's R18 Texture Pack 1.4.0
            probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_Eleanor_v1.0.0_DLL_KO_1541_20261121.zip
            probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_Eleanor_v1.0.3_DLL_KO_Isolated_1553_20261121.zip
            probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_AdultGoods_v1.1.1_DLL_KO_181_20261121.zip
          sparse-checkout-cone-mode: false
      - name: Check exact readme names, source manifest version and binary overlay coherence
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,xml.etree.ElementTree as ET
          root=Path('probably-stolen/local-mods')
          ko=root/'TentacleMod번역'
          for folder in ['3842247788','落魄千金-埃莉诺 v1.0.3','3842259965']:
              assert (root/'TentacleMod'/folder/'README.txt').exists()
              data=(ko/folder/'README.txt').read_text(encoding='utf-8')
              assert len(data)>800 and ('설치' in data)
              assert (ko/folder/'README_ko.txt').exists()
          folder="Bai She's R18 Texture Pack 1.4.0"
          src=(root/'TentacleMod'/folder/'manifest.xml').read_text(encoding='utf-8')
          dst=(ko/folder/'manifest.xml').read_text(encoding='utf-8')
          replace=lambda s:re.sub(r'<Description>[\s\S]*?</Description>','<Description/>',
                         re.sub(r'<Name>[^<]*</Name>','<Name/>',s))
          assert replace(src)==replace(dst)
          assert ET.fromstring(src).findtext('ModVersion')==ET.fromstring(dst).findtext('ModVersion')=='1.4.0'
          assert '반신' in (ko/folder/'使用说明.txt').read_text(encoding='utf-8')
          print('All source README and special Bai She manifest names verified.')
          PY
      - name: Extend the 3 existing DLL archives with source-named Korean instructions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import hashlib
          root=Path('probably-stolen/local-mods/TentacleMod번역')
          plans=[
              ('ProbablyStolen_Eleanor_v1.0.0_DLL_KO_1541_20261121.zip','3842247788','fallen_heiress_eleanor.dll'),
              ('ProbablyStolen_Eleanor_v1.0.3_DLL_KO_Isolated_1553_20261121.zip','落魄千金-埃莉诺 v1.0.3','fallen_heiress_eleanor.dll'),
              ('ProbablyStolen_AdultGoods_v1.1.1_DLL_KO_181_20261121.zip','3842259965','probably_adult_goods.dll')
          ]
          for name,folder,dll in plans:
              z=root/name
              with ZipFile(z) as f:
                  assert f.testzip() is None
                  items=[(n,f.read(n)) for n in f.namelist()]
              assert any(n==folder+'/'+dll for n,d in items)
              # Update the same root-level readme if present, else append.
              title=folder+'/README.txt'
              data=(root/folder/'README.txt').read_bytes()
              items=[(n,(data if n==title else d)) for n,d in items]
              if not any(n==title for n,d in items):items.append((title,data))
              tmp=z.with_suffix('.new')
              with ZipFile(tmp,'w',ZIP_DEFLATED,compresslevel=6) as f:
                  for n,d in items:f.writestr(n,d)
              with ZipFile(tmp) as f:
                  assert f.testzip() is None
                  assert f.read(title)==data
                  assert f.read(folder+'/'+dll)==(root/folder/dll).read_bytes()
              tmp.replace(z)
              print(name,len(items),z.stat().st_size,hashlib.sha256(z.read_bytes()).hexdigest())
          PY
      - name: Package Bai She native-original-image-safe translated metadata only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import hashlib
          root=Path('probably-stolen/local-mods/TentacleMod번역')
          folder="Bai She's R18 Texture Pack 1.4.0"
          z=root/'ProbablyStolen_BaiShe_TexturePack_v1.4.0_Metadata_KO_20261121.zip'
          with ZipFile(z,'w',ZIP_DEFLATED,compresslevel=6) as f:
              for n in ['manifest.xml','使用说明.txt','README_ko.txt']:
                  f.write(root/folder/n,arcname=folder+'/'+n)
          with ZipFile(z) as f:
              assert f.testzip() is None and len(f.namelist())==3
              assert all(f.read(folder+'/'+n)==(root/folder/n).read_bytes() for n in ['manifest.xml','使用说明.txt','README_ko.txt'])
          print(z.name,z.stat().st_size,hashlib.sha256(z.read_bytes()).hexdigest())
          PY
      - name: Commit four verified archives
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse \
            'probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_Eleanor_v1.0.0_DLL_KO_1541_20261121.zip' \
            'probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_Eleanor_v1.0.3_DLL_KO_Isolated_1553_20261121.zip' \
            'probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_AdultGoods_v1.1.1_DLL_KO_181_20261121.zip' \
            'probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_BaiShe_TexturePack_v1.4.0_Metadata_KO_20261121.zip'
          if ! git diff --cached --quiet; then
            git commit -m 'pack(tentacle): preserve original README filenames and ship Bai She Korean metadata'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
