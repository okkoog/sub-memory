name: Tentacle content translation final standalone overlay bundles
on:
  push:
    paths:
      - '.github/workflows/temp-tentacle-legacy-daily-content-ko-pack-20261121.yml'
  workflow_dispatch:
permissions: {contents: write}
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/LewdMemeLegacyContent-1.0.6-48sounds/Content/content.json
            probably-stolen/local-mods/TentacleMod/起飞攻速装-v1.1.3抢先体验版（修bug）/manifest.xml
            probably-stolen/local-mods/TentacleMod/起飞攻速装-v1.1.3抢先体验版（修bug）/使用说明.txt
            probably-stolen/local-mods/TentacleMod번역/LewdMemeLegacyContent-1.0.6-48sounds/Content/content.json
            probably-stolen/local-mods/TentacleMod번역/LewdMemeLegacyContent-1.0.6-48sounds/README_ko.txt
            probably-stolen/local-mods/TentacleMod번역/起飞攻速装-v1.1.3抢先体验版（修bug）/manifest.xml
            probably-stolen/local-mods/TentacleMod번역/起飞攻速装-v1.1.3抢先体验版（修bug）/使用说明.txt
            probably-stolen/local-mods/TentacleMod번역/번역대조표/LegacyContent_v1.0.6_CONTENT_JSON_AUDIT_20261121.md
          sparse-checkout-cone-mode: false
      - name: Verify all translated rows, untouched selectors and original version
        shell: bash
        run: |
          python3 - <<'PY'
          import json,re,hashlib
          from pathlib import Path
          base=Path('probably-stolen/local-mods')
          root=base/'TentacleMod번역'
          legacy='LewdMemeLegacyContent-1.0.6-48sounds'
          source=json.loads((base/'TentacleMod'/legacy/'Content/content.json').read_text(encoding='utf-8'))
          translated=json.loads((root/legacy/'Content/content.json').read_text(encoding='utf-8'))
          assert source['schemaVersion']==translated['schemaVersion']
          assert source['addressWeights']==translated['addressWeights']
          assert source['descriptions']['nightScenes']==translated['descriptions']['nightScenes']
          assert list(source)==list(translated)
          patt=lambda s:sorted(re.findall(r'\{[^{}]+\}',s))
          assert len(source['descriptions']['entries'])==len(translated['descriptions']['entries'])==72
          changed=0
          for a,b in zip(source['descriptions']['entries'],translated['descriptions']['entries']):
              assert a['key']==b['key'] and patt(a['value'])==patt(b['value'])
              changed+=a['value']!=b['value']
          assert changed==70
          label_changed=0
          for family in source['labels']:
              x,y=source['labels'][family],translated['labels'][family]
              assert len(x)==len(y)
              for a,b in zip(x,y):
                  assert a['id']==b['id']
                  label_changed+=a['display']!=b['display']
          assert label_changed==52
          dialogue_changed=dialogue_same=0
          def rows(x,y):
              global dialogue_changed,dialogue_same
              assert len(x)==len(y)
              for a,b in zip(x,y):
                  assert patt(a)==patt(b)
                  dialogue_changed+=a!=b
                  dialogue_same+=a==b
          A,B=source['dialogue'],translated['dialogue']
          rows(A['onomatopoeia'],B['onomatopoeia'])
          for key in ['combos','bodyLines','personalityLines','factionLines']:
              assert len(A[key])==len(B[key])
              for a,b in zip(A[key],B[key]):
                  assert {k:v for k,v in a.items() if k!='lines'}=={k:v for k,v in b.items() if k!='lines'}
                  rows(a['lines'],b['lines'])
          for key in ['bigBreastLines','kinkLines','firstLines','ovulatingLines','pregnantLines','climaxLines']:
              rows(A[key],B[key])
          assert (dialogue_changed,dialogue_same)==(170,28)
          assert source['manifest']['name']!=translated['manifest']['name']
          assert source['manifest']['description']!=translated['manifest']['description']
          guide='起飞攻速装-v1.1.3抢先体验版（修bug）'
          original_manifest=(base/'TentacleMod'/guide/'manifest.xml').read_text(encoding='utf-8')
          ko_manifest=(root/guide/'manifest.xml').read_text(encoding='utf-8')
          clear=lambda s:re.sub(r'<Description>[^<]*</Description>','<Description/>',
                          re.sub(r'<Name>[^<]*</Name>','<Name/>',s))
          assert clear(original_manifest)==clear(ko_manifest)
          assert '<ModVersion>1.1.1</ModVersion>' in ko_manifest
          assert (root/guide/'使用说明.txt').read_text(encoding='utf-8').count('v1.')>=10
          print(f'Checked 70/72 descriptions, 52/53 display labels, 170/198 dialogues, 5 original night scenes, original manifest identity preserved.')
          PY
      - name: Package each original-version overlay with integrity checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import hashlib
          root=Path('probably-stolen/local-mods/TentacleMod번역')
          config=[
            ('ProbablyStolen_LegacyContent_v1.0.6_Content_KO_170of198_20261121.zip',
             [('LewdMemeLegacyContent-1.0.6-48sounds/Content/content.json','LewdMemeLegacyContent-1.0.6-48sounds/Content/content.json'),
              ('LewdMemeLegacyContent-1.0.6-48sounds/README_ko.txt','LewdMemeLegacyContent-1.0.6-48sounds/README_ko.txt'),
              ('번역대조표/LegacyContent_v1.0.6_CONTENT_JSON_AUDIT_20261121.md','STATIC_AUDIT.md')]),
            ('ProbablyStolen_DailyWearWorkshop_v1.1.1_Manifest_Manual_KO_20261121.zip',
             [('起飞攻速装-v1.1.3抢先体验版（修bug）/manifest.xml','起飞攻速装-v1.1.3抢先体验版（修bug）/manifest.xml'),
              ('起飞攻速装-v1.1.3抢先体验版（修bug）/使用说明.txt','起飞攻速装-v1.1.3抢先体验版（修bug）/使用说明.txt')])
          ]
          for name,entries in config:
              file=root/name
              with ZipFile(file,'w',ZIP_DEFLATED,compresslevel=6) as z:
                  for src,dst in entries:z.write(root/src,arcname=dst)
              with ZipFile(file) as z:
                  assert z.testzip() is None
                  assert len(z.namelist())==len(entries)
                  for src,dst in entries:assert z.read(dst)==(root/src).read_bytes()
              print(name, file.stat().st_size,'bytes, sha256',hashlib.sha256(file.read_bytes()).hexdigest())
          PY
      - name: Commit both verified content overlays
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse \
            'probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_LegacyContent_v1.0.6_Content_KO_170of198_20261121.zip' \
            'probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_DailyWearWorkshop_v1.1.1_Manifest_Manual_KO_20261121.zip'
          if ! git diff --cached --quiet; then
            git commit -m 'pack(tentacle): ship source-verified LegacyContent 170 dialogues and DailyWear Korean docs'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
