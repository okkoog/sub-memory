name: Eleanor v1.0.3 UI-only Chinese label caller graph audit
on:
  push:
    paths: [.github/workflows/temp-tentacle-eleanor-ui-callflow-20261121.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/落魄千金-埃莉诺 v1.0.3/fallen_heiress_eleanor.dll
            probably-stolen/local-mods/TentacleMod번역/번역대조표
          sparse-checkout-cone-mode: false
      - name: Audit display candidate callers, branches and field writes
        shell: bash
        run: |
          dotnet new console -f net8.0 -o /tmp/eleanor_flow --force
          dotnet add /tmp/eleanor_flow/eleanor_flow.csproj package dnlib --version 4.5.0
          cat >/tmp/eleanor_flow/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Text;
          using System.Collections.Generic;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P{
            static void Main(string[] args){
              using var m=ModuleDefMD.Load(args[0]);
              var methods=m.GetTypes().SelectMany(t=>t.Methods.Where(m=>m.HasBody)).ToArray();
              var wanted=new[]{
                "ProbablyEleanorFollowup.DownfallNote::TrySpawn",
                "ProbablyEleanorFollowup.EmbeddedAssets::DisplayName",
                "ProbablyEleanorFollowup.ModEntry::Init",
                "ProbablyEleanorFollowup.SpriteGuard::Tick",
                "ProbablyEleanorFollowup.Loc::.cctor"
              };
              var lines=new List<string>{"# Original Eleanor v1.0.3 Chinese-only IL user-visible candidates\n"};
              foreach(string pattern in wanted){
                var hits=methods.Where(m=>m.FullName.Contains(pattern)).ToArray();
                lines.Add("## "+pattern+" ("+hits.Length+" methods)");
                foreach(var method in hits){
                  lines.Add("### "+method.FullName);
                  foreach(var ins in method.Body.Instructions)lines.Add("- "+ins.ToString());
                  var callers=methods.Where(other=>other.Body.Instructions.Any(x=>
                    x.Operand is IMethod im && im.FullName==method.FullName && (x.OpCode==OpCodes.Call || x.OpCode==OpCodes.Callvirt)))
                    .Select(other=>other.FullName).Distinct().Take(40).ToArray();
                  lines.Add("Callers: "+string.Join("; ",callers)+"\n");
                }
              }
              File.WriteAllLines(args[1],lines,new UTF8Encoding(false));
              Console.WriteLine("Report chars "+lines.Sum(x=>x.Length));
            }
          }
          CS
          dotnet run --project /tmp/eleanor_flow/eleanor_flow.csproj -- \
            'probably-stolen/local-mods/TentacleMod/落魄千金-埃莉诺 v1.0.3/fallen_heiress_eleanor.dll' \
            'probably-stolen/local-mods/TentacleMod번역/번역대조표/Eleanor_v1.0.3_UI_LABEL_CALLFLOW_20261121.md'
      - name: Commit audit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse probably-stolen/local-mods/TentacleMod번역/번역대조표/Eleanor_v1.0.3_UI_LABEL_CALLFLOW_20261121.md
          if ! git diff --cached --quiet; then
            git commit -m 'audit(tentacle): identify safe display-only string callsites in Eleanor'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
