name: Temp Corp repair user DLL main runner

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/temp-corp-repair-userdll-main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-corp-repair-userdll

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Reconstruct exact user DLL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/input"
          cat probably-stolen/tmp/corp-repair-input/part*.b64 | base64 -d > "$RUNNER_TEMP/input/ProbablyStolenKoreanPack_user.dll"
          echo "b0417f1bc43ccf6b33ca97cda3b26b3d30bcd40490039f0681debe21e4610b0a  $RUNNER_TEMP/input/ProbablyStolenKoreanPack_user.dll" | sha256sum -c -
          stat -c '%n %s bytes' "$RUNNER_TEMP/input/ProbablyStolenKoreanPack_user.dll"

      - name: Decompile exact user DLL
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
          mkdir -p "$RUNNER_TEMP/src"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p             -r probably-stolen/Managed             -o "$RUNNER_TEMP/src"             "$RUNNER_TEMP/input/ProbablyStolenKoreanPack_user.dll"
          cp -a "$RUNNER_TEMP/src" "$RUNNER_TEMP/src-before"
          test -f "$RUNNER_TEMP/src/ProbablyStolenKoreanPack/KoreanPack.cs"
          test -f "$RUNNER_TEMP/src/ProbablyStolenKoreanPack/WaterNameCompatibility.cs"
          test -f "$RUNNER_TEMP/src/ProbablyStolenKoreanPack/FishingStartPerkCompatibility.cs"

      - name: Apply only Corp postload localization isolation
        shell: bash
        run: |
          set -euo pipefail
          python3 probably-stolen/tmp/corp-repair-input/apply_corp_postload_fix.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os
          before=Path(os.environ['RUNNER_TEMP'])/'src-before'
          after=Path(os.environ['RUNNER_TEMP'])/'src'
          def sha(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          changed=[]
          for p in before.rglob('*'):
              if not p.is_file(): continue
              rel=p.relative_to(before)
              q=after/rel
              if not q.exists() or sha(p)!=sha(q):
                  changed.append(str(rel))
          for q in after.rglob('*'):
              if not q.is_file(): continue
              rel=q.relative_to(after)
              if not (before/rel).exists():
                  changed.append(str(rel))
          changed=sorted(set(changed))
          print('CHANGED_SOURCE_FILES=', changed)
          expected=['ProbablyStolenKoreanPack/WaterNameCompatibility.cs']
          if changed != expected:
              raise SystemExit('Unexpected source changes: '+repr(changed))
          PY
          diff -u "$RUNNER_TEMP/src-before/ProbablyStolenKoreanPack/WaterNameCompatibility.cs"                   "$RUNNER_TEMP/src/ProbablyStolenKoreanPack/WaterNameCompatibility.cs"                   > "$RUNNER_TEMP/CorpPostloadFix.diff" || true

      - name: Build patched DLL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build/ProbablyStolenKoreanPack"
          cp "$RUNNER_TEMP/src/ProbablyStolenKoreanPack/KoreanPack.cs" "$RUNNER_TEMP/build/ProbablyStolenKoreanPack/"
          cp "$RUNNER_TEMP/src/ProbablyStolenKoreanPack/WaterNameCompatibility.cs" "$RUNNER_TEMP/build/ProbablyStolenKoreanPack/"
          cp "$RUNNER_TEMP/src/ProbablyStolenKoreanPack/FishingStartPerkCompatibility.cs" "$RUNNER_TEMP/build/ProbablyStolenKoreanPack/"
          cat > "$RUNNER_TEMP/build/ProbablyStolenKoreanPack.csproj" <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>netstandard2.1</TargetFramework>
              <AssemblyName>ProbablyStolenKoreanPack</AssemblyName>
              <RootNamespace>ProbablyStolenKoreanPack</RootNamespace>
              <LangVersion>latest</LangVersion>
              <Nullable>disable</Nullable>
              <ImplicitUsings>disable</ImplicitUsings>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <Deterministic>true</Deterministic>
              <AssemblyVersion>0.8.2.0</AssemblyVersion>
              <FileVersion>0.8.2.5</FileVersion>
              <InformationalVersion>0.8.2-cachefix3-safe</InformationalVersion>
            </PropertyGroup>
            <ItemGroup>
              <Compile Include="ProbablyStolenKoreanPack/KoreanPack.cs" />
              <Compile Include="ProbablyStolenKoreanPack/WaterNameCompatibility.cs" />
              <Compile Include="ProbablyStolenKoreanPack/FishingStartPerkCompatibility.cs" />
              <Reference Include="Assembly-CSharp"><HintPath>${GITHUB_WORKSPACE}/probably-stolen/Managed/Assembly-CSharp.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="0Harmony"><HintPath>${GITHUB_WORKSPACE}/probably-stolen/Managed/0Harmony.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="Unity.Localization"><HintPath>${GITHUB_WORKSPACE}/probably-stolen/Managed/Unity.Localization.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="Unity.ResourceManager"><HintPath>${GITHUB_WORKSPACE}/probably-stolen/Managed/Unity.ResourceManager.dll</HintPath><Private>false</Private></Reference>
              <Reference Include="UnityEngine.CoreModule"><HintPath>${GITHUB_WORKSPACE}/probably-stolen/Managed/UnityEngine.CoreModule.dll</HintPath><Private>false</Private></Reference>
            </ItemGroup>
          </Project>
          EOF
          dotnet build "$RUNNER_TEMP/build/ProbablyStolenKoreanPack.csproj" -c Release --nologo
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/build/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll"              "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CorpPostloadFix.dll"
          cp "$RUNNER_TEMP/CorpPostloadFix.diff" "$RUNNER_TEMP/out/"
          sha256sum "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CorpPostloadFix.dll" > "$RUNNER_TEMP/out/SHA256.txt"

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -r probably-stolen/Managed             -t ProbablyStolenKoreanPack.WaterNameCompatibility             "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CorpPostloadFix.dll"             > "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -r probably-stolen/Managed             -t ProbablyStolenKoreanPack.KoreanPack             "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CorpPostloadFix.dll"             > "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -r probably-stolen/Managed             -t ProbablyStolenKoreanPack.FishingStartPerkCompatibility             "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CorpPostloadFix.dll"             > "$RUNNER_TEMP/out/FishingStartPerkCompatibility.verify.cs"

          grep -q 'localizationHooksReady' "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"
          grep -q 'EnsureLocalizationHooks' "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"
          grep -q 'BeforeWaterTooltip' "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q 'AuditWaterTooltip' "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q 'RestoreWaterFeatureAfterMods' "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q 'CoreGameWaterFeaturePostfix' "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q 'BeforeLabelerInit' "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q 'EnableLabelerConditionRepairLate' "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q 'ps-fishing-gameplay' "$RUNNER_TEMP/out/FishingStartPerkCompatibility.verify.cs"

          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path(os.environ['RUNNER_TEMP'])/'out'/'WaterNameCompatibility.verify.cs'
          s=p.read_text()
          a=s[s.index('internal void Enable()'):s.index('internal void Disable()',s.index('internal void Enable()'))]
          if 'LocalizationSettings' in a:
              raise SystemExit('FAIL: Enable still touches LocalizationSettings')
          r=s[s.index('private void Request()'):]
          r=r[:r.index('\n\tprivate ',1)]
          if 'EnsureLocalizationHooks();' not in r or '!worldReady' not in r:
              raise SystemExit('FAIL: Request is not postload-gated')
          print('Corp postload isolation verification passed')
          PY

          {
            echo 'Input SHA256: b0417f1bc43ccf6b33ca97cda3b26b3d30bcd40490039f0681debe21e4610b0a'
            echo "Output $(cat "$RUNNER_TEMP/out/SHA256.txt")"
            echo 'Source files changed: ProbablyStolenKoreanPack/WaterNameCompatibility.cs only'
            echo 'Verified: WaterNameCompatibility.Enable does not access LocalizationSettings.'
            echo 'Verified: Localization hooks attach lazily after worldReady via EnsureLocalizationHooks.'
            echo 'Verified retained: Labeler repair, water tooltip v3/v4 repair, native water restore-after-mods, fishing perk compatibility.'
          } > "$RUNNER_TEMP/out/VERIFIED.txt"
          stat -c '%n %s bytes' "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CorpPostloadFix.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: ProbablyStolenKoreanPack-CorpPostloadFix-UserDLL
          path: ${{ runner.temp }}/out
          if-no-files-found: error
