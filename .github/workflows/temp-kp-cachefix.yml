name: Temp build KoreanPack cache fix

on:
  push:
    branches: [main]
    paths:
      - "probably-stolen/tmp/kp_cachefix_patch.py"
      - ".github/workflows/temp-kp-cachefix.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/tmp/kp_cachefix_patch.py
            probably-stolen/Managed/Assembly-CSharp.dll
            probably-stolen/Managed/0Harmony.dll
            probably-stolen/Managed/Unity.Localization.dll
            probably-stolen/Managed/Unity.ResourceManager.dll
            probably-stolen/Managed/UnityEngine.CoreModule.dll
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download exact labeler-late base
        uses: actions/download-artifact@v4
        with:
          name: ProbablyStolenKoreanPack-LabelerLateFix
          path: ${{ runner.temp }}/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: okkoog/sub-memory
          run-id: 42319757586

      - name: Verify base DLL
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/input/ProbablyStolenKoreanPack_LabelerLateFix.dll"
          echo "8f999a172529cce365503e5a8f5e46c4c87cf1e95c093f2b6ddedc5ed8ca02dc  $RUNNER_TEMP/input/ProbablyStolenKoreanPack_LabelerLateFix.dll" | sha256sum -c -

      - name: Decompile exact base
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
          mkdir -p "$RUNNER_TEMP/src"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p             -r probably-stolen/Managed             -o "$RUNNER_TEMP/src"             "$RUNNER_TEMP/input/ProbablyStolenKoreanPack_LabelerLateFix.dll"

      - name: Apply cache repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 probably-stolen/tmp/kp_cachefix_patch.py

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet build "$RUNNER_TEMP/build/ProbablyStolenKoreanPack.csproj" -c Release --nologo
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/build/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll"              "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CacheFix.dll"
          sha256sum "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CacheFix.dll" > "$RUNNER_TEMP/out/SHA256.txt"

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -r probably-stolen/Managed             -t ProbablyStolenKoreanPack.KoreanPack             "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CacheFix.dll" > "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -r probably-stolen/Managed             -t ProbablyStolenKoreanPack.FishingStartPerkCompatibility             "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CacheFix.dll" > "$RUNNER_TEMP/out/FishingStartPerkCompatibility.verify.cs"

          grep -q "0.8.2-cachefix" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "conditionFoodFreshness" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "conditionModuleStuck" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "ModuleEffectHelper.moduleEffects" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "mech_module_effect_overvolted_desc" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "mech_module_effect_negative_feedback_desc" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "ChemFinisherRecipe.chemFinisherRecipes" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "item_pink_alt_injector_name" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "RepairConditionDisplays(includeItems: true)" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "ps-fishing-gameplay" "$RUNNER_TEMP/out/FishingStartPerkCompatibility.verify.cs"

          if grep -q "CorpPresence" "$RUNNER_TEMP/out/KoreanPack.verify.cs"; then
            echo "FAIL: unexpected CorpPresence-specific code" >&2
            exit 1
          fi
          printf "Verified: food freshness, module-stuck, module-effect name/description, chem-finisher recipe caches repair only stale Translation Error values; current fishing compatibility retained.\n" > "$RUNNER_TEMP/out/VERIFIED.txt"
          stat -c "%n %s bytes" "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CacheFix.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: ProbablyStolenKoreanPack-CacheFix
          path: ${{ runner.temp }}/out
          if-no-files-found: error
