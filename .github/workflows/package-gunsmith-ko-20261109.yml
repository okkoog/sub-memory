name: Package Gunsmith Korean CSV 2026-11-09
on:
  push:
    paths:
      - '.github/workflows/package-gunsmith-ko-20261109.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Package exact Korean translation CSV
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          src = Path('probably-stolen/번역 모드/Localization/pskb__3834619049.csv')
          data=src.read_text(encoding='utf-8-sig')
          assert data.count('K|nightlog_shady_buyer,')==1
          assert data.count('K|gsx_conversion_kit_desc,')==1
          assert '벡스가 오늘 가게에 올 밀수 총기 구매자를 소개했습니다.' in data
          assert '키트를 제거하더라도 해당 총기는 영구적으로 밀수품으로 취급된다.' in data
          dst=Path('probably-stolen/maintenance/GunsmithExpansion-ko-update-2026-11-09.zip')
          dst.parent.mkdir(parents=True,exist_ok=True)
          with ZipFile(dst,'w',ZIP_DEFLATED) as z:
              z.write(src,arcname='pskb__3834619049.csv')
          print(dst,dst.stat().st_size)
          PY
      - name: Commit ZIP
        shell: bash
        run: |
          git add -- probably-stolen/maintenance/GunsmithExpansion-ko-update-2026-11-09.zip
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Package updated Gunsmith Expansion Korean CSV"
          git pull --rebase origin main
          git push origin HEAD:main
