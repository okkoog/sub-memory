name: Temp build KoreanPack water defer fix

on:
  push:
    branches: [main]
    paths:
      - "probably-stolen/tmp/kp_water_defer_patch.py"
      - ".github/workflows/temp-kp-water-defer.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download exact latest labeler build
        uses: actions/download-artifact@v4
        with:
          name: ProbablyStolenKoreanPack-LabelerTimingFix
          path: ${{ runner.temp }}/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: okkoog/sub-memory
          run-id: 42310100243

      - name: Verify input DLL
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/input/ProbablyStolenKoreanPack_LabelerTimingFix.dll"
          echo "ef49598c78a1f47c25126cca2ce217ff59cc457fda4e0b8e4a6a9cfa632a2ba2  $RUNNER_TEMP/input/ProbablyStolenKoreanPack_LabelerTimingFix.dll" | sha256sum -c -

      - name: Decompile exact input
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
          mkdir -p "$RUNNER_TEMP/src"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p             -r probably-stolen/Managed             -o "$RUNNER_TEMP/src"             "$RUNNER_TEMP/input/ProbablyStolenKoreanPack_LabelerTimingFix.dll"

      - name: Apply water timing fix
        shell: bash
        run: |
          set -euo pipefail
          python3 probably-stolen/tmp/kp_water_defer_patch.py
          grep -n "worldReady" "$RUNNER_TEMP/src/ProbablyStolenKoreanPack/WaterNameCompatibility.cs"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet build "$RUNNER_TEMP/build/ProbablyStolenKoreanPack.csproj" -c Release --nologo
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/build/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll"             "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CorpWaterTimingFix.dll"
          sha256sum "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CorpWaterTimingFix.dll" > "$RUNNER_TEMP/out/SHA256.txt"

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -r probably-stolen/Managed             -t ProbablyStolenKoreanPack.KoreanPack             "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CorpWaterTimingFix.dll"             > "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -r probably-stolen/Managed             -t ProbablyStolenKoreanPack.WaterNameCompatibility             "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CorpWaterTimingFix.dll"             > "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"
          grep -q "0.8.2-water-deferred" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "!worldReady" "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"
          grep -q "LabelerElement" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "RepairForLabeler" "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"
          if grep -q "CorpPresence" "$RUNNER_TEMP/out/KoreanPack.verify.cs"; then
            echo "Unexpected CorpPresence-specific code found in latest DLL" >&2
            exit 1
          fi
          printf "Static verification passed. Water repair cannot request Mechanic before worldReady.\n" > "$RUNNER_TEMP/out/VERIFIED.txt"
          stat -c "%n %s bytes" "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_CorpWaterTimingFix.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: ProbablyStolenKoreanPack-CorpWaterTimingFix
          path: ${{ runner.temp }}/out
          if-no-files-found: error
