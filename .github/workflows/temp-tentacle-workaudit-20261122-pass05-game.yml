name: Work audit C - game config and display boundary
on:
  push:
    paths: [.github/workflows/temp-tentacle-workaudit-20261122-pass05-game.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/Managed/Assembly-CSharp.dll
            probably-stolen/local-mods/TentacleMod번역/번역대조표/WorkAudit_20261122
      - name: Read only game IL
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/cgame --force
          dotnet add /tmp/cgame/cgame.csproj package dnlib --version 4.5.0
          cat >/tmp/cgame/Program.cs <<'CS'
          using System.Text.Json;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          using System.Security.Cryptography;
          using System.Text.RegularExpressions;
          static string Oper(object? o)=>o switch {null=>"",Instruction i=>"IL_"+i.Offset.ToString("X4"),IList<Instruction> l=>string.Join(",",l.Select(i=>"IL_"+i.Offset.ToString("X4"))),_=>o.ToString()??""};
          using var md=ModuleDefMD.Load(args[0]);
          var ms=md.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToArray();
          var owner=ms.Where(m=>Regex.IsMatch(m.DeclaringType.FullName,@"ModConfig|ConfigEntry|ModSetting|ModMenu|ModPanel|ModWindow",RegexOptions.IgnoreCase)).ToArray();
          var refs=ms.Where(m=>m.Body.Instructions.Any(i=>Regex.IsMatch(Oper(i.Operand),@"(?:ModConfig|ConfigEntry[^ ]*)::|StoreClient::(?:displayName|realName)|GameItem::(?:get_name|set_name)|GameItem::(?:get_customName|set_customName)",RegexOptions.IgnoreCase))).ToArray();
          var methods=owner.Concat(refs).Distinct().Select(m=>new {method=m.FullName,token=m.MDToken.Raw.ToString("X8"),il=m.Body.Instructions.Select(i=>new {off=i.Offset,op=i.OpCode.Name,arg=Oper(i.Operand)}).ToArray()}).ToArray();
          var meta=new {sha256=Convert.ToHexString(SHA256.HashData(File.ReadAllBytes(args[0]))).ToLowerInvariant(),methodCount=ms.Length,selected=methods.Length,methods};
          File.WriteAllText(args[1],JsonSerializer.Serialize(meta));
          Console.WriteLine($"Selected {methods.Length} game methods of {ms.Length}");
          CS
          d='probably-stolen/local-mods/TentacleMod번역/번역대조표/WorkAudit_20261122/후속05'
          mkdir -p "$d"
          dotnet run --project /tmp/cgame/cgame.csproj -- 'probably-stolen/Managed/Assembly-CSharp.dll' "$d/game_config_display_IL.json"
      - name: Commit audit evidence only
        shell: bash
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add 'probably-stolen/local-mods/TentacleMod번역/번역대조표/WorkAudit_20261122/후속05/game_config_display_IL.json'
          git diff --cached --quiet && exit 0
          git commit -m 'audit: extract game config/display boundary IL for mixed-use review'
          git push
