name: Probably Stolen target mod source calls
on:
  push:
    paths:
      - '.github/workflows/target-mod-source-calls.yml'
      - 'probably-stolen/tools/trace_target_source_calls.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            probably-stolen/tools/trace_target_source_calls.py
            probably-stolen/mods/3832048841/GameCardPK.dll
            probably-stolen/mods/3831837821/MidnightPawn.dll
            probably-stolen/mods/3829429358/XIAOWONightAuction.dll
            probably-stolen/mods/3829085054/ItemStorage.dll
            probably-stolen/mods/3829730904/BrewingExpansion.dll
            probably-stolen/mods/3828913695/CorpPresence.dll
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
      - name: Decompile
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/src"
          decomp(){ id="$1"; dll="$2"; mkdir -p "$ROOT/$id"; "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p -o "$ROOT/$id" "probably-stolen/mods/$id/$dll"; }
          decomp 3832048841 GameCardPK.dll
          decomp 3831837821 MidnightPawn.dll
          decomp 3829429358 XIAOWONightAuction.dll
          decomp 3829085054 ItemStorage.dll
          decomp 3829730904 BrewingExpansion.dll
          decomp 3828913695 CorpPresence.dll
      - name: Trace
        env:
          DECOMPILED_ROOT: ${{ runner.temp }}/src
        run: python3 probably-stolen/tools/trace_target_source_calls.py
      - name: Commit
        shell: bash
        run: |
          git add --sparse -- probably-stolen/analysis/target-mod-source-calls.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Trace target mod source labels"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 3
          done
          exit 1
