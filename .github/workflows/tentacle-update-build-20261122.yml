name: Build and verify updated Tentacle Korean installations
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tentacle-update-build-20261122.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tentacle-update-work-20261122
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            review
            candidate
            packages
            probably-stolen/local-mods/TentacleMod/lewd_meme2.1.0
            probably-stolen/local-mods/TentacleMod/lewd_meme_config0.7.2-pre
            probably-stolen/local-mods/TentacleMod번역/lewd_meme2.1.0
            probably-stolen/local-mods/TentacleMod번역/lewd_meme_config0.7.2-pre
            probably-stolen/local-mods/TentacleMod-Update/lewd_meme 2.3.1
            probably-stolen/local-mods/TentacleMod-Update/lewd_meme_config
      - name: Compile exact-site patcher and verify both updated binaries
        shell: bash
        run: |
          set -euo pipefail
          dotnet new console --framework net8.0 -o /tmp/tentacle-build --force
          dotnet add /tmp/tentacle-build/tentacle-build.csproj package dnlib --version 4.5.0
          cp review/Patch.cs /tmp/tentacle-build/Program.cs
          dotnet build /tmp/tentacle-build/tentacle-build.csproj -c Release
          root='probably-stolen/local-mods'
          mkdir -p candidate/MidnightPawn candidate/LewdMemeConfig packages
          rm -f review/MidnightPawn-build.json review/LewdMemeConfig-build.json
          set +e
          dotnet /tmp/tentacle-build/bin/Release/net8.0/tentacle-build.dll MidnightPawn "$root/TentacleMod/lewd_meme2.1.0/MidnightPawn.dll" "$root/TentacleMod번역/lewd_meme2.1.0/MidnightPawn.dll" "$root/TentacleMod-Update/lewd_meme 2.3.1/MidnightPawn.dll" review/MidnightPawn-transfer.json review/MidnightPawn-manual.json candidate/MidnightPawn/MidnightPawn.dll review/MidnightPawn-build.json
          mp=$?
          dotnet /tmp/tentacle-build/bin/Release/net8.0/tentacle-build.dll LewdMemeConfig "$root/TentacleMod/lewd_meme_config0.7.2-pre/LewdMemeConfig.dll" "$root/TentacleMod번역/lewd_meme_config0.7.2-pre/LewdMemeConfig.dll" "$root/TentacleMod-Update/lewd_meme_config/LewdMemeConfig.dll" review/LewdMemeConfig-transfer.json review/LewdMemeConfig-manual.json candidate/LewdMemeConfig/LewdMemeConfig.dll review/LewdMemeConfig-build.json
          cfg=$?
          set -e
          if [ "$mp" != 0 ]; then rm -f candidate/MidnightPawn/MidnightPawn.dll; fi
          if [ "$cfg" != 0 ]; then rm -f candidate/LewdMemeConfig/LewdMemeConfig.dll; fi
          printf '%s %s\n' "$mp" "$cfg" > review/build-exit-status.txt
          echo "MidnightPawn exit=$mp; LewdMemeConfig exit=$cfg"
      - name: Verify full installations and package only successful candidates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,json,hashlib,zipfile,xml.etree.ElementTree as ET,csv,io
          root=pathlib.Path('probably-stolen/local-mods/TentacleMod-Update')
          cand=pathlib.Path('candidate')
          reports=pathlib.Path('review')
          packages=pathlib.Path('packages')
          def sha(b):return hashlib.sha256(b).hexdigest()
          def tree(p):
              return {x.relative_to(p).as_posix():x for x in p.rglob('*') if x.is_file() and 'Source' not in x.relative_to(p).parts and '.git' not in x.relative_to(p).parts}
          def parse_manifest(p):
              doc=ET.fromstring(p.read_bytes())
              return doc,[(x.tag,ET.tostring(x,encoding='unicode').strip()) for x in doc if x.tag not in ('Name','Description')]
          data=[]
          mods=[('MidnightPawn','lewd_meme 2.3.1','MidnightPawn.dll','2.3.1'),('LewdMemeConfig','lewd_meme_config','LewdMemeConfig.dll','0.8.1-pre')]
          for mod,folder,dll,version in mods:
              report=reports/(mod+'-build.json')
              if not report.exists():continue
              j=json.loads(report.read_text())
              assert j['remainingUnreviewed']==0 and j['allOriginalInstructionsVerified']
              src=root/folder;overlay=cand/mod
              original=tree(src);translated=tree(overlay)
              assert sha(original[dll].read_bytes())==j['originalSHA']
              assert sha(translated[dll].read_bytes())==j['translatedSHA']
              assert translated[dll].read_bytes()[:2]==b'MZ'
              o,os=parse_manifest(original['manifest.xml']);k,ks=parse_manifest(translated['manifest.xml'])
              # Compare functional XML subtrees structurally, ignoring formatting whitespace.
              def canon(e):return (e.tag,tuple(sorted(e.attrib.items())),(e.text or '').strip(),tuple(canon(c) for c in e))
              assert [canon(e) for e in o if e.tag not in ('Name','Description')]==[canon(e) for e in k if e.tag not in ('Name','Description')]
              assert k.findtext('ModVersion')==version
              if mod=='MidnightPawn':
                  rel='Data/物品定义.csv'
                  def rows(p):return list(csv.reader(io.StringIO(p.read_text(encoding='utf-8-sig'))))
                  old=[r for r in rows(original[rel]) if r];new=[r for r in rows(translated[rel]) if r]
                  assert old[0]==new[0] and len(old)==len(new)
                  assert all(a[:1]+a[2:]==b[:1]+b[2:] for a,b in zip(old[1:],new[1:]))
                  assert set(r[0] for r in old[1:])==set(r[0] for r in new[1:])
                  assert [r[1] for r in new if r[0]=='tentacle_archive']==['촉수 기록부']
                  assert '工具' not in next(r[6] for r in new if r[0]=='tentacle_body')
                  def names(p):return [x.split('\t') for x in p.read_text(encoding='utf-8-sig').splitlines() if x]
                  n1,n2=names(original['Content/names.txt']),names(translated['Content/names.txt'])
                  assert len(n1)==len(n2)==13
                  assert all(a[0]==b[0] and len(a)==len(b)==3 and all(len(a[i].split(','))==len(b[i].split(',')) for i in (1,2)) for a,b in zip(n1,n2))
                  def keys(p):return [r[0] for r in rows(p) if r]
                  assert keys(original['Localization/zh.csv'])==keys(translated['Localization/ko.csv'])
              merged={**original,**translated}
              z=packages/(mod+'_'+version+'_KO_Install.zip')
              name=folder
              with zipfile.ZipFile(z,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as archive:
                  for rel,f in sorted(merged.items()):archive.writestr(name+'/'+rel,f.read_bytes())
              with zipfile.ZipFile(z) as archive:
                  assert archive.testzip() is None and set(archive.namelist())=={name+'/'+p for p in merged}
                  assert all(sha(archive.read(name+'/'+p))==sha(f.read_bytes()) for p,f in merged.items())
              data.append({'mod':mod,'version':version,'zip':z.name,'size':z.stat().st_size,'sha256':sha(z.read_bytes()),'files':len(merged),'overrides':len(translated),'originalSHA':j['originalSHA'],'translatedSHA':j['translatedSHA'],'gameTested':False,'crcVerified':True})
          (reports/'package-verification.json').write_text(json.dumps(data,ensure_ascii=False,indent=1)+'\n')
          print(json.dumps(data,ensure_ascii=False))
          PY
      - name: Commit verified candidates to isolated work branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse -f candidate packages review/build-exit-status.txt review/package-verification.json
          for m in MidnightPawn LewdMemeConfig; do
            if [ -e "review/$m-build.json" ]; then git add --sparse "review/$m-build.json"; fi
          done
          git diff --cached --quiet || (git commit -m "Record verified updated Korean mod candidates and installation ZIPs" && git push origin HEAD:refs/heads/tentacle-update-work-20261122)
      - uses: actions/upload-artifact@v4
        with:
          name: verified-tentacle-update-installations
          path: packages/*.zip
          if-no-files-found: warn
      - name: Require both verified distributions
        shell: bash
        run: |
          test -f review/MidnightPawn-build.json
          test -f review/LewdMemeConfig-build.json
          test -f packages/MidnightPawn_2.3.1_KO_Install.zip
          test -f packages/LewdMemeConfig_0.8.1-pre_KO_Install.zip
