name: Temp build KoreanPack labeler timing repair

on:
  push:
    branches: [main]
    paths:
      - "probably-stolen/tmp/kp_labelerfix_patch.py"
      - ".github/workflows/temp-kp-labelerfix.yml"

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Download exact previous condition-cache build
        uses: actions/download-artifact@v4
        with:
          name: ProbablyStolenKoreanPack-ConditionCacheFix
          path: ${{ runner.temp }}/input
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: okkoog/sub-memory
          run-id: 42308575741

      - name: Verify input DLL
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/input/ProbablyStolenKoreanPack_ConditionCacheFix.dll"
          echo "06b075a0648918d01c843060121a7fb391190fb17db888ca506c5b4f2a8ecc4a  $RUNNER_TEMP/input/ProbablyStolenKoreanPack_ConditionCacheFix.dll" | sha256sum -c -

      - name: Decompile exact input
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
          mkdir -p "$RUNNER_TEMP/src"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p             -r probably-stolen/Managed             -o "$RUNNER_TEMP/src"             "$RUNNER_TEMP/input/ProbablyStolenKoreanPack_ConditionCacheFix.dll"

      - name: Apply targeted labeler repair
        shell: bash
        run: |
          set -euo pipefail
          python3 probably-stolen/tmp/kp_labelerfix_patch.py
          grep -nE "EnableLabelerConditionRepair|BeforeLabelerInit|RepairForLabeler|RepairGenericCondition"             "$RUNNER_TEMP/src/ProbablyStolenKoreanPack/"*.cs

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          dotnet build "$RUNNER_TEMP/build/ProbablyStolenKoreanPack.csproj" -c Release --nologo
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/build/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll"             "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_LabelerTimingFix.dll"
          sha256sum "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_LabelerTimingFix.dll" > "$RUNNER_TEMP/out/SHA256.txt"

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -r probably-stolen/Managed             -t ProbablyStolenKoreanPack.KoreanPack             "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_LabelerTimingFix.dll"             > "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -r probably-stolen/Managed             -t ProbablyStolenKoreanPack.WaterNameCompatibility             "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_LabelerTimingFix.dll"             > "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"
          grep -q "EnableLabelerConditionRepair" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "LabelerElement" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "InitElement" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "BeforeLabelerInit" "$RUNNER_TEMP/out/KoreanPack.verify.cs"
          grep -q "RepairForLabeler" "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"
          grep -q "RepairGenericCondition" "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"
          grep -q "ItemConditionList.conditionLookup" "$RUNNER_TEMP/out/WaterNameCompatibility.verify.cs"
          printf "Static verification passed.\n" > "$RUNNER_TEMP/out/VERIFIED.txt"
          stat -c "%n %s bytes" "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_LabelerTimingFix.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: ProbablyStolenKoreanPack-LabelerTimingFix
          path: ${{ runner.temp }}/out
          if-no-files-found: error
