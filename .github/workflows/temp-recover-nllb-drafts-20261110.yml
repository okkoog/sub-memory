name: Temporary recover and finish 3 NLLB translation drafts
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-recover-nllb-drafts-20261110.yml
permissions:
  contents: write
  actions: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /probably-stolen/mods/3834071305/Localization/en.csv
            /probably-stolen/work-in-progress/translation-20261110/nllb_large_draft.py
            /.github/workflows/temp-recover-nllb-drafts-20261110.yml
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          run-id: 42730032335
          repository: okkoog/sub-memory
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pattern: mod-translation-*
          merge-multiple: true
          path: probably-stolen/work-in-progress/translation-20261110/machine-drafts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install translation engine
        run: python -m pip install --quiet "transformers==4.46.3" "sentencepiece" "torch" "sacremoses"
      - name: Generate the missing Cyber Fried Rice machine draft
        env:
          HF_HUB_DISABLE_XET: '1'
        run: python probably-stolen/work-in-progress/translation-20261110/nllb_large_draft.py 3834071305
      - name: Audit all recovered drafts and QA reports
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, csv, json
          p=pathlib.Path('probably-stolen/work-in-progress/translation-20261110/machine-drafts')
          want={'3835292703':817,'3830031787':664,'3834071305':473}
          for modid,n in want.items():
              csvfile=p/f'pskb__{modid}.csv'
              report=json.loads((p/f'qa__{modid}.json').read_text(encoding='utf-8'))
              with csvfile.open(encoding='utf-8-sig',newline='') as f:
                  rows=[r for r in csv.reader(f) if r and r[0].startswith('K|')]
              keys=[r[0][2:] for r in rows]
              assert len(rows)==n, (modid,len(rows),n)
              assert len(set(keys))==n, (modid,'duplicate')
              assert report['source_count']==n, (modid,report['source_count'])
              print('QA',modid,'rows',n,'untranslated',len(report['untranslated_keys']),
                    'fragment_errors',report['failed_fragments'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all-three-machine-translation-drafts-for-review
          path: probably-stolen/work-in-progress/translation-20261110/machine-drafts/*
          if-no-files-found: error
      - name: Commit drafts only; do not overwrite human-reviewed KoreanPack files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f probably-stolen/work-in-progress/translation-20261110/machine-drafts/
          git commit -m "Recover all 1954 NLLB Korean drafts and QA reports (editorial review pending)"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
