name: Probably Stolen mod source label trace
on:
  push:
    paths:
      - '.github/workflows/mod-source-label-trace.yml'
      - 'probably-stolen/tools/trace_mod_source_label.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            probably-stolen/Managed/Assembly-CSharp.dll
            probably-stolen/tools/trace_mod_source_label.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
      - name: Decompile game
        run: |
          mkdir -p "$RUNNER_TEMP/game"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p -o "$RUNNER_TEMP/game" probably-stolen/Managed/Assembly-CSharp.dll
      - name: Trace label
        env:
          GAME_DECOMPILED: ${{ runner.temp }}/game
        run: python3 probably-stolen/tools/trace_mod_source_label.py
      - name: Commit report
        run: |
          git add --sparse -- probably-stolen/analysis/mod-source-label-trace.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Trace mod source labels in game tooltip"
          git pull --rebase origin main
          git push origin HEAD:main
