name: RLD 20261121 comparison-site verification
on:
  push:
    paths:
      - '.github/workflows/temp-rld-key-comparison-audit-20261121.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1/RedLightDistrict.dll
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/translation-work
          sparse-checkout-cone-mode: false
      - name: Inspect exact callsites with dnlib
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/rld-compare --force
          dotnet add /tmp/rld-compare/rld-compare.csproj package dnlib --version 4.5.0
          cat >/tmp/rld-compare/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Text;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class Inspect {
            static void Main(string[] args){
              using var m=ModuleDefMD.Load(args[0]);
              var target=new[]{
                ("RedLightDistrict.TalentScenarioMaid","ContainerByName"),
                ("RedLightDistrict.ShowerRoom","RefreshShowerDescription"),
                ("RedLightDistrict.TalentWaterTank","FindTankInCell"),
                ("RedLightDistrict.TalentFeeder","AppendFeederLine"),
                ("RedLightDistrict.TalentWaterTank","AppendTankLine")
              };
              var sb=new StringBuilder("# RLD v1.1.1 translated string comparison/static callsite review\n\n");
              foreach(var (name,method) in target){
                var typ=m.GetTypes().Single(t=>t.FullName==name);
                var fn=typ.Methods.Single(x=>x.Name.ToString()==method);
                sb.AppendLine("## "+name+"::"+method+"\n");
                foreach(var il in fn.Body.Instructions){
                  var op=il.Operand is string s?System.Text.Json.JsonSerializer.Serialize(s):il.Operand?.ToString()??"";
                  sb.AppendLine($"- IL_{il.Offset:X4}: {il.OpCode} {op}");
                }
              }
              Directory.CreateDirectory(Path.GetDirectoryName(args[1])!);
              File.WriteAllText(args[1],sb.ToString(),new UTF8Encoding(false));
              Console.WriteLine("Audited "+target.Length+" methods, "+sb.Length+" characters.");
            }
          }
          CS
          dotnet run --project /tmp/rld-compare/rld-compare.csproj -- \
            probably-stolen/local-mods/TentacleMod/RedLightDistrict_v1.1.1/RedLightDistrict.dll \
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/translation-work/RLD_COMPARISON_IL_AUDIT_20261121.md
      - name: Preserve audit report only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/translation-work/RLD_COMPARISON_IL_AUDIT_20261121.md
          git diff --cached --quiet || (git commit -m 'audit(rld): inspect translated string comparison sites' && git pull --rebase origin main && git push)
