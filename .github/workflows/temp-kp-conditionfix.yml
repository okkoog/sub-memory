name: Temp build KoreanPack condition cache repair

on:
  push:
    branches:
      - main
    paths:
      - "probably-stolen/tmp/kp_featurefix2_input.gz.b64"
      - "probably-stolen/tmp/kp_featurefix2_patch.py"
      - ".github/workflows/temp-kp-conditionfix.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Reconstruct current feature-fix DLL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kp" "$RUNNER_TEMP/src"
          base64 -d probably-stolen/tmp/kp_featurefix2_input.gz.b64 | gzip -d > "$RUNNER_TEMP/kp/ProbablyStolenKoreanPack.dll"
          echo "dc35a09f14ee5268ee19a3d503b5171bbed10cfd71ca068c9e6d6a900fa9d2fd  $RUNNER_TEMP/kp/ProbablyStolenKoreanPack.dll" | sha256sum -c -

      - name: Decompile exact current DLL
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p             -r probably-stolen/Managed             -o "$RUNNER_TEMP/src"             "$RUNNER_TEMP/kp/ProbablyStolenKoreanPack.dll"

      - name: Apply generic condition lookup repair
        shell: bash
        run: |
          set -euo pipefail
          python3 probably-stolen/tmp/kp_featurefix2_patch.py
          grep -nE "RepairConditionLookup|condition lookup=|ItemConditionList.conditionLookup"             "$RUNNER_TEMP/src/ProbablyStolenKoreanPack/WaterNameCompatibility.cs"

      - name: Build patched DLL
        shell: bash
        run: |
          set -euo pipefail
          dotnet build "$RUNNER_TEMP/build/ProbablyStolenKoreanPack.csproj" -c Release --nologo
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/build/bin/Release/netstandard2.1/ProbablyStolenKoreanPack.dll"             "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_ConditionCacheFix.dll"
          cp "$RUNNER_TEMP/src/ProbablyStolenKoreanPack/WaterNameCompatibility.cs"             "$RUNNER_TEMP/out/WaterNameCompatibility.conditionfix.cs"
          sha256sum "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_ConditionCacheFix.dll" > "$RUNNER_TEMP/out/SHA256.txt"

      - name: Static verification
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck -r probably-stolen/Managed             -t ProbablyStolenKoreanPack.WaterNameCompatibility             "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_ConditionCacheFix.dll"             > "$RUNNER_TEMP/out/verification.cs"
          grep -q "RepairFeatureCategoryNames" "$RUNNER_TEMP/out/verification.cs"
          grep -q "RepairConditionLookup" "$RUNNER_TEMP/out/verification.cs"
          grep -q "ItemConditionList.conditionLookup" "$RUNNER_TEMP/out/verification.cs"
          grep -q "condition.display" "$RUNNER_TEMP/out/verification.cs"
          grep -q "TryGetMechanicErrorKey" "$RUNNER_TEMP/out/verification.cs"\n          grep -n -A80 "RepairConditionLookup" "$RUNNER_TEMP/out/verification.cs" > "$RUNNER_TEMP/out/verification-conditionlookup.txt"
          printf "Static verification passed.\n" > "$RUNNER_TEMP/out/VERIFIED.txt"
          stat -c "%n %s bytes" "$RUNNER_TEMP/out/ProbablyStolenKoreanPack_ConditionCacheFix.dll"

      - uses: actions/upload-artifact@v4
        with:
          name: ProbablyStolenKoreanPack-ConditionCacheFix
          path: ${{ runner.temp }}/out
          if-no-files-found: error
