name: Temp inspect PCExpansion 1.3 Korean font support

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-inspect-pcexpansion-font.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect Korean locale detection
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail "https://raw.githubusercontent.com/okkoog/sub-memory/main/probably-stolen/mods/3829413447/PCExpansion.dll" -o PCExpansion.dll
          dotnet tool install --global ilspycmd
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir decomp
          ilspycmd -p -o decomp PCExpansion.dll
          echo "===== LanguageText files ====="
          find decomp/PCExpansion -maxdepth 2 -type f -iname '*Language*' -o -iname '*Locale*'
          echo "===== LocaleCode definitions/usages ====="
          grep -R -n -C 12 "LocaleCode" decomp/PCExpansion || true
          echo "===== IsChinese definitions/usages ====="
          grep -R -n -C 8 "IsChinese" decomp/PCExpansion || true
          echo "===== ko localization/path logic ====="
          grep -R -n -C 8 '"ko"\|ko.csv\|Localization' decomp/PCExpansion/LanguageText.cs decomp/PCExpansion/*Language*.cs 2>/dev/null || true
