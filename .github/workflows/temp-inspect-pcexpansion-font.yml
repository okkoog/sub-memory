name: Temp inspect PCExpansion 1.3 Korean font support

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-inspect-pcexpansion-font.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Decompile PCExpansion 1.3
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail "https://raw.githubusercontent.com/okkoog/sub-memory/main/probably-stolen/mods/3829413447/PCExpansion.dll" -o PCExpansion.dll
          dotnet tool install --global ilspycmd
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir decomp
          ilspycmd -p -o decomp PCExpansion.dll

          echo "===== UiFonts.cs ====="
          sed -n '1,180p' decomp/PCExpansion/UiFonts.cs

          echo "===== ConsoleFontFallback.cs ====="
          sed -n '1,140p' decomp/PCExpansion/ConsoleFontFallback.cs

          echo "===== StartingPerkHooks.cs ====="
          sed -n '1,120p' decomp/PCExpansion/StartingPerkHooks.cs

          echo "===== ComputerManualView PrepareFont ====="
          sed -n '740,870p' decomp/PCExpansion/ComputerManualView.cs

          echo "===== koreanFont references ====="
          grep -R -n -C 5 "koreanFont\|Korean\|ko-KR\|ko_KR" decomp/PCExpansion || true

          echo "===== UiFonts.Require call sites ====="
          grep -R -n "UiFonts.Require" decomp/PCExpansion || true
