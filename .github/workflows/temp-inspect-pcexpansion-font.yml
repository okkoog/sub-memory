name: Temp inspect PCExpansion 1.3 Korean font support

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-inspect-pcexpansion-font.yml"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download PCExpansion 1.3 DLL
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail "https://raw.githubusercontent.com/okkoog/sub-memory/main/probably-stolen/mods/3829413447/PCExpansion.dll" -o PCExpansion.dll
          sha256sum PCExpansion.dll
          file PCExpansion.dll

      - name: Decompile and inspect font/localization code
        shell: bash
        run: |
          set -euo pipefail
          dotnet tool install --global ilspycmd
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p decomp report
          ilspycmd -p -o decomp PCExpansion.dll

          python3 - <<'PY'
          from pathlib import Path
          import re

          root=Path("decomp")
          pats = re.compile(
              r"(TMP_FontAsset|FontAsset|fallbackFontAssetTable|fallbackFontAssets|fontFallback|"
              r"FontManager|font|Korean|korean|한국|ko-KR|ko_KR|Hangul|hangul|"
              r"Localization|Locale|SelectedLocale|GetLocalized|language|Language|"
              r"TextMeshPro|TMP_Text|TMP_Settings)",
              re.I
          )

          hits=[]
          for p in root.rglob("*.cs"):
              lines=p.read_text(encoding="utf-8",errors="replace").splitlines()
              for i,line in enumerate(lines,1):
                  if pats.search(line):
                      a=max(1,i-5); b=min(len(lines),i+10)
                      snippet="\n".join(f"{j:5}: {lines[j-1]}" for j in range(a,b+1))
                      hits.append((str(p),i,snippet))

          out=[]
          last={}
          for p,i,s in hits:
              if p in last and i-last[p] < 8:
                  continue
              last[p]=i
              out.append((p,i,s))

          resources=[str(p) for p in root.rglob("*") if p.is_file() and p.suffix.lower() not in {".cs",".csproj",".sln"}]

          report=[]
          report.append("# PCExpansion 1.3 Korean font support audit")
          report.append("")
          report.append(f"CS files: {len(list(root.rglob('*.cs')))}")
          report.append(f"Matched snippets: {len(out)}")
          report.append("")
          report.append("## Non-C# extracted files/resources")
          report.extend(f"- {x}" for x in resources[:200])
          report.append("")
          report.append("## Relevant snippets")
          for p,i,s in out[:300]:
              report.append(f"\n### {p}:{i}\n~~~csharp\n{s}\n~~~")

          Path("report/report.md").write_text("\n".join(report),encoding="utf-8")

          likely=[]
          for p in root.rglob("*.cs"):
              txt=p.read_text(encoding="utf-8",errors="replace")
              score=sum(1 for kw in [
                  "TMP_FontAsset","fallbackFontAssetTable","fallbackFontAssets","TMP_Settings",
                  "Korean","ko-KR","Hangul","FontAsset","font"
              ] if kw.lower() in txt.lower())
              if score:
                  likely.append((score,str(p)))
          likely.sort(reverse=True)

          print("=== LIKELY FONT/LOCALE FILES ===")
          for score,p in likely[:100]:
              print(score,p)

          print("=== DIRECT FONT/FALLBACK MATCHES ===")
          direct_re=re.compile(r"(TMP_FontAsset|fallbackFontAssetTable|fallbackFontAssets|TMP_Settings|Korean|ko-KR|Hangul)",re.I)
          n=0
          for p in root.rglob("*.cs"):
              lines=p.read_text(encoding="utf-8",errors="replace").splitlines()
              for i,line in enumerate(lines,1):
                  if direct_re.search(line):
                      print(f"{p}:{i}: {line.strip()}")
                      n+=1
                      if n>=250:
                          break
              if n>=250:
                  break
          print("DIRECT_MATCH_COUNT_SHOWN",n)
          PY

      - name: Upload audit
        uses: actions/upload-artifact@v4
        with:
          name: pcexpansion-1.3-korean-font-audit
          path: report
          if-no-files-found: error
