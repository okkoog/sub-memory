name: Probably Stolen MOD_NAME_TAG trace
on:
  push:
    paths:
      - '.github/workflows/mod-name-tag-trace.yml'
      - 'probably-stolen/tools/trace_mod_name_tag.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            probably-stolen/Managed/Assembly-CSharp.dll
            probably-stolen/tools/trace_mod_name_tag.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet tool install --tool-path "$RUNNER_TEMP/ilspy" ilspycmd --version 9.1.0.7988
      - run: |
          mkdir -p "$RUNNER_TEMP/game"
          "$RUNNER_TEMP/ilspy/ilspycmd" --disable-updatecheck --nested-directories -p -o "$RUNNER_TEMP/game" probably-stolen/Managed/Assembly-CSharp.dll
      - name: Trace
        env:
          GAME_DECOMPILED: ${{ runner.temp }}/game
        run: python3 probably-stolen/tools/trace_mod_name_tag.py
      - name: Commit
        shell: bash
        run: |
          git add --sparse -- probably-stolen/analysis/mod-name-tag-tooltip-trace.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Trace MOD_NAME_TAG tooltip rendering"
          for i in 1 2 3 4; do
            git pull --rebase origin main || true
            git push origin HEAD:main && exit 0
            sleep 4
          done
          exit 1
