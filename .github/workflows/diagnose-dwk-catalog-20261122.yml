name: Diagnose catalog item ID and icon lookup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-dwk-catalog-20261122.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod/3842259965/probably_adult_goods.dll
            probably-stolen/local-mods/TentacleMod번역/3842259965/probably_adult_goods.dll
            probably-stolen/local-mods/TentacleMod/起飞攻速装-v1.1.3抢先体验版（修bug）/起飞攻速装.dll
            probably-stolen/local-mods/TentacleMod번역/起飞攻速装-v1.1.3抢先体验版（修bug）/起飞攻速装.dll
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll
      - name: Inspect item registration and catalog lookup
        run: |
          set -euo pipefail
          dotnet new console --framework net8.0 -o /tmp/catalog --force
          dotnet add /tmp/catalog/catalog.csproj package dnlib --version 4.5.0
          cat >/tmp/catalog/Program.cs <<'CS'
          using System;
          using System.Linq;
          using System.Collections.Generic;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class Program {
           static string Safe(object? o) {
           if(o is string s) return s.Length<=100 && (s.Contains("dwk_")||s.Contains("yangsheng")||s.Contains("未拥有")||s.Contains("未持有")||s.Contains("未获得")||s.Contains("소유하지")||s=="?") ? s : "[string length="+s.Length+"]";
           return o?.ToString()??"";
           }
           static void Main(string[] args) {
           foreach(var path in args){
           using var mod=ModuleDefMD.Load(path);
           Console.WriteLine("MODULE "+path);
           var methods=mod.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToArray();
           var relevant=methods.Where(m=>m.Body.Instructions.Any(i=>i.Operand is string s&&(s.Contains("dwk_yangsheng_cup")||s.Contains("未拥有")||s.Contains("未持有")||s.Contains("未获得")||s.Contains("소유하지 않음")))).ToArray();
           foreach(var m in relevant){
           Console.WriteLine("MATCH "+m.FullName+" LENGTH "+m.Body.Instructions.Count);
           var il=m.Body.Instructions;
           var idx=Enumerable.Range(0,il.Count).Where(i=>il[i].Operand is string s&&(s.Contains("dwk_yangsheng_cup")||s.Contains("未拥有")||s.Contains("未持有")||s.Contains("未获得")||s.Contains("소유하지 않음"))).ToArray();
           var indices=idx.SelectMany(i=>Enumerable.Range(Math.Max(0,i-22),Math.Min(il.Count,i+35)-Math.Max(0,i-22))).Distinct().OrderBy(i=>i);
           foreach(int i in indices) Console.WriteLine($"{il[i].Offset:X4} {il[i].OpCode} {Safe(il[i].Operand)}");
           }
           foreach(var m in methods.Where(m=>System.Text.RegularExpressions.Regex.IsMatch(m.FullName,"Catalog|Collection|RegisterReady|RegisterItems|Build.*Slot|Get.*Icon|Resolve.*Item",System.Text.RegularExpressions.RegexOptions.IgnoreCase)).Take(90)){
           Console.WriteLine("METHOD "+m.FullName+" LENGTH "+m.Body.Instructions.Count);
           foreach(var i in m.Body.Instructions.Where(i=>i.Operand is IMethod mm&&System.Text.RegularExpressions.Regex.IsMatch(mm.FullName,"GetItem|Definition|TryGet|Register|Sprite|Icon|GetName|GetDisplayName|Catalog|Collection",System.Text.RegularExpressions.RegexOptions.IgnoreCase)).Take(40)) Console.WriteLine($"{i.Offset:X4} {i.OpCode} {Safe(i.Operand)}");
           }
           }
           }
          }
          CS
          P=probably-stolen/local-mods
          D='起飞攻速装-v1.1.3抢先体验版（修bug）/起飞攻速装.dll'
          git lfs pull --include="$P/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll" --exclude=''
          dotnet run --project /tmp/catalog -- "$P/TentacleMod/$D" "$P/TentacleMod번역/$D" "$P/TentacleMod/3842259965/probably_adult_goods.dll" "$P/TentacleMod번역/3842259965/probably_adult_goods.dll" "$P/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll"
