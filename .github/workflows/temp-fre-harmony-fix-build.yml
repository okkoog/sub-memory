name: Temporary build Faction Reputation Harmony compatibility fix
on:
  push:
    branches: [main]
    paths: [.github/workflows/temp-fre-harmony-fix-build.yml]
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /probably-stolen/mods/3828971731/FactionReputationExpansion.dll
            /probably-stolen/Managed/0Harmony.dll
            /probably-stolen/work-in-progress/fre-harmony-compat-fix/FreHarmonyCompatPatch.cs
            /probably-stolen/downloads
          persist-credentials: true
      - uses: actions/setup-dotnet@v4
        with: {dotnet-version: '10.0.x'}
      - name: Apply 1-call Harmony API replacement and verify DLL
        shell: bash
        run: |
          set -euo pipefail
          original="probably-stolen/mods/3828971731/FactionReputationExpansion.dll"
          harmony="probably-stolen/Managed/0Harmony.dll"
          out="probably-stolen/downloads/FactionReputationExpansion_1.5.3_HarmonyFix"
          mkdir -p "$out"
          dotnet new console --framework net10.0 -o "$RUNNER_TEMP/patcher" --no-restore >/dev/null
          cp "probably-stolen/work-in-progress/fre-harmony-compat-fix/FreHarmonyCompatPatch.cs" "$RUNNER_TEMP/patcher/Program.cs"
          dotnet add "$RUNNER_TEMP/patcher/patcher.csproj" package Mono.Cecil --version 0.11.6 >/dev/null
          dotnet run --project "$RUNNER_TEMP/patcher" --configuration Release -- "$original" "$harmony" "$out/FactionReputationExpansion.dll"
          cat > "$out/README.txt" <<'TXT'
          Faction Reputation Expansion v1.5.3 - Harmony compatibility test patch
          Workshop ID 3828971731
          Fix scope: one call in ThiefCrateFirstPatch / ReorderStock's generated predicate.
          Replaced missing HarmonyLib.CodeInstructionExtensions.LoadsConstant(CodeInstruction, string)
          with a helper comparing the instruction opcode (ldstr) and literal operand.
          No item/reputation/save processing logic was intentionally changed.
          Installation:
            1. Quit the game. Back up saves and the ORIGINAL FactionReputationExpansion.dll.
            2. Replace only FactionReputationExpansion.dll in the EXISTING installed
               Workshop mod folder 4348910/3828971731.
            3. Do NOT install this ZIP as an additional separate mod.
            4. Game runtime testing is NOT completed. Test store opening with a
               backed-up save; do not save unless behavior is verified.
            5. Steam Workshop updates may restore the original DLL.
          Revert by restoring your backed-up original DLL.
          TXT
          pushd probably-stolen/downloads >/dev/null
          zip -q -r FactionReputationExpansion_1.5.3_HarmonyFix.zip FactionReputationExpansion_1.5.3_HarmonyFix
          unzip -t FactionReputationExpansion_1.5.3_HarmonyFix.zip | tail -1
          popd >/dev/null
          sha256sum "$original" "$out/FactionReputationExpansion.dll" "probably-stolen/downloads/FactionReputationExpansion_1.5.3_HarmonyFix.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$out/FactionReputationExpansion.dll" "$out/README.txt" "probably-stolen/downloads/FactionReputationExpansion_1.5.3_HarmonyFix.zip"
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "Build Faction Reputation 1.5.3 Harmony compatibility DLL (one-call fix)"
            git push origin HEAD:main
          fi
