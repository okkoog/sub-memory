name: Tentacle update exact callsite transfer audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tentacle-update-refine-20261122.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tentacle-update-work-20261122
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            candidate
            review
      - name: Derive per-method and per-setting-field translation carry-forward
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth 1 origin tentacle-update-audit-20261122
          mkdir -p /tmp/tentacle-audit review
          for m in MidnightPawn LewdMemeConfig; do
            git show "FETCH_HEAD:audit/$m.json" > "/tmp/tentacle-audit/$m.json"
          done
          python3 - <<'PY'
          import json,pathlib,collections,re,difflib
          def read(p): return json.loads(p.read_text())
          def write(p,j): p.write_text(json.dumps(j,ensure_ascii=False,indent=1)+'\n')
          def istxt(s): return any('\u3400'<=c<='\u9fff' or '\uac00'<=c<='\ud7a3' for c in s)
          def il(m): return m['il'] if m else []
          def sig(x,abstract=False):
              v=x['operand']; op=x['opcode']
              if op in ('br','br.s','brtrue','brtrue.s','brfalse','brfalse.s','leave','leave.s','switch') or v.startswith('@'): v='@'
              if op=='ldstr' and abstract: v='<literal>'
              return (op,v)
          def align(a,b,abstract=False):
              A=[sig(x,abstract) for x in a];B=[sig(x,abstract) for x in b]
              if A==B:return {i:i for i in range(len(a))}
              out={}
              for block in difflib.SequenceMatcher(None,A,B,autojunk=False).get_matching_blocks():
                  for i in range(block.size):
                      if block.size>=5 and (i>=2 or block.a==0) and (block.size-i>=3 or block.a+block.size==len(a)):
                          out[block.a+i]=block.b+i
              return out
          def settings(m):
              # Cctor only. Associate a literal with the exact entry key and its named field.
              I=il(m); entry=None; entries={}; key=None; kind=None
              for j,x in enumerate(I):
                  o=x['operand']
                  if x['opcode']=='newobj' and re.search(r'(?:Family)?PanelEntry::\.ctor\(',o):
                      entry={};key=None
                  if entry is None:continue
                  if x['opcode']!='stfld' or not re.search(r'(?:Family)?PanelEntry::',o):continue
                  field=o.rsplit('::',1)[-1]
                  if field in ('Key','OurKey'):
                      if j and I[j-1]['opcode']=='ldstr':key=I[j-1]['operand']
                      elif j>=2 and 'ItemSwitchKey' in I[j-1]['operand'] and I[j-2]['opcode']=='ldstr':key=I[j-2]['operand']+'.enabled'
                      else:key=None
                      if key is not None:
                          if key in entries: raise Exception('duplicate setting '+key)
                          entries[key]=entry
                  elif field in ('Label','Tooltip','Section','Default') and j and I[j-1]['opcode']=='ldstr':
                      entry[field]=(j-1,I[j-1]['operand'])
              return entries
          for mod in ['MidnightPawn','LewdMemeConfig']:
              j=read(pathlib.Path('/tmp/tentacle-audit')/(mod+'.json'))
              direct={(x['method'],x['index']):x for x in j['direct']}
              candidates={(x['method'],x['index']):x for x in j['candidates']}
              pending={key:x for key,x in candidates.items() if not x['anchorExact'] or x['target'] is None}
              unchanged={key:x for key,x in candidates.items() if key not in pending}
              transfers=[]; protected=[]; structural=[]; setting_diff=[]; decisions={}
              for row in j['changed']:
                  om,km,nm=row['old'],row['ko'],row['current']
                  if not km: continue
                  o,k,n=il(om),il(km),il(nm);name=nm['name']
                  ok=align(o,k,True);on=align(o,n,False)
                  if mod=='LewdMemeConfig' and ('PanelKeys::.cctor()' in name or 'FamilyPanelKeys::.cctor()' in name):
                      oe,ke,ne=settings(om),settings(km),settings(nm)
                      for key,fields in ne.items():
                          for field,(ni,src) in fields.items():
                              if not istxt(src):continue
                              item=(name,ni)
                              if field in ('Section','Default'):
                                  if item in pending:decisions[item]=('protected',src,'raw section/default field '+key)
                                  continue
                              a=oe.get(key,{}).get(field);b=ke.get(key,{}).get(field)
                              if a and b and a[1]==src:
                                  decisions[item]=('carry' if b[1]!=src else 'protected',b[1],'same setting key and display field '+key+'.'+field)
                              else:
                                  setting_diff.append({'key':key,'field':field,'method':name,'index':ni,'source':src,'previousSource':a[1] if a else None,'previousTarget':b[1] if b else None})
                      # Other initializer strings are raw choice/default arrays or identities; review separately.
                  for oi,ni in on.items():
                      if oi not in ok: continue
                      ki=ok[oi]; it=o[oi]; kt=k[ki]; nt=n[ni]; item=(name,ni)
                      if item not in pending or item in decisions:continue
                      if it['opcode']!=kt['opcode'] or it['opcode']!='ldstr' or it['operand']!=nt['operand']:continue
                      # Cctor display fields must be matched by key, not repetitive IL.
                      if mod=='LewdMemeConfig' and ('PanelKeys::.cctor()' in name or 'FamilyPanelKeys::.cctor()' in name):continue
                      decisions[item]=('carry' if it['operand']!=kt['operand'] else 'protected',kt['operand'],'matching method and aligned literal context')
                  os=[sig(x,True) for x in o];ks=[sig(x,True) for x in k]
                  if os!=ks:
                      delta=[]
                      for tag,a,b,c,d in difflib.SequenceMatcher(None,os,ks,autojunk=False).get_opcodes():
                          if tag!='equal':
                              delta.append({'tag':tag,'old':o[max(0,a-2):min(len(o),b+2)],'ko':k[max(0,c-2):min(len(k),d+2)],'oldStart':a,'oldEnd':b})
                      structural.append({'method':name,'changes':delta,'newInstructionCount':len(n),'oldInstructionCount':len(o)})
              for key,(action,target,reason) in decisions.items():
                  if key not in pending:continue
                  x=pending.pop(key)
                  y={**{k:v for k,v in x.items() if k!='context'},'target':target,'reason':reason}
                  (transfers if action=='carry' else protected).append(y)
              def compact(x):return {k:v for k,v in x.items() if k not in ('target','anchorExact')}
              left=[compact(x) for x in pending.values()]
              plan=[{**x,'reason':'exact full method shape and literal site'} for x in direct.values()]+transfers
              assert len({(x['method'],x['index']) for x in plan})==len(plan)
              plan_obj={'baselineSHA':j['stats']['newSHA'],'sites':plan,'protectedUnchanged':len(unchanged),'protectedMatched':len(protected),'remaining':len(left)}
              out=pathlib.Path('review')
              write(out/(mod+'-transfer.json'),plan_obj)
              write(out/(mod+'-protected.json'),protected)
              write(out/(mod+'-unresolved.json'),left)
              write(out/(mod+'-structural.json'),structural)
              write(out/(mod+'-settings-changed.json'),setting_diff)
              # Small human review table for unresolved sites, with original context retained separately.
              brief=[{'token':x['token'],'index':x['index'],'method':x['method'],'source':x['source'],'after':x['context'][6:9] if len(x['context'])>6 else []} for x in left]
              for b in range(0,len(brief),60):
                  write(out/(mod+'-unresolved-%03d.json'%(b//60+1)),brief[b:b+60])
              stats={'mod':mod,'initialExact':len(direct),'extraCarry':len(transfers),'protectedUnchanged':len(unchanged),'protectedMatched':len(protected),'unresolved':len(left),'structuralMethods':len(structural),'settingsChanged':len(setting_diff)}
              print(json.dumps(stats,ensure_ascii=False))
              write(out/(mod+'-stats.json'),stats)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --sparse -f review
          git commit -m "Refine translation carry-forward by precise callsite and settings identity"
          git push origin HEAD:refs/heads/tentacle-update-work-20261122
