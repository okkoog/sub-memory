name: Tentacle final Eleanor and AdultGoods UI-only IL labels
on:
  push:
    paths: [.github/workflows/temp-tentacle-final-ui-code-strings-20261121.yml]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod번역/3842247788
            probably-stolen/local-mods/TentacleMod번역/3842259965
            probably-stolen/local-mods/TentacleMod번역/3843142171
            probably-stolen/local-mods/TentacleMod번역/落魄千金-埃莉诺 v1.0.3
            probably-stolen/local-mods/TentacleMod번역/번역대조표
          sparse-checkout-cone-mode: false
      - name: Patch only method-verified visual labels and missing-key fallback dialogue
        shell: bash
        run: |
          dotnet new console --framework net8.0 -o /tmp/final_il --force
          dotnet add /tmp/final_il/final_il.csproj package dnlib --version 4.5.0
          cat >/tmp/final_il/Program.cs <<'CS'
          using System;
          using System.IO;
          using System.Linq;
          using System.Collections.Generic;
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          class P {
            record Change(string type,string method,string from,string to,int count=1);
            static void Main(string[] args){
              var root=Path.GetFullPath(args[0]);
              var specs=new[]{
                (folder:"3842247788",file:"fallen_heiress_eleanor.dll",originalSha:"0b32263288db6ffd987c40fec966cfc8c98ec8381e77348a4a46466a2f2baa11",e:true,full:false,adult:false),
                (folder:"落魄千金-埃莉诺 v1.0.3",file:"fallen_heiress_eleanor.dll",originalSha:"51fb9b043ce34c0ec46498a1fefb4bf0150438011e72e8273df320b19286ab5a",e:true,full:true,adult:false),
                (folder:"3843142171",file:"fallen_heiress_eleanor.dll",originalSha:"1e3615e895a532d34539a18157811053e773b502d3a56c096001bb905934ff5e",e:true,full:true,adult:true),
                (folder:"3842259965",file:"probably_adult_goods.dll",originalSha:"38445f346ed1eeb2ff9005dafcb3df210eccffafdfb0732a8883fcff205aad8c",e:false,full:false,adult:true)
              };
              var audit=new List<string>{"# Tentacle UI code-literal finishing pass","",
                "Change set targets only verified direct display/setting-section/fallback callsite strings.",
                "No gameplay keys, item identity maps or save parser strings replaced.",""};
              foreach(var spec in specs){
                string path=Path.Combine(root,spec.folder,spec.file);
                string origSha=Convert.ToHexString(System.Security.Cryptography.SHA256.HashData(File.ReadAllBytes(path))).ToLowerInvariant();
                if(origSha!=spec.originalSha)throw new Exception("Expected previous translated DLL hash "+spec.folder+" got "+origSha);
                using var md=ModuleDefMD.Load(path);
                var changes=new List<Change>();
                if(spec.e)changes.Add(new Change("ProbablyEleanorFollowup.DownfallNote","TrySpawn",
                  "想要知道她去哪了？去垃圾场看看吧……","그녀가 어디로 갔는지 알고 싶다면 쓰레기장을 찾아보자……"));
                if(spec.full){
                  changes.Add(new Change("ProbablyEleanorFollowup.ModEntry","Init","【正式版】","【정식판】"));
                  changes.Add(new Change("ProbablyEleanorFollowup.ModEntry","Init","剧情","스토리"));
                  changes.Add(new Change("ProbablyEleanorFollowup.ModEntry","Init","立绘","초상화"));
                }
                if(spec.adult)changes.Add(new Change("ProbablyAdultGoods.ModEntry","Init","额外内容","추가 콘텐츠",4));
                int patched=0;
                foreach(var c in changes){
                  var method=md.GetTypes().Single(t=>t.FullName==c.type).Methods.Single(x=>x.Name.ToString()==c.method);
                  var all=method.Body.Instructions.Where(i=>i.OpCode==OpCodes.Ldstr && Equals(i.Operand,c.from)).ToArray();
                  if(all.Length!=c.count)throw new Exception(spec.folder+" unexpected IL counts: "+c.from+" = "+all.Length+" / "+c.count);
                  foreach(var i in all){i.Operand=c.to;patched++;}
                  audit.Add("- "+spec.folder+" "+c.type+"::"+c.method+": "+c.from+" → "+c.to+" ("+c.count+" IL callsite(s))");
                }
                string temp=path+".new";
                md.Write(temp);
                using var check=ModuleDefMD.Load(temp);
                foreach(var c in changes){
                  var method=check.GetTypes().Single(t=>t.FullName==c.type).Methods.Single(x=>x.Name.ToString()==c.method);
                  if(method.Body.Instructions.Count(i=>i.OpCode==OpCodes.Ldstr && Equals(i.Operand,c.from))!=0 ||
                    method.Body.Instructions.Count(i=>i.OpCode==OpCodes.Ldstr && Equals(i.Operand,c.to))!=c.count)
                    throw new Exception("Patched IL failed validation "+spec.folder+" "+c.from);
                }
                var oldResources=md.Resources.OfType<EmbeddedResource>().ToDictionary(x=>x.Name.ToString(),x=>x.CreateReader().ToArray());
                var newResources=check.Resources.OfType<EmbeddedResource>().ToDictionary(x=>x.Name.ToString(),x=>x.CreateReader().ToArray());
                if(oldResources.Count!=newResources.Count || oldResources.Keys.Except(newResources.Keys).Any() ||
                    oldResources.Any(k=>!k.Value.SequenceEqual(newResources[k.Key])))
                    throw new Exception("Managed resource mutated "+spec.folder);
                if(md.GetTypes().Count()!=check.GetTypes().Count())throw new Exception("CLR type count mutated");
                File.Move(temp,path,true);
                string sha=Convert.ToHexString(System.Security.Cryptography.SHA256.HashData(File.ReadAllBytes(path))).ToLowerInvariant();
                audit.Add($"- {spec.folder} patched calls: {patched}, bytes {new FileInfo(path).Length}; previous {origSha}; current SHA256 {sha}");
                audit.Add("");
                Console.WriteLine("Patched "+spec.folder+": "+patched+" visual-only references");
              }
              File.WriteAllLines(args[1],audit);
            }
          }
          CS
          dotnet run --project /tmp/final_il/final_il.csproj -- \
            'probably-stolen/local-mods/TentacleMod번역' \
            'probably-stolen/local-mods/TentacleMod번역/번역대조표/Tentacle_FINAL_UI_IL_AUDIT_20261121.md'
      - name: Repack 4 final user-deliverable archives, independent CRC and reference checks
        shell: bash
        run: |
          python3 -m pip install -q dnfile
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          import hashlib,dnfile,csv
          root=Path('probably-stolen/local-mods/TentacleMod번역')
          audit=root/'번역대조표/Tentacle_FINAL_UI_IL_AUDIT_20261121.md'
          configs=[
              ('3842247788','fallen_heiress_eleanor.dll','ProbablyStolen_Eleanor_v1.0.0_DLL_KO_1541_20261121.zip','EleanorEmbedded/Localization/ko.csv'),
              ('落魄千金-埃莉诺 v1.0.3','fallen_heiress_eleanor.dll','ProbablyStolen_Eleanor_v1.0.3_DLL_KO_Isolated_1553_20261121.zip','EleanorEmbedded/Localization/ko.csv'),
              ('3843142171','fallen_heiress_eleanor.dll','ProbablyStolen_Integrated_Eleanor_AdultGoods_v1.1.3_DLL_KO_1734_20261121.zip','EleanorEmbedded/Localization/ko.csv'),
              ('3842259965','probably_adult_goods.dll','ProbablyStolen_AdultGoods_v1.1.1_DLL_KO_181_20261121.zip','ProbablyAdultGoods.Localization.ko.csv')
          ]
          for folder,binary,zname,resource in configs:
              dll=root/folder/binary
              pe=dnfile.dnPE(str(dll))
              resources={str(x.name):x.data for x in pe.net.resources}
              assert resource in resources
              if folder=='3843142171':
                  assert resources['ProbablyAdultGoods.Localization.ko.csv']==resources['ProbablyAdultGoods.Localization.ko-KR.csv']
                  assert len(resources)==107
              if folder=='3842259965':
                  assert resources['ProbablyAdultGoods.Localization.ko.csv']==resources['ProbablyAdultGoods.Localization.ko-KR.csv']
                  assert len(resources)==67
              if folder=='3842247788':assert len(resources)==47
              if folder=='落魄千金-埃莉诺 v1.0.3':assert len(resources)==47
              z=root/zname
              entries=[]
              with ZipFile(z) as old:
                  assert old.testzip() is None
                  for name in old.namelist():
                      if name==folder+'/'+binary:
                          entries.append((name,dll.read_bytes()))
                      else:
                          entries.append((name,old.read(name)))
              assert len(entries) in (5,6,17)
              entries=[(name, audit.read_bytes() if name=='FINAL_UI_STATIC_AUDIT.md' else value)
                       for name,value in entries]
              if not any(x[0]=='FINAL_UI_STATIC_AUDIT.md' for x in entries):
                  entries.append(('FINAL_UI_STATIC_AUDIT.md',audit.read_bytes()))
              temp=z.with_suffix('.next')
              with ZipFile(temp,'w',ZIP_DEFLATED,compresslevel=6) as out:
                  for name,content in entries:out.writestr(name,content)
              with ZipFile(temp) as check:
                  assert check.testzip() is None
                  assert check.read(folder+'/'+binary)==dll.read_bytes()
              temp.replace(z)
              print(folder,len(entries),"file",z.stat().st_size,hashlib.sha256(z.read_bytes()).hexdigest())
          PY
      - name: Commit and publish 4 method-reviewed DLLs and checked final ZIP files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse \
            'probably-stolen/local-mods/TentacleMod번역/3842247788/fallen_heiress_eleanor.dll' \
            'probably-stolen/local-mods/TentacleMod번역/落魄千金-埃莉诺 v1.0.3/fallen_heiress_eleanor.dll' \
            'probably-stolen/local-mods/TentacleMod번역/3843142171/fallen_heiress_eleanor.dll' \
            'probably-stolen/local-mods/TentacleMod번역/3842259965/probably_adult_goods.dll' \
            'probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_Eleanor_v1.0.0_DLL_KO_1541_20261121.zip' \
            'probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_Eleanor_v1.0.3_DLL_KO_Isolated_1553_20261121.zip' \
            'probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_Integrated_Eleanor_AdultGoods_v1.1.3_DLL_KO_1734_20261121.zip' \
            'probably-stolen/local-mods/TentacleMod번역/ProbablyStolen_AdultGoods_v1.1.1_DLL_KO_181_20261121.zip' \
            'probably-stolen/local-mods/TentacleMod번역/번역대조표/Tentacle_FINAL_UI_IL_AUDIT_20261121.md'
          if ! git diff --cached --quiet; then
            git commit -m 'build(tentacle): localize safe setting headings and fallback note in four completed DLLs'
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin main; then exit 0; fi
              sleep 3
            done
            exit 1
          fi
