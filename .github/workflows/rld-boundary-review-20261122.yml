name: RLD precise display boundary audit
on:
  push:
    paths: ['.github/workflows/rld-boundary-review-20261122.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll
            probably-stolen/local-mods/TentacleMod번역/번역대조표/RLD_STATUS_RESULT_20261122.json
      - name: Obtain verified LFS and inspect actual IL
        run: |
          git lfs pull --include='probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll' --exclude=''
          test "$(sha256sum 'probably-stolen/local-mods/TentacleMod번역/RedLightDistrict_v1.1.1/RedLightDistrict.dll' | cut -d' ' -f1)" = '45f3f40c401dc9cc99bd5261509df30d5e9b814b67422386676eb372e482e72b'
          dotnet new console --framework net8.0 -o /tmp/rldreview --force
          dotnet add /tmp/rldreview/rldreview.csproj package dnlib --version 4.5.0
          cat >/tmp/rldreview/Program.cs <<'CS'
          using dnlib.DotNet;
          using dnlib.DotNet.Emit;
          using System.Text.Json;
          using System.Linq;
          using System.Collections.Generic;
          using System.IO;
          using System;
          using var md=ModuleDefMD.Load(args[0]);
          var names=new HashSet<string>{"TypeName","SetItemTagFlag","MarkEaten","ShowPanel","BuildTalentTooltipBuilder","BuildRansomDialogue","RenderAllyTalentPicker","CreatePatronClient","HasPatronBoughtByName","FindMaidData","EnsureDefaultOutfit","Init","OnEnable","OnDisable"};
          var methods=md.GetTypes().SelectMany(t=>t.Methods).Where(m=>m.HasBody).ToArray();
          bool IsLit(Instruction i)=>i.OpCode==OpCodes.Ldstr;
          string Op(Instruction i)=>i.Operand switch{Instruction x=>"IL_"+x.Offset.ToString("X4"),IList<Instruction> a=>string.Join(",",a.Select(x=>"IL_"+x.Offset.ToString("X4"))),string s=>s.Length<=64?s:"[long display literal omitted]",_=>i.Operand?.ToString()??""};
          bool TypeCall(Instruction i)=>i.Operand is IMethod m&&m.DeclaringType.FullName=="RedLightDistrict.TalentIntel"&&m.Name=="TypeName";
          bool Selected(MethodDef m)=>names.Contains(m.Name.ToString())&&(m.DeclaringType.FullName.StartsWith("RedLightDistrict.Talent")||m.DeclaringType.FullName.StartsWith("RedLightDistrict.PatronSystem")||m.DeclaringType.FullName.StartsWith("RedLightDistrict.ModEntry"))||m.Body.Instructions.Any(TypeCall)||m.Body.Instructions.Any(i=>IsLit(i)&&i.Operand is string s&&(s=="rld_cab0891ddb48c0be0ba7"||s=="rld_f2e46f40043ddf963794"));
          var items=methods.Where(Selected).Select(m=>new{token=m.MDToken.Raw.ToString("X8"),method=m.FullName,il=m.Body.Instructions.Select(i=>new{offset=i.Offset,opcode=i.OpCode.Name,operand=Op(i)}).ToArray()}).ToArray();
          var types=md.GetTypes().Where(t=>t.Name.ToString().Contains("ModEntry")||t.Name.ToString().Contains("RldTags")||t.Name.ToString().Contains("TalentIntel")).Select(t=>new{type=t.FullName,methods=t.Methods.Select(m=>m.FullName).ToArray()}).ToArray();
          File.WriteAllText(args[1],JsonSerializer.Serialize(new{types,items},new JsonSerializerOptions{WriteIndented=false,Encoder=System.Text.Encodings.Web.JavaScriptEncoder.UnsafeRelaxedJsonEscaping}));
          CS
          R='probably-stolen/local-mods/TentacleMod번역'
          dotnet run --project /tmp/rldreview/rldreview.csproj -- "$R/RedLightDistrict_v1.1.1/RedLightDistrict.dll" "$R/번역대조표/RLD_BOUNDARY_REVIEW_20261122.json"
      - name: Commit precise evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse 'probably-stolen/local-mods/TentacleMod번역/번역대조표/RLD_BOUNDARY_REVIEW_20261122.json'
          git diff --cached --quiet || (git commit -m 'Audit RLD display boundaries against verified actual bridge' && git push origin main)
